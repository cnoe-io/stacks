# Production Environment Feature Flags
# Stable configurations with careful rollout strategies
version: "1.0"
namespace: production

segments:
  # VIP users segment
  - key: vip-users
    name: VIP Users
    description: High-value customers
    matchType: ALL
    constraints:
      - property: tier
        operator: EQ
        value: enterprise

  # Premium tier users - higher rate limits
  - key: premium-users
    name: Premium Tier Users
    description: Users with premium tier access
    matchType: ANY
    constraints:
      - property: tier
        operator: EQ
        value: "premium"

  # Platform team - for testing in production
  - key: platform-team
    name: Platform Team
    description: Internal platform team members
    matchType: ANY
    constraints:
      - property: groups
        operator: IS_ONE_OF
        value: "platform-team,sre-team"

flags:
  # Dark mode fully rolled out in production
  - key: dark-mode-enabled
    name: Dark Mode
    type: BOOLEAN
    description: Enable dark mode UI theme
    enabled: true
    defaultVariant: "on"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    # No rules needed - default to on for everyone

  # New dashboard disabled in production
  - key: new-dashboard-ui
    name: New Dashboard UI
    type: BOOLEAN
    description: Experimental new dashboard layout
    enabled: false
    defaultVariant: "off"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    # Feature not yet ready for production

  # Original checkout only in production
  - key: checkout-flow
    name: Checkout Flow Version
    type: STRING
    description: Which checkout flow to display
    enabled: true
    defaultVariant: control
    variants:
      - key: control
        value: original
        description: Original checkout flow
    # Only original flow in production until A/B test concludes

  # ===========================================================================
  # CAIPE Feature Flags - Production
  # Conservative defaults with emergency kill switch capability
  # ===========================================================================

  # Master kill switch - CRITICAL for emergency disable
  - key: caipe-enabled
    name: CAIPE Master Switch
    type: BOOLEAN
    description: |
      Master toggle for entire CAIPE AI assistant system.
      EMERGENCY: Set to 'off' to immediately disable all CAIPE functionality.
    enabled: true
    defaultVariant: "on"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      # 100% enabled in production (change to 0 for emergency disable)
      - rank: 0
        distributions:
          - variant: "on"
            rollout: 100

  # Per-Agent Toggles - all enabled, can disable individually
  - key: caipe-agent-argocd
    name: CAIPE ArgoCD Agent
    type: BOOLEAN
    description: Enable ArgoCD agent for GitOps and deployment operations
    enabled: true
    defaultVariant: "on"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      - rank: 0
        distributions:
          - variant: "on"
            rollout: 100

  - key: caipe-agent-github
    name: CAIPE GitHub Agent
    type: BOOLEAN
    description: Enable GitHub agent for repository and PR operations
    enabled: true
    defaultVariant: "on"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      - rank: 0
        distributions:
          - variant: "on"
            rollout: 100

  - key: caipe-agent-backstage
    name: CAIPE Backstage Agent
    type: BOOLEAN
    description: Enable Backstage agent for catalog and template operations
    enabled: true
    defaultVariant: "on"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      - rank: 0
        distributions:
          - variant: "on"
            rollout: 100

  # Operational Controls - production tier-based limits
  - key: caipe-rate-limit
    name: CAIPE Rate Limit
    type: STRING
    description: Maximum requests per minute per user
    enabled: true
    defaultVariant: standard
    variants:
      - key: low
        value: "20"
        description: Low rate limit (20 rpm)
      - key: standard
        value: "100"
        description: Standard rate limit (100 rpm)
      - key: high
        value: "500"
        description: High rate limit (500 rpm)
    rules:
      # VIP/Enterprise users get high rate limit
      - segment: vip-users
        rank: 0
        distributions:
          - variant: high
            rollout: 100
      # Premium users get high rate limit
      - segment: premium-users
        rank: 1
        distributions:
          - variant: high
            rollout: 100
      # Everyone else gets standard
      - rank: 2
        distributions:
          - variant: standard
            rollout: 100

  - key: caipe-agent-timeout
    name: CAIPE Agent Timeout
    type: STRING
    description: Agent response timeout in seconds
    enabled: true
    defaultVariant: standard
    variants:
      - key: short
        value: "30"
        description: Short timeout (30s)
      - key: standard
        value: "120"
        description: Standard timeout (120s)
      - key: long
        value: "300"
        description: Long timeout (300s)
    rules:
      # VIP users get longer timeout
      - segment: vip-users
        rank: 0
        distributions:
          - variant: long
            rollout: 100
      # Everyone else gets standard
      - rank: 1
        distributions:
          - variant: standard
            rollout: 100

  # Observability - enabled but can be toggled for performance
  - key: langfuse-tracing
    name: Langfuse Tracing
    type: BOOLEAN
    description: Enable LLM observability and tracing via Langfuse
    enabled: true
    defaultVariant: "on"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      - rank: 0
        distributions:
          - variant: "on"
            rollout: 100

  # Experimental Features - disabled in production by default
  - key: caipe-streaming
    name: CAIPE Streaming Responses
    type: BOOLEAN
    description: Enable streaming responses from agents (experimental)
    enabled: true
    defaultVariant: "off"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      # Only platform team can test in production
      - segment: platform-team
        rank: 0
        distributions:
          - variant: "on"
            rollout: 100
      # Everyone else: off
      - rank: 1
        distributions:
          - variant: "off"
            rollout: 100

  - key: caipe-deep-orchestration
    name: CAIPE Deep Orchestration
    type: BOOLEAN
    description: Enable multi-agent orchestration for complex workflows (experimental)
    enabled: true
    defaultVariant: "off"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      # Disabled for everyone in production until stable
      - rank: 0
        distributions:
          - variant: "off"
            rollout: 100
