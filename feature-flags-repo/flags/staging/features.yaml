# Staging Environment Feature Flags
# Pre-production testing with realistic configurations
version: "1.0"
namespace: staging

segments:
  # Beta testers segment
  - key: beta-users
    name: Beta Program Users
    description: Users enrolled in the beta testing program
    matchType: ANY
    constraints:
      - property: groups
        operator: IS_ONE_OF
        value: "beta-testers,early-adopters"
      - property: email
        operator: ENDS_WITH
        value: "@beta.example.com"

  # CAIPE testers - for staging validation
  - key: caipe-testers
    name: CAIPE Beta Testers
    description: Users testing CAIPE AI agent features
    matchType: ANY
    constraints:
      - property: groups
        operator: IS_ONE_OF
        value: "caipe-testers,platform-team"

  # Premium tier users
  - key: premium-users
    name: Premium Tier Users
    description: Users with premium tier access
    matchType: ANY
    constraints:
      - property: tier
        operator: EQ
        value: "premium"

flags:
  # Dark mode with wider rollout in staging
  - key: dark-mode-enabled
    name: Dark Mode
    type: BOOLEAN
    description: Enable dark mode UI theme
    enabled: true
    defaultVariant: "off"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      # 50% rollout in staging for testing
      - rank: 0
        distributions:
          - variant: "on"
            rollout: 50
          - variant: "off"
            rollout: 50

  # New dashboard disabled in staging by default
  - key: new-dashboard-ui
    name: New Dashboard UI
    type: BOOLEAN
    description: Experimental new dashboard layout
    enabled: false
    defaultVariant: "off"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false

  # Checkout flow testing with production-like config
  - key: checkout-flow
    name: Checkout Flow Version
    type: STRING
    description: Which checkout flow to display
    enabled: true
    defaultVariant: control
    variants:
      - key: control
        value: original
        description: Original checkout flow
      - key: variant-a
        value: streamlined
        description: Streamlined checkout
    rules:
      # Conservative A/B test
      - rank: 0
        distributions:
          - variant: control
            rollout: 80
          - variant: variant-a
            rollout: 20

  # ===========================================================================
  # CAIPE Feature Flags - Staging
  # More aggressive rollouts for pre-production testing
  # ===========================================================================

  # Master kill switch
  - key: caipe-enabled
    name: CAIPE Master Switch
    type: BOOLEAN
    description: Master toggle for entire CAIPE AI assistant system
    enabled: true
    defaultVariant: "on"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      # 100% enabled in staging
      - rank: 0
        distributions:
          - variant: "on"
            rollout: 100

  # Per-Agent Toggles - all enabled for staging testing
  - key: caipe-agent-argocd
    name: CAIPE ArgoCD Agent
    type: BOOLEAN
    description: Enable ArgoCD agent for GitOps and deployment operations
    enabled: true
    defaultVariant: "on"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      - rank: 0
        distributions:
          - variant: "on"
            rollout: 100

  - key: caipe-agent-github
    name: CAIPE GitHub Agent
    type: BOOLEAN
    description: Enable GitHub agent for repository and PR operations
    enabled: true
    defaultVariant: "on"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      - rank: 0
        distributions:
          - variant: "on"
            rollout: 100

  - key: caipe-agent-backstage
    name: CAIPE Backstage Agent
    type: BOOLEAN
    description: Enable Backstage agent for catalog and template operations
    enabled: true
    defaultVariant: "on"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      - rank: 0
        distributions:
          - variant: "on"
            rollout: 100

  # Operational Controls - staging uses standard limits
  - key: caipe-rate-limit
    name: CAIPE Rate Limit
    type: STRING
    description: Maximum requests per minute per user
    enabled: true
    defaultVariant: standard
    variants:
      - key: low
        value: "20"
        description: Low rate limit (20 rpm)
      - key: standard
        value: "100"
        description: Standard rate limit (100 rpm)
      - key: high
        value: "500"
        description: High rate limit (500 rpm)
    rules:
      # Premium users get high rate limit
      - segment: premium-users
        rank: 0
        distributions:
          - variant: high
            rollout: 100
      # Everyone else gets standard
      - rank: 1
        distributions:
          - variant: standard
            rollout: 100

  - key: caipe-agent-timeout
    name: CAIPE Agent Timeout
    type: STRING
    description: Agent response timeout in seconds
    enabled: true
    defaultVariant: standard
    variants:
      - key: short
        value: "30"
        description: Short timeout (30s)
      - key: standard
        value: "120"
        description: Standard timeout (120s)
      - key: long
        value: "300"
        description: Long timeout (300s)
    rules:
      - rank: 0
        distributions:
          - variant: standard
            rollout: 100

  # Observability - enabled in staging
  - key: langfuse-tracing
    name: Langfuse Tracing
    type: BOOLEAN
    description: Enable LLM observability and tracing via Langfuse
    enabled: true
    defaultVariant: "on"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      - rank: 0
        distributions:
          - variant: "on"
            rollout: 100

  # Experimental Features - 50% rollout in staging for testing
  - key: caipe-streaming
    name: CAIPE Streaming Responses
    type: BOOLEAN
    description: Enable streaming responses from agents (experimental)
    enabled: true
    defaultVariant: "off"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      # CAIPE testers get streaming
      - segment: caipe-testers
        rank: 0
        distributions:
          - variant: "on"
            rollout: 100
      # 50% of regular users for staging validation
      - rank: 1
        distributions:
          - variant: "on"
            rollout: 50
          - variant: "off"
            rollout: 50

  - key: caipe-deep-orchestration
    name: CAIPE Deep Orchestration
    type: BOOLEAN
    description: Enable multi-agent orchestration for complex workflows
    enabled: true
    defaultVariant: "off"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      # Only CAIPE testers in staging
      - segment: caipe-testers
        rank: 0
        distributions:
          - variant: "on"
            rollout: 100
      # Everyone else: off
      - rank: 1
        distributions:
          - variant: "off"
            rollout: 100
