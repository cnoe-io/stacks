# Development Environment Feature Flags
# Safe for experimentation and testing new features
version: "1.0"
namespace: development

segments:
  # Beta testers segment - users in beta program
  - key: beta-users
    name: Beta Program Users
    description: Users enrolled in the beta testing program
    matchType: ANY
    constraints:
      - property: groups
        operator: IS_ONE_OF
        value: "beta-testers,early-adopters"
      - property: email
        operator: ENDS_WITH
        value: "@beta.example.com"

  # Internal users segment
  - key: internal-users
    name: Internal Users
    description: Company employees and contractors
    matchType: ANY
    constraints:
      - property: email
        operator: ENDS_WITH
        value: "@company.com"
      - property: groups
        operator: IS_ONE_OF
        value: "employees,contractors"

  # CAIPE beta testers - users testing AI agent features
  - key: caipe-testers
    name: CAIPE Beta Testers
    description: Users testing CAIPE AI agent features
    matchType: ANY
    constraints:
      - property: groups
        operator: IS_ONE_OF
        value: "caipe-testers,platform-team"
      - property: email
        operator: ENDS_WITH
        value: "@company.com"

  # Premium tier users - higher rate limits
  - key: premium-users
    name: Premium Tier Users
    description: Users with premium tier access
    matchType: ANY
    constraints:
      - property: tier
        operator: EQ
        value: "premium"

flags:
  # Example: Dark mode toggle
  - key: dark-mode-enabled
    name: Dark Mode
    type: BOOLEAN
    description: Enable dark mode UI theme
    enabled: true
    defaultVariant: "off"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      # Beta users get dark mode enabled
      - segment: beta-users
        rank: 0
        distributions:
          - variant: "on"
            rollout: 100
      # Everyone else: 20% rollout
      - rank: 1
        distributions:
          - variant: "on"
            rollout: 20
          - variant: "off"
            rollout: 80

  # Example: Feature under development
  - key: new-dashboard-ui
    name: New Dashboard UI
    type: BOOLEAN
    description: Experimental new dashboard layout
    enabled: true
    defaultVariant: "off"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      # Only internal users see new dashboard
      - segment: internal-users
        rank: 0
        distributions:
          - variant: "on"
            rollout: 100

  # Example: String flag for A/B testing
  - key: checkout-flow
    name: Checkout Flow Version
    type: STRING
    description: Which checkout flow to display
    enabled: true
    defaultVariant: control
    variants:
      - key: control
        value: original
        description: Original checkout flow
      - key: variant-a
        value: streamlined
        description: Streamlined checkout
      - key: variant-b
        value: one-page
        description: Single page checkout
    rules:
      # A/B test with equal distribution
      - rank: 0
        distributions:
          - variant: control
            rollout: 34
          - variant: variant-a
            rollout: 33
          - variant: variant-b
            rollout: 33

  # ===========================================================================
  # CAIPE Feature Flags
  # ===========================================================================

  # Master kill switch for entire CAIPE system
  - key: caipe-enabled
    name: CAIPE Master Switch
    type: BOOLEAN
    description: Master toggle for entire CAIPE AI assistant system. Disabling stops all agent functionality.
    enabled: true
    defaultVariant: "on"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      # 100% enabled in development
      - rank: 0
        distributions:
          - variant: "on"
            rollout: 100

  # Per-Agent Toggles
  - key: caipe-agent-argocd
    name: CAIPE ArgoCD Agent
    type: BOOLEAN
    description: Enable ArgoCD agent for GitOps and deployment operations
    enabled: true
    defaultVariant: "on"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      - rank: 0
        distributions:
          - variant: "on"
            rollout: 100

  - key: caipe-agent-github
    name: CAIPE GitHub Agent
    type: BOOLEAN
    description: Enable GitHub agent for repository and PR operations
    enabled: true
    defaultVariant: "on"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      - rank: 0
        distributions:
          - variant: "on"
            rollout: 100

  - key: caipe-agent-backstage
    name: CAIPE Backstage Agent
    type: BOOLEAN
    description: Enable Backstage agent for catalog and template operations
    enabled: true
    defaultVariant: "on"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      - rank: 0
        distributions:
          - variant: "on"
            rollout: 100

  # Operational Controls
  - key: caipe-rate-limit
    name: CAIPE Rate Limit
    type: STRING
    description: Maximum requests per minute per user (variant-based)
    enabled: true
    defaultVariant: standard
    variants:
      - key: low
        value: "20"
        description: Low rate limit (20 rpm)
      - key: standard
        value: "100"
        description: Standard rate limit (100 rpm)
      - key: high
        value: "500"
        description: High rate limit (500 rpm)
      - key: unlimited
        value: "0"
        description: No rate limit
    rules:
      # Premium users get high rate limit
      - segment: premium-users
        rank: 0
        distributions:
          - variant: high
            rollout: 100
      # CAIPE testers get high limit for testing
      - segment: caipe-testers
        rank: 1
        distributions:
          - variant: high
            rollout: 100
      # Everyone else gets standard
      - rank: 2
        distributions:
          - variant: standard
            rollout: 100

  - key: caipe-agent-timeout
    name: CAIPE Agent Timeout
    type: STRING
    description: Agent response timeout in seconds (variant-based)
    enabled: true
    defaultVariant: standard
    variants:
      - key: short
        value: "30"
        description: Short timeout (30s)
      - key: standard
        value: "120"
        description: Standard timeout (120s)
      - key: long
        value: "300"
        description: Long timeout (300s)
    rules:
      # Default to standard for everyone
      - rank: 0
        distributions:
          - variant: standard
            rollout: 100

  # Observability
  - key: langfuse-tracing
    name: Langfuse Tracing
    type: BOOLEAN
    description: Enable LLM observability and tracing via Langfuse
    enabled: true
    defaultVariant: "on"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      # Always on in development for debugging
      - rank: 0
        distributions:
          - variant: "on"
            rollout: 100

  # Experimental Features
  - key: caipe-streaming
    name: CAIPE Streaming Responses
    type: BOOLEAN
    description: Enable streaming responses from agents (experimental)
    enabled: true
    defaultVariant: "off"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      # Only CAIPE testers get streaming in dev
      - segment: caipe-testers
        rank: 0
        distributions:
          - variant: "on"
            rollout: 100
      # Everyone else: off
      - rank: 1
        distributions:
          - variant: "off"
            rollout: 100

  - key: caipe-deep-orchestration
    name: CAIPE Deep Orchestration
    type: BOOLEAN
    description: Enable multi-agent orchestration for complex workflows (experimental)
    enabled: true
    defaultVariant: "off"
    variants:
      - key: "on"
        value: true
      - key: "off"
        value: false
    rules:
      # Only CAIPE testers in development
      - segment: caipe-testers
        rank: 0
        distributions:
          - variant: "on"
            rollout: 100
      # Everyone else: off
      - rank: 1
        distributions:
          - variant: "off"
            rollout: 100
