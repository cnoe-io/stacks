apiVersion: v1
kind: Service
metadata:
  name: agent-sandbox-controller
  namespace: agent-sandbox
  labels:
    app: agent-sandbox-controller
    app.kubernetes.io/name: agent-sandbox-controller
    app.kubernetes.io/part-of: agent-sandbox
spec:
  type: ClusterIP
  selector:
    app: agent-sandbox-controller
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
