apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-isolation
  namespace: agent-sandbox
  labels:
    app.kubernetes.io/name: sandbox-isolation
    app.kubernetes.io/part-of: agent-sandbox
    app.kubernetes.io/component: network-policy
spec:
  # Apply to all sandbox pods
  podSelector:
    matchLabels:
      app.kubernetes.io/name: open-swe-sandbox
  policyTypes:
    - Ingress
    - Egress
  # Ingress rules: Allow from open-swe namespace and sandbox-router
  ingress:
    # Allow from open-swe LangGraph server
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: open-swe
    # Allow from sandbox-router
    - from:
        - podSelector:
            matchLabels:
              app: sandbox-router
    # Allow from other pods in agent-sandbox namespace (controller)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-sandbox
    # Allow from ai-chatbot namespace (for direct pod-to-pod HTTP API calls)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-chatbot
  # Egress rules: Allow necessary outbound traffic
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS (GitHub, npm, pip, etc.)
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # Allow HTTP (some package registries)
    - to: []
      ports:
        - protocol: TCP
          port: 80
    # Allow SSH (git clone via SSH - rare but possible)
    - to: []
      ports:
        - protocol: TCP
          port: 22
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-router-policy
  namespace: agent-sandbox
  labels:
    app.kubernetes.io/name: sandbox-router-policy
    app.kubernetes.io/part-of: agent-sandbox
spec:
  podSelector:
    matchLabels:
      app: sandbox-router
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from open-swe namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: open-swe
      ports:
        - protocol: TCP
          port: 8080
    # Allow from within agent-sandbox namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-sandbox
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow to sandboxes for exec
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: open-swe-sandbox
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow to Kubernetes API for pod exec
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
