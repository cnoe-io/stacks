apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-sandbox-controller
  namespace: agent-sandbox
  labels:
    app.kubernetes.io/name: agent-sandbox-controller
    app.kubernetes.io/part-of: agent-sandbox
  annotations:
    # NOTE: The kubernetes-sigs/agent-sandbox controller image is not yet publicly available.
    # This deployment uses a placeholder that logs CRD events.
    # When the official image becomes available, update to:
    # image: registry.k8s.io/agent-sandbox/controller:v0.1.0
    open-swe.status: "placeholder-controller"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-sandbox-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-sandbox-controller
        app.kubernetes.io/part-of: agent-sandbox
    spec:
      serviceAccountName: agent-sandbox-controller
      containers:
        - name: controller
          # Using kubectl as a simple placeholder controller
          # In production, replace with official agent-sandbox controller image
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Agent Sandbox Controller Placeholder"
              echo "Watching for Sandbox CRDs..."
              while true; do
                echo "$(date): Watching sandbox resources..."
                kubectl get sandboxes,sandboxtemplates,sandboxclaims,sandboxwarmpools -A --no-headers 2>/dev/null || echo "No sandbox resources found"
                sleep 60
              done
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
