apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-sandbox-controller
  namespace: agent-sandbox
  labels:
    app.kubernetes.io/name: agent-sandbox-controller
    app.kubernetes.io/part-of: agent-sandbox
  annotations:
    # NOTE: The kubernetes-sigs/agent-sandbox controller image is not yet publicly available.
    # This deployment uses a placeholder that logs CRD events.
    # When the official image becomes available, update to:
    # image: registry.k8s.io/agent-sandbox/controller:v0.1.0
    open-swe.status: "placeholder-controller"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-sandbox-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-sandbox-controller
        app.kubernetes.io/part-of: agent-sandbox
    spec:
      serviceAccountName: agent-sandbox-controller
      containers:
        - name: controller
          image: registry.k8s.io/agent-sandbox/agent-sandbox-controller:v0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --extensions
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
