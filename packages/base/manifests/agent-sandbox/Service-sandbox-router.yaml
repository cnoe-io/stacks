apiVersion: v1
kind: Service
metadata:
  name: sandbox-router
  namespace: agent-sandbox
  labels:
    app.kubernetes.io/name: sandbox-router
    app.kubernetes.io/component: router
    app.kubernetes.io/part-of: agent-sandbox
spec:
  type: ClusterIP
  selector:
    app: sandbox-router
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
