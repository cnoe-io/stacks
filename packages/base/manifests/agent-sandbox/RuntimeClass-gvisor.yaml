apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
  labels:
    app.kubernetes.io/name: gvisor
    app.kubernetes.io/part-of: agent-sandbox
# Handler must match the containerd/CRI-O configuration for gVisor
# This assumes gVisor (runsc) is installed on nodes with handler name "runsc"
# For GKE: Use "gvisor" handler with nodes having --sandbox type=gvisor
# For self-hosted: Install gVisor and configure containerd with runsc handler
handler: runsc
# Optional: Scheduling constraints to ensure pods land on gVisor-capable nodes
# Uncomment if you have dedicated gVisor node pools
# scheduling:
#   nodeSelector:
#     sandbox.gke.io/runtime: gvisor
