apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxWarmPool
metadata:
  name: open-swe-warm-pool
  namespace: agent-sandbox
  labels:
    app.kubernetes.io/name: open-swe-warm-pool
    app.kubernetes.io/part-of: open-swe
    app.kubernetes.io/component: warm-pool
spec:
  sandboxTemplateRef:
    name: open-swe-dev
    namespace: agent-sandbox
  # Scale down warm pool to 0 to save resources
  replicas: 0
  # Minimum number of ready sandboxes before accepting claims
  minReady: 0
  # Topology spread for high availability across zones
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: open-swe-sandbox
