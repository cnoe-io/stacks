apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: open-swe-sandbox-user
  labels:
    app.kubernetes.io/name: open-swe-sandbox-user
    app.kubernetes.io/part-of: open-swe
rules:
  # SandboxClaim management for agent-sandbox CRD integration
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Sandbox CR access for getting pod selector
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  # Pod management in agent-sandbox namespace (for warm pool pods)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Pod exec for command execution (requires both get and create)
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  # Pod logs for debugging
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  # Pod status for monitoring
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: open-swe-sandbox-user
  namespace: agent-sandbox
  labels:
    app.kubernetes.io/name: open-swe-sandbox-user
    app.kubernetes.io/part-of: open-swe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: open-swe-sandbox-user
subjects:
  # Default service account in open-swe namespace (used by the agent)
  - kind: ServiceAccount
    name: default
    namespace: open-swe
  - kind: ServiceAccount
    name: open-swe-langgraph-cloud-api-server
    namespace: open-swe
