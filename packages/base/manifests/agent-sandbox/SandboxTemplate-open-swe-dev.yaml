apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: open-swe-dev
  namespace: agent-sandbox
  labels:
    app.kubernetes.io/name: open-swe-dev
    app.kubernetes.io/part-of: open-swe
spec:
  description: "Development sandbox template for Open SWE code execution"
  defaultTimeout: "30m"
  resourceLimits:
    cpu: "2"
    memory: "4Gi"
    storage: "10Gi"
  securityPolicy:
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: true
    networkPolicy: restricted
  podTemplate:
    spec:
      containers:
        - name: sandbox
          image: python:3.11-slim-bookworm
          command:
            - /bin/sh
            - -c
            - |
              # Install common development tools
              apt-get update && apt-get install -y --no-install-recommends \
                git \
                curl \
                wget \
                build-essential \
                nodejs \
                npm \
                && rm -rf /var/lib/apt/lists/*
              # Configure git
              git config --global user.email "open-swe@users.noreply.github.com"
              git config --global user.name "open-swe[bot]"
              git config --global init.defaultBranch main
              # Create symlink for compatibility with Daytona workspace path
              mkdir -p /home
              ln -sfn /workspace /home/daytona
              echo "Sandbox ready"
              # Keep container running
              tail -f /dev/null
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            # Note: We don't drop ALL capabilities because apt-get needs
            # SETUID/SETGID for user switching during package installation.
            # For production, consider using a pre-built image with tools installed.
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 10Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
