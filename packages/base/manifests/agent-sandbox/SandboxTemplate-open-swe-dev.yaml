apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: open-swe-dev
  namespace: agent-sandbox
  labels:
    app.kubernetes.io/name: open-swe-dev
    app.kubernetes.io/part-of: open-swe
    app.kubernetes.io/component: sandbox-template
spec:
  description: "Development sandbox template for Open SWE code execution"
  defaultTimeout: "30m"
  resourceLimits:
    cpu: "2"
    memory: "4Gi"
    storage: "10Gi"
  securityPolicy:
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: true
    networkPolicy: restricted
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: open-swe-sandbox
        app.kubernetes.io/part-of: open-swe
        sandbox-type: development
    spec:
      containers:
        - name: sandbox
          # AIO Sandbox: All-in-One container with Browser, Shell, File, MCP, VSCode
          # Pre-installed: git, curl, wget, nodejs, python, headless Chrome
          # Docs: https://sandbox.agent-infra.com/
          image: ghcr.io/agent-infra/sandbox:1.0.0.152
          envFrom:
            # OpenTelemetry configuration for observability
            # Traces are sent to OTEL collector which routes to Tempo and Langfuse
            - configMapRef:
                name: sandbox-otel-config
          env:
            # AIO Sandbox working directory
            - name: WORKSPACE
              value: "/home/gem"
            - name: GIT_AUTHOR_NAME
              value: "open-swe[bot]"
            - name: GIT_AUTHOR_EMAIL
              value: "open-swe@users.noreply.github.com"
            - name: GIT_COMMITTER_NAME
              value: "open-swe[bot]"
            - name: GIT_COMMITTER_EMAIL
              value: "open-swe@users.noreply.github.com"
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          securityContext:
            # AIO Sandbox runs as root by default
            allowPrivilegeEscalation: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
