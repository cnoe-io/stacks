apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: nats
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
data:
  nats.conf: |
    # NATS Server Configuration for Workflow Infrastructure

    # Server identification
    server_name: nats-workflow

    # Client connections
    port: 4222
    max_connections: 1024
    max_payload: 8MB

    # HTTP monitoring
    http_port: 8222

    # JetStream configuration
    jetstream {
      store_dir: /data/jetstream
      max_memory_store: 256MB
      max_file_store: 1Gi
    }

    # Logging
    debug: false
    trace: false
    logtime: true

    # Cluster configuration (for future HA setup)
    # cluster {
    #   name: nats-workflow-cluster
    #   port: 6222
    #   routes: []
    # }

    # System account for monitoring
    accounts {
      $SYS {
        users = [
          { user: sys, password: sys }
        ]
      }
    }
