# Inner Loop Image Configuration
# Each entry generates a Warehouse + Stage for local development
# Generated pipelines are output to ./manifests/ directory
#
# This file is the SINGLE SOURCE OF TRUTH for:
#   - Kargo pipeline generation (generate-kargo-pipelines.sh)
#   - Warehouse refresh mappings in preload-images.sh
#
# Global config:
#   clusterHost  - Hostname used by idpbuilder (detected from CLUSTER_HOST env or hostname -s)
#   giteaOrg     - Gitea organization for manifests (default: giteaAdmin)
#
# Image fields:
#   name          - Image name (used for Warehouse/Stage naming)
#   imageName     - (optional) Actual image repository name if different from 'name'
#   argocdApp     - ArgoCD Application name to update
#   registry      - Container registry URL
#   org           - Registry organization/namespace
#   tagStrategy   - Kargo image selection: SemVer, Lexical, or NewestBuild
#   tagPattern    - Regex pattern for allowed tags
#   promotionType - kustomize or helm
#   warehouseName - (optional) Override warehouse name if different from 'name'
#
# For helm apps, you must also specify:
#   helmRepoURL  - Helm chart repository URL (to match ArgoCD source)
#   helmImageKey - Helm values key for image repository
#
# Global configuration
config:
  giteaOrg: giteaAdmin
  giteaRegistry: gitea.cnoe.localtest.me:8443

images:
  # NOTE: backstage is managed by kargo-backstage-pipeline, not included here
  # to avoid conflicts with the existing pipeline

  # Active-development apps with custom images built from local Gitea registry
  # These apps use :latest tags by default; Kargo manages versioned promotions

  - name: ai-chatbot
    argocdApp: ai-chatbot
    registry: gitea.cnoe.localtest.me:8443
    org: giteaadmin
    tagStrategy: Lexical
    tagPattern: ".*"
    promotionType: kustomize

  - name: workflow-builder
    argocdApp: workflow-builder
    registry: gitea.cnoe.localtest.me:8443
    org: giteaadmin
    tagStrategy: Lexical
    tagPattern: ".*"
    promotionType: kustomize

  - name: workflow-orchestrator
    argocdApp: workflow-orchestrator
    registry: gitea.cnoe.localtest.me:8443
    org: giteaadmin
    tagStrategy: NewestBuild
    tagPattern: ".*"
    promotionType: kustomize

  - name: function-router
    argocdApp: function-router
    registry: gitea.cnoe.localtest.me:8443
    org: giteaadmin
    tagStrategy: Lexical
    tagPattern: ".*"
    promotionType: kustomize

  - name: mcp-gateway
    argocdApp: mcp-gateway
    registry: gitea.cnoe.localtest.me:8443
    org: giteaadmin
    # We publish immutable git-tagged images; never promote :latest.
    tagStrategy: NewestBuild
    tagPattern: "^git-[0-9a-f]{40}$"
    promotionType: kustomize

  # workflow-builder serverless functions (fn-*)
  - name: fn-activepieces
    argocdApp: fn-activepieces
    registry: gitea.cnoe.localtest.me:8443
    org: giteaadmin
    tagStrategy: NewestBuild
    tagPattern: "^git-[0-9a-f]{40}$"
    promotionType: kustomize

  - name: fn-system
    argocdApp: fn-system
    registry: gitea.cnoe.localtest.me:8443
    org: giteaadmin
    tagStrategy: NewestBuild
    tagPattern: "^git-[0-9a-f]{40}$"
    promotionType: kustomize

  # Durable agent uses opencode image repository while app/stage name remains durable-agent
  - name: durable-agent
    imageName: opencode-durable-agent
    argocdApp: durable-agent
    registry: gitea.cnoe.localtest.me:8443
    org: giteaadmin
    tagStrategy: NewestBuild
    tagPattern: ".*"
    promotionType: kustomize
