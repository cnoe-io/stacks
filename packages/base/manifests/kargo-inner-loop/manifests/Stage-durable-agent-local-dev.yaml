apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  annotations:
    kargo.akuity.io/color: green
  labels:
    app.kubernetes.io/component: stage
    app.kubernetes.io/name: durable-agent-local-dev-stage
    app.kubernetes.io/part-of: kargo-inner-loop
    kargo.akuity.io/loop: inner
  name: durable-agent-local-dev
  namespace: kargo-pipelines
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: durable-agent
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        # ${TAILSCALE_HOST} is substituted by build.sh at build time
        - name: gitRepoURL
          value: http://gitea-http.gitea.svc.cluster.local:3000/giteaadmin/gitops-${TAILSCALE_HOST}-durable-agent-manifests.git
        - name: imageRepoURL
          value: gitea.cnoe.localtest.me:8443/giteaadmin/opencode-durable-agent
      steps:
        # Step 1: Clone the manifest repo (main branch only)
        - as: clone-repo
          uses: git-clone
          config:
            repoURL: ${{ vars.gitRepoURL }}
            insecureSkipTLSVerify: true
            checkout:
              - branch: main
                path: ./src

        # Step 2: Update image tag in kustomization.yaml
        # This modifies the images: section, ArgoCD will render via kustomize
        - as: update-image
          uses: kustomize-set-image
          config:
            path: ./src
            images:
              - image: ${{ vars.imageRepoURL }}
                tag: ${{ imageFrom(vars.imageRepoURL).Tag }}

        # Step 3: Commit the image tag change
        - as: commit-changes
          uses: git-commit
          config:
            path: ./src
            message: |
              chore: update durable-agent to ${{ imageFrom(vars.imageRepoURL).Tag }}

              Image: ${{ vars.imageRepoURL }}:${{ imageFrom(vars.imageRepoURL).Tag }}
              Freight: ${{ ctx.targetFreight.name }}

        # Step 4: Push to main branch
        - as: push-changes
          uses: git-push
          config:
            path: ./src
            targetBranch: main
