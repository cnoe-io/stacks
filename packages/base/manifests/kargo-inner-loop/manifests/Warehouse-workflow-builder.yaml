apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  labels:
    app.kubernetes.io/component: warehouse
    app.kubernetes.io/name: workflow-builder-warehouse
    app.kubernetes.io/part-of: kargo-inner-loop
    kargo.akuity.io/loop: inner
  name: workflow-builder
  namespace: kargo-pipelines
spec:
  freightCreationPolicy: Automatic
  interval: 30s
  subscriptions:
    - git:
        repoURL: https://gitea.cnoe.localtest.me:8443/giteaadmin/idpbuilder-${TAILSCALE_HOST}-workflow-builder-manifests.git
        branch: main
        insecureSkipTLSVerify: true
        strictSemvers: false
    - image:
        repoURL: gitea.cnoe.localtest.me:8443/giteaadmin/workflow-builder
        imageSelectionStrategy: NewestBuild
        allowTagsRegexes:
          - ^git-[0-9a-f]{40}$
        discoveryLimit: 10
        insecureSkipTLSVerify: true
        strictSemvers: false
    - image:
        repoURL: gitea.cnoe.localtest.me:8443/giteaadmin/workflow-mcp-server
        imageSelectionStrategy: NewestBuild
        allowTagsRegexes:
          - ^git-[0-9a-f]{40}$
        discoveryLimit: 10
        insecureSkipTLSVerify: true
        strictSemvers: false
