apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  labels:
    app.kubernetes.io/component: warehouse
    app.kubernetes.io/name: agentuity-coder-warehouse
    app.kubernetes.io/part-of: kargo-inner-loop
    kargo.akuity.io/loop: inner
  name: agentuity-coder
  namespace: kargo-pipelines
spec:
  freightCreationPolicy: Automatic
  interval: 30s
  subscriptions:
    # Config source - Gitea repo from gitops
    # The ryzen placeholder is substituted by build.sh
    - git:
        repoURL: http://gitea-http.gitea.svc.cluster.local:3000/giteaadmin/gitops-ryzen-agentuity-coder-manifests.git
        branch: main
        insecureSkipTLSVerify: true
        strictSemvers: false
    # Image source - local dev images from Gitea registry
    - image:
        repoURL: gitea.cnoe.localtest.me/giteaadmin/agentuity-coder
        imageSelectionStrategy: NewestBuild
        allowTagsRegexes:
          - ^git-[0-9a-f]{40}$
        discoveryLimit: 10
        insecureSkipTLSVerify: true
        strictSemvers: false
