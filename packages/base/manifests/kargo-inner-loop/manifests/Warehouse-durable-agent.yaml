apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  labels:
    app.kubernetes.io/component: warehouse
    app.kubernetes.io/name: durable-agent-warehouse
    app.kubernetes.io/part-of: kargo-inner-loop
    kargo.akuity.io/loop: inner
  name: durable-agent
  namespace: kargo-pipelines
spec:
  freightCreationPolicy: Automatic
  interval: 30s
  subscriptions:
    # Config source - Gitea repo from idpbuilder
    # The ${TAILSCALE_HOST} placeholder is substituted by build.sh
    - git:
        repoURL: https://gitea.cnoe.localtest.me:8443/giteaAdmin/idpbuilder-${TAILSCALE_HOST}-durable-agent-manifests.git
        branch: main
        insecureSkipTLSVerify: true
        strictSemvers: false
    # Image source - local dev images from Gitea registry
    - image:
        repoURL: gitea.cnoe.localtest.me:8443/giteaadmin/opencode-durable-agent
        imageSelectionStrategy: NewestBuild
        allowTagsRegexes:
          - ^dev-[0-9]{8}-[0-9]{6}-[0-9a-f]{7,}$
        discoveryLimit: 100
        insecureSkipTLSVerify: true
        strictSemvers: false
        platform: linux/amd64
