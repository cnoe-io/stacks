apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  labels:
    app.kubernetes.io/component: warehouse
    app.kubernetes.io/name: ai-chatbot-warehouse
    app.kubernetes.io/part-of: kargo-inner-loop
    kargo.akuity.io/loop: inner
  name: ai-chatbot
  namespace: kargo-pipelines
spec:
  freightCreationPolicy: Automatic
  interval: 30s
  subscriptions:
    # Config source - Gitea repo from gitops
    # The ryzen placeholder is substituted by build.sh
    - git:
        repoURL: http://gitea-http.gitea.svc.cluster.local:3000/giteaadmin/gitops-ryzen-ai-chatbot-manifests.git
        branch: main
        insecureSkipTLSVerify: true
        strictSemvers: false
    # Image source - local dev images from Gitea registry
    - image:
        repoURL: gitea.cnoe.localtest.me/giteaadmin/ai-chatbot
        imageSelectionStrategy: Lexical
        allowTagsRegexes:
          - .*
        discoveryLimit: 10
        insecureSkipTLSVerify: true
        strictSemvers: false
