apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  labels:
    app.kubernetes.io/component: warehouse
    app.kubernetes.io/name: open-swe-web-warehouse
    app.kubernetes.io/part-of: kargo-inner-loop
  name: open-swe-web
  namespace: kargo-pipelines
spec:
  freightCreationPolicy: Automatic
  interval: 30s
  subscriptions:
    - image:
        repoURL: gitea.cnoe.localtest.me:8443/giteaadmin/open-swe-web
        imageSelectionStrategy: SemVer
        allowTags: ^v?[0-9]+.[0-9]+.[0-9]+([+-].*)?$
        insecureSkipTLSVerify: true
