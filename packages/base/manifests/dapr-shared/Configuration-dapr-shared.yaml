# Dapr Configuration for shared instances
#
# Configures tracing, metrics, and features for dapr-shared DaemonSets.
# This is referenced by the daprd --config flag.
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-shared-config
  namespace: dapr-sandbox
spec:
  # Enable distributed tracing for observability
  tracing:
    samplingRate: "1"
    otel:
      endpointAddress: otel-collector.observability.svc.cluster.local:4317
      isSecure: false
      protocol: grpc
  # Metrics configuration
  metrics:
    enabled: true
  # Feature flags
  features:
    - name: "AppHealthCheck"
      enabled: true
    - name: "Resiliency"
      enabled: true
  # Access control for service invocation
  accessControl:
    defaultAction: allow
    trustDomain: "public"
