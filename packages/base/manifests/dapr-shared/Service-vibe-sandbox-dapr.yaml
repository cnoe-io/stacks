apiVersion: v1
kind: Service
metadata:
  name: vibe-sandbox-dapr
  namespace: dapr-sandbox
  labels:
    app.kubernetes.io/name: vibe-sandbox-dapr
    app.kubernetes.io/part-of: dapr-shared
spec:
  selector:
    app.kubernetes.io/name: vibe-sandbox-shared
  ports:
    - name: http
      port: 3500
      targetPort: 3500
      protocol: TCP
    - name: grpc
      port: 50001
      targetPort: 50001
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  type: ClusterIP
