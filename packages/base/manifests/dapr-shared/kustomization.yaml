apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Namespace and RBAC
  - Namespace-dapr-sandbox.yaml
  - ServiceAccount-dapr-shared.yaml
  - ClusterRole-dapr-shared.yaml
  - ClusterRoleBinding-dapr-shared.yaml
  # Copy dapr-trust-bundle from dapr-system (needed by DaemonSets for mTLS)
  - Job-copy-trust-bundle.yaml
  # Dapr Configuration for shared instances
  - Configuration-dapr-shared.yaml
  # Azure integration (secrets and configuration)
  - Component-secretstore-azure-keyvault.yaml
  - Component-azureappconfig.yaml
  # sandbox-agent shared Dapr
  - DaemonSet-sandbox-agent-shared.yaml
  - Service-sandbox-agent-dapr.yaml
  # vibe-sandbox shared Dapr
  - DaemonSet-vibe-sandbox-shared.yaml
  - Service-vibe-sandbox-dapr.yaml
