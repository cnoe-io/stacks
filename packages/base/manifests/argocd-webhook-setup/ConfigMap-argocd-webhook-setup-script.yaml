apiVersion: v1
data:
  setup-webhooks.sh: |
    #!/bin/sh
    set -e

    echo "Configuring Gitea System Webhook for ArgoCD..."
    echo "Target: http://argocd-server.argocd.svc.cluster.local/api/webhook"

    # Configuration
    GITEA_URL="https://gitea.cnoe.localtest.me:8443"
    WEBHOOK_URL="http://argocd-server.argocd.svc.cluster.local/api/webhook"

    # Get credentials from mounted secrets
    GITEA_USER=$(cat /gitea-credentials/username 2>/dev/null || echo "giteaAdmin")
    GITEA_PASS=$(cat /gitea-credentials/password)

    # Check if ArgoCD system webhook already exists
    echo "Checking for existing system webhook..."
    EXISTING=$(curl -k -s -u "$GITEA_USER:$GITEA_PASS" \
      "$GITEA_URL/api/v1/admin/hooks" | \
      jq '[.[] | select(.config.url | contains("argocd"))] | length' 2>/dev/null || echo "0")

    if [ "$EXISTING" -gt 0 ]; then
      echo "ArgoCD system webhook already exists. Skipping."
      echo ""
      echo "System webhook configuration complete!"
      echo "All repository push events will notify ArgoCD instantly."
      exit 0
    fi

    # Create system webhook (applies to ALL repositories)
    echo "Creating system webhook..."
    RESULT=$(curl -k -s -w "%{http_code}" -o /tmp/response.json -X POST \
      -u "$GITEA_USER:$GITEA_PASS" \
      "$GITEA_URL/api/v1/admin/hooks" \
      -H "Content-Type: application/json" \
      -d "{
        \"type\": \"gitea\",
        \"active\": true,
        \"events\": [\"push\"],
        \"config\": {
          \"url\": \"$WEBHOOK_URL\",
          \"content_type\": \"json\",
          \"is_system_webhook\": \"true\"
        }
      }")

    if [ "$RESULT" = "201" ]; then
      HOOK_ID=$(jq -r '.id' /tmp/response.json)
      echo "[+] Created system webhook (id: $HOOK_ID)"
      echo ""
      echo "System webhook configuration complete!"
      echo "All repository push events will notify ArgoCD instantly."
    else
      echo "[-] Failed to create system webhook (HTTP $RESULT)"
      cat /tmp/response.json
      exit 1
    fi
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: webhook-automation
    app.kubernetes.io/name: argocd-webhook-setup
  name: argocd-webhook-setup-script
  namespace: argocd
