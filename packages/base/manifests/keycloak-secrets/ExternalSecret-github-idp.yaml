apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-idp
  namespace: keycloak
  labels:
    app.kubernetes.io/name: github-idp
    app.kubernetes.io/part-of: keycloak
  annotations:
    # GitHub IdP is optional - add secrets to Azure Key Vault to enable
    argocd.argoproj.io/sync-options: "SkipDryRunOnMissingResource=true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    name: github-idp
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: GITHUB_IDP_CLIENT_ID
      remoteRef:
        key: github-idp-client-id
    - secretKey: GITHUB_IDP_CLIENT_SECRET
      remoteRef:
        key: github-idp-client-secret
