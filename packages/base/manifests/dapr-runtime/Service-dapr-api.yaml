apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/path: /
    prometheus.io/port: "9090"
    prometheus.io/scrape: "true"
  labels:
    app.kubernetes.io/component: operator
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/name: dapr
    app.kubernetes.io/part-of: dapr
    app.kubernetes.io/version: 1.17.0-rc.8
  name: dapr-api
  namespace: dapr-system
spec:
  ports:
    - name: grpc
      port: 443
      protocol: TCP
      targetPort: 6500
    - name: legacy
      port: 80
      protocol: TCP
      targetPort: 6500
    - name: metrics
      port: 9090
      protocol: TCP
      targetPort: 9090
  selector:
    app: dapr-operator
  type: ClusterIP
