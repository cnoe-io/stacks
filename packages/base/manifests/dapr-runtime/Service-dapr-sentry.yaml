apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/path: /
    prometheus.io/port: "9090"
    prometheus.io/scrape: "true"
  labels:
    app.kubernetes.io/component: sentry
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/name: dapr
    app.kubernetes.io/part-of: dapr
    app.kubernetes.io/version: 1.16.6
  name: dapr-sentry
  namespace: dapr-system
spec:
  ports:
    - name: grpc
      port: 443
      protocol: TCP
      targetPort: 50001
    - name: metrics
      port: 9090
      protocol: TCP
      targetPort: 9090
  selector:
    app: dapr-sentry
  type: ClusterIP
