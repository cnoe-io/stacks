apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: dapr-scheduler-server
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/name: dapr
    app.kubernetes.io/part-of: dapr
    app.kubernetes.io/version: 1.16.6
  name: dapr-scheduler-server
  namespace: dapr-system
spec:
  podManagementPolicy: Parallel
  replicas: 1
  selector:
    matchLabels:
      app: dapr-scheduler-server
  serviceName: dapr-scheduler-server
  template:
    metadata:
      annotations:
        dapr.io/control-plane: scheduler
        prometheus.io/path: /
        prometheus.io/port: "9090"
        prometheus.io/scrape: "true"
      labels:
        app: dapr-scheduler-server
        app.kubernetes.io/component: scheduler
        app.kubernetes.io/managed-by: helm
        app.kubernetes.io/name: dapr
        app.kubernetes.io/part-of: dapr
        app.kubernetes.io/version: 1.16.6
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
      containers:
        - args:
            - --listen-address=0.0.0.0
            - --id
            - $(SCHEDULER_ID)
            - --etcd-initial-cluster
            - dapr-scheduler-server-0=https://dapr-scheduler-server-0.dapr-scheduler-server.dapr-system.svc.cluster.local:2380
            - --etcd-embed=true
            - --log-level
            - info
            - --log-as-json
            - --enable-metrics
            - --metrics-port
            - "9090"
            - --etcd-client-port
            - "2379"
            - --etcd-data-dir=/var/run/data/dapr-scheduler/dapr-system/$(SCHEDULER_ID)
            - --etcd-space-quota=9.2E
            - --etcd-compaction-mode=periodic
            - --etcd-compaction-retention=10m
            - --etcd-snapshot-count=10000
            - --etcd-max-snapshots=10
            - --etcd-max-wals=10
            - --etcd-backend-batch-limit=5000
            - --etcd-backend-batch-interval=50ms
            - --etcd-experimental-bootstrap-defrag-threshold-megabytes=100
            - --etcd-initial-election-tick-advance=false
            - --etcd-metrics=basic
            - --tls-enabled
            - --trust-domain=cluster.local
            - --trust-anchors-file=/var/run/secrets/dapr.io/tls/ca.crt
            - --sentry-address=dapr-sentry.dapr-system.svc.cluster.local:443
            - --mode=kubernetes
          command:
            - /scheduler
          env:
            - name: SCHEDULER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          image: ghcr.io/dapr/scheduler:1.16.6
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 3
          name: dapr-scheduler-server
          ports:
            - containerPort: 50006
              name: api
            - containerPort: 2379
              name: etcd-client
            - containerPort: 2330
              name: etcd-httpclient
            - containerPort: 2380
              name: etcd-peer
            - containerPort: 9090
              name: metrics
              protocol: TCP
          readinessProbe:
            failureThreshold: 5
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
          resources: {}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /var/run/data/dapr-scheduler/
              name: dapr-scheduler-data-dir
              readOnly: false
            - mountPath: /tmp
              name: dapr-scheduler-writeable-identity
            - mountPath: /var/run/secrets/dapr.io/tls
              name: dapr-trust-bundle
              readOnly: true
            - mountPath: /var/run/secrets/dapr.io/sentrytoken
              name: dapr-identity-token
      securityContext:
        fsGroup: 65532
      serviceAccountName: dapr-scheduler
      volumes:
        - name: dapr-scheduler-writeable-identity
          emptyDir: {}
        - configMap:
            name: dapr-trust-bundle
          name: dapr-trust-bundle
        - name: dapr-identity-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: spiffe://cluster.local/ns/dapr-system/dapr-sentry
                  expirationSeconds: 600
                  path: token
  volumeClaimTemplates:
    - metadata:
        name: dapr-scheduler-data-dir
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
