apiVersion: v1
data:
  config: |
    sso:
      insecureSkipVerify: true
      issuer: https://keycloak.cnoe.localtest.me/realms/cnoe
      clientId:
        name: keycloak-oidc
        key: client-id
      clientSecret:
        name: keycloak-oidc
        key: secret-key
      redirectUrl: https://argo-workflows.cnoe.localtest.me/oauth2/callback
      rbac:
        enabled: true
      scopes:
        - openid
        - profile
        - email
        - groups
    nodeEvents:
      enabled: false
    retentionPolicy:
      completed: 10
      failed: 20
      errored: 10
kind: ConfigMap
metadata:
  name: workflow-controller-configmap
  namespace: argo
