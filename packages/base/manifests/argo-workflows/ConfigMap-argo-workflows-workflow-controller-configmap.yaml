apiVersion: v1
data:
  config: |
    sso:
      issuer: https://keycloak.cnoe.localtest.me/realms/cnoe
      clientId:
        name: keycloak-oidc
        key: client-id
      clientSecret:
        name: keycloak-oidc
        key: secret-key
      redirectUrl: "https://argo-workflows.cnoe.localtest.me/oauth2/callback"
      rbac:
        enabled: true
      scopes:
        - openid
        - profile
        - email
        - groups
      insecureSkipVerify: true
    nodeEvents:
      enabled: true
    workflowEvents:
      enabled: true
    retentionPolicy:
      completed: 10
      failed: 20
      errored: 10
kind: ConfigMap
metadata:
  labels:
    app: workflow-controller
    app.kubernetes.io/component: workflow-controller
    app.kubernetes.io/instance: argo-workflows
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: argo-workflows-cm
    app.kubernetes.io/part-of: argo-workflows
    helm.sh/chart: argo-workflows-0.46.2
  name: argo-workflows-workflow-controller-configmap
  namespace: argo
