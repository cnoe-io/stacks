apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argo-workflows-tailscale
  annotations:
    tailscale.com/hostname: "argo-workflows-ryzen"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
      - argo-workflows-ryzen
  rules:
    - host: argo-workflows-ryzen
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argo-workflows-server
                port:
                  number: 2746
