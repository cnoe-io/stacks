apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/name: kargo-github-app-credentials
    app.kubernetes.io/part-of: kargo-pipelines
    kargo.akuity.io/cred-type: git
  name: kargo-github-app-credentials
  namespace: kargo-pipelines
spec:
  data:
    - remoteRef:
        key: GITHUB-APP-ID
      secretKey: appId
    - remoteRef:
        key: GITHUB-APP-PRIVATE-KEY
      secretKey: privateKey
    - remoteRef:
        key: GITHUB-APP-INSTALL-ID
      secretKey: installationId
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    creationPolicy: Owner
    name: kargo-github-app-credentials
    template:
      data:
        # Kargo prefers githubAppClientID over githubAppID
        githubAppClientID: Iv23liOyweBA1S0cMIgB
        githubAppID: '{{ .appId }}'
        githubAppInstallationID: '{{ .installationId }}'
        githubAppPrivateKey: '{{ .privateKey }}'
        repoURL: https://github.com/PittampalliOrg
        repoURLIsRegex: "true"
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
