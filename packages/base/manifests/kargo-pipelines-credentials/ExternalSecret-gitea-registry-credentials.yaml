apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/name: gitea-registry-credentials
    app.kubernetes.io/part-of: kargo-pipelines
    kargo.akuity.io/cred-type: image
  name: gitea-registry-credentials
  namespace: kargo-pipelines
spec:
  data:
    - remoteRef:
        key: gitea-credential
        property: username
      secretKey: username
    - remoteRef:
        key: gitea-credential
        property: password
      secretKey: password
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: gitea
  target:
    creationPolicy: Owner
    name: gitea-registry-credentials
    template:
      data:
        password: '{{ .password }}'
        # Match all images in the local Gitea registry org used by inner-loop apps.
        repoURL: gitea.cnoe.localtest.me:8443/giteaadmin/.*
        repoURLIsRegex: "true"
        username: '{{ .username }}'
      metadata:
        labels:
          kargo.akuity.io/cred-type: image
      type: Opaque

