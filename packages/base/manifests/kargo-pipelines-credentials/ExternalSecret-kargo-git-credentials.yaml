apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/name: kargo-git-credentials
    app.kubernetes.io/part-of: kargo-pipelines
    kargo.akuity.io/cred-type: git
  name: kargo-git-credentials
  namespace: kargo-pipelines
spec:
  data:
    - remoteRef:
        key: gitea-credential
        property: username
      secretKey: username
    - remoteRef:
        key: gitea-credential
        property: password
      secretKey: password
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: gitea
  target:
    creationPolicy: Owner
    name: kargo-git-credentials
    template:
      data:
        password: '{{ .password }}'
        # Prefer full-URL matching per Kargo docs. Support both ingress hostnames.
        repoURL: ^https://(gitea\.cnoe\.localtest\.me|gitea-[a-z0-9-]+\.tail[0-9]+\.ts\.net)/.*$
        repoURLIsRegex: "true"
        username: '{{ .username }}'
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
