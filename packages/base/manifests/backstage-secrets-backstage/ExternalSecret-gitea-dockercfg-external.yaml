apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    app.kubernetes.io/name: gitea-dockercfg
    app.kubernetes.io/part-of: backstage
  name: gitea-dockercfg-external
  namespace: backstage
spec:
  data:
    - remoteRef:
        key: gitea-credential
        property: username
      secretKey: username
    - remoteRef:
        key: gitea-credential
        property: password
      secretKey: password
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: gitea
  target:
    creationPolicy: Owner
    name: gitea-dockercfg
    template:
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "gitea.cnoe.localtest.me:8443": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              },
              "gitea-${TAILSCALE_HOST}.${TAILSCALE_TAILNET}": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
      type: kubernetes.io/dockerconfigjson
