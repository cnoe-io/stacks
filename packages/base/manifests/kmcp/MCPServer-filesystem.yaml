apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: mcp-filesystem
  namespace: kagent
  labels:
    app.kubernetes.io/name: mcp-filesystem
    app.kubernetes.io/part-of: kmcp
spec:
  transportType: stdio
  stdioTransport: {}
  deployment:
    cmd: uvx
    args:
      - mcp-server-filesystem
      - /data
    port: 3000
