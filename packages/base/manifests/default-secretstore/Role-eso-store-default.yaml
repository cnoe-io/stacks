apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-store-default
  namespace: default
rules:
  - apiGroups:
      - ""
    resourceNames:
      - gitops-cert
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
