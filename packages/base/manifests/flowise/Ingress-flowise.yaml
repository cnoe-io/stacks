apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flowise
  namespace: workflow-builder
  annotations:
    argocd.argoproj.io/sync-wave: "65"
spec:
  ingressClassName: nginx
  rules:
    - host: flowise.cnoe.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flowise
                port:
                  number: 3000
  tls:
    - hosts:
        - flowise.cnoe.localtest.me
      secretName: nginx-tls
