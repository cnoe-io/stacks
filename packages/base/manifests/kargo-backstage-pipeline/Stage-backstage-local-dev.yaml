apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  annotations:
    kargo.akuity.io/color: green
  labels:
    app.kubernetes.io/component: stage
    app.kubernetes.io/name: backstage-local-dev-stage
    app.kubernetes.io/part-of: kargo-pipelines
    kargo.akuity.io/loop: inner
  name: backstage-local-dev
  namespace: kargo-pipelines
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: backstage-local
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        # The ${TAILSCALE_HOST} placeholder is substituted by build.sh
        - name: gitRepoURL
          value: https://gitea.cnoe.localtest.me:8443/giteaAdmin/idpbuilder-${TAILSCALE_HOST}-backstage-manifests.git
        - name: imageRepoURL
          value: gitea.cnoe.localtest.me:8443/giteaadmin/backstage
        - name: argoAppName
          value: backstage-local-dev
      steps:
        # Step 1: Clone both source (main) and output (stage/local-dev) branches
        - as: clone-repo
          uses: git-clone
          config:
            repoURL: ${{ vars.gitRepoURL }}
            insecureSkipTLSVerify: true
            checkout:
              - branch: main
                path: ./src
              - branch: stage/local-dev
                create: true
                path: ./out

        # Step 2: Clear previous rendered output
        - as: clear-output
          uses: git-clear
          config:
            path: ./out

        # Step 3: Update image tag in kustomization
        # The kustomization references ghcr.io/pittampalliorg/backstage
        # For inner loop, we replace it with the Gitea registry image
        - as: update-image
          uses: kustomize-set-image
          config:
            path: ./src
            images:
              - image: ghcr.io/pittampalliorg/backstage
                newName: ${{ vars.imageRepoURL }}
                tag: ${{ imageFrom(vars.imageRepoURL).Tag }}

        # Step 4: Render manifests using kustomize-build
        - as: render-manifests
          uses: kustomize-build
          config:
            path: ./src
            outPath: ./out/manifests/

        # Step 5: Commit rendered manifests with descriptive message
        - as: commit-changes
          uses: git-commit
          config:
            path: ./out
            message: |
              chore(local-dev): render backstage manifests

              Config: ${{ commitFrom(vars.gitRepoURL).ID }}
              Image: ${{ vars.imageRepoURL }}:${{ imageFrom(vars.imageRepoURL).Tag }}

        # Step 6: Push to stage/local-dev branch
        - as: push-changes
          uses: git-push
          config:
            path: ./out
            targetBranch: stage/local-dev

        # Step 7: Trigger ArgoCD sync
        - as: sync-argocd
          uses: argocd-update
          config:
            apps:
              - name: ${{ vars.argoAppName }}
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.gitRepoURL }}
                    desiredRevision: ${{ outputs['push-changes'].commit }}
