apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  labels:
    app.kubernetes.io/component: warehouse
    app.kubernetes.io/name: backstage-warehouse
    app.kubernetes.io/part-of: kargo-pipelines
  name: backstage
  namespace: kargo-pipelines
spec:
  freightCreationPolicy: Automatic
  interval: 1m0s
  subscriptions:
    - git:
        branch: main
        excludePaths:
          - rendered/**
        includePaths:
          - base/**
          - overlays/**
        repoURL: https://github.com/PittampalliOrg/backstage-config.git
    # Outer loop - production images from GHCR
    - image:
        allowTags: ^v?[0-9]+\.[0-9]+\.[0-9]+([\+-].*)?$
        discoveryLimit: 20
        imageSelectionStrategy: SemVer
        repoURL: ghcr.io/pittampalliorg/backstage
    # Inner loop - local development images from Gitea
    - image:
        repoURL: gitea.cnoe.localtest.me:8443/giteaadmin/backstage
        imageSelectionStrategy: Lexical
        discoveryLimit: 10
        insecureSkipTLSVerify: true
        platform: linux/amd64
