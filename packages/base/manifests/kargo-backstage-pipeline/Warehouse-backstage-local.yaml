apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  labels:
    app.kubernetes.io/component: warehouse
    app.kubernetes.io/name: backstage-local-warehouse
    app.kubernetes.io/part-of: kargo-pipelines
    kargo.akuity.io/loop: inner
  name: backstage-local
  namespace: kargo-pipelines
spec:
  freightCreationPolicy: Automatic
  interval: 30s
  subscriptions:
    # Config source - Gitea repo from idpbuilder
    # The ${TAILSCALE_HOST} placeholder is substituted by build.sh
    - git:
        repoURL: https://gitea.cnoe.localtest.me:8443/giteaadmin/idpbuilder-${TAILSCALE_HOST}-backstage-manifests.git
        branch: main
        insecureSkipTLSVerify: true
        strictSemvers: false
    # Image source - local dev images from Gitea registry
    - image:
        repoURL: gitea.cnoe.localtest.me:8443/giteaadmin/backstage
        imageSelectionStrategy: Lexical
        discoveryLimit: 10
        insecureSkipTLSVerify: true
