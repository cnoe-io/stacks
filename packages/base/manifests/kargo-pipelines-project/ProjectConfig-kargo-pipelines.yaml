apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/component: project-config
    app.kubernetes.io/name: kargo-pipelines-config
    app.kubernetes.io/part-of: kargo
  name: kargo-pipelines
  namespace: kargo-pipelines
spec:
  # Webhooks configured at cluster-level via ClusterConfig (kargo-cluster-config)
  promotionPolicies:
    - autoPromotionEnabled: true
      stageSelector:
        name: backstage-dev
    - autoPromotionEnabled: false
      stageSelector:
        name: backstage-staging
    - autoPromotionEnabled: true
      stageSelector:
        name: backstage
    - autoPromotionEnabled: true
      stageSelector:
        name: glob:*-local-dev
    - autoPromotionEnabled: true
      stageSelector:
        name: glob:*-dev
    - autoPromotionEnabled: false
      stageSelector:
        name: glob:*-staging
    - autoPromotionEnabled: false
      stageSelector:
        name: glob:*-prod
