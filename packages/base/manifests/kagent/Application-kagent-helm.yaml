apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "75"
  name: kagent-helm
  namespace: argocd
spec:
  destination:
    namespace: kagent
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: kagent
    helm:
      valuesObject:
        fullnameOverride: "kagent"
        controller:
          logLevel: info
          replicas: 1
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 128Mi
        grafana-mcp:
          fullnameOverride: "kagent-grafana-mcp"
        kmcp:
          enabled: true
          fullnameOverride: "kagent-kmcp"
        providers:
          default: openAI
          openAI:
            provider: OpenAI
            model: "gpt-5.2-codex"
            apiKeySecretRef: kagent-openai
            apiKeySecretKey: OPENAI_API_KEY
        namespace: kagent
        ui:
          enabled: true
          replicas: 1
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
    repoURL: ghcr.io/kagent-dev/kagent/helm
    targetRevision: 0.7.13
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
