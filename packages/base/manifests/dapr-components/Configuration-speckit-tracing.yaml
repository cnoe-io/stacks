apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: speckit-tracing
  namespace: dapr-agents
spec:
  tracing:
    samplingRate: "1"
    otel:
      endpointAddress: otel-collector.observability.svc.cluster.local:4317
      isSecure: false
      protocol: grpc
  logging:
    apiLogging:
      enabled: true
      obfuscateURLs: false
      omitHealthChecks: true
  metrics:
    enabled: true
