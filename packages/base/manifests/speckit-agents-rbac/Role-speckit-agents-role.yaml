apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: speckit-agents-role
  namespace: dapr-agents
rules:
  - apiGroups:
      - ""
      - apps
      - batch
    resources:
      - pods
      - services
      - deployments
      - jobs
      - configmaps
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - dapr.io
    resources:
      - components
      - configurations
      - subscriptions
    verbs:
      - get
      - list
      - watch
