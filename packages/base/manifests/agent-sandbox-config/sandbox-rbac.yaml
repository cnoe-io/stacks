# RBAC for services that need to create and manage Agent Sandboxes
# This allows the planner-dapr-agent to orchestrate sandbox execution
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-claim-creator
rules:
# Sandbox claims and sandboxes (extensions API group)
- apiGroups: ["extensions.agents.x-k8s.io"]
  resources: ["sandboxclaims"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: ["extensions.agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["get", "list", "watch"]
# Sandbox claims and sandboxes (agents API group)
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxclaims"]
  verbs: ["create", "get", "list", "watch", "delete"]
# Core resources for port-forwarding (Dev Mode)
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/portforward"]
  verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: planner-dapr-agent-sandbox-creator
subjects:
- kind: ServiceAccount
  name: planner-dapr-agent
  namespace: ai-chatbot
- kind: ServiceAccount
  name: planner-dapr-agent
  namespace: workflow-builder
roleRef:
  kind: ClusterRole
  name: sandbox-claim-creator
  apiGroup: rbac.authorization.k8s.io
