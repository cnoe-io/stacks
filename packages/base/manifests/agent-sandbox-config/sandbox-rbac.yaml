# RBAC for services that need to create and manage Agent Sandboxes
# This allows mastra-agent-tanstack to orchestrate sandbox execution
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-claim-creator
rules:
# Sandbox claims are in the extensions API group
- apiGroups: ["extensions.agents.x-k8s.io"]
  resources: ["sandboxclaims"]
  verbs: ["create", "get", "list", "watch", "delete"]
# Sandboxes are in the core agents API group (patch needed for shutdownTime TTL)
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["get", "list", "watch", "patch"]
# Core resources for port-forwarding (Dev Mode)
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/portforward"]
  verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mastra-agent-tanstack-sandbox-creator
subjects:
- kind: ServiceAccount
  name: mastra-agent-tanstack
  namespace: workflow-builder
roleRef:
  kind: ClusterRole
  name: sandbox-claim-creator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: durable-agent-sandbox-creator
subjects:
- kind: ServiceAccount
  name: durable-agent
  namespace: workflow-builder
roleRef:
  kind: ClusterRole
  name: sandbox-claim-creator
  apiGroup: rbac.authorization.k8s.io
