apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: vibe-coding-sandbox
  namespace: agent-sandbox
  labels:
    app.kubernetes.io/name: vibe-coding-sandbox
    app.kubernetes.io/part-of: vibe-coding-platform
spec:
  podTemplate:
    metadata:
      annotations:
        # Dapr disabled for now - sandbox pods are isolated execution environments
        # Re-enable when sandbox-to-platform communication via Dapr is needed
        dapr.io/enabled: "false"
        dapr.io/app-id: "sandbox-${SANDBOX_ID}"
        dapr.io/app-port: "8080"
        dapr.io/app-protocol: "http"
        dapr.io/enable-api-logging: "true"
      labels:
        sandbox: "true"
        app.kubernetes.io/managed-by: vibe-coding-platform
    spec:
      serviceAccountName: sandbox-runner
      containers:
        - name: sandbox
          image: node:22-alpine
          # Keep container alive - AI agent executes commands via kubectl exec
          command: ["sleep", "infinity"]
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: app-port-1
              containerPort: 3000
              protocol: TCP
            - name: app-port-2
              containerPort: 5000
              protocol: TCP
          env:
            - name: SANDBOX_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HOME
              value: /workspace
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          workingDir: /workspace
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          # Health probes removed - generic sandbox container doesn't expose /health
          # The AI agent writes and runs code in this container dynamically
          startupProbe:
            exec:
              command: ["true"]
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 5Gi
      terminationGracePeriodSeconds: 30
