apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: dapr-agent
  namespace: agent-sandbox
  labels:
    app.kubernetes.io/name: dapr-agent
    app.kubernetes.io/part-of: agent-sandbox
spec:
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-agent
        app.kubernetes.io/part-of: agent-sandbox
        app.kubernetes.io/managed-by: agent-sandbox
      annotations:
        # Dapr sidecar injection DISABLED - using dapr-shared DaemonSet instead
        # This reduces per-sandbox overhead by ~256Mi memory and ~100m CPU
        # Sandboxes connect to shared Dapr via DAPR_HTTP_ENDPOINT env var
        dapr.io/enabled: "false"
    spec:
      containers:
        - name: agent
          # Node sandbox runtime - handles /execute, /upload, and /download.
          image: gitea.cnoe.localtest.me:8443/giteaadmin/node-sandbox:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 8888
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          env:
            # Shared Dapr endpoints (dapr-shared DaemonSet in dapr-sandbox namespace)
            # Sandboxes use these endpoints instead of localhost sidecar
            - name: DAPR_HTTP_ENDPOINT
              value: "http://sandbox-agent-dapr.dapr-sandbox.svc.cluster.local:3500"
            - name: DAPR_GRPC_ENDPOINT
              value: "dns:sandbox-agent-dapr.dapr-sandbox.svc.cluster.local:50001"
            # Legacy port variables (for SDK compatibility)
            - name: DAPR_HTTP_PORT
              value: "3500"
            - name: DAPR_GRPC_PORT
              value: "50001"
            # Sandbox runtime defaults
            - name: WORKSPACE_DIR
              value: "/app"
            - name: HOME
              value: "/home/node"
            # Pod identity
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            limits:
              cpu: "4"
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          # Node runtime sandbox handles /execute requests on port 8888
          # No custom command needed - image has its own entrypoint
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      # Security context at pod level
      securityContext:
        fsGroup: 1000
      # DNS configuration for service discovery
      dnsPolicy: ClusterFirst
