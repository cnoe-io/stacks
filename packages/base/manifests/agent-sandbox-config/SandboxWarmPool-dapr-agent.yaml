apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxWarmPool
metadata:
  name: dapr-agent-pool
  namespace: agent-sandbox
  labels:
    app.kubernetes.io/name: dapr-agent-pool
    app.kubernetes.io/part-of: agent-sandbox
spec:
  # Number of pre-warmed sandboxes to maintain
  # Warmed sandboxes run with shared Dapr endpoints (no per-pod sidecar injection)
  replicas: 2
  # Reference to the SandboxTemplate to use
  sandboxTemplateRef:
    name: dapr-agent
