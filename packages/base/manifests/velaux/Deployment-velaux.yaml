apiVersion: apps/v1
kind: Deployment
metadata:
  name: velaux
  namespace: vela-system
  labels:
    app: velaux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: velaux
  template:
    metadata:
      labels:
        app: velaux
    spec:
      serviceAccountName: velaux
      containers:
        - name: velaux
          image: oamdev/velaux:v1.9.5
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          env:
            - name: KUBEVELA_API_URL
              value: "http://kubevela-vela-core.vela-system.svc.cluster.local:9443"
