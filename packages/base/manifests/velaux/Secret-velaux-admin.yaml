apiVersion: v1
kind: Secret
metadata:
  name: velaux-admin-credentials
  namespace: vela-system
  labels:
    app: velaux
type: Opaque
stringData:
  # Admin username
  ADMIN_USERNAME: "admin"
  # VelaUX requires complex passwords (mixed case + numbers)
  # "developer" doesn't meet requirements, using "Developer123"
  ADMIN_PASSWORD: "Developer123"
  ADMIN_EMAIL: "admin@cnoe.localtest.me"
