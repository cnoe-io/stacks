apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: velaux
rules:
  # Core Kubernetes resources
  - apiGroups: [""]
    resources:
      - configmaps
      - secrets
      - namespaces
      - pods
      - pods/log
      - services
      - events
      - serviceaccounts
      - persistentvolumeclaims
    verbs: ["*"]
  - apiGroups: [""]
    resources:
      - nodes
    verbs: ["get", "list", "watch"]
  # Apps resources
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["*"]
  # Batch resources
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["*"]
  # Networking resources
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["*"]
  # RBAC resources
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["*"]
  # OAM/KubeVela CRDs
  - apiGroups: ["core.oam.dev"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["standard.oam.dev"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["cue.oam.dev"]
    resources: ["*"]
    verbs: ["*"]
  # Additional APIs
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources:
      - tokenreviews
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources:
      - subjectaccessreviews
    verbs: ["create"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs: ["*"]
