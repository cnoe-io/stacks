apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: velaux
  namespace: vela-system
spec:
  ingressClassName: nginx
  rules:
    - host: velaux.cnoe.localtest.me
      http:
        paths:
          - backend:
              service:
                name: velaux
                port:
                  number: 80
            path: /
            pathType: Prefix
