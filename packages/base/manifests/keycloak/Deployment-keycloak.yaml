apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app: keycloak
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - args:
            - start-dev
            - --import-realm
          env:
            - name: KEYCLOAK_ADMIN
              value: cnoe-admin
            - name: KEYCLOAK_LOGLEVEL
              value: ALL
            - name: QUARKUS_TRANSACTION_MANAGER_ENABLE_RECOVERY
              value: "true"
          envFrom:
            - secretRef:
                name: keycloak-config
            - secretRef:
                name: keycloak-client-secrets
                optional: true
          image: quay.io/keycloak/keycloak:22.0.3
          name: keycloak
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
          volumeMounts:
            - mountPath: /opt/keycloak/conf
              name: keycloak-config
              readOnly: true
            - mountPath: /opt/keycloak/data/import
              name: realm-import
              readOnly: true
      initContainers:
        - args:
            - |
              apk add --no-cache gettext && \
              envsubst < /realm-template/cnoe-realm.json > /realm-import/cnoe-realm.json && \
              echo "Realm import file processed successfully"
          command:
            - /bin/sh
            - -c
          envFrom:
            - secretRef:
                name: keycloak-client-secrets
                optional: true
            - secretRef:
                name: keycloak-config
          image: docker.io/library/alpine:3.19
          name: realm-import-envsubst
          volumeMounts:
            - mountPath: /realm-template
              name: realm-import-template
              readOnly: true
            - mountPath: /realm-import
              name: realm-import
      volumes:
        - configMap:
            name: keycloak-config
          name: keycloak-config
        - configMap:
            name: keycloak-realm-config
          name: realm-import-template
        - emptyDir: {}
          name: realm-import
