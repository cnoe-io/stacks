apiVersion: v1
data:
  keycloak.conf: |
    # Database
    # The database vendor.
    db=postgres

    # The username of the database user.
    db-url=jdbc:postgresql://postgresql.keycloak.svc.cluster.local:5432/postgres

    # The proxy address forwarding mode if the server is behind a reverse proxy.
    proxy=edge

    # hostname configuration (domain-based routing)
    hostname=keycloak.cnoe.localtest.me
    hostname-port=443
    # No http-relative-path for domain-based routing

    # the admin url requires its own configuration to reflect correct url
    hostname-admin=keycloak.cnoe.localtest.me

    hostname-debug=true

    # this should only be allowed in development. NEVER in production.
    hostname-strict=false
    hostname-strict-backchannel=false
kind: ConfigMap
metadata:
  name: keycloak-config
  namespace: keycloak
