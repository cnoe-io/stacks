apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-server-tls
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server-tls
    app.kubernetes.io/part-of: argocd
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    name: argocd-server-tls
    template:
      type: kubernetes.io/tls
      metadata:
        labels:
          app.kubernetes.io/name: argocd-server-tls
          app.kubernetes.io/part-of: argocd
      data:
        tls.crt: "{{ .cert }}"
        tls.key: "{{ .key }}"
  data:
    - secretKey: cert
      remoteRef:
        key: gitops-TLS-CRT
        decodingStrategy: Base64
    - secretKey: key
      remoteRef:
        key: gitops-TLS-KEY
        decodingStrategy: Base64
