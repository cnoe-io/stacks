apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: planner-agent
  annotations:
    argocd.argoproj.io/sync-wave: "-80"
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis-service.dapr-agents.svc.cluster.local:6379
    - name: redisPassword
      value: ""
    - name: actorStateStore
      value: "true"
