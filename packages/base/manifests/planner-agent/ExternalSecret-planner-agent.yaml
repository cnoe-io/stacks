apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: planner-agent-secrets
  namespace: ai-chatbot
spec:
  data:
    - remoteRef:
        key: ANTHROPIC-API-KEY
      secretKey: ANTHROPIC_API_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    creationPolicy: Owner
    name: planner-agent-secrets
