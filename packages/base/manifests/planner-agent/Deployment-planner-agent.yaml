apiVersion: apps/v1
kind: Deployment
metadata:
  name: planner-agent
  namespace: ai-chatbot
  labels:
    app.kubernetes.io/name: planner-agent
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: planner-agent
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: planner-agent
        app.kubernetes.io/component: agent
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "planner-agent"
        dapr.io/app-port: "8080"
        dapr.io/app-protocol: "http"
        dapr.io/enable-api-logging: "true"
    spec:
      containers:
        - name: planner-agent
          image: gitea.cnoe.localtest.me:8443/giteaadmin/planner-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: planner-agent-secrets
                  key: ANTHROPIC_API_KEY
            - name: WORKSPACE_DIR
              value: /app/workspace
            - name: PLANS_DIR
              value: /app/plans
          envFrom:
            - configMapRef:
                name: planner-agent-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          volumeMounts:
            - name: workspace
              mountPath: /app/workspace
            - name: plans
              mountPath: /app/plans
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: planner-workspace-pvc
        - name: plans
          persistentVolumeClaim:
            claimName: planner-plans-pvc
      terminationGracePeriodSeconds: 30
