apiVersion: apps/v1
kind: Deployment
metadata:
  name: planner-agent
  namespace: planner-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planner-agent
  template:
    metadata:
      labels:
        app: planner-agent
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "planner-agent"
        dapr.io/app-port: "8080"
        dapr.io/app-protocol: "http"
        dapr.io/enable-api-logging: "true"
    spec:
      containers:
        - name: planner-agent
          image: gitea.cnoe.localtest.me:8443/giteaadmin/planner-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: APP_PORT
              value: "8080"
            - name: APP_ID
              value: "planner-agent"
            - name: DEBUG
              value: "false"
            - name: WORKSPACE_DIR
              value: /app/workspace
            - name: PLANS_DIR
              value: /app/plans
          envFrom:
            - secretRef:
                name: planner-agent-secrets
            - configMapRef:
                name: planner-agent-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          volumeMounts:
            - name: workspace
              mountPath: /app/workspace
            - name: plans
              mountPath: /app/plans
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: planner-workspace-pvc
        - name: plans
          persistentVolumeClaim:
            claimName: planner-plans-pvc
