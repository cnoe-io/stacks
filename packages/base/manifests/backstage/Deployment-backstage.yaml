apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  name: backstage
  namespace: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        dapr.io/app-health-check-path: /.backstage/health/v1/readiness
        dapr.io/app-health-probe-interval: "5"
        dapr.io/app-health-probe-timeout: "500"
        dapr.io/app-health-threshold: "3"
        dapr.io/app-id: backstage
        dapr.io/app-port: "7007"
        dapr.io/config: backstage-dapr-config
        dapr.io/enable-app-health-check: "true"
        dapr.io/enabled: "true"
        dapr.io/log-as-json: "true"
        dapr.io/log-level: info
        dapr.io/sidecar-liveness-probe-delay-seconds: "30"
        dapr.io/sidecar-liveness-probe-period-seconds: "10"
        dapr.io/sidecar-liveness-probe-threshold: "3"
        dapr.io/sidecar-readiness-probe-delay-seconds: "5"
        dapr.io/sidecar-readiness-probe-period-seconds: "5"
        dapr.io/sidecar-readiness-probe-threshold: "3"
        dapr.io/sidecar-securitycontext: '{"allowPrivilegeEscalation":false,"readOnlyRootFilesystem":true,"runAsNonRoot":false}'
      labels:
        app: backstage
    spec:
      containers:
        - args:
            - node
            - packages/backend
            - --config
            - /app/app-config.yaml
            - --config
            - /etc/backstage/app-config.yaml
          env:
            - name: LOG_LEVEL
              value: info
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            - name: NODE_ENV
              value: production
          envFrom:
            - secretRef:
                name: backstage-env-vars
            - secretRef:
                name: gitea-credentials
            - secretRef:
                name: argocd-credentials
          image: gitea.cnoe.localtest.me/giteaadmin/backstage:latest
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /.backstage/health/v1/liveness
              port: 7007
            initialDelaySeconds: 60
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 5
          name: backstage
          ports:
            - containerPort: 7007
              name: http
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /.backstage/health/v1/readiness
              port: 7007
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - mountPath: /etc/backstage/app-config.yaml
              name: app-config
              readOnly: true
              subPath: app-config.yaml
      imagePullSecrets:
        - name: ghcr-dockercfg
      securityContext: {}
      serviceAccountName: backstage
      volumes:
        - configMap:
            name: backstage-app-config
          name: app-config
