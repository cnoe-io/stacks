apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-chatbot-dapr-config
  namespace: ai-chatbot
  labels:
    app.kubernetes.io/name: ai-chatbot
    app.kubernetes.io/component: dapr
data:
  # Dapr Service Invocation Configuration
  # When enabled, ai-chatbot uses Dapr sidecar for sandbox communication
  # This provides automatic distributed tracing without modifying sandbox images

  # Enable Dapr service invocation for sandbox communication
  USE_DAPR_SERVICE_INVOCATION: "true"

  # Dapr sidecar HTTP port (default: 3500)
  DAPR_HTTP_PORT: "3500"

  # Enable Workflow Patterns feature
  # When enabled, the workflow patterns runtime is initialized for Dapr workflows
  WORKFLOW_PATTERNS_ENABLED: "true"
