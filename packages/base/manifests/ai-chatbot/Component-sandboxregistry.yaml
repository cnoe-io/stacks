apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: sandboxregistry
  namespace: ai-chatbot
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis.ai-chatbot.svc.cluster.local:6379
    - name: redisPassword
      value: ""
    - name: actorStateStore
      value: "false"
    # Enable TTL for automatic cleanup of stale sandbox entries
    - name: ttlInSeconds
      value: "1800"  # 30 minutes default, can be overridden per-key
