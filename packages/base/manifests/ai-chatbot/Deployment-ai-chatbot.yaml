apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  name: ai-chatbot
  namespace: ai-chatbot
  labels:
    app.kubernetes.io/name: ai-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-chatbot
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ai-chatbot
        app.kubernetes.io/name: ai-chatbot
    spec:
      serviceAccountName: ai-chatbot
      containers:
        - name: ai-chatbot
          image: gitea.cnoe.localtest.me:8443/giteaadmin/ai-chatbot
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: UPLOAD_DIR
              value: "/app/uploads"
            - name: NEXT_PUBLIC_APP_URL
              value: "https://ai-chatbot.cnoe.localtest.me:8443"
            # NextAuth configuration - trust the proxy/ingress host
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: AUTH_URL
              value: "https://ai-chatbot.cnoe.localtest.me:8443"
            # OpenTelemetry configuration
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "ai-chatbot"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=production,service.namespace=ai-chatbot"
            # GitHub App OAuth configuration (for coding agent)
            # Note: NEXT_PUBLIC_GITHUB_APP_CLIENT_ID must also be set at build time via Docker ARG
            - name: NEXT_PUBLIC_GITHUB_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ai-chatbot-github
                  key: GITHUB_APP_CLIENT_ID
                  optional: true
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ai-chatbot-github
                  key: GITHUB_APP_CLIENT_ID
                  optional: true
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-chatbot-github
                  key: GITHUB_APP_CLIENT_SECRET
                  optional: true
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: ai-chatbot-github
                  key: GITHUB_APP_ID
                  optional: true
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-chatbot-github
                  key: GITHUB_APP_PRIVATE_KEY
                  optional: true
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-chatbot-github
                  key: GITHUB_WEBHOOK_SECRET
                  optional: true
          envFrom:
            - secretRef:
                name: ai-chatbot-secrets
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
      volumes:
        - name: uploads
          emptyDir: {}
      securityContext:
        fsGroup: 1001
