apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-chatbot-sandbox-manager
  labels:
    app.kubernetes.io/name: ai-chatbot
rules:
  # SandboxClaim management for agent execution
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Sandbox status monitoring
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  # Pod operations for sandbox execution
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Service management for Dapr service invocation
  # Since Dapr Operator doesn't create services for CRD-owned pods,
  # we create them ourselves to enable Dapr service invocation
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "delete", "get", "list"]
