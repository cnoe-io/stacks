apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  annotations:
    kargo.akuity.io/color: green
  labels:
    app.kubernetes.io/component: stage
    app.kubernetes.io/name: open-swe-web-local-dev-stage
    app.kubernetes.io/part-of: kargo-pipelines
    kargo.akuity.io/loop: inner
  name: open-swe-web-local-dev
  namespace: kargo-pipelines
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: open-swe-web
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: webImageRepoURL
          value: gitea.cnoe.localtest.me:8443/giteaadmin/open-swe-web
        - name: webManifestsRepoURL
          value: https://gitea.cnoe.localtest.me:8443/giteaAdmin/idpbuilder-thinkpad-open-swe-web-manifests.git
        - name: argoAppName
          value: open-swe-web
      steps:
        - as: sync-argocd
          uses: argocd-update
          config:
            apps:
              - name: ${{ vars.argoAppName }}
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.webManifestsRepoURL }}
                    kustomize:
                      images:
                        - repoURL: ${{ vars.webImageRepoURL }}
                          tag: ${{ imageFrom(vars.webImageRepoURL).Tag }}
