apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  annotations:
    kargo.akuity.io/color: blue
  labels:
    app.kubernetes.io/component: stage
    app.kubernetes.io/name: open-swe-local-dev-stage
    app.kubernetes.io/part-of: kargo-pipelines
    kargo.akuity.io/loop: inner
  name: open-swe-local-dev
  namespace: kargo-pipelines
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: open-swe
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: agentImageRepoURL
          value: gitea.cnoe.localtest.me:8443/giteaadmin/open-swe-agent
        - name: webImageRepoURL
          value: gitea.cnoe.localtest.me:8443/giteaadmin/open-swe-web
        - name: argoAppName
          value: open-swe
      steps:
        # Trigger ArgoCD update directly for both agent and web apps
        - as: sync-argocd
          uses: argocd-update
          config:
            apps:
              - name: open-swe
                namespace: argocd
                sources:
                  - repoURL: https://langchain-ai.github.io/helm/
                    chart: langgraph-cloud
                    helm:
                      images:
                        - key: images.apiServerImage.tag
                          value: ${{ imageFrom(vars.agentImageRepoURL).Tag }}
                        - key: images.apiServerImage.repository
                          value: ${{ vars.agentImageRepoURL }}
              - name: open-swe-web
                namespace: argocd
                sources:
                  - repoURL: cnoe://open-swe-web/manifests
                    kustomize:
                      images:
                        - repoURL: ${{ vars.webImageRepoURL }}
                          tag: ${{ imageFrom(vars.webImageRepoURL).Tag }}
