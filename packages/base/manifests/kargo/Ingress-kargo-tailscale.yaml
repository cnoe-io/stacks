apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: kargo
  name: kargo-tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "70"
    tailscale.com/hostname: "kargo-ryzen"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
      - kargo-ryzen
  rules:
    - host: kargo-ryzen
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kargo-api
                port:
                  number: 80
