apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: backstage-dapr-config
  namespace: backstage
spec:
  features:
    - enabled: true
      name: ServiceInvocation
    - enabled: true
      name: Configuration
    - enabled: true
      name: StateStore
  tracing:
    samplingRate: "1"
    otel:
      endpointAddress: otel-collector.observability.svc.cluster.local:4317
      isSecure: false
      protocol: grpc
