apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/name: dapr-dashboard
    app.kubernetes.io/part-of: dapr
    app.kubernetes.io/version: 0.15.0
  name: dapr-dashboard
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - namespaces
    verbs:
      - get
      - list
  - apiGroups:
      - apps
    resources:
      - deployments
      - components
      - configurations
      - statefulsets
    verbs:
      - get
      - list
  - apiGroups:
      - dapr.io
    resources:
      - components
      - configurations
    verbs:
      - get
      - list
