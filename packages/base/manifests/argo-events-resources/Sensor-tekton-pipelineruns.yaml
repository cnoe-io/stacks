apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: tekton-pipelineruns
  namespace: argo-events
  labels:
    app.kubernetes.io/component: sensor
    app.kubernetes.io/name: argo-events
spec:
  eventBusName: default
  template:
    serviceAccountName: argo-events-sensor-sa
  dependencies:
    - name: pipelinerun-update
      eventSourceName: tekton-pipelineruns
      eventName: workflow-builder-pipelineruns
      filters:
        data:
          - path: body.status.completionTime
            type: string
            value:
              - .+
  triggers:
    - template:
        name: publish-tekton-pipelinerun-event
        k8s:
          operation: create
          source:
            resource:
              apiVersion: v1
              kind: Event
              metadata:
                generateName: delivery-tekton-pipelinerun-
                namespace: argo-events
              type: Normal
              reason: TektonPipelineRunCompleted
              source:
                component: argo-events.tekton-pipelineruns
              message: "Tekton PipelineRun completed"
              involvedObject:
                apiVersion: tekton.dev/v1
                kind: PipelineRun
                name: unknown
                namespace: workflow-builder
          parameters:
            - src:
                dependencyName: pipelinerun-update
                dataKey: body.metadata.name
                value: unknown
              dest: involvedObject.name
            - src:
                dependencyName: pipelinerun-update
                dataKey: body.status.conditions.0.reason
                value: Tekton PipelineRun completed
              dest: message
            - src:
                dependencyName: pipelinerun-update
                dataKey: body.status.completionTime
                value: ""
              dest: eventTime
      retryStrategy:
        steps: 3
