apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: resource-watcher
  namespace: argo-events
  labels:
    app.kubernetes.io/component: eventsource
    app.kubernetes.io/name: argo-events
spec:
  eventBusName: default
  resource:
    deployment-rollout-failures:
      namespace: ""
      group: apps
      version: v1
      resource: deployments
      eventTypes:
        - UPDATE
      filter:
        fields:
          - key: status.conditions.reason
            operation: "=="
            value: ProgressDeadlineExceeded
    job-completions:
      namespace: ""
      group: batch
      version: v1
      resource: jobs
      eventTypes:
        - UPDATE
      filter:
        fields:
          - key: status.conditions.type
            operation: "=="
            value: Complete
