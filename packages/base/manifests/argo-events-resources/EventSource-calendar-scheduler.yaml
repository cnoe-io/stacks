apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: calendar-scheduler
  namespace: argo-events
  labels:
    app.kubernetes.io/component: eventsource
    app.kubernetes.io/name: argo-events
spec:
  eventBusName: default
  calendar:
    daily-cleanup:
      schedule: "0 2 * * *"
      timezone: UTC
    hourly-healthcheck:
      schedule: "0 * * * *"
      timezone: UTC
