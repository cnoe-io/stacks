apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-chatbot-secrets
  namespace: ai-chatbot
  annotations:
    argocd.argoproj.io/sync-wave: "55"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    name: ai-chatbot-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Authentication
        AUTH_SECRET: "{{ .AUTH_SECRET }}"
        # Database
        POSTGRES_URL: "{{ .POSTGRES_URL }}"
        REDIS_URL: "{{ .REDIS_URL }}"
        # AI Provider API Keys
        OPENAI_API_KEY: "{{ .OPENAI_API_KEY }}"
        ANTHROPIC_API_KEY: "{{ .ANTHROPIC_API_KEY }}"
        GOOGLE_API_KEY: "{{ .GOOGLE_API_KEY }}"
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: AI-CHATBOT-AUTH-SECRET
    - secretKey: POSTGRES_URL
      remoteRef:
        key: AI-CHATBOT-POSTGRES-URL
    - secretKey: REDIS_URL
      remoteRef:
        key: AI-CHATBOT-REDIS-URL
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: OPENAI-API-KEY
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: ANTHROPIC-API-KEY
    - secretKey: GOOGLE_API_KEY
      remoteRef:
        key: GEMINI-API-KEY
