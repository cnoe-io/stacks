apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-chatbot-github
  namespace: ai-chatbot
  labels:
    app.kubernetes.io/name: ai-chatbot-github
    app.kubernetes.io/part-of: ai-chatbot
  annotations:
    # GitHub App credentials are optional - create GitHub App and add secrets to Key Vault to enable
    argocd.argoproj.io/sync-options: "SkipDryRunOnMissingResource=true"
    argocd.argoproj.io/sync-wave: "55"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    name: ai-chatbot-github
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: GITHUB_APP_ID
      remoteRef:
        key: OPEN-SWE-GITHUB-APP-ID
    - secretKey: GITHUB_APP_CLIENT_ID
      remoteRef:
        key: OPEN-SWE-GITHUB-APP-CLIENT-ID
    - secretKey: GITHUB_APP_CLIENT_SECRET
      remoteRef:
        key: OPEN-SWE-GITHUB-APP-CLIENT-SECRET
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: OPEN-SWE-GITHUB-APP-PRIVATE-KEY
    - secretKey: GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: OPEN-SWE-GITHUB-WEBHOOK-SECRET
