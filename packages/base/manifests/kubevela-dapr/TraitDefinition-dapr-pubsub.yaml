apiVersion: core.oam.dev/v1beta1
kind: TraitDefinition
metadata:
  name: dapr-pubsub
  namespace: vela-system
  annotations:
    definition.oam.dev/description: "Create Dapr Subscription resource for pub/sub messaging"
  labels:
    app.kubernetes.io/name: kubevela-dapr
    app.kubernetes.io/component: trait
spec:
  appliesToWorkloads:
    - deployments.apps
    - statefulsets.apps
  podDisruptive: false
  schematic:
    cue:
      template: |
        parameter: {
          // Dapr pubsub component name
          pubsubName: *"pubsub" | string
          // Topic to subscribe to
          topic: string
          // Route path for the subscription handler
          route: string
          // Optional dead letter topic
          deadLetterTopic?: string
          // Bulk subscribe configuration
          bulkSubscribe?: {
            enabled: bool
            maxMessagesCount?: int
            maxAwaitDurationMs?: int
          }
        }
        // Output a Dapr Subscription resource
        outputs: subscription: {
          apiVersion: "dapr.io/v2alpha1"
          kind:       "Subscription"
          metadata: {
            name: "\(context.name)-\(parameter.topic)-sub"
          }
          spec: {
            pubsubname: parameter.pubsubName
            topic:      parameter.topic
            route:      parameter.route
            if parameter.deadLetterTopic != _|_ {
              deadLetterTopic: parameter.deadLetterTopic
            }
            if parameter.bulkSubscribe != _|_ {
              bulkSubscribe: parameter.bulkSubscribe
            }
          }
        }
