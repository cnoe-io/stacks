apiVersion: apps/v1
kind: Deployment
metadata:
  name: mastra-agent
  namespace: dapr-agents
  labels:
    app.kubernetes.io/name: mastra-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mastra-agent
  template:
    metadata:
      labels:
        app: mastra-agent
        app.kubernetes.io/name: mastra-agent
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: mastra-agent
        dapr.io/app-port: "8001"
        dapr.io/app-protocol: http
        dapr.io/enable-workflow: "true"
    spec:
      containers:
        - name: mastra-agent
          image: gitea.cnoe.localtest.me:8443/giteaadmin/mastra-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dapr-agents-llm-providers
                  key: OPENAI_API_KEY
            - name: OPENAI_MODEL
              value: "gpt-4o"
            - name: MAX_ITERATIONS
              value: "10"
            - name: APP_PORT
              value: "8001"
            - name: STATE_KEY
              value: "mastra-weather-agent"
            - name: DAPR_STATE_STORE
              value: "statestore"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
