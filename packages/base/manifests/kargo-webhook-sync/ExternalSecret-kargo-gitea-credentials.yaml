apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    app.kubernetes.io/component: credentials
    app.kubernetes.io/name: kargo-webhook-sync
  name: kargo-gitea-credentials
  namespace: kargo
spec:
  data:
    - remoteRef:
        key: gitea-credential
        property: token
      secretKey: token
    - remoteRef:
        key: gitea-credential
        property: password
      secretKey: password
    - remoteRef:
        key: gitea-credential
        property: username
      secretKey: username
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: gitea
  target:
    creationPolicy: Owner
    name: kargo-gitea-credentials
