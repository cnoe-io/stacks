apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/component: webhook-automation
    app.kubernetes.io/name: kargo-webhook-sync
  name: kargo-webhook-sync
rules:
  # Allow reading ClusterConfig to get webhook receiver path
  - apiGroups:
      - kargo.akuity.io
    resources:
      - clusterconfigs
    verbs:
      - get
      - list
