apiVersion: v1
data:
  sync-webhooks.sh: |
    #!/bin/sh
    set -e

    echo "Configuring Gitea System Webhook for Kargo..."

    # Configuration
    GITEA_URL="https://gitea.cnoe.localtest.me:8443"
    KARGO_WEBHOOK_BASE="http://kargo-external-webhooks-server.kargo.svc.cluster.local:80"

    # Get credentials from mounted secrets
    GITEA_USER=$(cat /gitea-credentials/username 2>/dev/null || echo "giteaAdmin")
    GITEA_PASS=$(cat /gitea-credentials/password)
    KARGO_WEBHOOK_SECRET=$(cat /kargo-credentials/secret)

    # Fetch the webhook path from Kargo ClusterConfig status (cluster-level webhook)
    echo "Fetching webhook URL from Kargo ClusterConfig..."
    WEBHOOK_PATH=$(kubectl get clusterconfig cluster \
      -o jsonpath='{.status.webhookReceivers[?(@.name=="gitea-cluster-webhook")].path}' 2>/dev/null || echo "")

    if [ -z "$WEBHOOK_PATH" ]; then
      echo "[-] ERROR: Could not get webhook path from ClusterConfig."
      echo "    Make sure ClusterConfig has webhookReceivers configured."
      exit 1
    fi

    KARGO_WEBHOOK_URL="${KARGO_WEBHOOK_BASE}${WEBHOOK_PATH}"
    echo "Target: $KARGO_WEBHOOK_URL"

    # Check if Kargo system webhook already exists
    echo "Checking for existing system webhook..."
    EXISTING=$(curl -k -s -u "$GITEA_USER:$GITEA_PASS" \
      "$GITEA_URL/api/v1/admin/hooks" | \
      jq '[.[] | select(.config.url | contains("kargo"))] | length' 2>/dev/null || echo "0")

    if [ "$EXISTING" -gt 0 ]; then
      echo "Kargo system webhook already exists. Skipping."
      echo ""
      echo "System webhook configuration complete!"
      echo "All repository push events will notify Kargo instantly."
      exit 0
    fi

    # Create system webhook (applies to ALL repositories)
    # Match ArgoCD approach: is_system_webhook inside config
    echo "Creating system webhook..."
    RESULT=$(curl -k -s -w "%{http_code}" -o /tmp/response.json -X POST \
      -u "$GITEA_USER:$GITEA_PASS" \
      "$GITEA_URL/api/v1/admin/hooks" \
      -H "Content-Type: application/json" \
      -d "{
        \"type\": \"gitea\",
        \"active\": true,
        \"events\": [\"push\", \"package\"],
        \"config\": {
          \"url\": \"$KARGO_WEBHOOK_URL\",
          \"content_type\": \"json\",
          \"secret\": \"$KARGO_WEBHOOK_SECRET\",
          \"is_system_webhook\": \"true\"
        }
      }")

    if [ "$RESULT" = "201" ]; then
      HOOK_ID=$(jq -r '.id' /tmp/response.json)
      echo "[+] Created system webhook (id: $HOOK_ID)"
      echo ""
      echo "System webhook configuration complete!"
      echo "All repository push events will notify Kargo instantly."
    else
      echo "[-] Failed to create system webhook (HTTP $RESULT)"
      cat /tmp/response.json
      exit 1
    fi
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: webhook-automation
    app.kubernetes.io/name: kargo-webhook-sync
  name: kargo-webhook-sync-script
  namespace: kargo
