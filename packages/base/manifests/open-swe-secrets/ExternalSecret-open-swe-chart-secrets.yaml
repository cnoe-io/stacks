apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: open-swe-chart-secrets
  namespace: open-swe
  labels:
    app.kubernetes.io/name: open-swe-chart-secrets
    app.kubernetes.io/part-of: open-swe
  annotations:
    # Creates the secret expected by the langgraph-cloud Helm chart
    argocd.argoproj.io/sync-options: "SkipDryRunOnMissingResource=true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    name: open-swe-langgraph-cloud-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # LangSmith API key - required for Self-Hosted Lite
    - secretKey: api_key
      remoteRef:
        key: LANGSMITH-API-KEY
