apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: open-swe-langgraph-config
  namespace: open-swe
  labels:
    app.kubernetes.io/name: open-swe-langgraph-config
    app.kubernetes.io/part-of: open-swe
  annotations:
    # This secret provides the LangGraph Cloud Helm chart config values
    # using the existingSecretName option
    argocd.argoproj.io/sync-options: "SkipDryRunOnMissingResource=true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    name: open-swe-langgraph-config
    creationPolicy: Orphan
    deletionPolicy: Retain
    # Use template to set both required keys
    template:
      engineVersion: v2
      data:
        api_key: "{{ .langsmith_api_key }}"
        langgraph_cloud_license_key: ""
  data:
    - secretKey: langsmith_api_key
      remoteRef:
        key: LANGSMITH-API-KEY
