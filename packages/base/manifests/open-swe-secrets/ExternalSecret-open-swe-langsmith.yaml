apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: open-swe-langsmith
  namespace: open-swe
  labels:
    app.kubernetes.io/name: open-swe-langsmith
    app.kubernetes.io/part-of: open-swe
  annotations:
    # LangSmith API key is required for LangGraph Cloud to start
    # Sign up at https://smith.langchain.com and add LANGSMITH-API-KEY to Azure Key Vault
    argocd.argoproj.io/sync-options: "SkipDryRunOnMissingResource=true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    name: open-swe-langsmith
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: LANGSMITH_API_KEY
      remoteRef:
        key: LANGSMITH-API-KEY
