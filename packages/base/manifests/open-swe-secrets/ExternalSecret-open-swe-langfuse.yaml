apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: open-swe-langfuse
  namespace: open-swe
  labels:
    app.kubernetes.io/name: open-swe-langfuse
    app.kubernetes.io/part-of: open-swe
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    name: open-swe-langfuse
    creationPolicy: Owner
  data:
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef:
        key: LANGFUSE-PUBLIC-KEY
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef:
        key: LANGFUSE-SECRET-KEY
