apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: open-swe-encryption
  namespace: open-swe
  labels:
    app.kubernetes.io/name: open-swe-encryption
    app.kubernetes.io/part-of: open-swe
  annotations:
    argocd.argoproj.io/sync-options: "SkipDryRunOnMissingResource=true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    name: open-swe-encryption
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SECRETS_ENCRYPTION_KEY
      remoteRef:
        key: OPEN-SWE-SECRETS-ENCRYPTION-KEY
