apiVersion: v1
kind: ConfigMap
metadata:
  name: diagrid-dashboard-config
  namespace: dapr-agents
  labels:
    app.kubernetes.io/name: diagrid-dashboard
data:
  # Custom state store component for connecting to our Redis instance
  state_redis.yaml: |
    apiVersion: dapr.io/v1alpha1
    kind: Component
    metadata:
      name: statestore
    spec:
      type: state.redis
      version: v1
      metadata:
        - name: redisHost
          value: "redis-service.dapr-agents.svc.cluster.local:6379"
        - name: redisPassword
          value: ""
        - name: actorStateStore
          value: "true"
        - name: keyPrefix
          value: "workflow-llm"
