apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dapr-agents-demo
  namespace: dapr-agents
  labels:
    app.kubernetes.io/name: dapr-agents-demo
spec:
  ingressClassName: nginx
  rules:
    - host: dapr-agents.cnoe.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workflow-orchestrator
                port:
                  number: 80
  tls:
    - hosts:
        - dapr-agents.cnoe.localtest.me
      secretName: nginx-tls
