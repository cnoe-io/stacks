apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-route
  namespace: kgateway-system
  labels:
    app.kubernetes.io/name: llm-route
    app.kubernetes.io/part-of: kgateway-ai
spec:
  parentRefs:
    - name: kgateway
      namespace: kgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
        - path:
            type: PathPrefix
            value: /v1/completions
      backendRefs:
        - name: anthropic-llm
          kind: Backend
          group: gateway.kgateway.dev
