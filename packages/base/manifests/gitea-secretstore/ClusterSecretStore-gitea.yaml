apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gitea
spec:
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: eso-store
          namespace: gitea
      remoteNamespace: gitea
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: gitea
          type: ConfigMap
