apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workflow-web
  namespace: workflow-web
  labels:
    app.kubernetes.io/name: workflow-web
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
    - host: workflow.cnoe.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workflow-web
                port:
                  number: 80
  tls:
    - hosts:
        - workflow.cnoe.localtest.me
      secretName: nginx-tls
