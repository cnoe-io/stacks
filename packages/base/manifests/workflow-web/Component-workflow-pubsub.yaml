apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: workflow-pubsub
  namespace: workflow-web
  labels:
    app.kubernetes.io/name: workflow-pubsub
    app.kubernetes.io/component: pubsub
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    # NATS connection (shared with dapr-agents namespace)
    - name: natsURL
      value: nats://nats.dapr-agents.svc.cluster.local:4222
    - name: durableSubscriptionName
      value: workflow-web-durable
    - name: streamName
      value: workflow-stream
