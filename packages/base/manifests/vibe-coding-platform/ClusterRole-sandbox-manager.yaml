apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vibe-coding-sandbox-manager
  labels:
    app.kubernetes.io/name: vibe-coding-sandbox-manager
    app.kubernetes.io/part-of: vibe-coding-platform
rules:
  # SandboxClaim management
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Sandbox status monitoring
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  # Pod monitoring (for sandbox pods)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Pod exec (for running commands in sandboxes)
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Pod logs (for streaming command output)
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
