apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: workflow-statestore
  namespace: vibe-coding-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-80"
  labels:
    app.kubernetes.io/name: workflow-statestore
    app.kubernetes.io/component: statestore
    app.kubernetes.io/part-of: vibe-coding-platform
spec:
  type: state.redis
  version: v1
  metadata:
    # Redis host (using shared dapr-agents-redis instance)
    - name: redisHost
      value: redis-service.dapr-agents.svc.cluster.local:6379
    - name: redisPassword
      value: ""
    - name: enableTLS
      value: "false"
    # Key prefix to isolate workflow state
    - name: keyPrefix
      value: workflow
    # Enable actor state store for future actor support
    - name: actorStateStore
      value: "true"
    # Connection pool settings
    - name: redisMaxRetries
      value: "3"
    - name: redisMinRetryInterval
      value: 8ms
    - name: redisMaxRetryInterval
      value: 512ms
