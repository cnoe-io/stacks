apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/name: vibe-coding-secrets
    app.kubernetes.io/part-of: vibe-coding-platform
  name: vibe-coding-secrets
  namespace: vibe-coding-platform
spec:
  data:
    - remoteRef:
        key: ANTHROPIC-API-KEY
      secretKey: ANTHROPIC_API_KEY
    - remoteRef:
        key: OPENAI-API-KEY
      secretKey: OPENAI_API_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    creationPolicy: Owner
    name: vibe-coding-secrets
