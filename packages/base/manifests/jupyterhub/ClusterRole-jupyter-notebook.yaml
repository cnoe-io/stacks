apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jupyter-notebook
  annotations:
    argocd.argoproj.io/sync-wave: "45"
rules:
  # Read access to core resources
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - configmaps
      - namespaces
      - events
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]
  # Read access to apps
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  # Read access to networking
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  # Read access to batch jobs
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  # Dapr components - read access
  - apiGroups: ["dapr.io"]
    resources:
      - components
      - configurations
      - subscriptions
      - resiliencies
    verbs: ["get", "list", "watch"]
  # ArgoCD applications - read access
  - apiGroups: ["argoproj.io"]
    resources:
      - applications
      - applicationsets
      - appprojects
    verbs: ["get", "list", "watch"]
  # Kargo resources - read access
  - apiGroups: ["kargo.akuity.io"]
    resources:
      - stages
      - warehouses
      - freights
      - promotions
    verbs: ["get", "list", "watch"]
