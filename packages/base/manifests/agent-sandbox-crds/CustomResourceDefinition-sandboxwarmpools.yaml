apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxwarmpools.extensions.agents.x-k8s.io
  labels:
    app.kubernetes.io/name: agent-sandbox
spec:
  group: extensions.agents.x-k8s.io
  names:
    kind: SandboxWarmPool
    listKind: SandboxWarmPoolList
    plural: sandboxwarmpools
    singular: sandboxwarmpool
    shortNames:
      - sbwp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - sandboxTemplateRef
                - replicas
              properties:
                sandboxTemplateRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      description: Name of the SandboxTemplate to use for the warm pool
                    namespace:
                      type: string
                      description: Namespace of the SandboxTemplate
                replicas:
                  type: integer
                  minimum: 0
                  maximum: 10
                  description: Number of pre-warmed sandbox pods to maintain
                minReady:
                  type: integer
                  minimum: 0
                  description: Minimum number of ready sandboxes before scaling
                topologySpreadConstraints:
                  type: array
                  description: Topology spread constraints for distributing sandboxes across zones/nodes
                  items:
                    type: object
                    properties:
                      maxSkew:
                        type: integer
                        description: Maximum difference in pod count between topology domains
                      topologyKey:
                        type: string
                        description: Node label key for topology domain
                      whenUnsatisfiable:
                        type: string
                        enum: ["DoNotSchedule", "ScheduleAnyway"]
                        description: Action when constraints cannot be satisfied
                      labelSelector:
                        type: object
                        description: Label selector for matching pods
                        x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                replicas:
                  type: integer
                  description: Total number of non-terminated pods targeted by this warm pool
                readyReplicas:
                  type: integer
                  description: Number of ready pre-warmed sandboxes
                availableReplicas:
                  type: integer
                  description: Number of available sandboxes for allocation
                allocatedReplicas:
                  type: integer
                  description: Number of sandboxes currently allocated
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      additionalPrinterColumns:
        - name: Template
          type: string
          jsonPath: .spec.sandboxTemplateRef.name
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Available
          type: integer
          jsonPath: .status.availableReplicas
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
