apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxtemplates.agents.x-k8s.io
  labels:
    app.kubernetes.io/name: agent-sandbox
spec:
  group: agents.x-k8s.io
  names:
    kind: SandboxTemplate
    listKind: SandboxTemplateList
    plural: sandboxtemplates
    singular: sandboxtemplate
    shortNames:
      - sbt
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                description:
                  type: string
                  description: Description of the sandbox template
                podTemplate:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: Pod template specification for sandbox pods
                defaultTimeout:
                  type: string
                  description: Default timeout for sandboxes created from this template
                resourceLimits:
                  type: object
                  properties:
                    cpu:
                      type: string
                    memory:
                      type: string
                    storage:
                      type: string
                securityPolicy:
                  type: object
                  properties:
                    runAsNonRoot:
                      type: boolean
                    readOnlyRootFilesystem:
                      type: boolean
                    allowPrivilegeEscalation:
                      type: boolean
                    networkPolicy:
                      type: string
                      enum:
                        - isolated
                        - restricted
                        - unrestricted
      additionalPrinterColumns:
        - name: Description
          type: string
          jsonPath: .spec.description
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
