apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxclaims.agents.x-k8s.io
  labels:
    app.kubernetes.io/name: agent-sandbox
spec:
  group: agents.x-k8s.io
  names:
    kind: SandboxClaim
    listKind: SandboxClaimList
    plural: sandboxclaims
    singular: sandboxclaim
    shortNames:
      - sbc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - templateRef
              properties:
                templateRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      description: Name of the SandboxTemplate to use
                    namespace:
                      type: string
                      description: Namespace of the SandboxTemplate (defaults to claim namespace)
                overrides:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: Overrides to apply to the template
                timeout:
                  type: string
                  description: Override the default timeout
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Bound
                    - Ready
                    - Failed
                sandboxRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                message:
                  type: string
      additionalPrinterColumns:
        - name: Template
          type: string
          jsonPath: .spec.templateRef.name
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Sandbox
          type: string
          jsonPath: .status.sandboxRef.name
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
