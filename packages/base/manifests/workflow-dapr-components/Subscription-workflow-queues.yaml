apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: workflow-queue-subscription
  namespace: dapr-agents
  labels:
    app.kubernetes.io/name: workflow-queue-subscription
    app.kubernetes.io/component: subscription
    app.kubernetes.io/part-of: workflow-infrastructure
spec:
  # Topic pattern for workflow queues
  topic: workflow-queue-*
  pubsubname: workflow-pubsub
  # Bulk subscribe for efficiency
  bulkSubscribe:
    enabled: true
    maxMessagesCount: 100
    maxAwaitDurationMs: 1000
  routes:
    default: /api/workflow/queue
---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: workflow-stream-subscription
  namespace: dapr-agents
  labels:
    app.kubernetes.io/name: workflow-stream-subscription
    app.kubernetes.io/component: subscription
    app.kubernetes.io/part-of: workflow-infrastructure
spec:
  # Topic pattern for workflow streams
  topic: workflow-stream-*
  pubsubname: workflow-pubsub
  routes:
    default: /api/workflow/stream
---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: workflow-dlq-subscription
  namespace: dapr-agents
  labels:
    app.kubernetes.io/name: workflow-dlq-subscription
    app.kubernetes.io/component: subscription
    app.kubernetes.io/part-of: workflow-infrastructure
spec:
  # Topic pattern for dead letter queues
  topic: workflow-queue-*-dlq
  pubsubname: workflow-pubsub
  routes:
    default: /api/workflow/dlq
