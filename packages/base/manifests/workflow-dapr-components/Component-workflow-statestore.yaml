apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: workflow-statestore
  namespace: dapr-agents
  labels:
    app.kubernetes.io/name: workflow-statestore
    app.kubernetes.io/component: statestore
    app.kubernetes.io/part-of: workflow-infrastructure
# Scoped to prevent other Dapr apps in dapr-agents from loading this component
# (queryIndexes requires RediSearch which plain Redis does not support)
scopes:
  - workflow-web
spec:
  type: state.redis
  version: v1
  metadata:
    # Redis host (using existing dapr-agents-redis instance)
    - name: redisHost
      value: redis-service.dapr-agents.svc.cluster.local:6379

    # No password for internal Redis
    - name: redisPassword
      value: ""

    # Enable transactions for atomic operations
    - name: enableTLS
      value: "false"

    # Key prefix to isolate workflow state
    - name: keyPrefix
      value: workflow

    # Enable actor state store for future actor support
    - name: actorStateStore
      value: "true"

    # Connection pool settings
    - name: redisMaxRetries
      value: "3"

    - name: redisMinRetryInterval
      value: 8ms

    - name: redisMaxRetryInterval
      value: 512ms

    # TTL support for automatic cleanup
    - name: ttlInSeconds
      value: "0"

    # Query indexing for efficient listing
    - name: queryIndexes
      value: |
        [
          {
            "name": "runsByStatus",
            "indexes": [
              {"key": "status", "type": "TEXT"}
            ]
          },
          {
            "name": "runsByWorkflow",
            "indexes": [
              {"key": "workflowId", "type": "TEXT"}
            ]
          }
        ]
