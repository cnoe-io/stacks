apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    app.kubernetes.io/component: credentials
    app.kubernetes.io/name: argo-events-webhook-setup
  name: gitea-argo-events-webhook-creds
  namespace: argo-events
spec:
  data:
    - remoteRef:
        key: gitea-credential
        property: password
      secretKey: password
    - remoteRef:
        key: gitea-credential
        property: username
      secretKey: username
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: gitea
  target:
    creationPolicy: Owner
    name: gitea-argo-events-webhook-creds
