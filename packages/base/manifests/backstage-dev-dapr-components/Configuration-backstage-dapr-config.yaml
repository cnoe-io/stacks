apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: backstage-dapr-config
  namespace: backstage-dev
spec:
  features:
    - enabled: true
      name: ServiceInvocation
    - enabled: true
      name: Configuration
    - enabled: true
      name: StateStore
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: http://jaeger-collector.observability.svc.cluster.local:9411/api/v2/spans
