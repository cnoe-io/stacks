apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: selfsigned-issuer
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-85"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: cnoe://selfsigned-issuer/manifests
    targetRevision: HEAD
    path: "."
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
