apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-repo-write-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
    stacks.io/repo-source: stacks
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/giteaadmin/stacks.git
    targetRevision: HEAD
    path: packages/base/manifests/argocd-repo-write-secret
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
