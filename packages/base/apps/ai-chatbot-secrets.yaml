apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-chatbot-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "55"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: cnoe://ai-chatbot-secrets/manifests
    targetRevision: HEAD
    path: "."
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-chatbot
  syncPolicy:
    automated:
      prune: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
