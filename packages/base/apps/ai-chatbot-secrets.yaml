apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-chatbot-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "55"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/PittampalliOrg/stacks.git
    targetRevision: main
    path: packages/base/manifests/ai-chatbot-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-chatbot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
