apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "65"
  name: kargo-cluster-config
  namespace: argocd
spec:
  destination:
    namespace: kargo
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://kargo-cluster-config/manifests
  syncPolicy:
    automated:
      prune: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
