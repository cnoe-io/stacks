apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  name: activity-executor
  namespace: argocd
spec:
  destination:
    namespace: activity-executor
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://activity-executor/manifests
  syncPolicy: {}
