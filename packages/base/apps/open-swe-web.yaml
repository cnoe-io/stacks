apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "65"
  name: open-swe-web
  namespace: argocd
spec:
  destination:
    namespace: open-swe
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: cnoe://open-swe-web/manifests
    targetRevision: HEAD
    path: "."
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
