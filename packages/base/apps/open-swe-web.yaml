apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "65"
    kargo.akuity.io/authorized-stage: kargo-pipelines:open-swe-local-dev
  name: open-swe-web
  namespace: argocd
spec:
  destination:
    namespace: open-swe
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: cnoe://open-swe-web/manifests
    targetRevision: HEAD
    path: "."
  syncPolicy:
    # Auto-sync disabled - Kargo manages open-swe deployments via open-swe-local-dev
    # This also allows devspace to swap images without ArgoCD reverting changes
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
