apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage-templates
  namespace: argocd
  annotations:
    stacks.io/repo-source: stacks
    argocd.argoproj.io/sync-wave: "50"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/giteaadmin/stacks.git
    targetRevision: HEAD
    path: packages/base/manifests/backstage-templates/entities
    directory:
      exclude: 'catalog-info.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
