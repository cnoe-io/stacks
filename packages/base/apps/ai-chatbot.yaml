apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-chatbot
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: cnoe://ai-chatbot/manifests
    targetRevision: HEAD
    path: "."
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-chatbot
  syncPolicy:
    # Auto-sync disabled to allow DevSpace development
    # Manual sync required: argocd app sync ai-chatbot
    syncOptions:
      - ServerSideApply=true
