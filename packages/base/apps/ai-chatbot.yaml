apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-chatbot
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "60"
    kargo.akuity.io/authorized-stage: kargo-pipelines:ai-chatbot-local-dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: cnoe://ai-chatbot/manifests
    targetRevision: HEAD
    path: "."
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-chatbot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
