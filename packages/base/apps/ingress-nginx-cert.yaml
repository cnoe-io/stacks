apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    stacks.io/repo-source: stacks
    argocd.argoproj.io/sync-wave: "-99"
  labels:
    app.kubernetes.io/name: ingress-nginx-cert
  name: ingress-nginx-cert
  namespace: argocd
spec:
  destination:
    namespace: ingress-nginx
    server: https://kubernetes.default.svc
  project: default
  source:
    path: packages/base/manifests/ingress-nginx-cert
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/giteaadmin/stacks.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
      limit: 10
    syncOptions:
      - ServerSideApply=true
