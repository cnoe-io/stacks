apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-120"
  name: dapr-runtime
  namespace: argocd
spec:
  destination:
    namespace: dapr-system
    server: https://kubernetes.default.svc
  project: default
  source:
    path: packages/base/manifests/dapr-runtime/manifests
    repoURL: https://gitea.cnoe.localtest.me:8443/giteaadmin/stacks.git
  syncPolicy:
    automated:
      prune: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
