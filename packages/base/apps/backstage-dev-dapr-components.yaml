apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "15"
  name: backstage-dev-dapr-components
  namespace: argocd
spec:
  destination:
    namespace: backstage-dev
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://backstage-dev-dapr-components/manifests
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
