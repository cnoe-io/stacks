apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "75"
  name: kargo-backstage-pipeline
  namespace: argocd
spec:
  destination:
    namespace: kargo-pipelines
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://kargo-backstage-pipeline/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Retry on webhook failures during initial sync (webhooks may still be starting)
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      # Skip dry-run validation if Kargo CRDs not yet established
      - SkipDryRunOnMissingResource=true
