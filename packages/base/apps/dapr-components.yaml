apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-90"
  name: dapr-components
  namespace: argocd
spec:
  destination:
    namespace: dapr-agents
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://dapr-components/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
