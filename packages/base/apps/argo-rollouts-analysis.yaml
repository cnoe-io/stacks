apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts-analysis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-84"
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/giteaadmin/stacks.git
    targetRevision: HEAD
    path: packages/base/manifests/argo-rollouts-analysis/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
