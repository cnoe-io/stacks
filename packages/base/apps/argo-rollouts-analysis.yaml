apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts-analysis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-84"
spec:
  project: default
  source:
    repoURL: cnoe://argo-rollouts-analysis/manifests
    targetRevision: HEAD
    path: "."
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
