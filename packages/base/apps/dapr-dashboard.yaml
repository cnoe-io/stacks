apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-115"
  name: dapr-dashboard
  namespace: argocd
spec:
  destination:
    namespace: dapr-system
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://dapr-dashboard/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
