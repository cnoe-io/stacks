apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "45"
  name: agent-sandbox-config
  namespace: argocd
spec:
  destination:
    namespace: agent-sandbox
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://agent-sandbox-config/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
