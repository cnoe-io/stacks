apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  name: planner-agent
  namespace: argocd
spec:
  destination:
    namespace: planner-agent
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://planner-agent/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
