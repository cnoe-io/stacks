apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-40"
  name: backstage-staging-namespace
  namespace: argocd
spec:
  destination:
    namespace: backstage-staging
    server: https://kubernetes.default.svc
  project: default
  source:
    path: packages/base/manifests/backstage-staging-namespace/manifests
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/giteaadmin/stacks.git
  syncPolicy:
    automated:
      prune: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
