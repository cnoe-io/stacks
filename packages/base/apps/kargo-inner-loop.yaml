apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    # Must be after kargo (65) and kargo-pipelines-project (70) to ensure CRDs exist
    argocd.argoproj.io/sync-wave: "76"
  name: kargo-inner-loop
  namespace: argocd
spec:
  destination:
    namespace: kargo-pipelines
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: cnoe://kargo-inner-loop
    targetRevision: HEAD
    path: "manifests"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Retry on webhook failures during initial sync (webhooks may still be starting)
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Skip dry-run validation if Kargo CRDs not yet established
      - SkipDryRunOnMissingResource=true
