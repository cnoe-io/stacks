apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
    kargo.akuity.io/authorized-stage: kargo-pipelines:backstage-local-dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: cnoe://backstage/manifests
    targetRevision: HEAD
    path: "."
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    # Auto-sync disabled - Kargo manages Backstage deployments via backstage-local-dev
    syncOptions:
      - ServerSideApply=true
