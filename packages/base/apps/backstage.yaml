apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
    # Kargo Stage authorized to update this app's image tag
    kargo.akuity.io/authorized-stage: kargo-pipelines:backstage-local-dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/giteaadmin/stacks.git
    targetRevision: HEAD
    path: packages/base/manifests/backstage/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  # Ignore DevSpace-managed fields to allow local development without drift detection
  # Note: image is NOT ignored - Kargo manages image updates via inner-loop pipeline
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/resources
        - /spec/replicas
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
