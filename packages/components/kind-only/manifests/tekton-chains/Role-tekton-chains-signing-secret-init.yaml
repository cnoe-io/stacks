apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-chains-signing-secret-init
  namespace: tekton-chains
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - signing-secrets
    verbs:
      - get
      - create
      - patch
      - update
