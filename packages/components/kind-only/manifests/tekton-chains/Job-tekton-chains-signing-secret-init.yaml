apiVersion: batch/v1
kind: Job
metadata:
  name: tekton-chains-signing-secret-init
  namespace: tekton-chains
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: tekton-chains-signing-secret-init
      restartPolicy: OnFailure
      containers:
        - name: init-signing-secret
          image: alpine:3.21
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -euo pipefail

              apk add --no-cache curl kubectl coreutils

              if kubectl -n tekton-chains get secret signing-secrets -o jsonpath='{.data.cosign\.key}' 2>/dev/null | grep -q .; then
                echo "signing-secrets already initialized"
                exit 0
              fi

              tmp_dir="$(mktemp -d)"
              trap 'rm -rf "${tmp_dir}"' EXIT

              cosign_bin="${tmp_dir}/cosign"
              cosign_version="v2.4.1"

              echo "Downloading cosign ${cosign_version}..."
              curl -fsSL -o "${cosign_bin}" \
                "https://github.com/sigstore/cosign/releases/download/${cosign_version}/cosign-linux-amd64"
              chmod +x "${cosign_bin}"

              password="$(head -c 32 /dev/urandom | base64 | tr -d '\n')"

              echo "Generating signing key pair..."
              COSIGN_PASSWORD="${password}" "${cosign_bin}" generate-key-pair \
                --output-key-prefix "${tmp_dir}/cosign"

              kubectl -n tekton-chains create secret generic signing-secrets \
                --from-file=cosign.key="${tmp_dir}/cosign.key" \
                --from-file=cosign.pub="${tmp_dir}/cosign.pub" \
                --from-literal=cosign.password="${password}" \
                --dry-run=client -o yaml | kubectl apply -f -

              echo "signing-secrets initialized"
