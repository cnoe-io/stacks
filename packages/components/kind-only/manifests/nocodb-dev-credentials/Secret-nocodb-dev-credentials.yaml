apiVersion: v1
kind: Secret
metadata:
  name: nocodb-credentials
  namespace: nocodb
  labels:
    app: nocodb
  annotations:
    # This provides dev defaults - ExternalSecret will override if available
    dev.cnoe.io/purpose: "Local development default credentials"
type: Opaque
stringData:
  # Standard dev password matching idpbuilder convention
  NC_ADMIN_PASSWORD: "developer"
  # JWT secret for session management
  NC_AUTH_JWT_SECRET: "dev-jwt-secret-for-local-testing-only"
  # Postgres password
  POSTGRES_PASSWORD: "developer"
