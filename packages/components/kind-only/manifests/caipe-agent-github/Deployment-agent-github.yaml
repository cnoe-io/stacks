apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: agent-github
    tier: agent
  name: agent-github
  namespace: ai-platform-engineering
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-github
  template:
    metadata:
      labels:
        app: agent-github
    spec:
      containers:
        - env:
            - name: MCP_MODE
              value: http
            - name: GITHUB_PERSONAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  key: GITHUB_TOKEN
                  name: agent-github-secret
            # GH_TOKEN for gh CLI authentication
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  key: GITHUB_TOKEN
                  name: agent-github-secret
            # Tracing configuration
            - name: ENABLE_TRACING
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4317
            - name: OTEL_SERVICE_NAME
              value: caipe-agent-github
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            # Langfuse configuration
            - name: LANGFUSE_ENABLED
              value: "true"
            - name: LANGFUSE_HOST
              value: http://langfuse.observability.svc.cluster.local:3000
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  key: LANGFUSE_PUBLIC_KEY
                  name: langfuse-secret
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: LANGFUSE_SECRET_KEY
                  name: langfuse-secret
            - name: LANGFUSE_SESSION_ID
              value: ai-platform-engineering
            - name: LANGFUSE_USER_ID
              value: github-agent
          envFrom:
            - secretRef:
                name: llm-secret
          image: ghcr.io/cnoe-io/agent-github:latest
          name: agent-github
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
      imagePullSecrets:
        - name: ghcr-pull-secret
