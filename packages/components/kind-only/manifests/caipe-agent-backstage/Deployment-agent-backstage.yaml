apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: agent-backstage
    tier: agent
  name: agent-backstage
  namespace: ai-platform-engineering
spec:
  replicas: 0
  selector:
    matchLabels:
      app: agent-backstage
  template:
    metadata:
      labels:
        app: agent-backstage
    spec:
      containers:
        - env:
            - name: MCP_MODE
              value: http
            - name: MCP_HOST
              value: mcp-backstage.ai-platform-engineering.svc.cluster.local
            - name: MCP_PORT
              value: "8000"
            - name: BACKSTAGE_URL
              value: http://backstage.backstage.svc.cluster.local:7007
            - name: BACKSTAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  key: BACKSTAGE_API_TOKEN
                  name: agent-backstage-secret
            # Tracing configuration
            - name: ENABLE_TRACING
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4317
            - name: OTEL_SERVICE_NAME
              value: caipe-agent-backstage
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            # Langfuse configuration
            - name: LANGFUSE_ENABLED
              value: "true"
            - name: LANGFUSE_HOST
              value: http://langfuse.observability.svc.cluster.local:3000
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  key: LANGFUSE_PUBLIC_KEY
                  name: langfuse-secret
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: LANGFUSE_SECRET_KEY
                  name: langfuse-secret
            - name: LANGFUSE_SESSION_ID
              value: ai-platform-engineering
            - name: LANGFUSE_USER_ID
              value: backstage-agent
          envFrom:
            - secretRef:
                name: llm-secret
          image: ghcr.io/cnoe-io/agent-backstage:latest
          name: agent-backstage
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
      imagePullSecrets:
        - name: ghcr-pull-secret
