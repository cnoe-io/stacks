apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/component: init
    app.kubernetes.io/name: feature-flags-repo-init
    app.kubernetes.io/part-of: feature-flags
  name: feature-flags-repo-init
  namespace: feature-flags
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feature-flags-repo-init
    spec:
      containers:
        - args:
            - |2
                                set -e

                                # Install curl and jq
                                apk add --no-cache curl jq

                                GITEA_URL="http://gitea-http.gitea.svc.cluster.local:3000"
                                REPO_NAME="feature-flags"

                                echo "Checking if repo exists..."
                                REPO_CHECK=$(curl -s -o /dev/null -w "%{http_code}" \
                                  -u "$GITEA_USERNAME:$GITEA_PASSWORD" \
                                  "$GITEA_URL/api/v1/repos/giteaadmin/$REPO_NAME")

                                if [ "$REPO_CHECK" = "200" ]; then
                                  echo "Repository already exists, checking for .flipt.yml..."
                                  cd /tmp
                                  git config --global user.email "admin@example.com"
                                  git config --global user.name "Admin"
                                  git clone "http://$GITEA_USERNAME:$GITEA_PASSWORD@gitea-http.gitea.svc.cluster.local:3000/giteaadmin/$REPO_NAME.git"
                                  cd "$REPO_NAME"
                                  if [ -d "default" ] && [ -f "default/features.yaml" ]; then
                                    echo "Feature flags already configured with correct structure, skipping"
                                    exit 0
                                  fi
                                  echo "Repo exists but needs feature flags setup, continuing..."
                                else
                                  echo "Creating repository..."
                                  curl -s -X POST "$GITEA_URL/api/v1/user/repos" \
                                    -u "$GITEA_USERNAME:$GITEA_PASSWORD" \
                                    -H "Content-Type: application/json" \
                                    -d '{
                                      "name": "'"$REPO_NAME"'",
                                      "description": "Feature flags configuration for Flipt",
                                      "private": false,
                                      "auto_init": true,
                                      "default_branch": "main"
                                    }'

                                  echo "Waiting for repo to be ready..."
                                  sleep 5

                                  cd /tmp
                                  git config --global user.email "admin@example.com"
                                  git config --global user.name "Admin"
                                  git clone "http://$GITEA_USERNAME:$GITEA_PASSWORD@gitea-http.gitea.svc.cluster.local:3000/giteaadmin/$REPO_NAME.git"
                                  cd "$REPO_NAME"
                                fi

                                # Remove old features.json and flags directory if they exist
                                rm -f features.json
                                rm -rf flags .flipt.yml

                                # Create namespace directories (Flipt expects <namespace>/features.yaml structure)
                                mkdir -p default development staging production

                                # Default namespace flags (for Flagd and general use)
                                cat > default/features.yaml << 'EOF'
              # Default Namespace Feature Flags
              version: "1.2"
              namespace: default

              segments:
                - key: beta-users
                  name: Beta Program Users
                  match_type: ANY_MATCH_TYPE
                  constraints:
                    - property: groups
                      operator: isoneof
                      value: beta-testers,early-adopters
                      type: STRING_COMPARISON_TYPE

                - key: internal-users
                  name: Internal Users
                  match_type: ANY_MATCH_TYPE
                  constraints:
                    - property: email
                      operator: suffix
                      value: "@company.com"
                      type: STRING_COMPARISON_TYPE

              flags:
                - key: dark-mode-enabled
                  name: Dark Mode
                  type: BOOLEAN_FLAG_TYPE
                  enabled: true
                  rollouts:
                    - segment:
                        key: beta-users
                        value: true
                    - threshold:
                        percentage: 20
                        value: true

                - key: new-dashboard-ui
                  name: New Dashboard UI
                  type: BOOLEAN_FLAG_TYPE
                  enabled: true
                  rollouts:
                    - segment:
                        key: internal-users
                        value: true

                - key: checkout-flow
                  name: Checkout Flow Version
                  type: VARIANT_FLAG_TYPE
                  enabled: true
                  variants:
                    - key: control
                      name: Original checkout
                    - key: variant-a
                      name: Streamlined checkout
                    - key: variant-b
                      name: Single page checkout
                  rules:
                    - segment: beta-users
                      rank: 1
                      distributions:
                        - variant: control
                          rollout: 34
                        - variant: variant-a
                          rollout: 33
                        - variant: variant-b
                          rollout: 33
              EOF

                                # Development environment flags - Flipt v2 format
                                cat > development/features.yaml << 'EOF'
              # Development Environment Feature Flags
              version: "1.2"
              namespace: development

              segments:
                - key: beta-users
                  name: Beta Program Users
                  match_type: ANY_MATCH_TYPE
                  constraints:
                    - property: groups
                      operator: isoneof
                      value: beta-testers,early-adopters
                      type: STRING_COMPARISON_TYPE

                - key: internal-users
                  name: Internal Users
                  match_type: ANY_MATCH_TYPE
                  constraints:
                    - property: email
                      operator: suffix
                      value: "@company.com"
                      type: STRING_COMPARISON_TYPE

              flags:
                - key: dark-mode-enabled
                  name: Dark Mode
                  type: BOOLEAN_FLAG_TYPE
                  enabled: true
                  rollouts:
                    - segment:
                        key: beta-users
                        value: true
                    - threshold:
                        percentage: 20
                        value: true

                - key: new-dashboard-ui
                  name: New Dashboard UI
                  type: BOOLEAN_FLAG_TYPE
                  enabled: true
                  rollouts:
                    - segment:
                        key: internal-users
                        value: true
                    - threshold:
                        percentage: 0
                        value: false

                - key: checkout-flow
                  name: Checkout Flow Version
                  type: VARIANT_FLAG_TYPE
                  enabled: true
                  variants:
                    - key: control
                      name: Original checkout
                    - key: variant-a
                      name: Streamlined checkout
                    - key: variant-b
                      name: Single page checkout
                  rules:
                    - segment: beta-users
                      rank: 1
                      distributions:
                        - variant: control
                          rollout: 34
                        - variant: variant-a
                          rollout: 33
                        - variant: variant-b
                          rollout: 33
              EOF

                                # Staging environment flags - Flipt v2 format
                                cat > staging/features.yaml << 'EOF'
              # Staging Environment Feature Flags
              version: "1.2"
              namespace: staging

              segments:
                - key: beta-users
                  name: Beta Program Users
                  match_type: ANY_MATCH_TYPE
                  constraints:
                    - property: groups
                      operator: isoneof
                      value: beta-testers
                      type: STRING_COMPARISON_TYPE

              flags:
                - key: dark-mode-enabled
                  name: Dark Mode
                  type: BOOLEAN_FLAG_TYPE
                  enabled: true
                  rollouts:
                    - threshold:
                        percentage: 50
                        value: true

                - key: new-dashboard-ui
                  name: New Dashboard UI
                  type: BOOLEAN_FLAG_TYPE
                  enabled: false

                - key: checkout-flow
                  name: Checkout Flow Version
                  type: VARIANT_FLAG_TYPE
                  enabled: true
                  variants:
                    - key: control
                      name: Original checkout
                    - key: variant-a
                      name: Streamlined checkout
                  rules:
                    - segment: beta-users
                      rank: 1
                      distributions:
                        - variant: control
                          rollout: 80
                        - variant: variant-a
                          rollout: 20
              EOF

                                # Production environment flags - Flipt v2 format
                                cat > production/features.yaml << 'EOF'
              # Production Environment Feature Flags
              version: "1.2"
              namespace: production

              segments:
                - key: vip-users
                  name: VIP Users
                  match_type: ALL_MATCH_TYPE
                  constraints:
                    - property: tier
                      operator: eq
                      value: enterprise
                      type: STRING_COMPARISON_TYPE

              flags:
                - key: dark-mode-enabled
                  name: Dark Mode
                  type: BOOLEAN_FLAG_TYPE
                  enabled: true
                  rollouts:
                    - threshold:
                        percentage: 100
                        value: true

                - key: new-dashboard-ui
                  name: New Dashboard UI
                  type: BOOLEAN_FLAG_TYPE
                  enabled: false

                - key: checkout-flow
                  name: Checkout Flow Version
                  type: VARIANT_FLAG_TYPE
                  enabled: true
                  variants:
                    - key: control
                      name: Original checkout
                  rules:
                    - segment: vip-users
                      rank: 1
                      distributions:
                        - variant: control
                          rollout: 100
              EOF

                                # Commit all changes
                                git add -A
                                git commit -m "Initialize feature flags with multi-environment setup" || true
                                git push origin main || true

                                echo "Repository initialized with full feature flags configuration"
          command:
            - /bin/sh
            - -c
          env:
            - name: GITEA_USERNAME
              valueFrom:
                secretKeyRef:
                  key: FLIPT_STORAGE_DEFAULT_AUTHENTICATION_BASIC_USERNAME
                  name: flipt-git-credentials
            - name: GITEA_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: FLIPT_STORAGE_DEFAULT_AUTHENTICATION_BASIC_PASSWORD
                  name: flipt-git-credentials
          image: alpine/git:latest
          name: init-repo
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
      restartPolicy: OnFailure
      serviceAccountName: feature-flags-repo-init
  ttlSecondsAfterFinished: 300
