apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  labels:
    app: crawl4ai
    app.kubernetes.io/component: crawler
    app.kubernetes.io/name: crawl4ai
    app.kubernetes.io/part-of: caipe
  name: crawl4ai-secret
  namespace: ai-platform-engineering
spec:
  data:
    # Langfuse observability keys for LLM tracing
    - remoteRef:
        key: LANGFUSE-PUBLIC-KEY
      secretKey: LANGFUSE_PUBLIC_KEY
    - remoteRef:
        key: LANGFUSE-SECRET-KEY
      secretKey: LANGFUSE_SECRET_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    creationPolicy: Owner
    name: crawl4ai-secret
