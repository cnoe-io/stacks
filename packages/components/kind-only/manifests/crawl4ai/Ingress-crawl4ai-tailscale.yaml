apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: ai-platform-engineering
  name: crawl4ai-tailscale
  labels:
    tailscale.com/proxy-class: development
  annotations:
    argocd.argoproj.io/sync-wave: "60"
    tailscale.com/hostname: "crawl4ai-ryzen"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
      - crawl4ai-ryzen
  rules:
    - host: crawl4ai-ryzen
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crawl4ai
                port:
                  number: 11235
