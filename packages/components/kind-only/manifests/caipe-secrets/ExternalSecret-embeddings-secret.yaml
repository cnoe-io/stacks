apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: embeddings-secret
  namespace: ai-platform-engineering
spec:
  data:
    - remoteRef:
        key: OPENAI-API-KEY
      secretKey: OPENAI_API_KEY
    # Azure OpenAI embeddings config (higher rate limits)
    - remoteRef:
        key: AZURE-OPENAI-EMBEDDINGS-API-KEY
      secretKey: AZURE_OPENAI_EMBEDDINGS_API_KEY
    - remoteRef:
        key: AZURE-OPENAI-EMBEDDINGS-ENDPOINT
      secretKey: AZURE_OPENAI_EMBEDDINGS_ENDPOINT
    - remoteRef:
        key: AZURE-OPENAI-EMBEDDINGS-DEPLOYMENT
      secretKey: AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    creationPolicy: Owner
    name: embeddings-secret
