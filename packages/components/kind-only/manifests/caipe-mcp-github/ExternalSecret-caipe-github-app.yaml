apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: caipe-github-app-credentials
  namespace: ai-platform-engineering
  labels:
    app.kubernetes.io/name: caipe-github-app
    app.kubernetes.io/part-of: caipe
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    name: caipe-github-app-credentials
    creationPolicy: Owner
  data:
    - secretKey: APP_ID
      remoteRef:
        key: CAIPE-GITHUB-APP-ID
    - secretKey: PRIVATE_KEY
      remoteRef:
        key: CAIPE-GITHUB-APP-PRIVATE-KEY
    - secretKey: INSTALLATION_ID
      remoteRef:
        key: CAIPE-GITHUB-APP-INSTALL-ID
    - secretKey: CLIENT_ID
      remoteRef:
        key: CAIPE-GITHUB-APP-CLIENT-ID
