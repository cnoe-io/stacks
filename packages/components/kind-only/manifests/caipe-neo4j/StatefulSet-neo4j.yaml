apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: neo4j
    tier: storage
  name: neo4j
  namespace: ai-platform-engineering
spec:
  replicas: 0
  selector:
    matchLabels:
      app: neo4j
  serviceName: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  key: NEO4J_AUTH
                  name: neo4j-secret
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
            - name: NEO4J_server_config_strict__validation_enabled
              value: "false"
            - name: NEO4J_server_memory_heap_initial__size
              value: 1g
            - name: NEO4J_server_memory_heap_max__size
              value: 1g
            - name: NEO4J_server_memory_pagecache_size
              value: 512m
          image: neo4j:5.26.0-community
          name: neo4j
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7687
              name: bolt
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - mountPath: /data
              name: data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
