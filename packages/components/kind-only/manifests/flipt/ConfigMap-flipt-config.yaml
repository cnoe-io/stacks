apiVersion: v1
data:
  flipt.yml: |
    log:
      level: debug
      encoding: json

    server:
      protocol: http
      http_port: 8080
      grpc_port: 9000

    # Declarative Git storage (v2 format)
    # https://docs.flipt.io/configuration/storage
    # Authentication values are overridden by env vars:
    # FLIPT_STORAGE_DEFAULT_AUTHENTICATION_BASIC_USERNAME
    # FLIPT_STORAGE_DEFAULT_AUTHENTICATION_BASIC_PASSWORD
    storage:
      default:
        remote: "http://my-gitea-http.gitea.svc.cluster.local:3000/giteaadmin/feature-flags.git"
        ref: "main"
        poll_interval: "30s"
        insecure_skip_tls: true
        authentication:
          basic:
            # Placeholder values - overridden by env vars from flipt-git-credentials secret
            username: "placeholder"
            password: "placeholder"
        backend:
          type: git

    # Authentication configuration
    # NOTE: OIDC disabled due to Flipt not supporting custom CA certificates for OIDC providers
    # See: https://github.com/flipt-io/flipt/issues/5296
    # Using token authentication as workaround for local development
    authentication:
      required: false
      exclude:
        metadata: true
        evaluation: true
      session:
        domain: "flipt.cnoe.localtest.me"
        secure: true
      methods:
        token:
          enabled: true
          bootstrap:
            token: "developer"
            expiration: "8760h"
        oidc:
          enabled: false

    # Audit logging
    audit:
      sinks:
        log:
          enabled: true

    # Telemetry
    telemetry:
      enabled: true
kind: ConfigMap
metadata:
  labels:
    app: flipt
    app.kubernetes.io/component: management-ui
    app.kubernetes.io/name: flipt
    app.kubernetes.io/part-of: feature-flags
  name: flipt-config
  namespace: feature-flags
