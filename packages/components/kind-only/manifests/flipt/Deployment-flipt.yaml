apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: flipt
    app.kubernetes.io/component: management-ui
    app.kubernetes.io/name: flipt
    app.kubernetes.io/part-of: feature-flags
  name: flipt
  namespace: feature-flags
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flipt
  template:
    metadata:
      labels:
        app: flipt
        app.kubernetes.io/component: management-ui
        app.kubernetes.io/name: flipt
        app.kubernetes.io/part-of: feature-flags
    spec:
      initContainers:
        - name: setup-ca-bundle
          image: ghcr.io/flipt-io/flipt:v2.4.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "=== Setting up combined CA bundle ==="
              # Concatenate system CAs with our custom CA
              cat /etc/ssl/certs/ca-certificates.crt /custom-ca/ca.crt > /ca-bundle/ca-certificates.crt
              echo "Combined CA bundle created at /ca-bundle/ca-certificates.crt"
              echo "Bundle size: $(wc -c < /ca-bundle/ca-certificates.crt) bytes"
              echo "CA entries: $(grep -c 'BEGIN CERTIFICATE' /ca-bundle/ca-certificates.crt)"
          volumeMounts:
            - name: gitops-ca
              mountPath: /custom-ca
              readOnly: true
            - name: ca-bundle
              mountPath: /ca-bundle
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - args:
            - server
            - --config
            - /etc/flipt/flipt.yml
          command:
            - /flipt
          env:
            - name: FLIPT_LOG_LEVEL
              value: debug
            - name: GIT_SSL_CAINFO
              value: /ca-bundle/ca-certificates.crt
            - name: SSL_CERT_FILE
              value: /ca-bundle/ca-certificates.crt
            - name: SSL_CERT_DIR
              value: /ca-bundle
          envFrom:
            - secretRef:
                name: flipt-oidc
            - secretRef:
                name: flipt-git-credentials
          image: ghcr.io/flipt-io/flipt:v2.4.0
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          name: flipt
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 9000
              name: grpc
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /etc/flipt
              name: config
              readOnly: true
            - mountPath: /var/opt/flipt
              name: data
            - mountPath: /etc/ssl/certs/gitops-ca.crt
              name: gitops-ca
              readOnly: true
              subPath: ca.crt
            - mountPath: /ca-bundle
              name: ca-bundle
      securityContext:
        fsGroup: 1000
      volumes:
        - configMap:
            name: flipt-config
          name: config
        - name: data
          persistentVolumeClaim:
            claimName: flipt-data
        - name: gitops-ca
          secret:
            secretName: gitops-cert
        - name: ca-bundle
          emptyDir: {}
