apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: feature-flags
  name: flipt-tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "60"
    tailscale.com/hostname: "flipt-ryzen"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
      - flipt-ryzen
  rules:
    - host: flipt-ryzen
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flipt
                port:
                  number: 8080
