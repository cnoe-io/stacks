apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: rag-ingestors
    tier: rag
  name: rag-ingestors
  namespace: ai-platform-engineering
spec:
  replicas: 0
  selector:
    matchLabels:
      app: rag-ingestors
  template:
    metadata:
      labels:
        app: rag-ingestors
    spec:
      containers:
        - args:
            - /app/ingestors/src/ingestors/webloader/ingestor.py
          command:
            - python3
          env:
            - name: REDIS_URL
              value: redis://redis.ai-platform-engineering.svc.cluster.local:6379/0
            - name: RAG_SERVER_URL
              value: http://rag-server.ai-platform-engineering.svc.cluster.local:8000
            - name: MILVUS_URI
              value: http://milvus.ai-platform-engineering.svc.cluster.local:19530
            - name: MILVUS_HOST
              value: milvus.ai-platform-engineering.svc.cluster.local
            - name: MILVUS_PORT
              value: "19530"
            - name: NEO4J_ADDR
              value: neo4j://neo4j.ai-platform-engineering.svc.cluster.local:7687
            - name: NEO4J_URI
              value: bolt://neo4j.ai-platform-engineering.svc.cluster.local:7687
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  key: NEO4J_AUTH
                  name: neo4j-secret
            - name: EMBEDDINGS_MODEL
              value: text-embedding-3-large
            - name: LOG_LEVEL
              value: DEBUG
          envFrom:
            - secretRef:
                name: embeddings-secret
          image: ghcr.io/cnoe-io/caipe-rag-ingestors:0.2.8
          name: rag-ingestors
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 512Mi
      imagePullSecrets:
        - name: ghcr-pull-secret
