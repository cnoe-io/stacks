apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mcp-backstage
    tier: mcp
  name: mcp-backstage
  namespace: ai-platform-engineering
spec:
  replicas: 0
  selector:
    matchLabels:
      app: mcp-backstage
  template:
    metadata:
      labels:
        app: mcp-backstage
    spec:
      containers:
        - env:
            - name: MCP_MODE
              value: http
            - name: MCP_HOST
              value: 0.0.0.0
            - name: MCP_PORT
              value: "8000"
            - name: BACKSTAGE_URL
              value: http://backstage.backstage.svc.cluster.local:7007
            - name: BACKSTAGE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  key: BACKSTAGE_API_TOKEN
                  name: agent-backstage-secret
          image: ghcr.io/cnoe-io/mcp-backstage:stable
          name: mcp-backstage
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
      imagePullSecrets:
        - name: ghcr-pull-secret
