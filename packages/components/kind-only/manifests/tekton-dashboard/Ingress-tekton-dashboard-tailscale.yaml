apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tekton-dashboard-tailscale
  labels:
    tailscale.com/proxy-class: development
  annotations:
    argocd.argoproj.io/sync-wave: "60"
    tailscale.com/hostname: "tekton-ryzen"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
      - tekton-ryzen
  rules:
    - host: tekton-ryzen
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tekton-dashboard
                port:
                  number: 9097
