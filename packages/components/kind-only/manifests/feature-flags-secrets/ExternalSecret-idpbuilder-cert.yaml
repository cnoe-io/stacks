apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/component: ca-cert
    app.kubernetes.io/name: gitops
    app.kubernetes.io/part-of: feature-flags
  name: gitops-cert
  namespace: feature-flags
spec:
  data:
    - remoteRef:
        key: gitops-cert
        property: ca.crt
      secretKey: ca.crt
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: default-namespace
  target:
    creationPolicy: Owner
    name: gitops-cert
    template:
      type: Opaque
