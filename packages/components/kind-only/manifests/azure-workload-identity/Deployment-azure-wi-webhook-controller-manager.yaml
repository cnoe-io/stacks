apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: workload-identity-webhook
    azure-workload-identity.io/system: "true"
    chart: workload-identity-webhook
    release: workload-identity-webhook
  name: azure-wi-webhook-controller-manager
  namespace: azure-workload-identity-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workload-identity-webhook
      azure-workload-identity.io/system: "true"
      chart: workload-identity-webhook
      release: workload-identity-webhook
  template:
    metadata:
      labels:
        app: workload-identity-webhook
        azure-workload-identity.io/system: "true"
        chart: workload-identity-webhook
        release: workload-identity-webhook
    spec:
      containers:
        - args:
            - --log-level=info
            - --metrics-addr=:8095
            - --metrics-backend=prometheus
          command:
            - /manager
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: azure-wi-webhook-config
          image: mcr.microsoft.com/oss/azure/workload-identity/webhook:v1.5.1
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 20
          name: manager
          ports:
            - containerPort: 8095
              name: metrics
              protocol: TCP
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
            - containerPort: 9440
              name: healthz
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 100m
              memory: 30Mi
            requests:
              cpu: 100m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /certs
              name: cert
              readOnly: true
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-cluster-critical
      serviceAccountName: azure-wi-webhook-admin
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: azure-wi-webhook-server-cert
