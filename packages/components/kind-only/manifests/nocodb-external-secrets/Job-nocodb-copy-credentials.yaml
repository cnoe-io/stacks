apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app: nocodb-connections
  name: nocodb-copy-credentials
  namespace: nocodb
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: nocodb-connections
    spec:
      containers:
        - args:
            - |
              set -e
              echo "=== Copying database credentials ==="

              # Get Backstage PostgreSQL password from secret (not exec - more reliable)
              echo "Getting Backstage PostgreSQL password..."
              BACKSTAGE_PW=$(kubectl get secret -n backstage backstage-env-vars -o jsonpath='{.data.POSTGRES_PASSWORD}' 2>/dev/null | base64 -d || echo "")

              # Get Langfuse PostgreSQL password
              echo "Getting Langfuse PostgreSQL password..."
              LANGFUSE_PW=$(kubectl get secret -n observability langfuse-postgres-credentials -o jsonpath='{.data.POSTGRES_PASSWORD}' 2>/dev/null | base64 -d || echo "")

              # Get AI Chatbot PostgreSQL password (extract from POSTGRES_URL or use default)
              echo "Getting AI Chatbot PostgreSQL password..."
              AI_CHATBOT_URL=$(kubectl get secret -n ai-chatbot ai-chatbot-secrets -o jsonpath='{.data.POSTGRES_URL}' 2>/dev/null | base64 -d || echo "")
              # Extract password from postgresql://user:password@host:port/db format
              AI_CHATBOT_PW=$(echo "$AI_CHATBOT_URL" | sed -n 's|.*://[^:]*:\([^@]*\)@.*|\1|p' || echo "password")

              # Get Workflow Builder PostgreSQL password (extract from DATABASE_URL)
              echo "Getting Workflow Builder PostgreSQL password..."
              WF_BUILDER_URL=$(kubectl get secret -n workflow-builder workflow-builder-secrets -o jsonpath='{.data.DATABASE_URL}' 2>/dev/null | base64 -d || echo "")
              WF_BUILDER_PW=$(echo "$WF_BUILDER_URL" | sed -n 's|.*://[^:]*:\([^@]*\)@.*|\1|p' || echo "password")

              if [ -z "$BACKSTAGE_PW" ] || [ -z "$LANGFUSE_PW" ]; then
                echo "Warning: Could not retrieve all passwords, using defaults"
                # Fallback to known passwords for local dev
                BACKSTAGE_PW="${BACKSTAGE_PW:-backstage}"
                LANGFUSE_PW="${LANGFUSE_PW:-langfuse}"
              fi
              AI_CHATBOT_PW="${AI_CHATBOT_PW:-password}"
              WF_BUILDER_PW="${WF_BUILDER_PW:-password}"

              # Create/update secret in nocodb namespace
              kubectl create secret generic nocodb-external-db-credentials \
                --namespace=nocodb \
                --from-literal=BACKSTAGE_POSTGRES_PASSWORD="$BACKSTAGE_PW" \
                --from-literal=LANGFUSE_POSTGRES_PASSWORD="$LANGFUSE_PW" \
                --from-literal=AI_CHATBOT_POSTGRES_PASSWORD="$AI_CHATBOT_PW" \
                --from-literal=WORKFLOW_BUILDER_POSTGRES_PASSWORD="$WF_BUILDER_PW" \
                --dry-run=client -o yaml | kubectl apply -f -

              echo "✓ Credentials copied to nocodb namespace"
          command:
            - /bin/bash
            - -c
          image: bitnami/kubectl:latest
          name: copy-secrets
      restartPolicy: OnFailure
      serviceAccountName: nocodb-secret-copier
  ttlSecondsAfterFinished: 300
