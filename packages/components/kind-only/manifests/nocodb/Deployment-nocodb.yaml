apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nocodb
  name: nocodb
  namespace: nocodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nocodb
  template:
    metadata:
      labels:
        app: nocodb
    spec:
      containers:
        - env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: nocodb-credentials
            - name: NC_DB
              value: pg://nocodb-postgres:5432?u=nocodb&p=$(POSTGRES_PASSWORD)&d=nocodb
            - name: NC_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  key: NC_AUTH_JWT_SECRET
                  name: nocodb-credentials
            - name: NC_PUBLIC_URL
              value: https://nocodb.cnoe.localtest.me:8443
            - name: NC_DISABLE_TELE
              value: "true"
            # Initial admin credentials for automated setup
            # Username is derived from email prefix: admin
            - name: NC_ADMIN_EMAIL
              value: "admin@cnoe.localtest.me"
            # Note: Password comes from nocodb-credentials secret
            # Dev default: "developer", Azure Key Vault may override
            - name: NC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: NC_ADMIN_PASSWORD
                  name: nocodb-credentials
          image: nocodb/nocodb:latest
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          name: nocodb
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 512Mi
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
