apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app: nocodb-connections
  name: nocodb-connections-setup
  namespace: nocodb
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: nocodb-connections
    spec:
      containers:
        - command:
            - /bin/bash
            - /scripts/setup.sh
          env:
            - name: NOCODB_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: nocodb-credentials
            - name: BACKSTAGE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: BACKSTAGE_POSTGRES_PASSWORD
                  name: nocodb-external-db-credentials
            - name: LANGFUSE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: LANGFUSE_POSTGRES_PASSWORD
                  name: nocodb-external-db-credentials
            - name: AI_CHATBOT_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: AI_CHATBOT_POSTGRES_PASSWORD
                  name: nocodb-external-db-credentials
            - name: WORKFLOW_BUILDER_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: WORKFLOW_BUILDER_POSTGRES_PASSWORD
                  name: nocodb-external-db-credentials
            - name: FLIGHT_BOOKING_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: FLIGHT_BOOKING_POSTGRES_PASSWORD
                  name: nocodb-external-db-credentials
          image: postgres:15-alpine
          name: setup
          volumeMounts:
            - mountPath: /scripts
              name: scripts
      restartPolicy: OnFailure
      volumes:
        - configMap:
            defaultMode: 493
            name: nocodb-connections-setup
          name: scripts
  ttlSecondsAfterFinished: 300
