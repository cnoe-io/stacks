apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: caipe-mcp-github
  namespace: argocd
  annotations:
    stacks.io/repo-source: stacks
    argocd.argoproj.io/sync-wave: "50"
  labels:
    app.kubernetes.io/name: caipe-mcp-github
    app.kubernetes.io/part-of: caipe
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/giteaadmin/stacks.git
    targetRevision: HEAD
    path: packages/components/kind-only/manifests/caipe-mcp-github
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-platform-engineering
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
