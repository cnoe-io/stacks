apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  name: crawl4ai-ingestor
  namespace: argocd
spec:
  destination:
    namespace: ai-platform-engineering
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://crawl4ai-ingestor/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
