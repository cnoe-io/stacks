apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    # Deploy before ExternalSecret (-85) to provide dev fallback
    argocd.argoproj.io/sync-wave: "-90"
  name: nocodb-dev-credentials
  namespace: argocd
spec:
  destination:
    namespace: nocodb
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://nocodb-dev-credentials/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Don't use ServerSideApply - let ExternalSecret override this secret
