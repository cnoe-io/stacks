apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton-dashboard
  namespace: argocd
  annotations:
    # Install after Tekton Triggers (14)
    argocd.argoproj.io/sync-wave: "15"
spec:
  project: default
  source:
    repoURL: https://gitea.cnoe.localtest.me:8443/giteaadmin/stacks.git
    targetRevision: HEAD
    path: packages/components/kind-only/manifests/tekton-dashboard/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: tekton-pipelines
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
