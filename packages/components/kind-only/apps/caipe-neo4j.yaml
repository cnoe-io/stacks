apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
  name: caipe-neo4j
  namespace: argocd
spec:
  destination:
    namespace: ai-platform-engineering
    server: https://kubernetes.default.svc
  project: default
  source:
    path: packages/components/kind-only/manifests/caipe-neo4j/manifests
    repoURL: https://gitea.cnoe.localtest.me:8443/giteaadmin/stacks.git
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
