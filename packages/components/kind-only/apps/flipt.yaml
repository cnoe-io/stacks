apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-75"
  name: flipt
  namespace: argocd
spec:
  destination:
    namespace: feature-flags
    server: https://kubernetes.default.svc
  project: default
  source:
    path: packages/components/kind-only/manifests/flipt/manifests
    repoURL: https://gitea.cnoe.localtest.me:8443/giteaadmin/stacks.git
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
