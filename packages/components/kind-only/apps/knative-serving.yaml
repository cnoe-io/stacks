apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    # Install early as other services depend on it
    argocd.argoproj.io/sync-wave: "10"
  name: knative-serving
  namespace: argocd
spec:
  destination:
    namespace: knative-serving
    server: https://kubernetes.default.svc
  project: default
  source:
    path: packages/components/kind-only/manifests/knative-serving/manifests
    repoURL: https://gitea.cnoe.localtest.me:8443/giteaadmin/stacks.git
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
