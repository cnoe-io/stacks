apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    # Install after Dapr (5) and Knative (10)
    argocd.argoproj.io/sync-wave: "15"
  name: openfunction
  namespace: argocd
spec:
  destination:
    namespace: openfunction
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: openfunction
    repoURL: https://openfunction.github.io/charts/
    targetRevision: 0.7.0
    helm:
      values: |
        global:
          Dapr:
            enabled: false    # Already installed via cnoe
          Keda:
            enabled: true     # Required for autoscaling
          Knative:
            enabled: false    # Already installed via kind-only
          TektonPipelines:
            enabled: false    # Using pre-built images
          ShipwrightBuild:
            enabled: false
          Contour:
            enabled: false    # Using Kourier
        revisionController:
          enable: false
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
