apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton-chains
  namespace: argocd
  annotations:
    # Install after Tekton Pipelines (12)
    argocd.argoproj.io/sync-wave: "13"
spec:
  project: default
  source:
    repoURL: https://gitea.cnoe.localtest.me:8443/giteaadmin/stacks.git
    targetRevision: HEAD
    path: packages/components/kind-only/manifests/tekton-chains/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: tekton-chains
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
