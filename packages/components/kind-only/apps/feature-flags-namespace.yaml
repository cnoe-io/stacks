apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-80"
  name: feature-flags-namespace
  namespace: argocd
spec:
  destination:
    namespace: feature-flags
    server: https://kubernetes.default.svc
  project: default
  source:
    path: packages/components/kind-only/manifests/feature-flags-namespace/manifests
    repoURL: https://gitea.cnoe.localtest.me:8443/giteaadmin/stacks.git
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
