apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    stacks.io/repo-source: stacks
    argocd.argoproj.io/sync-wave: "70"
  name: nocodb-connections
  namespace: argocd
spec:
  destination:
    namespace: nocodb
    server: https://kubernetes.default.svc
  project: default
  source:
    path: packages/components/kind-only/manifests/nocodb-connections
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/giteaadmin/stacks.git
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
      limit: 10
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
