apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "65"
  name: open-swe-ingress
  namespace: argocd
spec:
  destination:
    namespace: open-swe
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://open-swe-ingress/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
