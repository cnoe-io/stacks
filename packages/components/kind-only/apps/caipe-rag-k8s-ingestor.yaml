apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  name: caipe-rag-k8s-ingestor
  namespace: argocd
spec:
  destination:
    namespace: ai-platform-engineering
    server: https://kubernetes.default.svc
  project: default
  source:
    path: packages/components/kind-only/manifests/caipe-rag-k8s-ingestor/manifests
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/giteaadmin/stacks.git
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
