apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-90"
  name: azure-workload-identity
  namespace: argocd
spec:
  destination:
    namespace: azure-workload-identity-system
    server: https://kubernetes.default.svc
  project: default
  source:
    path: packages/components/kind-only/manifests/azure-workload-identity/manifests
    repoURL: https://gitea.cnoe.localtest.me:8443/giteaadmin/stacks.git
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
      - ServerSideApply=true
