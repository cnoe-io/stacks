apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: letsencrypt-issuer
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-84"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: cnoe://letsencrypt-issuer/manifests
    targetRevision: HEAD
    path: "."
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
