apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Talos-only applications - production cluster
# Note: These apps are specific to Talos production environment
# gitops manages ingress-nginx for KIND environments, but Talos needs its own
resources:
  # Ingress controller (gitops manages this for KIND)
  - apps/ingress-nginx.yaml

  # Production TLS with Let's Encrypt
  - apps/letsencrypt-issuer.yaml
