apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    stacks.io/repo-source: stacks
    argocd.argoproj.io/sync-wave: "-100"
  name: tailscale-operator
  namespace: argocd
spec:
  destination:
    namespace: tailscale
    server: https://kubernetes.default.svc
  project: default
  source:
    path: packages/components/tailscale-serve/manifests/tailscale-operator
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/giteaadmin/stacks.git
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
