apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
  name: tailscale-subnet-router
  namespace: argocd
spec:
  destination:
    namespace: tailscale
    server: https://kubernetes.default.svc
  project: default
  source:
    path: packages/components/tailscale-serve/manifests/tailscale-subnet-router
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/giteaadmin/stacks.git
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
