apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-55"
  name: keycloak-tailscale-serve
  namespace: argocd
spec:
  destination:
    namespace: tailscale
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://keycloak-tailscale-serve/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
