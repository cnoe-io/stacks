apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-tailscale
  annotations:
    tailscale.com/hostname: "keycloak-ryzen"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
      - keycloak-ryzen
  rules:
    - host: keycloak-ryzen
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
