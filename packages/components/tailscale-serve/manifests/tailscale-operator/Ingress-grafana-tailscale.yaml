apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: observability
  name: grafana-tailscale
  annotations:
    tailscale.com/hostname: "grafana-ryzen"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
      - grafana-ryzen
  rules:
    - host: grafana-ryzen
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
