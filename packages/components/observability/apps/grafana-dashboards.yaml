apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-dashboards
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "65"
spec:
  project: default
  source:
    repoURL: https://gitea.cnoe.localtest.me:8443/giteaadmin/stacks.git
    targetRevision: HEAD
    path: packages/components/observability/manifests/grafana-dashboards/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

