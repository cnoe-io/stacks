apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-65"
  name: arize-phoenix
  namespace: argocd
spec:
  destination:
    namespace: observability
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://arize-phoenix/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
