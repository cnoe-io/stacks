apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-65"
  name: langfuse-postgres
  namespace: argocd
spec:
  destination:
    namespace: observability
    server: https://kubernetes.default.svc
  project: default
  source:
    path: packages/components/observability/manifests/langfuse-postgres/manifests
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/giteaadmin/stacks.git
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
