apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: loki
  name: loki
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - args:
            - -config.file=/etc/loki/config.yaml
            - -target=all
          image: grafana/loki:3.3.0
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 30
          name: loki
          ports:
            - containerPort: 3100
              name: http
            - containerPort: 9096
              name: grpc
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - mountPath: /etc/loki
              name: config
            - mountPath: /data/loki
              name: data
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      volumes:
        - configMap:
            name: loki-config
          name: config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
