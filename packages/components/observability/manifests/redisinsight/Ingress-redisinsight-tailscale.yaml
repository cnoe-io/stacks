apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redisinsight-tailscale
  annotations:
    tailscale.com/hostname: "redisinsight-ryzen"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
      - redisinsight-ryzen
  rules:
    - host: redisinsight-ryzen
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redisinsight
                port:
                  number: 5540
