apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: langfuse-redis
  name: langfuse-redis
  namespace: observability
spec:
  # Scaled to 0 by default - set to 1 when needed
  replicas: 0
  selector:
    matchLabels:
      app: langfuse-redis
  template:
    metadata:
      labels:
        app: langfuse-redis
    spec:
      containers:
        - image: redis:7-alpine
          name: redis
          ports:
            - containerPort: 6379
              name: redis
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
