apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: observability
  name: mimir-tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "60"
    tailscale.com/hostname: "mimir-ryzen"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
      - mimir-ryzen
  rules:
    - host: mimir-ryzen
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mimir
                port:
                  number: 9009
