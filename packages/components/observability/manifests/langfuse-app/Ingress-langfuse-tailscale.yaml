apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: observability
  name: langfuse-tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "60"
    tailscale.com/hostname: "langfuse-ryzen"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
      - langfuse-ryzen
  rules:
    - host: langfuse-ryzen
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: langfuse
                port:
                  number: 3000
