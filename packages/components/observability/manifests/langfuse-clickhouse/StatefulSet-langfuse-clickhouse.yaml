apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: langfuse-clickhouse
  name: langfuse-clickhouse
  namespace: observability
spec:
  # Scaled to 0 by default - set to 1 when needed
  replicas: 0
  selector:
    matchLabels:
      app: langfuse-clickhouse
  serviceName: langfuse-clickhouse
  template:
    metadata:
      labels:
        app: langfuse-clickhouse
    spec:
      containers:
        - env:
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_PASSWORD
              value: clickhouse_langfuse_password
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          image: clickhouse/clickhouse-server:24.8-alpine
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
          name: clickhouse
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: native
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - mountPath: /var/lib/clickhouse
              name: data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
