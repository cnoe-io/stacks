apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: observability
  name: loki-tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "60"
    tailscale.com/hostname: "loki-ryzen"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
      - loki-ryzen
  rules:
    - host: loki-ryzen
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loki
                port:
                  number: 3100
