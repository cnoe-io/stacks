apiVersion: v1
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - access: proxy
      isDefault: true
      jsonData:
        exemplarTraceIdDestinations:
        - datasourceUid: tempo
          name: trace_id
          urlDisplayLabel: View trace in Tempo
        httpMethod: POST
        prometheusType: Mimir
        prometheusVersion: 2.14.0
        timeInterval: 15s
      name: Mimir
      type: prometheus
      uid: mimir
      url: http://mimir:9009/prometheus
    - access: proxy
      isDefault: false
      jsonData:
        derivedFields:
        - datasourceUid: tempo
          matcherRegex: (?:trace_id|traceId|TraceId|traceid)[=:]\s*"?([a-fA-F0-9]{32})"?
          matcherType: regex
          name: TraceID
          url: ${__value.raw}
        maxLines: 1000
      name: Loki
      type: loki
      uid: loki
      url: http://loki:3100
    - access: proxy
      isDefault: false
      jsonData:
        httpMethod: GET
        lokiSearch:
          datasourceUid: loki
        nodeGraph:
          enabled: true
        search:
          hide: false
        serviceMap:
          datasourceUid: mimir
        tracesToLogs:
          datasourceUid: loki
          filterBySpanID: true
          filterByTraceID: true
          mapTagNamesEnabled: true
          mappedTags:
          - key: service.name
            value: service_name
          - key: host.name
            value: host
          spanEndTimeShift: 1h
          spanStartTimeShift: -1h
        tracesToMetrics:
          datasourceUid: mimir
          queries:
          - name: Request rate
            query: sum(rate(traces_spanmetrics_calls_total{$__tags}[5m]))
          - name: Duration (p95)
            query: histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket{$__tags}[5m]))
              by (le))
          spanEndTimeShift: 1h
          spanStartTimeShift: -1h
          tags:
          - key: service.name
            value: service
          - key: host.name
            value: instance
      name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo:3200
  grafana.ini: |
    [analytics]
    check_for_updates = true
    [grafana_net]
    url = https://grafana.net
    [log]
    mode = console
    [paths]
    data = /var/lib/grafana/
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    [server]
    domain = grafana.cnoe.localtest.me
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/version: 12.3.1
    helm.sh/chart: grafana-10.4.3
  name: grafana
  namespace: observability
