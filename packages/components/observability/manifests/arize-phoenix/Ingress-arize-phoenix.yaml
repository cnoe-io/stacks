apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arize-phoenix
  namespace: observability
spec:
  ingressClassName: nginx
  rules:
    - host: phoenix.cnoe.localtest.me
      http:
        paths:
          - backend:
              service:
                name: arize-phoenix
                port:
                  name: http
            path: /
            pathType: Prefix
