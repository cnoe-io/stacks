apiVersion: v1
kind: Service
metadata:
  labels:
    app: arize-phoenix
  name: arize-phoenix
  namespace: observability
spec:
  ports:
    - name: http
      port: 6006
      protocol: TCP
      targetPort: 6006
    - name: otlp-grpc
      port: 4317
      protocol: TCP
      targetPort: 4317
    - name: otlp-http
      port: 4318
      protocol: TCP
      targetPort: 4318
  selector:
    app: arize-phoenix
  type: ClusterIP
