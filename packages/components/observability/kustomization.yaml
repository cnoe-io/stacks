apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Observability stack - monitoring and tracing
resources:
  # Namespace and secrets
  - apps/observability-namespace.yaml
  - apps/observability-secrets.yaml

  # Prometheus CRDs (for ServiceMonitor support)
  - apps/prometheus-crds.yaml

  # LGTM stack - Helm-based
  - apps/loki.yaml
  - apps/tempo.yaml
  - apps/grafana.yaml

  # Mimir for metrics storage
  - apps/lgtm-mimir.yaml

  # OpenTelemetry collector
  - apps/lgtm-otel-collector.yaml

  # Profiling
  - apps/lgtm-pyroscope.yaml

  # Tracing alternative
  - apps/jaeger.yaml

  # Langfuse LLM observability
  - apps/langfuse-app.yaml
  - apps/langfuse-clickhouse.yaml
  - apps/langfuse-minio.yaml
  - apps/langfuse-postgres.yaml
  - apps/langfuse-redis.yaml

  # Redis management UI
  - apps/redisinsight.yaml

  # Arize Phoenix LLM observability
  - apps/arize-phoenix.yaml
