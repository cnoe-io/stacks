apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: azureoauthapps.platform.pittampalli.io
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  group: platform.pittampalli.io
  names:
    kind: AzureOAuthApp
    plural: azureoauthapps
  scope: Namespaced
  defaultCompositionRef:
    name: azureoauthapp.platform.pittampalli.io
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    displayName:
                      type: string
                      default: Workflow Builder
                    redirectUris:
                      type: array
                      minItems: 1
                      items:
                        type: string
                    signInAudience:
                      type: string
                      default: AzureADandPersonalMicrosoftAccount
                      enum:
                        - AzureADMyOrg
                        - AzureADMultipleOrgs
                        - AzureADandPersonalMicrosoftAccount
                        - PersonalMicrosoftAccount
                    secretDisplayName:
                      type: string
                      default: workflow-builder
                    secretValidityDuration:
                      type: string
                      default: 17520h
                    existingAppObjectId:
                      type: string
                      description: Object ID of an existing Azure AD App Registration to adopt instead of creating a new one.
                    requiredResourceAccess:
                      type: array
                      description: "Azure AD API permissions. Defaults to User.Read from Microsoft Graph if not specified."
                      items:
                        type: object
                        properties:
                          resourceAppId:
                            type: string
                          resourceAccess:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                type:
                                  type: string
                                  enum: [Scope, Role]
                                  default: Scope
                              required: [id, type]
                        required: [resourceAppId, resourceAccess]
                    keyVaultSecretPrefix:
                      type: string
                      description: "Prefix for Key Vault secret names when using PushSecret (e.g. MICROSOFT-ONEDRIVE)."
                  required:
                    - redirectUris
            status:
              type: object
              properties:
                clientId:
                  type: string
                objectId:
                  type: string
