apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-external-secrets-access
  annotations:
    argocd.argoproj.io/sync-wave: "15"
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  - apiGroups:
      - external-secrets.io
    resources:
      - externalsecrets
      - externalsecrets/status
      - externalsecrets/finalizers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
