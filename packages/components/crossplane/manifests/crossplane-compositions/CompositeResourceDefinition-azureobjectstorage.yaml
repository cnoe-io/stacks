apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: azureobjectstorages.platform.pittampalli.io
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  group: platform.pittampalli.io
  names:
    kind: AzureObjectStorage
    plural: azureobjectstorages
  scope: Namespaced
  defaultCompositionRef:
    name: azureobjectstorage.platform.pittampalli.io
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    storageAccountName:
                      type: string
                      description: Existing Azure Storage Account name to host blob containers.
                    containerName:
                      type: string
                      description: Azure Blob container name.
                    metadata:
                      type: object
                      additionalProperties:
                        type: string
                  required:
                    - storageAccountName
                    - containerName
            status:
              type: object
              properties:
                storageAccountName:
                  type: string
                containerName:
                  type: string
                containerId:
                  type: string
                resourceManagerId:
                  type: string
