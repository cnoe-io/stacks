apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: objectstorages.platform.pittampalli.io
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  group: platform.pittampalli.io
  names:
    kind: ObjectStorage
    plural: objectstorages
  scope: Namespaced
  defaultCompositionRef:
    name: objectstorage.platform.pittampalli.io
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                compositionRef:
                  type: object
                  properties:
                    name:
                      type: string
                compositionSelector:
                  type: object
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                compositionUpdatePolicy:
                  type: string
                  enum:
                    - Automatic
                    - Manual
                parameters:
                  type: object
                  properties:
                    provider:
                      type: string
                      enum:
                        - native
                        - azure
                      default: native
                    class:
                      type: string
                      enum:
                        - standard
                        - cold
                        - archive
                      default: standard
                    size:
                      type: string
                      enum:
                        - small
                        - medium
                        - large
                      default: medium
                    storageAccountName:
                      type: string
                      description: Existing Azure Storage Account name to host blob containers.
                    containerName:
                      type: string
                      description: Azure Blob container name.
                      default: default
                    data:
                      type: object
                      additionalProperties:
                        type: string
                  required:
                    - provider
            status:
              type: object
              properties:
                configMapName:
                  type: string
                storageAccountName:
                  type: string
                containerName:
                  type: string
                containerId:
                  type: string
                resourceManagerId:
                  type: string
