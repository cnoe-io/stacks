# Dapr Configuration with OTEL Tracing
#
# Provides distributed tracing via OpenTelemetry and mTLS for secure communication.
# Apps should use namePrefix to customize the name (e.g., "ai-chatbot-" -> "ai-chatbot-dapr-config")
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-config
spec:
  tracing:
    samplingRate: "1"
    otel:
      endpointAddress: otel-collector.observability.svc.cluster.local:4317
      isSecure: false
      protocol: grpc
  mtls:
    enabled: true
