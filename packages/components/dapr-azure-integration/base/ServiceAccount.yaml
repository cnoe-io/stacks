# ServiceAccount with Azure Workload Identity
#
# Provides authentication for Azure App Configuration and Key Vault access.
# Apps should use namePrefix to customize the name (e.g., "ai-chatbot-" -> "ai-chatbot-app-service-account")
#
# Azure Workload Identity Requirements:
# - Federated credential must be configured for this service account
# - Identity must have "App Configuration Data Reader" role on Azure App Configuration
# - Identity must have "Key Vault Secrets User" role on Azure Key Vault
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-service-account
  annotations:
    # Azure Workload Identity credentials (shared across apps)
    azure.workload.identity/client-id: "1140d9c2-62f6-4857-94c2-7e0e6c64e562"
    azure.workload.identity/tenant-id: "0c4da9c5-40ea-4e7d-9c7a-e7308d4f8e38"
