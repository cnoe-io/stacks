# Core External Secret
#
# Provides common secrets from Azure Key Vault:
# - AI Provider API Keys (OpenAI, Anthropic, Google)
#
# App-specific secrets (AUTH_SECRET, POSTGRES_URL, etc.)
# should be added via patches or separate ExternalSecrets.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "55"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    name: app-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # AI Provider API Keys
        OPENAI_API_KEY: "{{ .OPENAI_API_KEY }}"
        ANTHROPIC_API_KEY: "{{ .ANTHROPIC_API_KEY }}"
        GOOGLE_API_KEY: "{{ .GOOGLE_API_KEY }}"
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: OPENAI-API-KEY
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: ANTHROPIC-API-KEY
    - secretKey: GOOGLE_API_KEY
      remoteRef:
        key: GEMINI-API-KEY
