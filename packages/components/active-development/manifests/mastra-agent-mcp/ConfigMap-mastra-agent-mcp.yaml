apiVersion: v1
kind: ConfigMap
metadata:
  name: mastra-agent-mcp-config
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: mastra-agent-mcp
data:
  PORT: "3300"
  HOST: "0.0.0.0"
  DAPR_HTTP_PORT: "3500"
  PUBSUB_NAME: "pubsub"
  PUBSUB_TOPIC: "workflow.stream"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_SERVICE_NAME: "mastra-agent-mcp"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=workflow-builder,service.version=1.0.0"
  OTEL_PROPAGATORS: "tracecontext,baggage"
