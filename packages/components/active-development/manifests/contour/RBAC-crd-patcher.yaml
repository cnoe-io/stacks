# RBAC for Gateway API CRD patcher job
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-api-crd-patcher
  namespace: projectcontour
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gateway-api-crd-patcher
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gateway-api-crd-patcher
subjects:
  - kind: ServiceAccount
    name: gateway-api-crd-patcher
    namespace: projectcontour
roleRef:
  kind: ClusterRole
  name: gateway-api-crd-patcher
  apiGroup: rbac.authorization.k8s.io
