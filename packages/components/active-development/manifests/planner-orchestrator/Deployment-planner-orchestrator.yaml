# Planner Orchestrator - Dapr Workflow for AI planning and execution
# Can be invoked as a child workflow from workflow-orchestrator
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planner-orchestrator
  namespace: workflow-builder
  labels:
    app: planner-orchestrator
    app.kubernetes.io/runtime: python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planner-orchestrator
  template:
    metadata:
      labels:
        app: planner-orchestrator
        azure.workload.identity/use: "true"
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "planner-orchestrator"
        dapr.io/app-port: "8080"
        dapr.io/app-protocol: "http"
        dapr.io/config: "workflow-builder-tracing"
        dapr.io/enable-api-logging: "true"
        dapr.io/enable-workflow: "true"
        dapr.io/graceful-shutdown-seconds: "60"
        dapr.io/placement-host-address: "dapr-placement-server.dapr-system.svc.cluster.local:50005"
    spec:
      serviceAccountName: planner-orchestrator
      containers:
        - name: planner-orchestrator
          image: gitea.cnoe.localtest.me:8443/giteaadmin/planner-orchestrator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: planner-orchestrator-config
            - secretRef:
                name: planner-orchestrator-secrets
                optional: true
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
