apiVersion: v1
kind: ConfigMap
metadata:
  name: planner-orchestrator-config
  namespace: workflow-builder
  labels:
    app: planner-orchestrator
data:
  # Server configuration
  PORT: "8080"
  LOG_LEVEL: "INFO"
  # Dapr configuration
  DAPR_HOST: "localhost"
  DAPR_HTTP_PORT: "3500"
  DAPR_GRPC_PORT: "50001"
  # Agent service app IDs (Dapr service invocation)
  PLAN_SERVICE_APP_ID: "planner-sdk-agent"
  EXEC_SERVICE_APP_ID: "planner-sdk-agent"
  # State store name (shared with workflow-orchestrator)
  STATESTORE_NAME: "statestore"
  # Dapr pub/sub component name (must match Component-pubsub.yaml metadata.name)
  PUBSUB_NAME: "pubsub"
  # Topic for workflow events (used by planner completion events)
  WORKFLOW_EVENTS_TOPIC: "workflow.events"
