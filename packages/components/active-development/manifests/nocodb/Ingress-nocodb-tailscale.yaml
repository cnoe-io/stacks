apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: nocodb
  name: nocodb-tailscale
  annotations:
    tailscale.com/hostname: "nocodb-ryzen"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
      - nocodb-ryzen
  rules:
    - host: nocodb-ryzen
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nocodb
                port:
                  number: 8080
