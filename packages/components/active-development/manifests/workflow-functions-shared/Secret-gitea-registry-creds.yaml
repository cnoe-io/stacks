apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitea-registry-creds-external
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: workflow-functions-shared
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: workflow-builder
spec:
  data:
    - remoteRef:
        key: gitea-credential
        property: username
      secretKey: username
    - remoteRef:
        key: gitea-credential
        property: password
      secretKey: password
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: gitea
  target:
    creationPolicy: Owner
    name: gitea-registry-creds
    template:
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "gitea.cnoe.localtest.me": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              },
              "gitea-http.gitea.svc.cluster.local:3000": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
      type: kubernetes.io/dockerconfigjson
