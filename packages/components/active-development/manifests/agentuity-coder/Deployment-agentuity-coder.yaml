apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentuity-coder
  namespace: agentuity-coder
  labels:
    app.kubernetes.io/name: agentuity-coder
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentuity-coder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentuity-coder
    spec:
      initContainers:
        - name: db-migrate
          image: gitea.cnoe.localtest.me/giteaadmin/agentuity-coder:latest
          command: ["bun", "run", "db:migrate"]
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:password@postgresql.agentuity-coder.svc.cluster.local:5432/my_coder_db
      containers:
        - name: agentuity-coder
          image: gitea.cnoe.localtest.me/giteaadmin/agentuity-coder:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: BETTER_AUTH_URL
              value: "https://agentuity-${TAILSCALE_HOST}.${TAILSCALE_TAILNET}"
            - name: DATABASE_URL
              value: postgresql://postgres:password@postgresql.agentuity-coder.svc.cluster.local:5432/my_coder_db
            - name: AGENTUITY_AUTH_SECRET
              value: "dummy-auth-secret-for-local-dev-12345678"
            - name: NODE_ENV
              value: "production"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentuity-coder-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentuity-coder-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: agentuity-coder-secrets
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentuity-coder-secrets
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
