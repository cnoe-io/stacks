apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: vibe-coding-platform-dapr-config
  namespace: vibe-coding-platform
  labels:
    app.kubernetes.io/name: vibe-coding-platform
    app.kubernetes.io/component: dapr-config
spec:
  tracing:
    samplingRate: "1"
    otel:
      endpointAddress: otel-collector.observability.svc.cluster.local:4317
      isSecure: false
      protocol: grpc
  mtls:
    enabled: true
