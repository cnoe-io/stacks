apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  name: vibe-coding-platform
  namespace: vibe-coding-platform
  labels:
    app.kubernetes.io/name: vibe-coding-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vibe-coding-platform
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: vibe-coding-platform
        app.kubernetes.io/name: vibe-coding-platform
      annotations:
        # Dapr sidecar injection for workflow infrastructure
        dapr.io/enabled: "true"
        dapr.io/app-id: "vibe-coding-platform"
        dapr.io/app-port: "3000"
        dapr.io/app-protocol: "http"
        dapr.io/config: "vibe-coding-platform-dapr-config"
        dapr.io/enable-api-logging: "true"
        # Health check - Dapr waits for app to be healthy before starting
        dapr.io/enable-app-health-check: "true"
        dapr.io/app-health-check-path: "/api/health"
    spec:
      serviceAccountName: vibe-coding-platform
      containers:
        - name: vibe-coding-platform
          image: gitea.cnoe.localtest.me:8443/giteaadmin/vibe-coding-platform:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            # Allow self-signed certificates for local K8s ingress
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_PUBLIC_APP_URL
              value: "https://vibe-coding-platform.cnoe.localtest.me:8443"
            # AI Provider API Keys
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vibe-coding-secrets
                  key: ANTHROPIC_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vibe-coding-secrets
                  key: OPENAI_API_KEY
            # Sandbox configuration
            - name: SANDBOX_MODE
              value: "k8s"
            - name: SANDBOX_NAMESPACE
              value: "agent-sandbox"
            - name: SANDBOX_TEMPLATE
              value: "vibe-coding-sandbox"
            - name: SANDBOX_INGRESS_DOMAIN
              value: "sandbox.cnoe.localtest.me"
          envFrom:
            - configMapRef:
                name: vibe-coding-platform-otel-config
            - configMapRef:
                name: vibe-coding-platform-dapr-config
            - configMapRef:
                name: vibe-coding-platform-flipt-config
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
      securityContext:
        fsGroup: 1001
