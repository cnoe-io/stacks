apiVersion: v1
kind: ConfigMap
metadata:
  name: vibe-coding-platform-otel-config
  namespace: vibe-coding-platform
  labels:
    app.kubernetes.io/name: vibe-coding-platform
    app.kubernetes.io/component: observability
data:
  # OTEL Collector endpoint (gRPC)
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"

  # Service identification
  OTEL_SERVICE_NAME: "vibe-coding-platform"

  # Resource attributes for trace correlation
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=vibe-coding-platform,service.version=0.1.0"

  # Enable trace propagation headers
  OTEL_PROPAGATORS: "tracecontext,baggage"

  # Batch configuration for efficient export
  OTEL_BSP_SCHEDULE_DELAY: "5000"
  OTEL_BSP_MAX_EXPORT_BATCH_SIZE: "512"
