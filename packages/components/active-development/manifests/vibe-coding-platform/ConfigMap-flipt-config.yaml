apiVersion: v1
kind: ConfigMap
metadata:
  name: vibe-coding-platform-flipt-config
  namespace: vibe-coding-platform
  labels:
    app.kubernetes.io/name: vibe-coding-platform
    app.kubernetes.io/component: feature-flags
data:
  # Flipt feature flag service configuration
  FLIPT_URL: "http://flipt.feature-flags.svc.cluster.local:8080"
  FLIPT_NAMESPACE: "default"
  FLIPT_ENABLED: "true"
