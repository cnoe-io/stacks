apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "25"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: seed-functions
  namespace: workflow-builder
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: docker.io/library/postgres:15.3-alpine3.18
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: workflow-builder-secrets
                  key: DATABASE_URL
          command:
            - sh
            - -c
            - |
              : "${DATABASE_URL:?DATABASE_URL is required}"
              until pg_isready -d "$DATABASE_URL"; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready"
              # Wait a bit more to ensure schema is ready (after migrations)
              sleep 5
      containers:
        - name: seed-functions
          image: gitea.cnoe.localtest.me/giteaadmin/workflow-builder:git-0aba1e985a2e53c3d099770405b0a4fc27346288
          command:
            - sh
            - -c
            - |
              echo "Seeding functions table..."
              cd /app
              node scripts/seed-functions.bundle.js
              echo "Functions seeded successfully"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: workflow-builder-secrets
                  key: DATABASE_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
