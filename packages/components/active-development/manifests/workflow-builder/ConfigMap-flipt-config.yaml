apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-builder-flipt-config
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: workflow-builder
    app.kubernetes.io/component: feature-flags
data:
  # Flipt feature flag service configuration
  FLIPT_URL: "http://flipt.feature-flags.svc.cluster.local:8080"
  FLIPT_NAMESPACE: "default"
  FLIPT_ENABLED: "true"
