# Kubernetes Secret Store Component
#
# Provides access to Kubernetes secrets for Dapr-enabled services in the
# workflow-builder namespace.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kubernetes-secrets
  namespace: workflow-builder
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  labels:
    app.kubernetes.io/name: kubernetes-secrets
    app.kubernetes.io/component: dapr-secrets
    app.kubernetes.io/part-of: workflow-builder
spec:
  type: secretstores.kubernetes
  version: v1
  metadata: []
scopes:
  - workflow-builder
  - workflow-orchestrator

