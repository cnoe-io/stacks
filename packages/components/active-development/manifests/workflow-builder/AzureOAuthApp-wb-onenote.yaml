apiVersion: platform.pittampalli.io/v1alpha1
kind: AzureOAuthApp
metadata:
  name: wb-onenote
  namespace: workflow-builder
  annotations:
    argocd.argoproj.io/sync-wave: "80"
spec:
  parameters:
    existingAppObjectId: /applications/d8af561a-f6e7-47dd-9aaf-88c27bd7493c
    displayName: Workflow-Microsoft OneNote
    signInAudience: AzureADandPersonalMicrosoftAccount
    redirectUris:
      - https://workflow-builder.cnoe.localtest.me/api/app-connections/oauth2/callback
      - https://workflow-builder.cnoe.localtest.me/redirect
    secretDisplayName: wb-onenote
    secretValidityDuration: 17520h
    keyVaultSecretPrefix: MICROSOFT-ONENOTE
    requiredResourceAccess:
      - resourceAppId: "00000003-0000-0000-c000-000000000000"
        resourceAccess:
          - id: "615e26af-c38a-4150-ae3e-c3b0d4cb1d6a" # Notes.ReadWrite
            type: Scope
          - id: "e1fe6dd8-ba31-4d61-89e7-88639da4683d" # User.Read
            type: Scope
