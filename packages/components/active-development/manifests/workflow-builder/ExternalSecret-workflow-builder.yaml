apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: workflow-builder-secrets
  namespace: workflow-builder
  annotations:
    argocd.argoproj.io/sync-wave: "-60"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    creationPolicy: Owner
    name: workflow-builder-secrets
  data:
    # --- Infrastructure secrets ---
    - secretKey: DATABASE_URL
      remoteRef:
        key: WORKFLOW-BUILDER-DATABASE-URL
    - secretKey: AP_ENCRYPTION_KEY
      remoteRef:
        key: AP-ENCRYPTION-KEY
    - secretKey: INTERNAL_API_TOKEN
      remoteRef:
        key: INTERNAL-API-TOKEN
    - secretKey: JWT_SIGNING_KEY
      remoteRef:
        key: WORKFLOW-BUILDER-JWT-SIGNING-KEY
    - secretKey: AP_JWT_SECRET
      remoteRef:
        key: AP-JWT-SECRET
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: OPENAI-API-KEY
    - secretKey: AI_GATEWAY_API_KEY
      remoteRef:
        key: OPENAI-API-KEY

    # --- Social login (UPPERCASE Key Vault keys) ---
    - secretKey: GITHUB_CLIENT_ID
      remoteRef:
        key: GITHUB-OAUTH-CLIENT-ID
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef:
        key: GITHUB-OAUTH-CLIENT-SECRET
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: GOOGLE-OAUTH-CLIENT-ID
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: GOOGLE-OAUTH-CLIENT-SECRET

    # --- Optional DB seed inputs (GitHub user + user-level webhook API keys) ---
    - secretKey: SEED_GITHUB_USER_EMAIL
      remoteRef:
        key: WORKFLOW-BUILDER-SEED-GITHUB-USER-EMAIL
    - secretKey: SEED_GITHUB_USER_NAME
      remoteRef:
        key: WORKFLOW-BUILDER-SEED-GITHUB-USER-NAME
    - secretKey: SEED_GITHUB_USER_ID
      remoteRef:
        key: WORKFLOW-BUILDER-SEED-GITHUB-USER-ID
    - secretKey: SEED_GITHUB_USER_API_KEY
      remoteRef:
        key: WORKFLOW-BUILDER-SEED-GITHUB-USER-API-KEY
    - secretKey: SEED_GITHUB_USER_API_KEY_NAME
      remoteRef:
        key: WORKFLOW-BUILDER-SEED-GITHUB-USER-API-KEY-NAME

    # --- AP piece OAuth apps ---
    - secretKey: OAUTH_APP_GOOGLE_CLIENT_ID
      remoteRef:
        key: OAUTH-APP-GOOGLE-CLIENT-ID
    - secretKey: OAUTH_APP_GOOGLE_CLIENT_SECRET
      remoteRef:
        key: OAUTH-APP-GOOGLE-CLIENT-SECRET
    - secretKey: OAUTH_APP_GITHUB_CLIENT_ID
      remoteRef:
        key: OAUTH-APP-GITHUB-CLIENT-ID
    - secretKey: OAUTH_APP_GITHUB_CLIENT_SECRET
      remoteRef:
        key: OAUTH-APP-GITHUB-CLIENT-SECRET
    - secretKey: OAUTH_APP_NOTION_CLIENT_ID
      remoteRef:
        key: OAUTH-APP-NOTION-CLIENT-ID
    - secretKey: OAUTH_APP_NOTION_CLIENT_SECRET
      remoteRef:
        key: OAUTH-APP-NOTION-CLIENT-SECRET
    - secretKey: OAUTH_APP_LINKEDIN_CLIENT_ID
      remoteRef:
        key: OAUTH-APP-LINKEDIN-CLIENT-ID
    - secretKey: OAUTH_APP_LINKEDIN_CLIENT_SECRET
      remoteRef:
        key: OAUTH-APP-LINKEDIN-CLIENT-SECRET

    # --- Microsoft OAuth apps ---
    - secretKey: OAUTH_APP_MICROSOFT_TODO_CLIENT_ID
      remoteRef:
        key: OAUTH-APP-MICROSOFT-TODO-CLIENT-ID
    - secretKey: OAUTH_APP_MICROSOFT_TODO_CLIENT_SECRET
      remoteRef:
        key: OAUTH-APP-MICROSOFT-TODO-CLIENT-SECRET
    - secretKey: OAUTH_APP_MICROSOFT_DYNAMICS_365_BC_CLIENT_ID
      remoteRef:
        key: OAUTH-APP-MICROSOFT-DYNAMICS-365-BC-CLIENT-ID
    - secretKey: OAUTH_APP_MICROSOFT_DYNAMICS_365_BC_CLIENT_SECRET
      remoteRef:
        key: OAUTH-APP-MICROSOFT-DYNAMICS-365-BC-CLIENT-SECRET
    - secretKey: OAUTH_APP_MICROSOFT_ONEDRIVE_CLIENT_ID
      remoteRef:
        key: OAUTH-APP-MICROSOFT-ONEDRIVE-CLIENT-ID
    - secretKey: OAUTH_APP_MICROSOFT_ONEDRIVE_CLIENT_SECRET
      remoteRef:
        key: OAUTH-APP-MICROSOFT-ONEDRIVE-CLIENT-SECRET
    - secretKey: OAUTH_APP_MICROSOFT_OUTLOOK_CALENDAR_CLIENT_ID
      remoteRef:
        key: OAUTH-APP-MICROSOFT-OUTLOOK-CALENDAR-CLIENT-ID
    - secretKey: OAUTH_APP_MICROSOFT_OUTLOOK_CALENDAR_CLIENT_SECRET
      remoteRef:
        key: OAUTH-APP-MICROSOFT-OUTLOOK-CALENDAR-CLIENT-SECRET
    - secretKey: OAUTH_APP_MICROSOFT_TEAMS_CLIENT_ID
      remoteRef:
        key: OAUTH-APP-MICROSOFT-TEAMS-CLIENT-ID
    - secretKey: OAUTH_APP_MICROSOFT_TEAMS_CLIENT_SECRET
      remoteRef:
        key: OAUTH-APP-MICROSOFT-TEAMS-CLIENT-SECRET
    - secretKey: OAUTH_APP_MICROSOFT_EXCEL_CLIENT_ID
      remoteRef:
        key: OAUTH-APP-MICROSOFT-EXCEL-CLIENT-ID
    - secretKey: OAUTH_APP_MICROSOFT_EXCEL_CLIENT_SECRET
      remoteRef:
        key: OAUTH-APP-MICROSOFT-EXCEL-CLIENT-SECRET
    - secretKey: OAUTH_APP_MICROSOFT_OUTLOOK_CLIENT_ID
      remoteRef:
        key: OAUTH-APP-MICROSOFT-OUTLOOK-CLIENT-ID
    - secretKey: OAUTH_APP_MICROSOFT_OUTLOOK_CLIENT_SECRET
      remoteRef:
        key: OAUTH-APP-MICROSOFT-OUTLOOK-CLIENT-SECRET
    - secretKey: OAUTH_APP_MICROSOFT_POWER_BI_CLIENT_ID
      remoteRef:
        key: OAUTH-APP-MICROSOFT-POWER-BI-CLIENT-ID
    - secretKey: OAUTH_APP_MICROSOFT_POWER_BI_CLIENT_SECRET
      remoteRef:
        key: OAUTH-APP-MICROSOFT-POWER-BI-CLIENT-SECRET
    - secretKey: OAUTH_APP_MICROSOFT_PLANNER_CLIENT_ID
      remoteRef:
        key: OAUTH-APP-MICROSOFT-PLANNER-CLIENT-ID
    - secretKey: OAUTH_APP_MICROSOFT_PLANNER_CLIENT_SECRET
      remoteRef:
        key: OAUTH-APP-MICROSOFT-PLANNER-CLIENT-SECRET
    - secretKey: OAUTH_APP_MICROSOFT_ONENOTE_CLIENT_ID
      remoteRef:
        key: OAUTH-APP-MICROSOFT-ONENOTE-CLIENT-ID
    - secretKey: OAUTH_APP_MICROSOFT_ONENOTE_CLIENT_SECRET
      remoteRef:
        key: OAUTH-APP-MICROSOFT-ONENOTE-CLIENT-SECRET
    - secretKey: OAUTH_APP_MICROSOFT_SHAREPOINT_CLIENT_ID
      remoteRef:
        key: OAUTH-APP-MICROSOFT-SHAREPOINT-CLIENT-ID
    - secretKey: OAUTH_APP_MICROSOFT_SHAREPOINT_CLIENT_SECRET
      remoteRef:
        key: OAUTH-APP-MICROSOFT-SHAREPOINT-CLIENT-SECRET
    - secretKey: OAUTH_APP_MICROSOFT_PEOPLE_CLIENT_ID
      remoteRef:
        key: OAUTH-APP-MICROSOFT-PEOPLE-CLIENT-ID
    - secretKey: OAUTH_APP_MICROSOFT_PEOPLE_CLIENT_SECRET
      remoteRef:
        key: OAUTH-APP-MICROSOFT-PEOPLE-CLIENT-SECRET
    - secretKey: OAUTH_APP_MICROSOFT_DYNAMICS_CRM_CLIENT_ID
      remoteRef:
        key: OAUTH-APP-MICROSOFT-DYNAMICS-CRM-CLIENT-ID
    - secretKey: OAUTH_APP_MICROSOFT_DYNAMICS_CRM_CLIENT_SECRET
      remoteRef:
        key: OAUTH-APP-MICROSOFT-DYNAMICS-CRM-CLIENT-SECRET
