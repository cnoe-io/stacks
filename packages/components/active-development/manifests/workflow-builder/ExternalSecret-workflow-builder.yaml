apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: workflow-builder-secrets
  namespace: workflow-builder
  annotations:
    argocd.argoproj.io/sync-wave: "-60"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    creationPolicy: Owner
    name: workflow-builder-secrets
  data:
    # --- Infrastructure secrets ---
    - secretKey: DATABASE_URL
      remoteRef:
        key: WORKFLOW-BUILDER-DATABASE-URL
    - secretKey: AP_ENCRYPTION_KEY
      remoteRef:
        key: AP-ENCRYPTION-KEY
    - secretKey: INTERNAL_API_TOKEN
      remoteRef:
        key: INTERNAL-API-TOKEN
    - secretKey: JWT_SIGNING_KEY
      remoteRef:
        key: WORKFLOW-BUILDER-JWT-SIGNING-KEY

    # --- Social login (UPPERCASE Key Vault keys) ---
    - secretKey: GITHUB_CLIENT_ID
      remoteRef:
        key: GITHUB-OAUTH-CLIENT-ID
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef:
        key: GITHUB-OAUTH-CLIENT-SECRET
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: GOOGLE-OAUTH-CLIENT-ID
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: GOOGLE-OAUTH-CLIENT-SECRET

    # --- AP piece OAuth apps ---
    - secretKey: OAUTH_APP_GOOGLE_CLIENT_ID
      remoteRef:
        key: OAUTH-APP-GOOGLE-CLIENT-ID
    - secretKey: OAUTH_APP_GOOGLE_CLIENT_SECRET
      remoteRef:
        key: OAUTH-APP-GOOGLE-CLIENT-SECRET
    - secretKey: OAUTH_APP_MICROSOFT_CLIENT_ID
      remoteRef:
        key: OAUTH-APP-MICROSOFT-CLIENT-ID
    - secretKey: OAUTH_APP_MICROSOFT_CLIENT_SECRET
      remoteRef:
        key: OAUTH-APP-MICROSOFT-CLIENT-SECRET
    - secretKey: OAUTH_APP_LINKEDIN_CLIENT_ID
      remoteRef:
        key: OAUTH-APP-LINKEDIN-CLIENT-ID
    - secretKey: OAUTH_APP_LINKEDIN_CLIENT_SECRET
      remoteRef:
        key: OAUTH-APP-LINKEDIN-CLIENT-SECRET
