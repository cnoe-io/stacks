apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: workflowstatestore
  namespace: workflow-builder
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  labels:
    app.kubernetes.io/name: workflowstatestore
    app.kubernetes.io/component: statestore
    app.kubernetes.io/part-of: workflow-orchestrator
# Scoping: Visible to workflow-orchestrator
scopes:
  - workflow-orchestrator
spec:
  type: state.redis
  version: v1
  metadata:
    # Redis host (using existing dapr-agents-redis instance)
    - name: redisHost
      value: redis-service.dapr-agents.svc.cluster.local:6379

    # No password for internal Redis
    - name: redisPassword
      value: ""

    # Enable transactions for atomic operations
    - name: enableTLS
      value: "false"

    # Key prefix to isolate workflow state from other state stores
    - name: keyPrefix
      value: wfstate

    # Enable actor state store for Dapr workflows (required for workflow state persistence)
    - name: actorStateStore
      value: "true"

    # Connection pool settings
    - name: redisMaxRetries
      value: "3"

    - name: redisMinRetryInterval
      value: 8ms

    - name: redisMaxRetryInterval
      value: 512ms
