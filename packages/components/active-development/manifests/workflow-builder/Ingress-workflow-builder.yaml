apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "65"
    # Keep these values consistent to avoid ingress-nginx generating an invalid
    # nginx.conf (proxy_buffer_size/proxy_buffers vs proxy_busy_buffers_size).
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "128k"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  name: workflow-builder
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: workflow-builder
spec:
  ingressClassName: nginx
  rules:
    - host: workflow-builder.cnoe.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workflow-builder
                port:
                  number: 3000
  tls:
    - hosts:
        - workflow-builder.cnoe.localtest.me
      secretName: nginx-tls
