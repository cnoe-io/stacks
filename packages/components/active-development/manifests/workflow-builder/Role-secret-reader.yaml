# RBAC Role for reading K8s secrets used by Dapr secret store components.
#
# Required by the Dapr "kubernetes-secrets" component to read the
# workflow-builder-secrets secret (contains DATABASE_URL and other runtime secrets).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workflow-builder-secret-reader
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: workflow-builder
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: workflow-builder
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - "workflow-builder-secrets"
      - "github-token"
      - "GITHUB_TOKEN"
      - "github_pat"
      - "github-pat"
    verbs: ["get"]
  - apiGroups: ["platform.pittampalli.io"]
    resources: ["azureoauthapps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workflow-builder-secret-reader
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: workflow-builder
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: workflow-builder
subjects:
  - kind: ServiceAccount
    name: workflow-builder
    namespace: workflow-builder
roleRef:
  kind: Role
  name: workflow-builder-secret-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workflow-orchestrator-secret-reader-v2
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: workflow-orchestrator
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: workflow-builder
subjects:
  - kind: ServiceAccount
    name: workflow-orchestrator
    namespace: workflow-builder
roleRef:
  kind: Role
  name: workflow-builder-secret-reader
  apiGroup: rbac.authorization.k8s.io
