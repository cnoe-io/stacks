apiVersion: v1
kind: ConfigMap
metadata:
  name: db-seed
  namespace: workflow-builder
data:
  seed-admin-user.sql: |
    -- Seed admin user for development
    -- Email: admin@example.com
    -- Password: developer

    -- Insert user (skip if exists)
    INSERT INTO users (id, name, email, email_verified, created_at, updated_at, is_anonymous)
    VALUES (
      'dev-admin-user',
      'admin',
      'admin@example.com',
      true,
      NOW(),
      NOW(),
      false
    )
    ON CONFLICT (id) DO NOTHING;

    -- Insert credential account with password hash
    -- The hash is scrypt format (salt:hash) for password 'developer'
    INSERT INTO accounts (id, account_id, provider_id, user_id, password, created_at, updated_at)
    VALUES (
      'dev-admin-account',
      'admin@example.com',
      'credential',
      'dev-admin-user',
      '20f7cb0dbeeaa69191fd84b4c82ac2cf:556369ebf666fc6a0d66e72a31b8585e6ce67fd21e4d0e953c8c54aa3bc03dce57359c3339a7947f74dde8b552df195325c602a76b6ea17380fb11b47de89945',
      NOW(),
      NOW()
    )
    ON CONFLICT (id) DO UPDATE SET password = EXCLUDED.password;
