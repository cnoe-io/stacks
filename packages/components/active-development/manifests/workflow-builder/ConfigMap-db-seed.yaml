apiVersion: v1
kind: ConfigMap
metadata:
  name: db-seed
  namespace: workflow-builder
data:
  seed-admin-user.sql: |
    -- Seed admin user for development
    -- Email: admin@example.com
    -- Password: developer

    -- Insert user (skip if exists)
    INSERT INTO users (id, name, email, email_verified, created_at, updated_at, is_anonymous)
    VALUES (
      'dev-admin-user',
      'admin',
      'admin@example.com',
      true,
      NOW(),
      NOW(),
      false
    )
    ON CONFLICT (id) DO NOTHING;

    -- Insert credential account with password hash
    -- Generated with: node -e "require('better-auth/crypto').hashPassword('developer').then(console.log)"
    INSERT INTO accounts (id, account_id, provider_id, user_id, password, created_at, updated_at)
    VALUES (
      'dev-admin-account',
      'admin@example.com',
      'credential',
      'dev-admin-user',
      '80623ef74a3d79778ca5bf3c591dfe85:7c5f248409c46b6b7af67da92884d5004f85dcf234dadbf5b209ccc612dfdc649cb0ffdec85d97f89ebc178e6a97751e4efd35e89768ab52e0779478671637eb',
      NOW(),
      NOW()
    )
    ON CONFLICT (id) DO UPDATE SET password = EXCLUDED.password;
