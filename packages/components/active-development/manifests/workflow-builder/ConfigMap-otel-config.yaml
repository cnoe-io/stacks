apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-builder-otel-config
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: workflow-builder
    app.kubernetes.io/component: observability
data:
  # OTEL Collector endpoint (OTLP HTTP/protobuf)
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"

  # Service identification
  OTEL_SERVICE_NAME: "workflow-builder"
  JAEGER_QUERY_SERVICE: "workflow-builder"
  JAEGER_QUERY_URL: "http://jaeger-query.observability.svc.cluster.local:16686"

  # Resource attributes for trace correlation
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=workflow-builder,service.version=1.0.0"

  # Enable trace propagation headers
  OTEL_PROPAGATORS: "tracecontext,baggage"

  # Batch configuration for efficient export
  OTEL_BSP_SCHEDULE_DELAY: "5000"
  OTEL_BSP_MAX_EXPORT_BATCH_SIZE: "512"
