# RBAC Role for MCP server provisioning and discovery.
#
# Grants the workflow-builder ServiceAccount permission to create/read/update
# Deployment/Service resources used by the legacy piece-mcp auto-provisioner,
# and MCPService resources used by Nimble-managed Activepieces MCP servers.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: piece-mcp-provisioner
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: workflow-builder
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: workflow-builder
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete", "patch", "update"]
  - apiGroups: ["mcp.nimbletools.dev"]
    resources: ["mcpservices"]
    verbs: ["get", "list", "create", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: piece-mcp-provisioner-binding
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: workflow-builder
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: workflow-builder
subjects:
  - kind: ServiceAccount
    name: workflow-builder
    namespace: workflow-builder
roleRef:
  kind: Role
  name: piece-mcp-provisioner
  apiGroup: rbac.authorization.k8s.io
