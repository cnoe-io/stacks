apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  name: workflow-builder
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: workflow-builder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workflow-builder
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: workflow-builder
        app.kubernetes.io/name: workflow-builder
        azure.workload.identity/use: "true"
      annotations:
        # Dapr sidecar injection for config/secrets building blocks and tracing
        dapr.io/enabled: "true"
        dapr.io/app-id: "workflow-builder"
        dapr.io/app-port: "3000"
        dapr.io/config: "workflow-builder-tracing"
    spec:
      serviceAccountName: workflow-builder
      containers:
        - name: workflow-builder
          image: gitea.cnoe.localtest.me:8443/giteaadmin/workflow-builder:git-91663d8d30c683fb8f013f46a628761a4a5aa471
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            # Dapr (sidecar runs on localhost)
            - name: DAPR_HOST
              value: "localhost"
            - name: DAPR_HTTP_PORT
              value: "3500"
            # Dapr component names used by lib/dapr/config-provider.ts
            - name: DAPR_CONFIG_STORE
              value: "azureappconfig-workflow-builder"
            - name: CONFIG_LABEL
              value: "workflow-builder"
            - name: DAPR_SECRET_STORE
              value: "kubernetes-secrets"
            - name: DAPR_K8S_SECRET_NAME
              value: "workflow-builder-secrets"
            - name: NEXT_PUBLIC_APP_URL
              value: "https://workflow-builder-ryzen.tail286401.ts.net"
            # Auth providers (public, for client-side detection)
            - name: NEXT_PUBLIC_AUTH_PROVIDERS
              value: "email,github,google"
            # Public client IDs (for client-side OAuth button rendering)
            - name: NEXT_PUBLIC_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: workflow-builder-secrets
                  key: GITHUB_CLIENT_ID
            - name: NEXT_PUBLIC_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: workflow-builder-secrets
                  key: GOOGLE_CLIENT_ID
            # Dapr orchestrator (legacy planner workflows)
            - name: DAPR_ORCHESTRATOR_URL
              value: "http://workflow-orchestrator.workflow-builder.svc.cluster.local:8080"
            # Generic TypeScript workflow orchestrator for visual workflow builder
            - name: GENERIC_ORCHESTRATOR_URL
              value: "http://workflow-orchestrator.workflow-builder.svc.cluster.local:8080"
            - name: WORKFLOW_ORCHESTRATOR_URL
              value: "http://workflow-orchestrator.workflow-builder.svc.cluster.local:8080"
            # Optional: agent model dropdown list for `agent/run` properties pane.
            # If unset, the app uses a small baked-in fallback list.
            - name: AGENT_MODELS_JSON
              value: '["gpt-5.2-codex","gpt-4o-mini","gpt-4o","claude-sonnet-4-5","claude-opus-4-6","openai/gpt-5.1-instant"]'
            - name: MASTRA_AGENT_API_BASE_URL
              value: "http://durable-agent.workflow-builder.svc.cluster.local:8001"
          envFrom:
            - configMapRef:
                name: workflow-builder-otel-config
            - configMapRef:
                name: workflow-builder-flipt-config
            - secretRef:
                name: workflow-builder-secrets
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
      securityContext:
        fsGroup: 1001
