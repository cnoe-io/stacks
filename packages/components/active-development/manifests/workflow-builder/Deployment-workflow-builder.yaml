apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  name: workflow-builder
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: workflow-builder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workflow-builder
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: workflow-builder
        app.kubernetes.io/name: workflow-builder
    spec:
      serviceAccountName: workflow-builder
      containers:
        - name: workflow-builder
          image: gitea.cnoe.localtest.me:8443/giteaadmin/workflow-builder:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_PUBLIC_APP_URL
              value: "https://workflow-builder.cnoe.localtest.me:8443"
            # Auth providers (public, for client-side detection)
            - name: NEXT_PUBLIC_AUTH_PROVIDERS
              value: "email,github,google"
            # Public client IDs (for client-side OAuth button rendering)
            - name: NEXT_PUBLIC_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: workflow-builder-secrets
                  key: GITHUB_CLIENT_ID
            - name: NEXT_PUBLIC_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: workflow-builder-secrets
                  key: GOOGLE_CLIENT_ID
            # Dapr orchestrator (legacy planner workflows)
            - name: DAPR_ORCHESTRATOR_URL
              value: "http://workflow-orchestrator.workflow-builder.svc.cluster.local:8080"
            # Generic TypeScript workflow orchestrator for visual workflow builder
            - name: GENERIC_ORCHESTRATOR_URL
              value: "http://workflow-orchestrator.workflow-builder.svc.cluster.local:8080"
            - name: WORKFLOW_ORCHESTRATOR_URL
              value: "http://workflow-orchestrator.workflow-builder.svc.cluster.local:8080"
          envFrom:
            - configMapRef:
                name: workflow-builder-otel-config
            - configMapRef:
                name: workflow-builder-flipt-config
            - secretRef:
                name: workflow-builder-secrets
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
      securityContext:
        fsGroup: 1001
