apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "65"
  name: workflow-mcp-server
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: workflow-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workflow-mcp-server
  template:
    metadata:
      labels:
        app: workflow-mcp-server
        app.kubernetes.io/name: workflow-mcp-server
    spec:
      containers:
        - name: workflow-mcp-server
          image: gitea.cnoe.localtest.me/giteaadmin/workflow-mcp-server:git-0aba1e985a2e53c3d099770405b0a4fc27346288
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3200
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3200"
            - name: HOST
              value: "0.0.0.0"
            - name: WORKFLOW_ORCHESTRATOR_URL
              value: "http://workflow-orchestrator.workflow-builder.svc.cluster.local:8080"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "workflow-mcp-server"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=workflow-builder,service.version=1.0.0"
            - name: OTEL_PROPAGATORS
              value: "tracecontext,baggage"
          envFrom:
            - secretRef:
                name: workflow-builder-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3200
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3200
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
      securityContext:
        fsGroup: 1001
