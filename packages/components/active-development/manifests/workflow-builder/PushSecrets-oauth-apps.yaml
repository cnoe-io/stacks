# PushSecrets: push clientSecret from Crossplane-managed password secrets to Azure Key Vault.
# Each AzureOAuthApp composition creates a K8s secret named <xr-name>-azuread-password
# containing key "attribute.value" = the OAuth client secret.
# clientId is pushed separately by Job-push-oauth-client-ids.yaml
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: wb-todo-push-to-kv
  namespace: workflow-builder
  annotations:
    argocd.argoproj.io/sync-wave: "85"
spec:
  secretStoreRefs:
    - name: azure-keyvault-store
      kind: ClusterSecretStore
  selector:
    secret:
      name: wb-todo-azuread-password
  data:
    - match:
        secretKey: attribute.value
        remoteRef:
          remoteKey: OAUTH-APP-MICROSOFT-TODO-CLIENT-SECRET
