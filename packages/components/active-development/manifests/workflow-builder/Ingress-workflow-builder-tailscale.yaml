apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workflow-builder-tailscale
  annotations:
    tailscale.com/hostname: "workflow-builder-ryzen"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
      - workflow-builder-ryzen
  rules:
    - host: workflow-builder-ryzen
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workflow-builder
                port:
                  number: 3000
