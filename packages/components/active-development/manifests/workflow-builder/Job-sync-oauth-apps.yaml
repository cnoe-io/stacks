apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "27"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: sync-oauth-apps
  namespace: workflow-builder
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: docker.io/library/postgres:15.3-alpine3.18
          envFrom:
            - secretRef:
                name: workflow-builder-secrets
          command:
            - sh
            - -c
            - |
              : "${DATABASE_URL:?DATABASE_URL is required}"
              until pg_isready -d "$DATABASE_URL"; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready"
              # Wait a bit more to ensure schema is ready (after migrations)
              sleep 5
      containers:
        - name: sync-oauth-apps
          image: gitea.cnoe.localtest.me:8443/giteaadmin/workflow-builder:latest
          command:
            - sh
            - -c
            - |
              echo "Syncing OAuth apps from env vars..."
              node scripts/sync-oauth-apps.bundle.js
              echo "OAuth apps synced successfully"
          envFrom:
            - secretRef:
                name: workflow-builder-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
