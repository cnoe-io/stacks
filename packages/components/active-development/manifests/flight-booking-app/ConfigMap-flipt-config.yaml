apiVersion: v1
kind: ConfigMap
metadata:
  name: flight-booking-app-flipt-config
  namespace: flight-booking-app
  labels:
    app.kubernetes.io/name: flight-booking-app
    app.kubernetes.io/component: feature-flags
data:
  # Flipt feature flag service configuration
  FLIPT_URL: "http://flipt.feature-flags.svc.cluster.local:8080"
  FLIPT_NAMESPACE: "default"
  FLIPT_ENABLED: "true"
