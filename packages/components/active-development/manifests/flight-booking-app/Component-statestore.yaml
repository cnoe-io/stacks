apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-80"
  name: statestore
  namespace: flight-booking-app
  labels:
    app.kubernetes.io/name: statestore
    app.kubernetes.io/component: statestore
    app.kubernetes.io/part-of: flight-booking-app
spec:
  type: state.redis
  version: v1
  metadata:
    # Redis host (using shared dapr-agents Redis instance)
    - name: redisHost
      value: redis-service.dapr-agents.svc.cluster.local:6379

    # No password for internal Redis
    - name: redisPassword
      value: ""

    # TLS disabled for internal communication
    - name: enableTLS
      value: "false"

    # Key prefix to isolate flight-booking-app state
    - name: keyPrefix
      value: flight-booking

    # Enable actor state store for future actor support
    - name: actorStateStore
      value: "true"

    # Connection pool settings
    - name: redisMaxRetries
      value: "3"

    - name: redisMinRetryInterval
      value: 8ms

    - name: redisMaxRetryInterval
      value: 512ms

    # TTL support for automatic cleanup (0 = no TTL)
    - name: ttlInSeconds
      value: "0"
