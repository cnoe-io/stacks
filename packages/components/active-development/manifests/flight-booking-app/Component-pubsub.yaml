apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-80"
  name: pubsub
  namespace: flight-booking-app
  labels:
    app.kubernetes.io/name: pubsub
    app.kubernetes.io/component: pubsub
    app.kubernetes.io/part-of: flight-booking-app
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    # NATS server URL
    - name: natsURL
      value: nats://nats.nats.svc.cluster.local:4222

    # JetStream configuration
    - name: streamName
      value: FLIGHT_BOOKING

    # Durable subscription name for guaranteed delivery
    - name: durableSubscriptionName
      value: flight-booking-consumer

    # Message delivery semantics
    - name: deliverPolicy
      value: all

    # Acknowledge policy
    - name: ackPolicy
      value: explicit

    # Maximum in-flight messages per consumer
    - name: maxInFlight
      value: "100"

    # Acknowledgment wait timeout (30 seconds)
    - name: ackWait
      value: 30s

    # Maximum delivery attempts before message goes to DLQ
    - name: maxDeliver
      value: "3"

    # Flow control for backpressure handling
    - name: flowControl
      value: "true"

    # Heartbeat interval for consumer health
    - name: heartbeat
      value: 5s

    # Request timeout for NATS operations
    - name: requestTimeout
      value: 5s

    # Backoff policy for retries (exponential)
    - name: backOff
      value: 1s,5s,10s

    # Stream configuration
    - name: replicas
      value: "1"

    - name: storage
      value: file

    - name: retention
      value: workqueue

    - name: maxAge
      value: 24h

    - name: maxMsgsPerSubject
      value: "10000"
