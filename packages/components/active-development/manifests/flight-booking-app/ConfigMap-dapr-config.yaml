apiVersion: v1
kind: ConfigMap
metadata:
  name: flight-booking-app-dapr-config
  namespace: flight-booking-app
  labels:
    app.kubernetes.io/name: flight-booking-app
    app.kubernetes.io/component: dapr
data:
  # Dapr Service Configuration
  # Flight Booking App uses Dapr for distributed tracing and state management

  # Enable Dapr integration
  DAPR_ENABLED: "true"

  # Dapr sidecar HTTP port (default: 3500)
  DAPR_HTTP_PORT: "3500"

  # State store and pubsub component names
  DAPR_STATE_STORE: "statestore"
  PUBSUB_NAME: "pubsub"
