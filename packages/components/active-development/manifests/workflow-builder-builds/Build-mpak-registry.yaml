apiVersion: shipwright.io/v1beta1
kind: Build
metadata:
  name: mpak-registry
  namespace: workflow-builder
spec:
  source:
    type: Git
    git:
      url: https://github.com/NimbleBrainInc/mpak.git
      revision: main
    contextDir: .
  strategy:
    name: kaniko-push-insecure
    kind: ClusterBuildStrategy
  paramValues:
    - name: dockerfile
      value: apps/registry/Dockerfile
  output:
    image: gitea.cnoe.localtest.me:8443/giteaadmin/mpak-registry:latest
    pushSecret: gitea-registry-creds
    insecure: true
