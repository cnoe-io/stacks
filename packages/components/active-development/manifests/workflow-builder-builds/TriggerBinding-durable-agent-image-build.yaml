apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: durable-agent-image-build-binding
  namespace: workflow-builder
spec:
  params:
    - name: git_sha
      value: $(body.after)
    - name: image_name
      value: opencode-durable-agent
    - name: pipeline_name
      value: durable-agent-image-build
