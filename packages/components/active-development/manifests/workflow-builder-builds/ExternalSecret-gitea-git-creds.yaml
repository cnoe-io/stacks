apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitea-git-creds
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: workflow-builder-image-builds
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: workflow-builder
spec:
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: gitea
  target:
    creationPolicy: Owner
    name: gitea-git-creds
    template:
      metadata:
        annotations:
          tekton.dev/git-0: http://gitea-http.gitea.svc.cluster.local:3000
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: gitea-credential
        property: username
    - secretKey: password
      remoteRef:
        key: gitea-credential
        property: password
