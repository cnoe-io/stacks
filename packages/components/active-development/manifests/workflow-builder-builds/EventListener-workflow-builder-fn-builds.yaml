apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: workflow-builder-image-builds
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: workflow-builder-image-builds
    app.kubernetes.io/component: trigger
    app.kubernetes.io/part-of: workflow-builder
spec:
  serviceAccountName: workflow-builder-build-trigger
  resources:
    kubernetesResource:
      replicas: 1
      spec:
        template:
          spec:
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
  triggers:
    - name: build-workflow-builder-image
      interceptors:
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                body.ref == 'refs/heads/main' &&
                body.deleted == false &&
                body.after.matches('^[0-9a-f]{40}$') &&
                (
                  !has(body.commits) ||
                  body.commits.size() == 0 ||
                  body.commits.exists(c,
                    (has(c.added) && c.added.exists(f,
                      f == 'Dockerfile' ||
                      f.startsWith('app/') ||
                      f.startsWith('components/') ||
                      f.startsWith('hooks/') ||
                      f.startsWith('lib/') ||
                      f.startsWith('public/') ||
                      f.startsWith('scripts/') ||
                      f == 'package.json' ||
                      f == 'pnpm-lock.yaml' ||
                      f == 'pnpm-workspace.yaml' ||
                      f == 'tsconfig.json' ||
                      f == 'next.config.ts'
                    )) ||
                    (has(c.modified) && c.modified.exists(f,
                      f == 'Dockerfile' ||
                      f.startsWith('app/') ||
                      f.startsWith('components/') ||
                      f.startsWith('hooks/') ||
                      f.startsWith('lib/') ||
                      f.startsWith('public/') ||
                      f.startsWith('scripts/') ||
                      f == 'package.json' ||
                      f == 'pnpm-lock.yaml' ||
                      f == 'pnpm-workspace.yaml' ||
                      f == 'tsconfig.json' ||
                      f == 'next.config.ts'
                    )) ||
                    (has(c.removed) && c.removed.exists(f,
                      f == 'Dockerfile' ||
                      f.startsWith('app/') ||
                      f.startsWith('components/') ||
                      f.startsWith('hooks/') ||
                      f.startsWith('lib/') ||
                      f.startsWith('public/') ||
                      f.startsWith('scripts/') ||
                      f == 'package.json' ||
                      f == 'pnpm-lock.yaml' ||
                      f == 'pnpm-workspace.yaml' ||
                      f == 'tsconfig.json' ||
                      f == 'next.config.ts'
                    ))
                  )
                )
      bindings:
        - ref: workflow-builder-image-build-binding
      template:
        ref: workflow-builder-image-builds

