apiVersion: shipwright.io/v1beta1
kind: Build
metadata:
  name: fn-activepieces
  namespace: workflow-builder
spec:
  source:
    type: Git
    git:
      url: http://my-gitea-http.gitea.svc.cluster.local:3000/giteaAdmin/workflow-builder.git
      revision: main
    contextDir: .
  strategy:
    name: kaniko-push-insecure
    kind: ClusterBuildStrategy
  paramValues:
    - name: dockerfile
      value: services/fn-activepieces/Dockerfile
  output:
    image: gitea.cnoe.localtest.me:8443/giteaadmin/fn-activepieces:latest
    pushSecret: gitea-registry-creds
    insecure: true

