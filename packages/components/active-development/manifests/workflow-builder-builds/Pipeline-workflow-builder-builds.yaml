apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: workflow-builder-builds
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: workflow-builder-builds
    app.kubernetes.io/part-of: workflow-builder
spec:
  description: Build and push workflow-builder runtime images with Kargo-compatible tags.
  params:
    - name: git_url
      type: string
      default: http://my-gitea-http.gitea.svc.cluster.local:3000/giteaAdmin/workflow-builder.git
    - name: git_sha
      type: string
      description: Full 40-character git SHA from push webhook payload.

  tasks:
    - name: compute-tags
      taskSpec:
        params:
          - name: git_sha
            type: string
        results:
          - name: git_tag
            type: string
            description: git-<40sha>
          - name: dev_tag
            type: string
            description: dev-YYYYMMDD-HHMMSS-<shortsha>
        steps:
          - name: compute
            image: bash:5.2
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              GIT_SHA="$(params.git_sha)"
              if [[ ! "${GIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Expected a 40-character lowercase git SHA, got: ${GIT_SHA}" >&2
                exit 1
              fi

              SHORT_SHA="${GIT_SHA:0:8}"
              UTC_TS="$(date -u +%Y%m%d-%H%M%S)"

              printf "git-%s" "${GIT_SHA}" > "$(results.git_tag.path)"
              printf "dev-%s-%s" "${UTC_TS}" "${SHORT_SHA}" > "$(results.dev_tag.path)"
      params:
        - name: git_sha
          value: $(params.git_sha)

    - name: build-workflow-builder
      runAfter: [compute-tags]
      taskRef:
        name: workflow-builder-kaniko-build-push
      params:
        - name: git_url
          value: $(params.git_url)
        - name: git_revision
          value: $(params.git_sha)
        - name: context_dir
          value: .
        - name: dockerfile
          value: Dockerfile
        - name: image
          value: gitea.cnoe.localtest.me:8443/giteaadmin/workflow-builder:$(tasks.compute-tags.results.dev_tag)

    - name: build-workflow-orchestrator
      runAfter: [compute-tags]
      taskRef:
        name: workflow-builder-kaniko-build-push
      params:
        - name: git_url
          value: $(params.git_url)
        - name: git_revision
          value: $(params.git_sha)
        - name: context_dir
          value: services/workflow-orchestrator
        - name: dockerfile
          value: services/workflow-orchestrator/Dockerfile
        - name: image
          value: gitea.cnoe.localtest.me:8443/giteaadmin/workflow-orchestrator:$(tasks.compute-tags.results.dev_tag)

    - name: build-function-router
      runAfter: [compute-tags]
      taskRef:
        name: workflow-builder-kaniko-build-push
      params:
        - name: git_url
          value: $(params.git_url)
        - name: git_revision
          value: $(params.git_sha)
        - name: context_dir
          value: .
        - name: dockerfile
          value: services/function-router/Dockerfile
        - name: image
          value: gitea.cnoe.localtest.me:8443/giteaadmin/function-router:$(tasks.compute-tags.results.dev_tag)

    - name: build-fn-system
      runAfter: [compute-tags]
      taskRef:
        name: workflow-builder-kaniko-build-push
      params:
        - name: git_url
          value: $(params.git_url)
        - name: git_revision
          value: $(params.git_sha)
        - name: context_dir
          value: .
        - name: dockerfile
          value: services/fn-system/Dockerfile
        - name: image
          value: gitea.cnoe.localtest.me:8443/giteaadmin/fn-system:$(tasks.compute-tags.results.git_tag)

    - name: build-mcp-gateway
      runAfter: [compute-tags]
      taskRef:
        name: workflow-builder-kaniko-build-push
      params:
        - name: git_url
          value: $(params.git_url)
        - name: git_revision
          value: $(params.git_sha)
        - name: context_dir
          value: .
        - name: dockerfile
          value: services/mcp-gateway/Dockerfile
        - name: image
          value: gitea.cnoe.localtest.me:8443/giteaadmin/mcp-gateway:$(tasks.compute-tags.results.git_tag)

    - name: build-workflow-mcp-server
      runAfter: [compute-tags]
      taskRef:
        name: workflow-builder-kaniko-build-push
      params:
        - name: git_url
          value: $(params.git_url)
        - name: git_revision
          value: $(params.git_sha)
        - name: context_dir
          value: .
        - name: dockerfile
          value: services/workflow-mcp-server/Dockerfile
        - name: image
          value: gitea.cnoe.localtest.me:8443/giteaadmin/workflow-mcp-server:latest

    - name: build-piece-mcp-server
      runAfter: [compute-tags]
      taskRef:
        name: workflow-builder-kaniko-build-push
      params:
        - name: git_url
          value: $(params.git_url)
        - name: git_revision
          value: $(params.git_sha)
        - name: context_dir
          value: .
        - name: dockerfile
          value: services/piece-mcp-server/Dockerfile
        - name: image
          value: gitea.cnoe.localtest.me:8443/giteaadmin/piece-mcp-server:latest
