apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: durable-agent-image-build
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: workflow-builder-image-builds
    app.kubernetes.io/component: image-build
    app.kubernetes.io/part-of: workflow-builder
spec:
  description: Build and push opencode-durable-agent from workflow-builder monorepo.
  params:
    - name: git_url
      type: string
      default: http://my-gitea-http.gitea.svc.cluster.local:3000/giteaadmin/workflow-builder.git
    - name: git_sha
      type: string
      description: Full 40-character lowercase git SHA.
  tasks:
    - name: build-and-push
      retries: 1
      taskRef:
        name: workflow-builder-image-build-push
      params:
        - name: git_url
          value: $(params.git_url)
        - name: git_revision
          value: $(params.git_sha)
        - name: context_dir
          value: services/durable-agent
        - name: dockerfile
          value: services/durable-agent/Dockerfile
        - name: image
          value: gitea.cnoe.localtest.me:8443/giteaadmin/opencode-durable-agent:git-$(params.git_sha)
  results:
    - name: image_ref
      value: $(tasks.build-and-push.results.image_ref)
    - name: image_digest
      value: $(tasks.build-and-push.results.image_digest)
