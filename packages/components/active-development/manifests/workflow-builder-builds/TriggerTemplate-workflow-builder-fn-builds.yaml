apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: workflow-builder-fn-builds
  namespace: workflow-builder
spec:
  params:
    - name: git_sha
      description: Full git SHA from the webhook payload
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: workflow-builder-builds-
        namespace: workflow-builder
        labels:
          app.kubernetes.io/name: workflow-builder-builds
          app.kubernetes.io/part-of: workflow-builder
      spec:
        pipelineRef:
          name: workflow-builder-builds
        taskRunTemplate:
          serviceAccountName: workflow-builder-build-trigger
        params:
          - name: git_sha
            value: $(tt.params.git_sha)
