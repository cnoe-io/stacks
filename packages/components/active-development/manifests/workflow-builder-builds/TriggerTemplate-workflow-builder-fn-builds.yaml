apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: workflow-builder-fn-builds
  namespace: workflow-builder
spec:
  params:
    - name: git_sha
      description: Full git SHA from the webhook payload
  resourcetemplates:
    - apiVersion: shipwright.io/v1beta1
      kind: BuildRun
      metadata:
        generateName: fn-activepieces-
        namespace: workflow-builder
      spec:
        build:
          name: fn-activepieces
        output:
          image: gitea.cnoe.localtest.me:8443/giteaadmin/fn-activepieces:git-$(tt.params.git_sha)
          pushSecret: gitea-registry-creds
          insecure: true
    - apiVersion: shipwright.io/v1beta1
      kind: BuildRun
      metadata:
        generateName: mcp-gateway-
        namespace: workflow-builder
      spec:
        build:
          name: mcp-gateway
        output:
          image: gitea.cnoe.localtest.me:8443/giteaadmin/mcp-gateway:git-$(tt.params.git_sha)
          pushSecret: gitea-registry-creds
          insecure: true
    - apiVersion: shipwright.io/v1beta1
      kind: BuildRun
      metadata:
        generateName: fn-system-
        namespace: workflow-builder
      spec:
        build:
          name: fn-system
        output:
          image: gitea.cnoe.localtest.me:8443/giteaadmin/fn-system:git-$(tt.params.git_sha)
          pushSecret: gitea-registry-creds
          insecure: true
    - apiVersion: shipwright.io/v1beta1
      kind: BuildRun
      metadata:
        generateName: fn-openai-
        namespace: workflow-builder
      spec:
        build:
          name: fn-openai
        output:
          image: gitea.cnoe.localtest.me:8443/giteaadmin/fn-openai:git-$(tt.params.git_sha)
          pushSecret: gitea-registry-creds
          insecure: true
    - apiVersion: shipwright.io/v1beta1
      kind: BuildRun
      metadata:
        generateName: fn-slack-
        namespace: workflow-builder
      spec:
        build:
          name: fn-slack
        output:
          image: gitea.cnoe.localtest.me:8443/giteaadmin/fn-slack:git-$(tt.params.git_sha)
          pushSecret: gitea-registry-creds
          insecure: true
    - apiVersion: shipwright.io/v1beta1
      kind: BuildRun
      metadata:
        generateName: fn-github-
        namespace: workflow-builder
      spec:
        build:
          name: fn-github
        output:
