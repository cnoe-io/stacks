          app.kubernetes.io/part-of: workflow-builder
          workflow-builder.cnoe.io/image: fn-system
      spec:
        pipelineRef:
          name: fn-system-image-build
        taskRunTemplate:
          serviceAccountName: workflow-builder-build-trigger
        params:
          - name: git_sha
            value: $(tt.params.git_sha)

    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: node-sandbox-image-build-
