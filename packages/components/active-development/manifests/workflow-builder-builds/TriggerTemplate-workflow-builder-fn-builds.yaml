      spec:
        build:
          name: fn-resend
        output:
          image: gitea.cnoe.localtest.me:8443/giteaadmin/fn-resend:git-$(tt.params.git_sha)
          pushSecret: gitea-registry-creds
          insecure: true
    - apiVersion: shipwright.io/v1beta1
      kind: BuildRun
      metadata:
        generateName: fn-stripe-
        namespace: workflow-builder
      spec:
        build:
          name: fn-stripe
        output:
          image: gitea.cnoe.localtest.me:8443/giteaadmin/fn-stripe:git-$(tt.params.git_sha)
          pushSecret: gitea-registry-creds
          insecure: true
    - apiVersion: shipwright.io/v1beta1
      kind: BuildRun
      metadata:
        generateName: fn-linear-
        namespace: workflow-builder
      spec:
        build:
          name: fn-linear
        output:
          image: gitea.cnoe.localtest.me:8443/giteaadmin/fn-linear:git-$(tt.params.git_sha)
