apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: workflow-builder-image-builds
  namespace: workflow-builder
spec:
  params:
    - name: git_sha
      description: Full git SHA from webhook payload.
    - name: image_name
      description: Logical image name used for labels/generateName.
    - name: pipeline_name
      description: Tekton Pipeline resource name to run.
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: $(tt.params.image_name)-image-build-
        namespace: workflow-builder
        labels:
          app.kubernetes.io/name: workflow-builder-image-builds
          app.kubernetes.io/component: pipeline-run
          app.kubernetes.io/part-of: workflow-builder
          workflow-builder.cnoe.io/image: $(tt.params.image_name)
          workflow-builder.cnoe.io/git-sha: $(tt.params.git_sha)
      spec:
        pipelineRef:
          name: $(tt.params.pipeline_name)
        taskRunTemplate:
          serviceAccountName: workflow-builder-build-trigger
        params:
          - name: git_sha
            value: $(tt.params.git_sha)
