apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitea-registry-creds-external
  namespace: stacks-builds
  labels:
    app.kubernetes.io/name: stacks-builds
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: gitea
  target:
    creationPolicy: Owner
    name: gitea-registry-creds
    template:
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "gitea.cnoe.localtest.me": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: username
      remoteRef:
        key: gitea-credential
        property: username
    - secretKey: password
      remoteRef:
        key: gitea-credential
        property: password