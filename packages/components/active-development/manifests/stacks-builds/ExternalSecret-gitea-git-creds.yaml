apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitea-git-creds
  namespace: stacks-builds
  labels:
    app.kubernetes.io/name: stacks-builds
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: gitea
  target:
    creationPolicy: Owner
    name: gitea-git-creds
    template:
      metadata:
        annotations:
          tekton.dev/git-0: http://my-gitea-http.gitea.svc.cluster.local:3000
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: gitea-credential
        property: username
    - secretKey: password
      remoteRef:
        key: gitea-credential
        property: password