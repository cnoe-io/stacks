apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: devcontainer-nodejs-build
  labels:
    app.kubernetes.io/name: stacks-builds
    app.kubernetes.io/component: image-build
spec:
  description: Build and push nodejs-22-devspace from stacks monorepo.
  params:
    - name: git_url
      type: string
      default: http://gitea-http.gitea.svc.cluster.local:3000/giteaadmin/stacks.git
    - name: git_sha
      type: string
      description: Full 40-character lowercase git SHA.
  tasks:
    - name: build-and-push
      retries: 1
      taskRef:
        name: stacks-image-build-push
      params:
        - name: git_url
          value: $(params.git_url)
        - name: git_revision
          value: $(params.git_sha)
        - name: context_dir
          value: devcontainers
        - name: dockerfile
          value: devcontainers/Dockerfile.nodejs-22
        - name: image
          value: gitea.cnoe.localtest.me/giteaadmin/nodejs-22-devspace:latest
  results:
    - name: image_ref
      value: $(tasks.build-and-push.results.image_ref)
    - name: image_digest
      value: $(tasks.build-and-push.results.image_digest)