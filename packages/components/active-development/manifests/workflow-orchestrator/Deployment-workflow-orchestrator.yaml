# Python-based Workflow Orchestrator with native child workflow support
# KEY FEATURE: Multi-app child workflows for planner/* actions
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-orchestrator
  namespace: workflow-builder
  annotations:
    argocd.argoproj.io/sync-wave: "45"
  labels:
    app: workflow-orchestrator
    app.kubernetes.io/runtime: python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workflow-orchestrator
  template:
    metadata:
      labels:
        app: workflow-orchestrator
        azure.workload.identity/use: "true"
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "workflow-orchestrator"
        dapr.io/app-port: "8080"
        dapr.io/app-protocol: "http"
        dapr.io/config: "workflow-builder-tracing"
        dapr.io/enable-api-logging: "true"
        dapr.io/enable-workflow: "true"
        dapr.io/graceful-shutdown-seconds: "60"
        dapr.io/placement-host-address: "dapr-placement-server.dapr-system.svc.cluster.local:50005"
    spec:
      serviceAccountName: workflow-orchestrator
      containers:
        - name: workflow-orchestrator
          # Python orchestrator with native Dapr child workflow support
          image: gitea.cnoe.localtest.me:8443/giteaadmin/workflow-orchestrator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: workflow-orchestrator-config
            - configMapRef:
                name: workflow-orchestrator-otel-config
            - configMapRef:
                name: workflow-orchestrator-dapr-config
            - secretRef:
                name: workflow-orchestrator-secrets
                optional: true
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
