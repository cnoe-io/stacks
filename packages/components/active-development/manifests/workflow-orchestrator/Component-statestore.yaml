apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: workflow-builder
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  labels:
    app.kubernetes.io/name: statestore
    app.kubernetes.io/component: statestore
    app.kubernetes.io/part-of: workflow-orchestrator
# Scoping: Allow workflow-orchestrator
scopes:
  - workflow-orchestrator
spec:
  type: state.redis
  version: v1
  metadata:
    # Redis host (shared in-cluster Redis instance)
    - name: redisHost
      value: redis-service.nextjs.svc.cluster.local:6379
    # No password for internal Redis
    - name: redisPassword
      value: ""
    # Enable transactions for atomic operations
    - name: enableTLS
      value: "false"
    # Key prefix to isolate orchestrator state
    - name: keyPrefix
      value: orchestrator
    # Actor state store disabled - workflowstatestore is used for Dapr workflows
    - name: actorStateStore
      value: "false"
    # Connection pool settings
    - name: redisMaxRetries
      value: "3"
    - name: redisMinRetryInterval
      value: 8ms
    - name: redisMaxRetryInterval
      value: 512ms
