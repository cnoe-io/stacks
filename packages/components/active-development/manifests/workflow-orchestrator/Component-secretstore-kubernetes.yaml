# Kubernetes Secret Store Component
#
# Provides access to Kubernetes secrets for the workflow-orchestrator.
# Used to fetch DATABASE_URL from the workflow-builder-secrets K8s secret
# so the orchestrator can write execution logs directly to PostgreSQL.
#
# This complements the Azure Key Vault secret store (used for API keys like
# openai-api-key, slack-bot-token) by providing access to infrastructure
# secrets that are already available as K8s secrets.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kubernetes-secrets
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: kubernetes-secrets
    app.kubernetes.io/component: dapr-secrets
    app.kubernetes.io/part-of: workflow-builder
spec:
  type: secretstores.kubernetes
  version: v1
  metadata: []
scopes:
  - workflow-orchestrator
