# RBAC Role for reading K8s secrets
#
# Required by the Dapr kubernetes-secrets secret store component.
# Grants the workflow-orchestrator service account permission to read
# the workflow-builder-secrets K8s secret (which contains DATABASE_URL).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workflow-orchestrator-secret-reader
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: workflow-orchestrator
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: workflow-builder
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["workflow-builder-secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workflow-orchestrator-secret-reader
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: workflow-orchestrator
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: workflow-builder
subjects:
- kind: ServiceAccount
  name: workflow-orchestrator
  namespace: workflow-builder
roleRef:
  kind: Role
  name: workflow-orchestrator-secret-reader
  apiGroup: rbac.authorization.k8s.io
