apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: workflow-orchestrator-secrets
  namespace: workflow-builder
spec:
  # Note: workflow-orchestrator uses Dapr statestore (Redis) for workflow state
  # and calls function-router via Dapr for action execution.
  # No direct database or encryption key secrets needed here.
  # Add secrets as needed when orchestrator requires them.
  data: []
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    creationPolicy: Owner
    name: workflow-orchestrator-secrets
