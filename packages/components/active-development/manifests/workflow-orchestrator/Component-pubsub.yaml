apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
  namespace: workflow-builder
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  labels:
    app.kubernetes.io/name: pubsub
    app.kubernetes.io/component: pubsub
    app.kubernetes.io/part-of: workflow-orchestrator
# Scoping: Allow orchestrators, function-router, and agent services for events
scopes:
  - workflow-orchestrator
  - function-router
  - durable-agent
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    # NATS server URL
    - name: natsURL
      value: nats://nats.nats.svc.cluster.local:4222
    # JetStream configuration
    - name: streamName
      value: ORCHESTRATOR
    # Durable subscription name for guaranteed delivery
    - name: durableSubscriptionName
      value: orchestrator-consumer
    # Message delivery semantics
    - name: deliverPolicy
      value: all
    # Acknowledge policy
    - name: ackPolicy
      value: explicit
    # Maximum in-flight messages per consumer
    - name: maxInFlight
      value: "100"
    # Acknowledgment wait timeout (30 seconds)
    - name: ackWait
      value: 30s
    # Maximum delivery attempts
    - name: maxDeliver
      value: "3"
    # Flow control disabled (simplifies setup, not needed for low-volume orchestration events)
    - name: flowControl
      value: "false"
