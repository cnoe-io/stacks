apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-orchestrator-config
  namespace: workflow-builder
data:
  NODE_ENV: "production"
  PORT: "8080"
  LOG_LEVEL: "info"
  # Function router routes to OpenFunctions (fn-openai, fn-slack, etc.)
  FUNCTION_RUNNER_APP_ID: "function-router"
  # Dapr pub/sub component name (must match Component-pubsub.yaml metadata.name)
  PUBSUB_NAME: "pubsub"
  # Planner agent app ID for Dapr service invocation (planner-dapr-agent has /run endpoint)
  PLANNER_APP_ID: "planner-dapr-agent"
