apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-orchestrator-config
  namespace: workflow-builder
data:
  NODE_ENV: "production"
  PORT: "8080"
  LOG_LEVEL: "info"
  # Internal workflow-builder URL used for orchestrator connection token decryption.
  WORKFLOW_BUILDER_URL: "http://workflow-builder.workflow-builder.svc.cluster.local:3000"
  # Function router routes to serverless functions (fn-openai, fn-slack, etc.)
  FUNCTION_RUNNER_APP_ID: "function-router"
  # Dapr pub/sub component name (must match Component-pubsub.yaml metadata.name)
  PUBSUB_NAME: "pubsub"
  # Native parent-child Dapr workflow execution is the default durable path.
  DURABLE_AGENT_ENABLE_NATIVE_CHILD_WORKFLOW: "true"
  DURABLE_AGENT_CHILD_WORKFLOW_RUN_NAME: "durableRunWorkflow"
  DURABLE_AGENT_CHILD_WORKFLOW_PLAN_NAME: "durablePlanWorkflow"
  DURABLE_AGENT_CHILD_WORKFLOW_EXEC_PLAN_NAME: "durableRunWorkflow"
