# Azure Key Vault Secret Store Component
#
# Provides secrets from Azure Key Vault for workflow-builder services.
# Uses Azure Workload Identity for authentication (requires federated credential).
#
# Required Azure setup:
# 1. Federated credential on the managed identity for each scoped service account
# 2. Key Vault access policy granting the managed identity "Get" permission for secrets
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: azure-keyvault
  namespace: workflow-builder
  annotations:
    argocd.argoproj.io/sync-wave: "-90"
  labels:
    app.kubernetes.io/name: azure-keyvault
    app.kubernetes.io/component: dapr-secrets
    app.kubernetes.io/part-of: workflow-builder
spec:
  type: secretstores.azure.keyvault
  version: v1
  metadata:
    # Azure Key Vault name (default keyvault from stacks)
    - name: vaultName
      value: "keyvault-thcmfmoo5oeow"
    # Use Azure Workload Identity for authentication
    # Leave empty to use Workload Identity (requires azure.workload.identity/use label on pod)
    - name: azureClientId
      value: ""
# Scope to workflow-builder app-ids that need secrets
scopes:
  - function-router
  - workflow-orchestrator
  - workflow-builder
  - durable-agent
