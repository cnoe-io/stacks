apiVersion: apps/v1
kind: Deployment
metadata:
  name: fn-activepieces
  namespace: workflow-builder
  labels:
    app: fn-activepieces
    app.kubernetes.io/name: fn-activepieces
    app.kubernetes.io/component: function-executor
    app.kubernetes.io/part-of: workflow-builder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fn-activepieces
  template:
    metadata:
      labels:
        app: fn-activepieces
    spec:
      containers:
        - name: fn-activepieces
          image: gitea.cnoe.localtest.me:8443/giteaadmin/fn-activepieces:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: HOST
              value: "0.0.0.0"
            - name: NODE_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
