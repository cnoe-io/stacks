apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: fn-activepieces
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: fn-activepieces
    app.kubernetes.io/component: knative-service
    app.kubernetes.io/part-of: workflow-builder
  annotations:
    networking.knative.dev/visibility: cluster-local
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      serviceAccountName: workflow-functions
      containers:
        - name: fn-activepieces
          image: gitea.cnoe.localtest.me:8443/giteaadmin/fn-activepieces:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: NODE_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "fn-activepieces"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=workflow-builder,service.version=1.0.0"
            - name: OTEL_PROPAGATORS
              value: "tracecontext,baggage"
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: workflow-builder-secrets
                  key: INTERNAL_API_TOKEN
            - name: WORKFLOW_BUILDER_URL
              value: "http://workflow-builder.workflow-builder.svc.cluster.local:3000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
