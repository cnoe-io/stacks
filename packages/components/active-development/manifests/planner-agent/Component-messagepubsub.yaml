apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: message-pubsub
  namespace: planner-agent
  annotations:
    argocd.argoproj.io/sync-wave: "-80"
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis-service.dapr-agents.svc.cluster.local:6379
    - name: redisPassword
      value: ""
    - name: consumerID
      value: "planner-dapr-agent-group"
    - name: enableTLS
      value: "false"
