# LLM Provider Component (Dapr Conversation API)
#
# Provides LLM access via Dapr Conversation API.
# Uses secretKeyRef to get API key from Azure Key Vault.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: llm-provider
  namespace: planner-agent
  annotations:
    argocd.argoproj.io/sync-wave: "-70"
spec:
  type: conversation.openai
  version: v1
  metadata:
    # API key from Azure Key Vault secret store
    - name: key
      secretKeyRef:
        name: OPENAI-API-KEY
        key: OPENAI-API-KEY
    - name: model
      value: gpt-5.2-codex
auth:
  secretStore: azure-keyvault
# Scope to planner-dapr-agent only
scopes:
  - planner-dapr-agent
