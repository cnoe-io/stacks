apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: ai-chatbot-statestore
  namespace: planner-agent
  annotations:
    argocd.argoproj.io/sync-wave: "-80"
spec:
  type: state.redis
  version: v1
  metadata:
    # Connect to ai-chatbot's Redis for shared workflow index
    - name: redisHost
      value: redis.ai-chatbot.svc.cluster.local:6379
    - name: redisPassword
      value: ""
    # Disable key prefix so keys match what ai-chatbot expects
    - name: keyPrefix
      value: none
scopes:
  - planner-dapr-agent
