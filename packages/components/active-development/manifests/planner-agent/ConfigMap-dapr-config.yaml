apiVersion: v1
kind: ConfigMap
metadata:
  name: planner-agent-dapr-config
  namespace: planner-agent
  labels:
    app.kubernetes.io/name: planner-agent
    app.kubernetes.io/component: dapr
data:
  # Dapr Service Configuration
  # Planner Agent uses Dapr for workflow orchestration and inter-service communication

  # Enable Dapr integration
  DAPR_ENABLED: "true"

  # Dapr sidecar HTTP port (default: 3500)
  DAPR_HTTP_PORT: "3500"

  # Service App IDs for Dapr service invocation
  PLAN_SERVICE_APP_ID: "planner-agent-plan"
  EXEC_SERVICE_APP_ID: "planner-agent-exec"
