apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - Namespace-planner-agent.yaml
  - ConfigMap-planner-agent.yaml
  - ConfigMap-otel-config.yaml
  - ConfigMap-dapr-config.yaml
  - ConfigMap-flipt-config.yaml
  - ExternalSecret-planner-agent.yaml
  - PersistentVolumeClaim-workspace.yaml
  # Dapr Components
  - Component-statestore.yaml
  - Component-pubsub.yaml
  - Component-agentregistrystore.yaml
  - Component-memorystate.yaml
  - Component-messagepubsub.yaml
