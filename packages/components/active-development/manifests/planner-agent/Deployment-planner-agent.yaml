apiVersion: apps/v1
kind: Deployment
metadata:
  name: planner-orchestrator
  namespace: planner-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planner-orchestrator
  template:
    metadata:
      labels:
        app: planner-orchestrator
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "planner-orchestrator"
        dapr.io/app-port: "8080"
        dapr.io/app-protocol: "http"
        dapr.io/enable-api-logging: "true"
    spec:
      containers:
        - name: planner-orchestrator
          image: gitea.cnoe.localtest.me:8443/giteaadmin/planner-orchestrator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: APP_PORT
              value: "8080"
            - name: PLAN_SERVICE_APP_ID
              value: "planner-agent-plan"
            - name: EXEC_SERVICE_APP_ID
              value: "planner-agent-exec"
            # OpenTelemetry observability
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_SERVICE_NAME
              value: planner-orchestrator
          envFrom:
            - configMapRef:
                name: planner-agent-config
            - configMapRef:
                name: planner-agent-otel-config
            - configMapRef:
                name: planner-agent-dapr-config
            - configMapRef:
                name: planner-agent-flipt-config
            - secretRef:
                name: planner-agent-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
