# Azure Key Vault Secret Store Component
#
# Provides secrets from Azure Key Vault for Dapr components.
# Uses Azure Workload Identity for authentication in AKS.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: azure-keyvault
  namespace: planner-agent
  annotations:
    argocd.argoproj.io/sync-wave: "-90"
spec:
  type: secretstores.azure.keyvault
  version: v1
  metadata:
    # Azure Key Vault URL (default keyvault from stacks)
    - name: vaultName
      value: "keyvault-thcmfmoo5oeow"
    # Use Azure Workload Identity for authentication
    # Leave empty to use Workload Identity (recommended for AKS)
    - name: azureClientId
      value: ""
# Scope to planner-dapr-agent only
scopes:
  - planner-dapr-agent
