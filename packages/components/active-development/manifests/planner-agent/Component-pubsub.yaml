apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
  namespace: planner-agent
  annotations:
    argocd.argoproj.io/sync-wave: "-80"
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      # Use the same Redis instance as ai-chatbot for shared topic
      value: redis.ai-chatbot.svc.cluster.local:6379
    - name: redisPassword
      value: ""
    - name: consumerID
      value: "planner-agent-publisher"
