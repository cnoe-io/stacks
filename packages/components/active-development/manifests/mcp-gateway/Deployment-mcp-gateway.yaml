apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  namespace: workflow-builder
  annotations:
    argocd.argoproj.io/sync-wave: "62"
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: workflow-builder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-gateway
        app.kubernetes.io/part-of: workflow-builder
    spec:
      containers:
        - name: mcp-gateway
          image: gitea.cnoe.localtest.me/giteaadmin/mcp-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: WORKFLOW_BUILDER_URL
              value: "http://workflow-builder.workflow-builder.svc.cluster.local:3000"
            - name: MCP_WAIT_TIMEOUT_MS
              value: "300000"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "mcp-gateway"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=workflow-builder,service.version=1.0.0"
            - name: OTEL_PROPAGATORS
              value: "tracecontext,baggage"
          envFrom:
            - secretRef:
                name: workflow-builder-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
