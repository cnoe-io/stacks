apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workflow-builder-mcp-gateway
  namespace: workflow-builder
  annotations:
    argocd.argoproj.io/sync-wave: "65"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Keep these values consistent to avoid ingress-nginx generating an invalid
    # nginx.conf (proxy_buffer_size/proxy_buffers vs proxy_busy_buffers_size).
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "128k"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: workflow-builder.cnoe.localtest.me
      http:
        paths:
          - path: /api/v1/projects/.*/mcp-server/http
            pathType: ImplementationSpecific
            backend:
              service:
                name: mcp-gateway
                port:
                  number: 8080
  tls:
    - hosts:
        - workflow-builder.cnoe.localtest.me
      secretName: nginx-tls
