# Azure App Configuration Component
#
# Provides configuration values from Azure App Configuration for Dapr applications.
# Uses Azure Workload Identity for authentication (requires federated credential).
# Configurations are filtered by label to isolate per-application settings.
#
# Required Azure setup:
# 1. Federated credential on the managed identity for:
#    - Subject: system:serviceaccount:activity-executor:activity-executor
#    - Issuer: <OIDC issuer URL from cluster>
# 2. App Configuration Data Reader role on the managed identity
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: azureappconfig
  namespace: workflow-builder
  annotations:
    argocd.argoproj.io/sync-wave: "-80"
spec:
  type: configuration.azure.appconfig
  version: v1
  metadata:
    # Azure App Configuration endpoint
    - name: host
      value: "https://rg3-app-config.azconfig.io"
    # Use Azure Workload Identity for authentication
    # Leave empty to use Workload Identity (requires azure.workload.identity/use label on pod)
    - name: azureClientId
      value: ""
    # Filter by label to get only activity-executor configurations
    - name: label
      value: "activity-executor"
    # Poll interval for configuration changes (supports dynamic updates)
    - name: subscribePollingInterval
      value: "30s"
# Scope to activity-executor app only
scopes:
  - activity-executor
