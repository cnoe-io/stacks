apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - Namespace-activity-executor.yaml
  - ServiceAccount-activity-executor.yaml
  - ServiceAccount-default.yaml
  - ConfigMap-activity-executor-config.yaml
  - ConfigMap-otel-config.yaml
  - ConfigMap-dapr-config.yaml
  - ConfigMap-flipt-config.yaml
  - ExternalSecret-activity-executor.yaml
  # Dapr Components for Azure integration
  - Component-secretstore-azure-keyvault.yaml
  - Component-azureappconfig.yaml
  # Standard Kubernetes Deployment with Dapr sidecar
  - Deployment-activity-executor.yaml
  - Service-activity-executor.yaml
  # OpenFunction (disabled - dapr-proxy doesn't work with standard HTTP servers)
  # - Function-activity-executor.yaml
