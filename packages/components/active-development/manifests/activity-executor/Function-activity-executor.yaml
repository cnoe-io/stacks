apiVersion: core.openfunction.io/v1beta2
kind: Function
metadata:
  name: activity-executor
  namespace: activity-executor
  labels:
    app.kubernetes.io/name: activity-executor
    app.kubernetes.io/part-of: workflow-builder
spec:
  image: gitea.cnoe.localtest.me:8443/giteaadmin/activity-executor:latest
  serving:
    runtime: knative
    annotations:
      dapr.io/enabled: "true"
      dapr.io/app-id: "activity-executor"
      dapr.io/app-port: "8080"
      dapr.io/app-protocol: "http"
      dapr.io/enable-api-logging: "true"
      dapr.io/log-as-json: "true"
    labels:
      azure.workload.identity/use: "true"
    scaleOptions:
      minReplicas: 1  # Keep at least 1 replica for reliable Dapr service invocation
      maxReplicas: 10
    template:
      containers:
        - name: function
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: activity-executor-config
            - configMapRef:
                name: activity-executor-otel-config
            - configMapRef:
                name: activity-executor-dapr-config
            - configMapRef:
                name: activity-executor-flipt-config
            - secretRef:
                name: activity-executor-secrets
                optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
      serviceAccountName: activity-executor
