apiVersion: v1
kind: ConfigMap
metadata:
  name: activity-executor-config
  namespace: activity-executor
  labels:
    app.kubernetes.io/name: activity-executor
    app.kubernetes.io/component: config
data:
  # Server configuration
  PORT: "8080"
  HOST: "0.0.0.0"
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  # Database connection (shared with workflow-builder)
  DATABASE_URL: "postgresql://postgres:password@postgresql.workflow-builder.svc.cluster.local:5432/workflow_builder"
