apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: activity-executor-secrets
  namespace: activity-executor
spec:
  data:
    # Database connection
    - remoteRef:
        key: WORKFLOW-BUILDER-DATABASE-URL
      secretKey: DATABASE_URL
    # Encryption key for integration credentials
    - remoteRef:
        key: INTEGRATION-ENCRYPTION-KEY
      secretKey: INTEGRATION_ENCRYPTION_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    creationPolicy: Owner
    name: activity-executor-secrets
