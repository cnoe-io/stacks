apiVersion: v1
kind: ConfigMap
metadata:
  name: activity-executor-otel-config
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: activity-executor
    app.kubernetes.io/component: observability
data:
  # OTEL Collector endpoint (gRPC for activity-executor)
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"

  # Service identification
  OTEL_SERVICE_NAME: "activity-executor"

  # Resource attributes for trace correlation
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=activity-executor,service.version=1.0.0"

  # Enable trace propagation headers
  OTEL_PROPAGATORS: "tracecontext,baggage"

  # Batch configuration for efficient export
  OTEL_BSP_SCHEDULE_DELAY: "5000"
  OTEL_BSP_MAX_EXPORT_BATCH_SIZE: "512"
