# Default ServiceAccount with Azure Workload Identity
#
# Required for OpenFunction's Dapr Standalone mode where the proxy deployment
# uses the default service account instead of the custom one.
#
# IMPORTANT: A federated credential must be created in Azure for:
#   Subject: system:serviceaccount:activity-executor:default
#   Issuer: <OIDC issuer URL from cluster>
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: activity-executor
    app.kubernetes.io/component: dapr-proxy
  annotations:
    # Azure Workload Identity for accessing Azure App Configuration and Key Vault
    # Uses the same identity as the activity-executor SA
    azure.workload.identity/client-id: "1140d9c2-62f6-4857-94c2-7e0e6c64e562"
    azure.workload.identity/tenant-id: "0c4da9c5-40ea-4e7d-9c7a-e7308d4f8e38"
