apiVersion: v1
kind: ConfigMap
metadata:
  name: activity-executor-dapr-config
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: activity-executor
    app.kubernetes.io/component: dapr
data:
  # Dapr Service Configuration
  # Activity Executor uses Dapr for workflow activity execution

  # Dapr sidecar HTTP port (default: 3500)
  DAPR_HTTP_PORT: "3500"

  # Enable Dapr service invocation
  USE_DAPR_SERVICE_INVOCATION: "true"
