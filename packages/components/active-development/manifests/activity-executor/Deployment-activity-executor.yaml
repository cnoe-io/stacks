apiVersion: apps/v1
kind: Deployment
metadata:
  name: activity-executor
  namespace: activity-executor
  labels:
    app: activity-executor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: activity-executor
  template:
    metadata:
      labels:
        app: activity-executor
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "activity-executor"
        dapr.io/app-port: "8080"
        dapr.io/app-protocol: "http"
        dapr.io/enable-api-logging: "true"
    spec:
      containers:
        - name: activity-executor
          image: gitea.cnoe.localtest.me:8443/giteaadmin/activity-executor:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: activity-executor-config
            - configMapRef:
                name: activity-executor-otel-config
            - configMapRef:
                name: activity-executor-dapr-config
            - configMapRef:
                name: activity-executor-flipt-config
            - secretRef:
                name: activity-executor-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
