apiVersion: apps/v1
kind: Deployment
metadata:
  name: mastra-agent
  namespace: dapr-agents
  annotations:
    argocd.argoproj.io/sync-wave: "45"
  labels:
    app: mastra-agent
    app.kubernetes.io/runtime: nodejs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mastra-agent
  template:
    metadata:
      labels:
        app: mastra-agent
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "mastra-agent"
        dapr.io/app-port: "8001"
        dapr.io/app-protocol: "http"
        dapr.io/enable-api-logging: "true"
        dapr.io/enable-workflow: "true"
        dapr.io/graceful-shutdown-seconds: "60"
        dapr.io/placement-host-address: "dapr-placement-server.dapr-system.svc.cluster.local:50005"
    spec:
      serviceAccountName: mastra-agent
      containers:
        - name: mastra-agent
          image: gitea.cnoe.localtest.me:8443/giteaadmin/mastra-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: mastra-agent-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dapr-agents-llm-providers
                  key: OPENAI_API_KEY
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
