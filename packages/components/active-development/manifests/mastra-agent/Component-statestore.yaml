apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: mastra-statestore
  namespace: dapr-agents
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  labels:
    app.kubernetes.io/name: mastra-statestore
    app.kubernetes.io/component: statestore
    app.kubernetes.io/part-of: mastra-agent
scopes:
  - mastra-agent
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis-service.dapr-agents.svc.cluster.local:6379
    - name: redisPassword
      value: ""
    - name: enableTLS
      value: "false"
    - name: keyPrefix
      value: mastra
    - name: actorStateStore
      value: "false"
