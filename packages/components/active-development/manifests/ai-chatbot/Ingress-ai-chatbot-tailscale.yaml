apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-chatbot-tailscale
  annotations:
    tailscale.com/hostname: "ai-chatbot-ryzen"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
      - ai-chatbot-ryzen
  rules:
    - host: ai-chatbot-ryzen
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-chatbot
                port:
                  number: 3000
