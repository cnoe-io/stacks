apiVersion: v1
kind: ConfigMap
metadata:
  name: planner-dapr-agent-config
  namespace: ai-chatbot
data:
  # Dapr component names (use ai-chatbot's shared components)
  DAPR_STATESTORE: "statestore"
  DAPR_PUBSUB: "pubsub"
  DAPR_WORKFLOW_ACTOR_TYPE: "planner-workflow"
  # Workflow configuration
  MAX_WORKFLOW_TURNS: "50"
  DEFAULT_MODEL: "gpt-4o-mini"
  # GitHub token will come from Azure Key Vault via Dapr secretstore
