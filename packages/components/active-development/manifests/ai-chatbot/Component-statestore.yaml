apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: ai-chatbot
  annotations:
    argocd.argoproj.io/sync-wave: "-80"
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis.ai-chatbot.svc.cluster.local:6379
    - name: redisPassword
      value: ""
    - name: actorStateStore
      value: "true"
    # Disable key prefix so keys are stored without app-id prefix
    # Required for cross-app workflow index sharing with planner-dapr-agent
    - name: keyPrefix
      value: "none"
