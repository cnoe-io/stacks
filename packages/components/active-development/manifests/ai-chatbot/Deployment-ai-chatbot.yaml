apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  name: ai-chatbot
  namespace: ai-chatbot
  labels:
    app.kubernetes.io/name: ai-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-chatbot
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ai-chatbot
        app.kubernetes.io/name: ai-chatbot
        azure.workload.identity/use: "true"
      annotations:
        # Dapr sidecar injection for distributed tracing
        dapr.io/enabled: "true"
        dapr.io/app-id: "ai-chatbot"
        dapr.io/app-port: "3000"
        dapr.io/config: "ai-chatbot-dapr-config"
        dapr.io/enable-app-health-check: "true"
        dapr.io/app-health-check-path: "/api/health"
    spec:
      serviceAccountName: ai-chatbot
      initContainers:
        - name: db-migrate
          image: gitea.cnoe.localtest.me:8443/giteaadmin/ai-chatbot:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              echo "Running database migrations..."
              node lib/db/migrate.bundle.js
              echo "Migrations complete"
          env:
            - name: NODE_ENV
              value: production
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
          envFrom:
            - secretRef:
                name: ai-chatbot-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
      containers:
        - name: ai-chatbot
          image: gitea.cnoe.localtest.me:8443/giteaadmin/ai-chatbot:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            # Allow self-signed certificates for local K8s ingress
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: UPLOAD_DIR
              value: "/app/uploads"
            - name: NEXT_PUBLIC_APP_URL
              value: "https://ai-chatbot.cnoe.localtest.me:8443"
            # NextAuth configuration - trust the proxy/ingress host
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: AUTH_URL
              value: "https://ai-chatbot.cnoe.localtest.me:8443"
            # OpenTelemetry - environment-specific override
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=production,service.namespace=ai-chatbot,service.version=1.0.0"
            # Sandbox configuration for agent execution
            - name: SANDBOX_MODE
              value: "k8s"
            - name: SANDBOX_NAMESPACE
              value: "agent-sandbox"
            # Workflow configuration (now internal to ai-chatbot)
            - name: DAPR_STATE_STORE
              value: "statestore"
            - name: PUBSUB_NAME
              value: "pubsub"
            - name: WORKING_DIRECTORY
              value: "/workspace"
            # Workflow orchestrator service configuration
            - name: WORKFLOW_SERVICE_URL
              value: "http://workflow-orchestrator.workflow-builder.svc.cluster.local:8080"
            - name: WORKFLOW_PATTERNS_ENABLED
              value: "true"
            - name: CLAUDE_MODEL
              value: "claude-sonnet-4-20250514"
            - name: EXECUTION_TIMEOUT
              value: "300000"
            - name: USE_BUILT_IN_AGENTS
              value: "true"
            # Redis configuration (local ai-chatbot instance)
            - name: REDIS_HOST
              value: "redis.ai-chatbot.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            # Dapr Workflow configuration for Ralph Loop
            - name: DAPR_WORKFLOW_ENABLED
              value: "true"
            - name: DAPR_WORKFLOW_STATE_STORE
              value: "statestore"
            # Workflow state key for reading workflow state
            - name: WORKFLOW_STATE_KEY
              value: "workflow-llm||llm.orchestrator:LLMOrchestrator:workflow_state"
            # Redis for workflow state (dapr-agents instance)
            - name: WORKFLOW_REDIS_HOST
              value: "redis-service.dapr-agents.svc.cluster.local"
            - name: WORKFLOW_REDIS_PORT
              value: "6379"
            # GitHub App OAuth configuration (for coding agent)
            # Note: NEXT_PUBLIC_GITHUB_APP_CLIENT_ID must also be set at build time via Docker ARG
            - name: NEXT_PUBLIC_GITHUB_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ai-chatbot-github
                  key: GITHUB_APP_CLIENT_ID
                  optional: true
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ai-chatbot-github
                  key: GITHUB_APP_CLIENT_ID
                  optional: true
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-chatbot-github
                  key: GITHUB_APP_CLIENT_SECRET
                  optional: true
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: ai-chatbot-github
                  key: GITHUB_APP_ID
                  optional: true
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-chatbot-github
                  key: GITHUB_APP_PRIVATE_KEY
                  optional: true
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-chatbot-github
                  key: GITHUB_WEBHOOK_SECRET
                  optional: true
          envFrom:
            - configMapRef:
                name: ai-chatbot-otel-config
            - configMapRef:
                name: ai-chatbot-dapr-config
            - configMapRef:
                name: ai-chatbot-flipt-config
            - secretRef:
                name: ai-chatbot-secrets
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: workspace
              mountPath: /workspace
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
      volumes:
        - name: uploads
          emptyDir: {}
        - name: workspace
          emptyDir: {}
      securityContext:
        fsGroup: 1001
