apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-chatbot-otel-config
  namespace: ai-chatbot
  labels:
    app.kubernetes.io/name: ai-chatbot
    app.kubernetes.io/component: observability
data:
  # OTEL Collector endpoint (HTTP/protobuf)
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"

  # Service identification
  OTEL_SERVICE_NAME: "ai-chatbot"

  # Resource attributes for trace correlation
  # Note: deployment.environment is overridden per-environment
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=ai-chatbot,service.version=1.0.0"

  # Enable trace propagation headers
  OTEL_PROPAGATORS: "tracecontext,baggage"

  # Batch configuration for efficient export
  OTEL_BSP_SCHEDULE_DELAY: "5000"
  OTEL_BSP_MAX_EXPORT_BATCH_SIZE: "512"

  # Client-side OTEL configuration (for browser SDK)
  # Browser sends to /api/otel which proxies to collector
  NEXT_PUBLIC_OTEL_ENABLED: "true"
  NEXT_PUBLIC_OTEL_SERVICE_NAME: "ai-chatbot-browser"
