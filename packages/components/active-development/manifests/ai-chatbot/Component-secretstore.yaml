# Kubernetes Secret Store Component
#
# Reads secrets from Kubernetes secrets via Dapr Secrets API.
#
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
  namespace: ai-chatbot
  annotations:
    argocd.argoproj.io/sync-wave: "-80"
  labels:
    app.kubernetes.io/name: ai-chatbot
    app.kubernetes.io/component: dapr-secrets
spec:
  type: secretstores.kubernetes
  version: v1
  metadata: []
# Scope to ai-chatbot apps
scopes:
  - ai-chatbot
