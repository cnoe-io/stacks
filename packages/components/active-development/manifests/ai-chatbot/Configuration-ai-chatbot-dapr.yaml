apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: ai-chatbot-dapr-config
  namespace: ai-chatbot
  labels:
    app.kubernetes.io/name: ai-chatbot
    app.kubernetes.io/component: dapr-config
spec:
  tracing:
    samplingRate: "1"
    otel:
      endpointAddress: otel-collector.observability.svc.cluster.local:4317
      isSecure: false
      protocol: grpc
  mtls:
    enabled: true
