apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: ai-platform-engineering
  name: caipe-tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "60"
    tailscale.com/hostname: "caipe-ryzen"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
      - caipe-ryzen
  rules:
    - host: caipe-ryzen
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: supervisor
                port:
                  number: 8000
