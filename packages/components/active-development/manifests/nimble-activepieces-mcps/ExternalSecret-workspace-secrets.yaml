apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: workspace-secrets
  namespace: workflow-builder
  annotations:
    argocd.argoproj.io/sync-wave: "-59"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    creationPolicy: Owner
    name: workspace-secrets
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: WORKFLOW-BUILDER-DATABASE-URL
    - secretKey: INTERNAL_API_TOKEN
      remoteRef:
        key: INTERNAL-API-TOKEN
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: OPENAI-API-KEY
    - secretKey: OAUTH_APP_GITHUB_CLIENT_ID
      remoteRef:
        key: OAUTH-APP-GITHUB-CLIENT-ID
    - secretKey: OAUTH_APP_GITHUB_CLIENT_SECRET
      remoteRef:
        key: OAUTH-APP-GITHUB-CLIENT-SECRET
    - secretKey: OAUTH_APP_GOOGLE_CLIENT_ID
      remoteRef:
        key: OAUTH-APP-GOOGLE-CLIENT-ID
    - secretKey: OAUTH_APP_GOOGLE_CLIENT_SECRET
      remoteRef:
        key: OAUTH-APP-GOOGLE-CLIENT-SECRET
