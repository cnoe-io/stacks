apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: activepieces-mcp-reconciler
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: activepieces-mcp-reconciler
    app.kubernetes.io/component: reconciler
    app.kubernetes.io/part-of: workflow-builder
rules:
  - apiGroups: ["mcp.nimbletools.dev"]
    resources: ["mcpservices"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: activepieces-mcp-reconciler
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: activepieces-mcp-reconciler
    app.kubernetes.io/component: reconciler
    app.kubernetes.io/part-of: workflow-builder
subjects:
  - kind: ServiceAccount
    name: activepieces-mcp-reconciler
    namespace: workflow-builder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: activepieces-mcp-reconciler
