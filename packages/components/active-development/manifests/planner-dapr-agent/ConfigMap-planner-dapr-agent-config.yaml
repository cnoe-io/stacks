# Configuration for planner-dapr-agent (OpenAI Agents SDK)
apiVersion: v1
kind: ConfigMap
metadata:
  name: planner-dapr-agent-config
  namespace: workflow-builder
  labels:
    app: planner-dapr-agent
data:
  # Working directory for planning operations
  PLANNER_CWD: "/app/workspace"
  # LLM model to use (OpenAI Agents SDK)
  OPENAI_MODEL: "gpt-4o"
  # Dapr configuration
  DAPR_HTTP_PORT: "3500"
  DAPR_GRPC_PORT: "50001"
  DAPR_SECRET_STORE: "azure-keyvault"
  # Logging
  LOG_LEVEL: "INFO"
  PYTHONUNBUFFERED: "1"
