# Dapr Configuration for planner-dapr-agent
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: planner-dapr-agent-config
  namespace: workflow-builder
spec:
  # Enable distributed tracing
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: "http://jaeger-collector.observability.svc.cluster.local:9411/api/v2/spans"
  # Enable mTLS
  mtls:
    enabled: true
    workloadCertTTL: "24h"
    allowedClockSkew: "15m"
  # API access control
  accessControl:
    defaultAction: deny
    trustDomain: "public"
    policies:
      - appId: workflow-orchestrator
        defaultAction: allow
        trustDomain: "public"
        namespace: "workflow-builder"
      - appId: workflow-builder
        defaultAction: allow
        trustDomain: "public"
        namespace: "workflow-builder"
      - appId: ai-chatbot
        defaultAction: allow
        trustDomain: "public"
        namespace: "ai-chatbot"
