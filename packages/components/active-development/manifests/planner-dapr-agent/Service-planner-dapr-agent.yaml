# Service for planner-dapr-agent
apiVersion: v1
kind: Service
metadata:
  name: planner-dapr-agent
  namespace: workflow-builder
  labels:
    app: planner-dapr-agent
spec:
  type: ClusterIP
  selector:
    app: planner-dapr-agent
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
