apiVersion: v1
kind: ConfigMap
metadata:
  name: function-runner-dapr-config
  namespace: function-runner
  labels:
    app.kubernetes.io/name: function-runner
    app.kubernetes.io/component: dapr
data:
  # Dapr Service Configuration
  # Function Runner uses Dapr for secrets and workflow activity execution

  # Dapr sidecar HTTP port (default: 3500)
  DAPR_HTTP_PORT: "3500"
  DAPR_HOST: "localhost"

  # Dapr Secrets Store
  DAPR_SECRETS_STORE: "azure-keyvault"
  SECRETS_FALLBACK_DB: "true"
  DAPR_SECRETS_ENABLED: "true"
