# Azure Key Vault Secret Store Component
#
# Provides secrets from Azure Key Vault for Dapr applications.
# Uses Azure Workload Identity for authentication (requires federated credential).
#
# Required Azure setup:
# 1. Federated credential on the managed identity for:
#    - Subject: system:serviceaccount:function-runner:function-runner
#    - Issuer: <OIDC issuer URL from cluster>
# 2. Key Vault access policy granting the managed identity "Get" permission for secrets
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: azure-keyvault
  namespace: workflow-builder
  annotations:
    argocd.argoproj.io/sync-wave: "-90"
spec:
  type: secretstores.azure.keyvault
  version: v1
  metadata:
    # Azure Key Vault name (default keyvault from stacks)
    - name: vaultName
      value: "keyvault-thcmfmoo5oeow"
    # Use Azure Workload Identity for authentication
    # Client ID from the federated managed identity
    - name: azureClientId
      value: "1140d9c2-62f6-4857-94c2-7e0e6c64e562"
# Scope to Dapr apps that need Key Vault secrets
scopes:
  - activity-executor
  - function-runner
  - workflow-orchestrator
