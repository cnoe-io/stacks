apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-inspector-proxy-tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "60"
    tailscale.com/hostname: "mcp-inspector-proxy-ryzen"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
      - mcp-inspector-proxy-ryzen
  rules:
    - host: mcp-inspector-proxy-ryzen
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-inspector-proxy
                port:
                  number: 6277
