apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-inspector-client-tailscale
  labels:
    tailscale.com/proxy-class: development
  annotations:
    argocd.argoproj.io/sync-wave: "60"
    tailscale.com/hostname: "mcp-inspector-client-ryzen"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
      - mcp-inspector-client-ryzen
  rules:
    - host: mcp-inspector-client-ryzen
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-inspector-client
                port:
                  number: 6274
