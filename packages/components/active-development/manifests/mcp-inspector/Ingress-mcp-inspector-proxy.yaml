apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-inspector-proxy
  namespace: workflow-builder
  annotations:
    argocd.argoproj.io/sync-wave: "65"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: mcp-inspector.cnoe.localtest.me
      http:
        paths:
          - path: /sse
            pathType: Prefix
            backend:
              service:
                name: mcp-inspector-proxy
                port:
                  number: 6277
          - path: /message
            pathType: Prefix
            backend:
              service:
                name: mcp-inspector-proxy
                port:
                  number: 6277
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: mcp-inspector-proxy
                port:
                  number: 6277
          - path: /stdio
            pathType: Prefix
            backend:
              service:
                name: mcp-inspector-proxy
                port:
                  number: 6277
          - path: /config
            pathType: Prefix
            backend:
              service:
                name: mcp-inspector-proxy
                port:
                  number: 6277
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: mcp-inspector-proxy
                port:
                  number: 6277
          - path: /sandbox
            pathType: Prefix
            backend:
              service:
                name: mcp-inspector-proxy
                port:
                  number: 6277
  tls:
    - hosts:
        - mcp-inspector.cnoe.localtest.me
      secretName: nginx-tls
