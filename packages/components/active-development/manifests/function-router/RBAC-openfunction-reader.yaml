# RBAC for function-router to query OpenFunction CRDs and Services
# Required for dynamic URL resolution to Knative services
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: function-router-openfunction-reader
rules:
  # Read OpenFunction Function CRDs
  - apiGroups: ["core.openfunction.io"]
    resources: ["functions"]
    verbs: ["get", "list"]
  # Read OpenFunction Serving CRDs
  - apiGroups: ["core.openfunction.io"]
    resources: ["servings"]
    verbs: ["get", "list"]
  # Read Services (to find Knative services by label)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: function-router-openfunction-reader
subjects:
  - kind: ServiceAccount
    name: function-router
    namespace: workflow-builder
roleRef:
  kind: ClusterRole
  name: function-router-openfunction-reader
  apiGroup: rbac.authorization.k8s.io
