apiVersion: v1
kind: ConfigMap
metadata:
  name: function-registry
  namespace: workflow-builder
data:
  # Function slug → target service mapping
  # type: "knative" = direct HTTP call to service (internal DNS name)
  #
  # Routing:
  #   system/*   → fn-system (http-request, database-query, condition)
  #   mastra/*   → durable-agent (clone, plan, execute, workspace tools)
  #   durable/*  → durable-agent (durable agent runs)
  #   *          → fn-activepieces (all AP piece actions: openai, slack, github, etc.)
  functions.json: |
    {
      "system/*": { "appId": "fn-system", "type": "knative" },
      "mastra/*": { "appId": "durable-agent", "type": "knative" },
      "durable/*": { "appId": "durable-agent", "type": "knative" },
      "_default": { "appId": "fn-activepieces", "type": "knative" }
    }
