apiVersion: v1
kind: ConfigMap
metadata:
  name: function-router-config
  namespace: workflow-builder
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "8080"
  HOST: "0.0.0.0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_SERVICE_NAME: "function-router"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=workflow-builder,service.version=1.0.0"
  OTEL_PROPAGATORS: "tracecontext,baggage"
  REGISTRY_FILE_PATH: "/config/functions.json"
  WORKFLOW_BUILDER_URL: "http://workflow-builder.workflow-builder.svc.cluster.local:3000"
  AP_API_URL: "http://activepieces.activepieces.svc.cluster.local:80"
  DURABLE_AGENT_URL: "http://durable-agent.workflow-builder.svc.cluster.local:8001"
  HTTP_TIMEOUT_MS: "180000"
