apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-web-dapr-config
  namespace: workflow-web
  labels:
    app.kubernetes.io/name: workflow-web
    app.kubernetes.io/component: dapr
data:
  # Dapr Service Configuration
  # Workflow Web uses Dapr for accessing workflow state store

  # Enable Dapr integration
  DAPR_ENABLED: "true"

  # Dapr sidecar HTTP port (default: 3500)
  DAPR_HTTP_PORT: "3500"

  # State store and pubsub component names
  DAPR_STATE_STORE: "workflow-statestore"
  DAPR_PUBSUB: "workflow-pubsub"

  # Number of attempts to wait for Dapr sidecar
  DAPR_SIDECAR_WAIT_ATTEMPTS: "180"
