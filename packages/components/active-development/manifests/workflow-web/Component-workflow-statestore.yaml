apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: workflow-statestore
  namespace: workflow-web
  labels:
    app.kubernetes.io/name: workflow-statestore
    app.kubernetes.io/component: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    # Redis host (shared with dapr-agents namespace)
    - name: redisHost
      value: redis-service.dapr-agents.svc.cluster.local:6379
    - name: redisPassword
      value: ""
    - name: enableTLS
      value: "false"
    # Same key prefix to read workflow state
    - name: keyPrefix
      value: workflow
    - name: actorStateStore
      value: "true"
    - name: redisMaxRetries
      value: "3"
    - name: redisMinRetryInterval
      value: 8ms
    - name: redisMaxRetryInterval
      value: 512ms
    - name: ttlInSeconds
      value: "0"
