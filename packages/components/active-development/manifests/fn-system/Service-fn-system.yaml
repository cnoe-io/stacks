apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: fn-system
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: fn-system
    app.kubernetes.io/component: knative-service
    app.kubernetes.io/part-of: workflow-builder
    workflow-builder.io/plugin: system
  annotations:
    networking.knative.dev/visibility: cluster-local
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      serviceAccountName: workflow-functions
      containers:
        - name: function
          image: gitea.cnoe.localtest.me:8443/giteaadmin/fn-system:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "fn-system"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=workflow-builder,service.version=1.0.0"
            - name: OTEL_PROPAGATORS
              value: "tracecontext,baggage"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
