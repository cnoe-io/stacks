apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: fn-firecrawl
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: fn-firecrawl
    app.kubernetes.io/component: knative-service
    app.kubernetes.io/part-of: workflow-builder
    workflow-builder.io/plugin: firecrawl
  annotations:
    networking.knative.dev/visibility: cluster-local
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      serviceAccountName: workflow-functions
      containers:
        - name: function
          image: gitea.cnoe.localtest.me:8443/giteaadmin/fn-firecrawl:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
