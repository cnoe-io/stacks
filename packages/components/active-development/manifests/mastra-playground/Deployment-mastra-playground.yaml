apiVersion: apps/v1
kind: Deployment
metadata:
  name: mastra-playground
  namespace: workflow-builder
  annotations:
    argocd.argoproj.io/sync-wave: "45"
  labels:
    app.kubernetes.io/name: mastra-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mastra-playground
  template:
    metadata:
      labels:
        app: mastra-playground
        app.kubernetes.io/name: mastra-playground
    spec:
      containers:
        - name: mastra-playground
          image: gitea.cnoe.localtest.me:8443/giteaadmin/mastra-playground:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            # nginx:alpine expects to write under /var/cache/nginx at startup.
            # In this dev stack we run it as root to avoid permission issues.
