apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mastra-playground
  namespace: workflow-builder
  annotations:
    argocd.argoproj.io/sync-wave: "65"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  labels:
    app.kubernetes.io/name: mastra-playground
spec:
  ingressClassName: nginx
  rules:
    - host: mastra-playground.cnoe.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mastra-playground
                port:
                  number: 80
  tls:
    - hosts:
        - mastra-playground.cnoe.localtest.me
      secretName: nginx-tls
