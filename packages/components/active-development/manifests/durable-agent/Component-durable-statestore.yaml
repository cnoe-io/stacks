apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: durable-statestore
  namespace: workflow-builder
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  labels:
    app.kubernetes.io/name: durable-statestore
    app.kubernetes.io/component: statestore
    app.kubernetes.io/part-of: durable-agent
scopes:
  - durable-agent
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis-service.nextjs.svc.cluster.local:6379
    - name: redisPassword
      value: ""
    - name: enableTLS
      value: "false"
    - name: keyPrefix
      value: durable
    - name: actorStateStore
      value: "true"
    - name: redisMaxRetries
      value: "3"
    - name: redisMinRetryInterval
      value: 8ms
    - name: redisMaxRetryInterval
      value: 512ms
