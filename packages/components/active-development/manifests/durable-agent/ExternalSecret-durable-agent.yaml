apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: durable-agent-secrets
  namespace: workflow-builder
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    name: durable-agent-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: OPENAI-API-KEY
