apiVersion: v1
kind: Service
metadata:
  name: durable-agent
  namespace: workflow-builder
  labels:
    app: durable-agent
spec:
  selector:
    app: durable-agent
  ports:
    - name: http
      port: 80
      targetPort: 8001
    - name: app
      port: 8001
      targetPort: 8001
  type: ClusterIP
