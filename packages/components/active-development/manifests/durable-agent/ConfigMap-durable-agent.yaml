apiVersion: v1
kind: ConfigMap
metadata:
  name: durable-agent-config
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: durable-agent
data:
  PORT: "8001"
  HOST: "0.0.0.0"
  AI_MODEL: "gpt-4o"
  MAX_ITERATIONS: "10"
  STATE_STORE_NAME: "durable-statestore"
  PUBSUB_NAME: "pubsub"
  PUBSUB_TOPIC: "workflow.stream"
  ORCHESTRATOR_APP_ID: "workflow-orchestrator"
  DAPR_HTTP_PORT: "3500"
  DAPR_GRPC_PORT: "50001"
  SANDBOX_BACKEND: "local"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_SERVICE_NAME: "durable-agent"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=workflow-builder,service.version=1.0.0"
  OTEL_PROPAGATORS: "tracecontext,baggage"
