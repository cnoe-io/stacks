apiVersion: v1
kind: ConfigMap
metadata:
  name: durable-agent-config
  namespace: workflow-builder
  labels:
    app.kubernetes.io/name: durable-agent
data:
  PORT: "8001"
  HOST: "0.0.0.0"
  AI_MODEL: "gpt-4o"
  MAX_ITERATIONS: "10"
  STATE_STORE_NAME: "durable-statestore"
  PUBSUB_NAME: "pubsub"
  PUBSUB_TOPIC: "workflow.stream"
  ORCHESTRATOR_APP_ID: "workflow-orchestrator"
  DAPR_HTTP_PORT: "3500"
  DAPR_GRPC_PORT: "50001"
  SANDBOX_BACKEND: "local"
