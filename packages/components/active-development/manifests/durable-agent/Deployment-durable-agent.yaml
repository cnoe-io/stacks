apiVersion: apps/v1
kind: Deployment
metadata:
  name: durable-agent
  namespace: workflow-builder
  annotations:
    argocd.argoproj.io/sync-wave: "45"
  labels:
    app: durable-agent
    app.kubernetes.io/runtime: nodejs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: durable-agent
  template:
    metadata:
      labels:
        app: durable-agent
        azure.workload.identity/use: "true"
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "durable-agent"
        dapr.io/app-port: "8001"
        dapr.io/app-protocol: "http"
        dapr.io/enable-api-logging: "true"
        dapr.io/enable-workflow: "true"
        dapr.io/graceful-shutdown-seconds: "60"
        dapr.io/placement-host-address: "dapr-placement-server.dapr-system.svc.cluster.local:50005"
    spec:
      serviceAccountName: durable-agent
      containers:
        - name: durable-agent
          image: gitea.cnoe.localtest.me/giteaadmin/opencode-durable-agent:git-0aba1e985a2e53c3d099770405b0a4fc27346288
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -lc
          args:
            - |
              until nc -z 127.0.0.1 "${DAPR_GRPC_PORT:-50001}"; do
                echo "[startup] waiting for Dapr gRPC on ${DAPR_GRPC_PORT:-50001}..."
                sleep 1
              done
              if command -v opencode >/dev/null 2>&1; then
                exec opencode serve --hostname 0.0.0.0 --port 8001
              fi
              if command -v bun >/dev/null 2>&1 && [ -f "packages/opencode/src/server/server.ts" ]; then
                exec bun --eval 'import { Server } from "./packages/opencode/src/server/server.ts"; const server = Server.listen({ hostname: "0.0.0.0", port: 8001 }); console.log(`opencode server listening on http://${server.hostname}:${server.port}`); await new Promise(() => {});'
              fi
              echo "[startup] failed: opencode executable not found in image"
              exit 1
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: durable-agent-config
          env:
            # Pin workspace sandbox backend at the deployment layer so runtime
            # behavior is stable even if ConfigMap keys drift.
            - name: SANDBOX_BACKEND
              value: "k8s"
            - name: SANDBOX_TEMPLATE
              value: "dapr-agent"
            - name: SANDBOX_NAMESPACE
              value: "agent-sandbox"
            - name: SANDBOX_WORKSPACE_DIR
              value: "/app"
            - name: SANDBOX_PROVISION_TIMEOUT_MS
              value: "180000"
            - name: WORKSPACE_CLONE_STRIP_GIT_DIR
              value: "false"
            - name: DURABLE_REQUIRE_STARTUP_INIT
              value: "false"
            - name: DURABLE_STARTUP_INIT_RETRY_MS
              value: "15000"
            - name: OPENCODE_DISABLE_DEFAULT_PLUGINS
              value: "true"
            - name: OPENCODE_DISABLE_PROJECT_CONFIG
              value: "true"
            - name: OPENCODE_HEADLESS
              value: "true"
            - name: OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER
              value: "true"
            - name: OPENCODE_DISABLE_LSP_DOWNLOAD
              value: "true"
            - name: OPENAI_CHAT_FALLBACK_MODEL
              value: "gpt-4o"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: durable-agent-secrets
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: durable-agent-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: durable-agent-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
            - name: WORKSPACE_RECON_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: workflow-builder-secrets
                  key: DATABASE_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              # Use /api/health for readiness because some durable-agent images
              # do not expose /api/ready, which keeps endpoints in notReady and
              # breaks Dapr service invocation DNS resolution.
              path: /api/health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
