apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Active-Development Applications (Single Branch Model)
#
# Architecture:
#   - Single ArgoCD app per application (no separate *-local-dev apps)
#   - gitops pushes manifests to Gitea (main branch)
#   - Kargo updates image tags on main branch via kustomize-set-image
#   - ArgoCD syncs from main branch
#
# Config changes (fast path, ~3-10s):
#   Edit manifests/<app>/ → devenv up → gitops → Gitea (main) → ArgoCD syncs
#
# Image changes (Kargo path, ~60s):
#   docker push → Kargo Warehouse → Stage → kustomize-set-image → push main → ArgoCD syncs
#
# DevSpace:
#   ignoreDifferences allows DevSpace to modify image/resources without ArgoCD reverting
#
# Sync behavior:
#   - automated: true (ArgoCD auto-syncs on git changes)
#   - selfHeal: true (ArgoCD reverts manual changes, except ignoreDifferences fields)
#   - prune: true (ArgoCD deletes orphaned resources)

resources:
  # Core workflow applications
  # ai-chatbot disabled: images not yet available in Gitea registry
  # - apps/ai-chatbot.yaml
  - apps/function-router.yaml
  - apps/workflow-builder.yaml
  # agentuity-coder disabled: no Gitea repo exists for this app
  # - apps/agentuity-coder.yaml
  - apps/mcp-gateway.yaml
  - apps/mcp-inspector.yaml
  - apps/workflow-orchestrator.yaml
  # Contour Gateway (kept for general ingress/gateway needs)
  - apps/contour.yaml
  # Shared infrastructure for workflow-builder functions (registry creds, service account)
  - apps/workflow-functions-shared.yaml
  # Serverless functions (scale-to-zero Knative Services)
  # - apps/fn-activepieces.yaml  # Disabled with activepieces
  - apps/fn-system.yaml
  # Durable agent (Dapr Workflow-backed ReAct loop, primary agent service)
  - apps/durable-agent.yaml
  # Centralized in-cluster builds for workflow-builder runtime images (Tekton)
  - apps/workflow-builder-builds.yaml
  # Centralized in-cluster builds for stacks images (Tekton)
  - apps/stacks-builds.yaml
  # In-cluster MCP bundle registry for Nimble/MPAK-compatible bundles
  - apps/mpak-registry.yaml
  # Nimble MCPService instances for selected Activepieces pieces
  - apps/nimble-activepieces-mcps.yaml

# Image tag reference (documentation)
# All active-development images use :latest for local development
# NOTE: Since manifests are copied directly (not via kustomize), tags are
# hardcoded in Deployment files. This block documents which images are used.
images:
  # - name: gitea.cnoe.localtest.me/giteaadmin/ai-chatbot
  #   newTag: latest
  - name: gitea.cnoe.localtest.me/giteaadmin/function-router
    newTag: latest
  - name: gitea.cnoe.localtest.me/giteaadmin/workflow-builder
    newTag: dev-20260223-114519-oauth-url-resolve
  - name: gitea.cnoe.localtest.me/giteaadmin/mcp-gateway
    newTag: latest
  - name: gitea.cnoe.localtest.me/giteaadmin/workflow-orchestrator
    newTag: dev-20260222-114456-a3e16257
  # Standalone function executor images
  # - name: gitea.cnoe.localtest.me/giteaadmin/fn-activepieces
  #   newTag: latest
  - name: gitea.cnoe.localtest.me/giteaadmin/fn-system
    newTag: latest
  - name: gitea.cnoe.localtest.me/giteaadmin/piece-mcp-server
    newTag: latest
  # Durable agent
  - name: gitea.cnoe.localtest.me/giteaadmin/opencode-durable-agent
    newTag: dev-20260223-111928-claude-plan
