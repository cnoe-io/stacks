apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Active-Development Applications (Single Branch Model)
#
# Architecture:
#   - Single ArgoCD app per application (no separate *-local-dev apps)
#   - idpbuilder pushes manifests to Gitea (main branch)
#   - Kargo updates image tags on main branch via kustomize-set-image
#   - ArgoCD syncs from main branch
#
# Config changes (fast path, ~3-10s):
#   Edit manifests/<app>/ → devenv up → idpbuilder → Gitea (main) → ArgoCD syncs
#
# Image changes (Kargo path, ~60s):
#   docker push → Kargo Warehouse → Stage → kustomize-set-image → push main → ArgoCD syncs
#
# DevSpace:
#   ignoreDifferences allows DevSpace to modify image/resources without ArgoCD reverting
#
# Sync behavior:
#   - automated: true (ArgoCD auto-syncs on git changes)
#   - selfHeal: true (ArgoCD reverts manual changes, except ignoreDifferences fields)
#   - prune: true (ArgoCD deletes orphaned resources)

resources:
  # Core workflow applications
  - apps/ai-chatbot.yaml
  - apps/function-router.yaml
  - apps/workflow-builder.yaml
  - apps/mcp-gateway.yaml
  - apps/mcp-inspector.yaml
  - apps/workflow-orchestrator.yaml
  - apps/workflow-web.yaml
  # Planner services
  - apps/planner-dapr-agent.yaml
  # Contour Gateway (kept for general ingress/gateway needs)
  - apps/contour.yaml
  # Shared infrastructure for workflow-builder functions (registry creds, service account)
  - apps/workflow-functions-shared.yaml
  # Serverless functions (scale-to-zero Knative Services)
  - apps/fn-activepieces.yaml
  - apps/fn-system.yaml
  - apps/fn-openai.yaml
  - apps/fn-slack.yaml
  - apps/fn-github.yaml
  - apps/fn-resend.yaml
  - apps/fn-stripe.yaml
  - apps/fn-linear.yaml
  - apps/fn-perplexity.yaml
  - apps/fn-firecrawl.yaml
  # Centralized in-cluster builds for fn-* images (Shipwright + Tekton)
  - apps/workflow-builder-builds.yaml

# Image tag reference (documentation)
# All active-development images use :latest for local development
# NOTE: Since manifests are copied directly (not via kustomize), tags are
# hardcoded in Deployment files. This block documents which images are used.
images:
  - name: gitea.cnoe.localtest.me:8443/giteaadmin/ai-chatbot
    newTag: latest
  - name: gitea.cnoe.localtest.me:8443/giteaadmin/function-router
    newTag: latest
  - name: gitea.cnoe.localtest.me:8443/giteaadmin/workflow-builder
    newTag: latest
  - name: gitea.cnoe.localtest.me:8443/giteaadmin/mcp-gateway
    newTag: latest
  - name: gitea.cnoe.localtest.me:8443/giteaadmin/workflow-orchestrator
    newTag: latest
  - name: gitea.cnoe.localtest.me:8443/giteaadmin/workflow-web
    newTag: latest
  # Planner services
  - name: gitea.cnoe.localtest.me:8443/giteaadmin/planner-dapr-agent
    newTag: latest
  # Standalone function executor images
  - name: gitea.cnoe.localtest.me:8443/giteaadmin/fn-activepieces
    newTag: latest
  - name: gitea.cnoe.localtest.me:8443/giteaadmin/fn-system
    newTag: latest
  # Function images
  - name: gitea.cnoe.localtest.me:8443/giteaadmin/fn-openai
    newTag: latest
  - name: gitea.cnoe.localtest.me:8443/giteaadmin/fn-slack
    newTag: latest
  - name: gitea.cnoe.localtest.me:8443/giteaadmin/fn-github
    newTag: latest
  - name: gitea.cnoe.localtest.me:8443/giteaadmin/fn-resend
    newTag: latest
  - name: gitea.cnoe.localtest.me:8443/giteaadmin/fn-stripe
    newTag: latest
  - name: gitea.cnoe.localtest.me:8443/giteaadmin/fn-linear
    newTag: latest
  - name: gitea.cnoe.localtest.me:8443/giteaadmin/fn-perplexity
    newTag: latest
  - name: gitea.cnoe.localtest.me:8443/giteaadmin/fn-firecrawl
    newTag: latest
