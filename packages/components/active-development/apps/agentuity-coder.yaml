apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentuity-coder
  namespace: argocd
  annotations:
    stacks.io/repo-source: stacks
    argocd.argoproj.io/sync-wave: "16"
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/giteaadmin/stacks.git
    targetRevision: HEAD
    path: packages/components/active-development/manifests/agentuity-coder
  destination:
    server: https://kubernetes.default.svc
    namespace: agentuity-coder
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/resources
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
