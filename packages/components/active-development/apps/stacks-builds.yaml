apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stacks-builds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "70"
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/giteaadmin/stacks.git
    targetRevision: HEAD
    path: packages/components/active-development/manifests/stacks-builds
  destination:
    server: https://kubernetes.default.svc
    namespace: stacks-builds
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
