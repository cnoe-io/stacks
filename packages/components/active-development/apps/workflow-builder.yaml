apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  name: workflow-builder
  namespace: argocd
spec:
  destination:
    namespace: workflow-builder
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://workflow-builder/manifests
  syncPolicy:
    # Active development: auto-sync enabled but selfHeal disabled
    # ArgoCD detects drift (OutOfSync) but won't auto-revert manual changes
    # Manual sync: argocd app sync workflow-builder --insecure
    automated:
      selfHeal: false
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
