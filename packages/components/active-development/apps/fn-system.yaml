apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fn-system
  namespace: argocd
  annotations:
    stacks.io/repo-source: stacks
    argocd.argoproj.io/sync-wave: "56"
    # Kargo Stage authorized to update this app's image tag
    kargo.akuity.io/authorized-stage: kargo-pipelines:fn-system-local-dev
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/giteaadmin/stacks.git
    targetRevision: HEAD
    path: packages/components/active-development/manifests/fn-system
  destination:
    server: https://kubernetes.default.svc
    namespace: workflow-builder
  # Ignore DevSpace-managed fields to allow local development without drift detection
  ignoreDifferences:
    - group: serving.knative.dev
      kind: Service
      jsonPointers:
        - /spec/template/spec/containers/0/image
        - /spec/template/spec/containers/0/resources
        - /spec/template/metadata/annotations/autoscaling.knative.dev~1minScale
        - /spec/template/metadata/annotations/autoscaling.knative.dev~1maxScale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
