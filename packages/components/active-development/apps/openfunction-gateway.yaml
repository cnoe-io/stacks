apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openfunction-gateway
  namespace: argocd
  annotations:
    # Deploy early - OpenFunctions depend on this
    argocd.argoproj.io/sync-wave: "40"
spec:
  project: default
  source:
    repoURL: cnoe://openfunction-gateway/manifests
    targetRevision: HEAD
    path: "."
  destination:
    server: https://kubernetes.default.svc
    namespace: openfunction
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
