apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  name: flight-booking-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: flight-booking-app
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://flight-booking-app/manifests
  syncPolicy:
    # Active development: auto-sync enabled but selfHeal disabled
    # ArgoCD detects drift (OutOfSync) but won't auto-revert manual changes
    # Manual sync: argocd app sync flight-booking-app --insecure
    automated:
      selfHeal: false
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
