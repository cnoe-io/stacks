apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  name: planner-agent
  namespace: argocd
spec:
  destination:
    namespace: ai-chatbot
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://planner-agent/manifests
  syncPolicy:
    # Active development: auto-sync enabled but selfHeal disabled
    # ArgoCD detects drift (OutOfSync) but won't auto-revert manual changes
    # Manual sync: argocd app sync planner-agent --insecure
    automated:
      selfHeal: false
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
