apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  name: planner-agent
  namespace: argocd
spec:
  destination:
    namespace: ai-chatbot
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://planner-agent/manifests
  syncPolicy:
    # Auto-sync DISABLED for active development
    # Sync manually: argocd app sync planner-agent --insecure
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
