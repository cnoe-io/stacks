apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-chatbot
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "60"
    # Kargo Stage authorized to update this app's image tag
    kargo.akuity.io/authorized-stage: kargo-pipelines:ai-chatbot-local-dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: cnoe://ai-chatbot/manifests
    targetRevision: HEAD
    path: "."
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-chatbot
  # Ignore DevSpace-managed fields to allow local development without drift detection
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/image
        - /spec/template/spec/containers/0/resources
        - /spec/replicas
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
