apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fn-linear
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "56"
    kargo.akuity.io/authorized-stage: kargo-pipelines:fn-linear-local-dev
spec:
  project: default
  source:
    repoURL: cnoe://fn-linear/manifests
    targetRevision: HEAD
    path: "."
  destination:
    server: https://kubernetes.default.svc
    namespace: workflow-builder
  ignoreDifferences:
    - group: core.openfunction.io
      kind: Function
      jsonPointers:
        - /spec/image
        - /status
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
