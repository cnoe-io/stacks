apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "65"
  name: workflow-web
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: workflow-web
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://workflow-web/manifests
  syncPolicy:
    # Active development: auto-sync enabled but selfHeal disabled
    # ArgoCD detects drift (OutOfSync) but won't auto-revert manual changes
    # Manual sync: argocd app sync workflow-web --insecure
    automated:
      selfHeal: false
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
