apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "65"
  name: workflow-web
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: workflow-web
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://workflow-web/manifests
  syncPolicy:
    # Auto-sync DISABLED for active development
    # Sync manually: argocd app sync workflow-web --insecure
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
