apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vibe-coding-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: cnoe://vibe-coding-platform/manifests
    targetRevision: HEAD
    path: "."
  destination:
    server: https://kubernetes.default.svc
    namespace: vibe-coding-platform
  syncPolicy:
    # Auto-sync DISABLED for active development
    # Sync manually: argocd app sync vibe-coding-platform --insecure
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
