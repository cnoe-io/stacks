apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vibe-coding-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: cnoe://vibe-coding-platform/manifests
    targetRevision: HEAD
    path: "."
  destination:
    server: https://kubernetes.default.svc
    namespace: vibe-coding-platform
  syncPolicy:
    # Active development: auto-sync enabled but selfHeal disabled
    # ArgoCD detects drift (OutOfSync) but won't auto-revert manual changes
    # Manual sync: argocd app sync vibe-coding-platform --insecure
    automated:
      selfHeal: false
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
