apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: planner-dapr-agent
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: workflow-builder
  annotations:
    argocd.argoproj.io/sync-wave: "65"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: cnoe://planner-dapr-agent/manifests
    targetRevision: HEAD
    path: "."
  destination:
    server: https://kubernetes.default.svc
    namespace: workflow-builder
  # Ignore DevSpace-managed fields to allow local development without drift detection
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/image
        - /spec/template/spec/containers/0/resources
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Retry failed syncs to handle transient failures during cluster creation
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
