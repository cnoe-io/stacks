apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spoke-talos
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sourceHydrator:
    drySource:
      repoURL: https://github.com/PittampalliOrg/stacks.git
      path: packages/overlays/talos
      targetRevision: main
      kustomize: {}
    hydrateTo:
      targetBranch: env/talos-next
    syncSource:
      targetBranch: env/talos
      path: talos-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
