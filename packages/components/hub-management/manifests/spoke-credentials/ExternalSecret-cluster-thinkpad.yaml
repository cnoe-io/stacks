apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-cluster-thinkpad
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-40"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    name: cluster-thinkpad
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
          cluster-host: thinkpad
          managed-by: external-secrets
      data:
        name: thinkpad
        server: https://k8s-api-thinkpad.tail286401.ts.net
        config: |
          {
            "tlsClientConfig": {
              "insecure": false,
              "caData": "{{ .caData }}"
            },
            "bearerToken": "{{ .bearerToken }}"
          }
  data:
    - secretKey: bearerToken
      remoteRef:
        key: ARGOCD-CLUSTER-THINKPAD-TOKEN
    - secretKey: caData
      remoteRef:
        key: ARGOCD-CLUSTER-THINKPAD-CA
