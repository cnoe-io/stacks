apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stacks-repo-write
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    name: stacks-repo-write
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository-write
      data:
        type: git
        url: https://github.com/PittampalliOrg/stacks.git
        username: x-access-token
        password: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: GITHUB-ARGOCD-PUSH-TOKEN
