apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Hub multi-cluster management environment
# Manages spoke clusters via Tailscale

resources:
  - ../../base

components:
  - ../../components/talos-only
  - ../../components/tailscale-serve
  - ../../components/observability

# Environment-specific patches
patches:
  # Patches will be added as apps are migrated
  # - path: patches/ingress-host.yaml
  # - path: patches/tls-enabled.yaml

# ConfigMap with cluster configuration
configMapGenerator:
  - name: cluster-config
    behavior: create
    literals:
      - CLUSTER_NAME=hub
      - INGRESS_HOST=hub.ai401kchat.com
      - INGRESS_PORT=443
      - TLS_ENABLED=true
      - TLS_CLUSTER_ISSUER=letsencrypt-prod
      - TAILSCALE_TAILNET=tail286401.ts.net
      - AZURE_KEY_VAULT_NAME=keyvault-thcmfmoo5oeow
      - GIT_REPO_URL=https://github.com/PittampalliOrg/stacks.git
      - GIT_BRANCH=main
