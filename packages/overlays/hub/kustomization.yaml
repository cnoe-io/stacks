apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Hub multi-cluster management environment
# Manages spoke clusters via Tailscale
# Uses Source Hydrator for rendered manifests pattern

resources:
  - ../../base

components:
  - ../../components/talos-only
  - ../../components/tailscale-serve
  - ../../components/observability
  - ../../components/hub-management

# Rewrite Gitea URLs to GitHub URLs for external clusters
# Targets only Application YAMLs annotated with stacks.io/repo-source: stacks
replacements:
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.GIT_REPO_URL
    targets:
      - select:
          kind: Application
          annotationSelector: "stacks.io/repo-source=stacks"
        fieldPaths:
          - spec.source.repoURL

# ConfigMap with cluster configuration
configMapGenerator:
  - name: cluster-config
    behavior: create
    literals:
      - CLUSTER_NAME=hub
      - INGRESS_HOST=hub.ai401kchat.com
      - INGRESS_PORT=443
      - TLS_ENABLED=true
      - TLS_CLUSTER_ISSUER=letsencrypt-prod
      - TAILSCALE_TAILNET=tail286401.ts.net
      - AZURE_KEY_VAULT_NAME=keyvault-thcmfmoo5oeow
      - GIT_REPO_URL=https://github.com/PittampalliOrg/stacks.git
      - GIT_BRANCH=main
