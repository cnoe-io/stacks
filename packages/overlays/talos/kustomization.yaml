apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Talos production environment
# Uses GitHub URLs for GitOps
# Spoke cluster managed by hub ArgoCD via Source Hydrator

resources:
  - ../../base

components:
  - ../../components/talos-only
  # - ../../components/crossplane  # Disabled: OAuth apps managed outside Crossplane, providers consume ~1.75 GiB idle
  - ../../components/tailscale-serve
  - ../../components/observability

# Rewrite Gitea URLs to GitHub URLs for external clusters
replacements:
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.GIT_REPO_URL
    targets:
      - select:
          kind: Application
          annotationSelector: "stacks.io/repo-source=stacks"
        fieldPaths:
          - spec.source.repoURL

# Destination patch: all apps deploy to talos spoke via Tailscale API
patches:
  - target:
      kind: Application
      group: argoproj.io
    patch: |
      - op: replace
        path: /spec/destination/server
        value: https://k8s-api-talos.tail286401.ts.net

# ConfigMap with cluster configuration
configMapGenerator:
  - name: cluster-config
    behavior: create
    literals:
      - CLUSTER_NAME=talos
      - INGRESS_HOST=ai401kchat.com
      - INGRESS_PORT=443
      - TLS_ENABLED=true
      - TLS_CLUSTER_ISSUER=letsencrypt-prod
      - TAILSCALE_TAILNET=tail286401.ts.net
      - AZURE_KEY_VAULT_NAME=keyvault-thcmfmoo5oeow
      - GIT_REPO_URL=https://github.com/PittampalliOrg/stacks.git
      - GIT_BRANCH=main
