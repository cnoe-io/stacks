apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# KIND on Ryzen host
# Inherits from kind overlay, overrides cluster name

resources:
  - ../kind
  # Pilot-only apps for SigNoz + OBI on ryzen
  - apps/signoz.yaml
  - apps/obi.yaml
  - apps/signoz-tailscale-serve.yaml

# Override cluster name for Ryzen host
configMapGenerator:
  - name: cluster-config
    behavior: replace
    literals:
      - CLUSTER_NAME=ryzen
      - INGRESS_HOST=cnoe.localtest.me
      - INGRESS_PORT=8443
      - TLS_ENABLED=false
      - TAILSCALE_TAILNET=tail286401.ts.net
      - TAILSCALE_SERVICE_HOST=ryzen
      - AZURE_KEY_VAULT_NAME=keyvault-thcmfmoo5oeow
