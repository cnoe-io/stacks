apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# KIND local development environment
# Uses cnoe:// URLs for idpbuilder local package deployment

resources:
  - ../../base

components:
  - ../../components/kind-only
  - ../../components/tailscale-serve
  - ../../components/observability

# Environment-specific patches
patches:
  # Patches will be added as apps are migrated
  # - path: patches/ingress-host.yaml

# ConfigMap with cluster configuration
configMapGenerator:
  - name: cluster-config
    behavior: create
    literals:
      - CLUSTER_NAME=localdev
      - INGRESS_HOST=cnoe.localtest.me
      - INGRESS_PORT=8443
      - TLS_ENABLED=false
      - TAILSCALE_TAILNET=tail286401.ts.net
      - AZURE_KEY_VAULT_NAME=keyvault-thcmfmoo5oeow
