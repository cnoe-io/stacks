# External Secret Contract for LLM Provider API Keys
# Uses Azure Key Vault via Azure Workload Identity

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kagent-llm-providers
  namespace: kagent
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: kagent
spec:
  # Refresh interval for secret synchronization
  refreshInterval: 1h

  # Reference to ClusterSecretStore (Azure Key Vault)
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore

  # Target Kubernetes secret configuration
  target:
    name: kagent-llm-providers
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: kagent
          app.kubernetes.io/component: secrets

  # Data mapping from Azure Key Vault to Kubernetes secret
  data:
    # OpenAI API Key
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: OPENAI-API-KEY

    # Anthropic API Key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: ANTHROPIC-API-KEY

    # Google Gemini API Key
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: GEMINI-API-KEY

---
