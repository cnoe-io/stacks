# Spoke Cluster ServiceAccount Contract
# This defines the ServiceAccount and RBAC for ArgoCD hub access
#
# Usage: Created by bootstrap-spoke.sh on each spoke cluster
# Location: kube-system namespace on spoke cluster
# Purpose: Provides hub ArgoCD with management access to spoke

apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-remote-manager
  namespace: kube-system
  labels:
    app.kubernetes.io/name: argocd-remote-manager
    app.kubernetes.io/component: hub-spoke-integration
    app.kubernetes.io/managed-by: bootstrap-spoke
  annotations:
    description: "ServiceAccount for hub ArgoCD to manage this spoke cluster"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-remote-manager
  labels:
    app.kubernetes.io/name: argocd-remote-manager
    app.kubernetes.io/component: hub-spoke-integration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: argocd-remote-manager
    namespace: kube-system

---
# Token generation (via kubectl command, not as manifest)
# kubectl create token argocd-remote-manager -n kube-system --duration=8760h
#
# The generated token is stored in Azure Key Vault:
# - Key name: ARGOCD-CLUSTER-<SPOKE>-TOKEN
# - Example: ARGOCD-CLUSTER-THINKPAD-TOKEN

---
# Validation Rules:
#
# 1. ServiceAccount MUST exist in kube-system namespace
#
# 2. ClusterRoleBinding MUST grant cluster-admin role
#    - Required for ArgoCD to manage all resources
#    - Scoped to this specific ServiceAccount
#
# 3. Token MUST be:
#    - Generated with long duration (8760h = 1 year)
#    - Stored in Azure Key Vault (not in Git)
#    - Rotated before expiration
#
# 4. Spoke cluster MUST have:
#    - Tailscale operator installed
#    - k8s-api service exposed via Tailscale serve
#    - Network connectivity to hub cluster

---
# Security Considerations:
#
# - cluster-admin is required because ArgoCD needs to:
#   - Create/update/delete any resource type
#   - Create namespaces for applications
#   - Manage CRDs and webhooks
#
# - Token is long-lived but:
#   - Stored encrypted in Azure Key Vault
#   - Synced via External Secrets (auto-refresh on rotation)
#   - Can be rotated by regenerating and updating Key Vault
#
# - Tailscale provides additional security:
#   - Encrypted mesh traffic
#   - Device authentication
#   - ACL-based access control
