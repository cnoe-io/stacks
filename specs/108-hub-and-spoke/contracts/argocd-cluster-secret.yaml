# ArgoCD Cluster Secret Contract
# This defines the structure for registering spoke clusters in hub ArgoCD
#
# Usage: Generated by ArgocdClusterSecretChart via ExternalSecret
# Location: argocd namespace on hub cluster
# Reference: https://argo-cd.readthedocs.io/en/stable/operator-manual/declarative-setup/#clusters

apiVersion: v1
kind: Secret
metadata:
  # Name format: cluster-<spoke-name>
  name: cluster-thinkpad
  namespace: argocd
  labels:
    # REQUIRED: ArgoCD discovers clusters via this label
    argocd.argoproj.io/secret-type: cluster
    # Custom labels for filtering/organization
    cluster-host: thinkpad
    cluster-type: development
    managed-by: external-secrets
  annotations:
    # Source tracking
    external-secrets.io/managed-by: external-secrets
type: Opaque
stringData:
  # Human-readable cluster name (appears in ArgoCD UI)
  name: thinkpad

  # Kubernetes API server URL (via Tailscale)
  # Format: https://k8s-api-<host>.<tailnet>.ts.net
  server: https://k8s-api-thinkpad.tail286401.ts.net

  # Connection configuration (JSON)
  # Must include TLS config and authentication
  config: |
    {
      "tlsClientConfig": {
        "insecure": false,
        "caData": "LS0tLS1CRUdJTi..."
      },
      "bearerToken": "eyJhbGciOiJSUzI1NiI..."
    }

---
# Example for production spoke
apiVersion: v1
kind: Secret
metadata:
  name: cluster-talos
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    cluster-host: talos
    cluster-type: production
    managed-by: external-secrets
type: Opaque
stringData:
  name: talos
  server: https://k8s-api-talos.tail286401.ts.net
  config: |
    {
      "tlsClientConfig": {
        "insecure": false,
        "caData": "LS0tLS1CRUdJTi..."
      },
      "bearerToken": "eyJhbGciOiJSUzI1NiI..."
    }

---
# Validation Rules:
#
# 1. metadata.labels MUST contain:
#    - argocd.argoproj.io/secret-type: cluster
#
# 2. stringData.name MUST be unique across all cluster secrets
#
# 3. stringData.server MUST be:
#    - Valid HTTPS URL
#    - Reachable from hub cluster via Tailscale
#    - Format: https://k8s-api-<host>.<tailnet>.ts.net
#
# 4. stringData.config MUST be valid JSON with:
#    - tlsClientConfig.caData: Base64-encoded CA certificate
#    - bearerToken: Valid Kubernetes ServiceAccount token
#
# 5. Token MUST be from ServiceAccount with cluster-admin role on spoke
