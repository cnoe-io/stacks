# External Secret Contract: RustDesk Password
# Feature: 006-update-our-specification
# Purpose: Define ESO ExternalSecret for syncing RustDesk password from Azure Key Vault

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rustdesk-password
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "-70"  # Before VM deployment (wave 0)
    description: "RustDesk permanent password synced from Azure Key Vault"
spec:
  # Refresh interval: sync password changes from Key Vault every 1 hour
  refreshInterval: 1h

  # Reference to ClusterSecretStore (Azure Key Vault)
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore

  # Target Kubernetes Secret to create
  target:
    name: rustdesk-password
    creationPolicy: Owner  # ESO manages the Secret lifecycle
    template:
      type: Opaque
      metadata:
        labels:
          app: rustdesk
          managed-by: external-secrets
      data:
        # Single key: "password" containing the RustDesk permanent password
        password: "{{ .password }}"

  # Data mapping: Azure Key Vault secret → Kubernetes Secret key
  data:
    - secretKey: password  # Kubernetes Secret key name
      remoteRef:
        key: RUSTDESK-PASSWORD  # Azure Key Vault secret name

---
# USAGE in VM deployment:
#
# Option 1: Environment variable (recommended)
# apiVersion: kubevirt.io/v1
# kind: VirtualMachine
# spec:
#   template:
#     spec:
#       domain:
#         devices:
#           interfaces:
#             - name: default
#               masquerade: {}
#       volumes:
#         - name: cloudinitdisk
#           cloudInitNoCloud:
#             userData: |
#               #cloud-config
#               chpasswd:
#                 list: |
#                   nixos:${RUSTDESK_PASSWORD}
#       env:
#         - name: RUSTDESK_PASSWORD
#           valueFrom:
#             secretKeyRef:
#               name: rustdesk-password
#               key: password
#
# Option 2: Volume mount (alternative)
# spec:
#   template:
#     spec:
#       volumes:
#         - name: rustdesk-secret
#           secret:
#             secretName: rustdesk-password
#       domain:
#         devices:
#           disks:
#             - name: rustdesk-secret
#               disk:
#                 bus: virtio

---
# VALIDATION:
#
# 1. Check ExternalSecret status:
#    kubectl get externalsecret rustdesk-password -n default
#    # Expected: READY=True, STATUS=SecretSynced
#
# 2. Verify Kubernetes Secret created:
#    kubectl get secret rustdesk-password -n default
#    # Expected: Type=Opaque, Data: password (1 key)
#
# 3. Check Secret contents (base64 encoded):
#    kubectl get secret rustdesk-password -n default -o jsonpath='{.data.password}' | base64 -d
#    # Expected: (plaintext password from Azure Key Vault)
#
# 4. Verify Azure Key Vault secret exists:
#    az keyvault secret show --vault-name <vault-name> --name RUSTDESK-PASSWORD
#    # Expected: value field contains the password
#
# 5. Test password rotation:
#    - Update password in Azure Key Vault
#    - Wait up to 1 hour (refreshInterval)
#    - Verify Kubernetes Secret updates automatically
#    - VM recreation required to use new password

---
# SECURITY BEST PRACTICES:
#
# 1. Password Requirements:
#    - Minimum 12 characters (recommended)
#    - Mix of uppercase, lowercase, numbers, symbols
#    - Avoid common words or patterns
#    - Unique per environment (dev/staging/prod)
#
# 2. Access Control:
#    - Azure Key Vault: Limit access to platform operators
#    - Kubernetes Secret: Namespace-scoped (only VMs in `default`)
#    - ESO ServiceAccount: Minimal RBAC (read secrets, write secrets in namespace)
#
# 3. Audit Trail:
#    - Azure Key Vault: Enable audit logging (all access logged)
#    - Kubernetes: Enable audit logging for Secret access
#    - Monitor for unauthorized access attempts
#
# 4. Rotation Policy:
#    - Rotate password quarterly (or per security policy)
#    - Update Azure Key Vault secret
#    - ESO syncs automatically (within refreshInterval)
#    - Recreate VMs to apply new password
#    - Test connection with new password before deleting old VMs
#
# 5. Emergency Response:
#    - If password compromised: rotate immediately in Key Vault
#    - Delete all VMs and recreate with new password
#    - Review audit logs for unauthorized access
#    - Update firewall rules if needed (restrict port 21116 to known IPs)

---
# DEPENDENCIES:
#
# 1. ClusterSecretStore (must exist before ExternalSecret):
#    - Name: azure-keyvault-store
#    - Provider: Azure Key Vault
#    - Auth: Workload Identity (pod identity)
#
# 2. Azure Key Vault secret:
#    - Secret name: RUSTDESK-PASSWORD
#    - Value: Permanent password for RustDesk connections
#    - Created manually or via automation
#
# 3. ArgoCD sync wave ordering:
#    - ClusterSecretStore: wave -90 (infrastructure)
#    - ExternalSecret: wave -70 (this file)
#    - VM deployment: wave 0
#    - Ensures Secret exists before VM starts

---
# TROUBLESHOOTING:
#
# Issue: ExternalSecret shows "SecretSyncedError"
# Resolution:
#   - Check ClusterSecretStore exists: kubectl get clustersecretstore
#   - Verify Workload Identity configured: kubectl describe pod -n external-secrets
#   - Check Azure Key Vault secret exists: az keyvault secret list
#   - Review ESO controller logs: kubectl logs -n external-secrets deploy/external-secrets
#
# Issue: Kubernetes Secret not created
# Resolution:
#   - Verify ExternalSecret is in correct namespace
#   - Check creationPolicy is "Owner" (ESO creates Secret)
#   - Review ExternalSecret status: kubectl describe externalsecret rustdesk-password
#
# Issue: VM can't access password
# Resolution:
#   - Verify Secret exists: kubectl get secret rustdesk-password -n default
#   - Check VM spec references correct Secret name and key
#   - Ensure sync wave ordering (Secret created before VM)
#   - Review VM events: kubectl describe vm <vm-name>
