# Warehouse: backstage-gitea (Inner Loop)
# Purpose: Monitors Gitea OCI registry for locally-pushed Backstage images
# Trigger: Webhook from Gitea or polling every 5 minutes

apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: backstage-gitea
  namespace: kargo-pipelines
  annotations:
    argocd.argoproj.io/sync-wave: '20'
  labels:
    app.kubernetes.io/name: backstage-gitea-warehouse
    app.kubernetes.io/part-of: kargo-pipelines
    app.kubernetes.io/component: warehouse
    kargo.akuity.io/loop: inner
spec:
  # Automatically create Freight when new images are discovered
  freightCreationPolicy: Automatic

  # Polling interval (backup for webhooks)
  interval: 5m0s

  subscriptions:
    - image:
        # Gitea OCI registry URL (no tag)
        repoURL: gitea.cnoe.localtest.me:8443/giteaadmin/backstage

        # Lexical strategy for dev-<commit> tags
        # Lexical sorts tags alphabetically and picks the "highest"
        imageSelectionStrategy: Lexical

        # Only consider tags matching dev-<7-char-hex> pattern
        # Examples: dev-abc1234, dev-f9e8d7c
        allowTags: "^dev-[a-f0-9]{7}$"

        # Ignore these tags even if they match allowTags
        ignoreTags:
          - latest
          - develop
          - main

        # Only examine the 10 most recent tags
        discoveryLimit: 10

        # Gitea uses self-signed certificates in local dev
        insecureSkipTLSVerify: true

        # Target linux/amd64 images only
        platform: linux/amd64
