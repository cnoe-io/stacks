# Minimal Next.js DevSpace Configuration Example
# Copy this file to your project and adjust the import paths and variables.

version: v2beta1
name: my-nextjs-app

# Import shared variable definitions from templates
# Adjust paths based on your project location relative to stacks/main
imports:
  - path: ../../stacks/main/devspace-templates/base.yaml
  - path: ../../stacks/main/devspace-templates/snippets/nextjs.yaml

# App-specific variable values
vars:
  APP_NAME: my-nextjs-app
  LOCAL_PORT: "3000"
  CONTAINER_PORT: "3000"
  # Optional: Database migrations
  # RUN_MIGRATIONS: "true"
  # MIGRATION_COMMAND: "pnpm tsx lib/db/migrate"
  # Optional: Install Claude CLI for AI-powered features
  # INSTALL_CLAUDE_CLI: "true"

# Development configuration
dev:
  app:
    namespace: ${APP_NAME}
    imageSelector: ${GITEA_HOST}/${GITEA_USER}/${APP_NAME}
    container: ${APP_NAME}
    devImage: ${GITEA_HOST}/${GITEA_USER}/${APP_NAME}-devspace:latest
    workingDir: /app

    resources:
      requests:
        cpu: ${CPU_REQUEST}
        memory: ${MEMORY_REQUEST}
      limits:
        cpu: ${CPU_LIMIT}
        memory: ${MEMORY_LIMIT}

    command:
      - /bin/sh
      - -c
      - |
        set -e
        echo "=== DevSpace Development Container (Next.js) ==="
        corepack enable
        corepack prepare pnpm@${PNPM_VERSION} --activate
        if [ ! -d "node_modules" ] || [ ! -f "node_modules/.pnpm-lock-hash" ] || \
           [ "$(cat node_modules/.pnpm-lock-hash 2>/dev/null)" != "$(md5sum pnpm-lock.yaml | cut -d' ' -f1)" ]; then
          pnpm install --frozen-lockfile
          md5sum pnpm-lock.yaml | cut -d' ' -f1 > node_modules/.pnpm-lock-hash
        fi
        exec pnpm dev

    sync:
      - path: ./:/app
        initialSync: mirrorLocal
        startContainer: true
        waitInitialSync: true
        onUpload:
          restartContainer: false
        excludePaths:
          - node_modules/
          - .pnpm-store/
          - .next/
          - dist/
          - out/
          - coverage/
          - next-env.d.ts
          - .devenv/
          - .devspace/
          - .direnv/
          - .git
          - .git/
          - .github/
          - .idea/
          - .vscode/
          - .cursor/
          - tests/
          - playwright-report/
          - test-results/
          - playwright.config.ts
          - vitest.config.ts
          - docs/
          - scripts/
          - "*.md"
          - "*.log"
          - LICENSE
          - Dockerfile
          - Dockerfile.devspace
          - devenv.*
          - devenv.lock
          - .devenv*
          - .devenv.flake.nix
          - biome.jsonc
          - .dockerignore
          - .gitignore
          - .env.local
          - .env.example

    persistPaths:
      - path: /tmp
        skipPopulate: true
      - path: /app/node_modules

    patches:
      - op: remove
        path: spec.containers.name=${APP_NAME}.livenessProbe
      - op: remove
        path: spec.containers.name=${APP_NAME}.readinessProbe
      - op: replace
        path: spec.containers.name=${APP_NAME}.securityContext
        value:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
      - op: replace
        path: spec.securityContext
        value:
          fsGroup: 1001
          runAsNonRoot: false

    ports:
      - port: "${LOCAL_PORT}:${CONTAINER_PORT}"

    ssh:
      enabled: true
      localPort: 2222

    env:
      - name: NODE_ENV
        value: development
      - name: NEXT_TELEMETRY_DISABLED
        value: "1"
      - name: OTEL_SERVICE_NAME
        value: ${OTEL_SERVICE_NAME}
      - name: OTEL_RESOURCE_ATTRIBUTES
        value: "deployment.environment=${OTEL_ENVIRONMENT},service.namespace=${APP_NAME}-dev,service.version=dev"
