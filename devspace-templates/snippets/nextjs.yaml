# DevSpace Next.js Framework Variables
# Provides Next.js-specific variable defaults
#
# Import after base.yaml:
#   imports:
#     - path: .../base.yaml
#     - path: .../snippets/nextjs.yaml

version: v2beta1

# ============================================================================
# Next.js Variables
# ============================================================================
vars:
  # pnpm version
  PNPM_VERSION:
    default: "9.12.3"

  # Migration configuration
  RUN_MIGRATIONS:
    default: "false"
  MIGRATION_COMMAND:
    default: ""

  # Whether to install Claude CLI (for AI-powered apps)
  INSTALL_CLAUDE_CLI:
    default: "false"

