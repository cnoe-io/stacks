# DevSpace FastAPI Framework Variables
# Provides Python/FastAPI-specific variable defaults
#
# Import after base.yaml:
#   imports:
#     - path: .../base.yaml
#     - path: .../snippets/fastapi.yaml

version: v2beta1

# ============================================================================
# FastAPI Variables
# ============================================================================
vars:
  # Uvicorn configuration
  UVICORN_HOST:
    default: "0.0.0.0"
  UVICORN_PORT:
    default: "8080"
  UVICORN_APP:
    default: "main:app"

  # Python user configuration (for non-root execution)
  PYTHON_UID:
    default: "1000"
  PYTHON_GID:
    default: "1000"

