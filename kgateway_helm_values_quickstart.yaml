# Quick Start: kgateway Helm Values for agentgateway + AI Extension + OpenTelemetry
# 
# This file shows the exact YAML structure needed to enable:
# 1. agentgateway integration
# 2. AI Gateway extension
# 3. OpenTelemetry tracing with OTLP
#
# Usage:
#   helm upgrade -i -n kgateway-system kgateway \
#     oci://cr.kgateway.dev/kgateway-dev/charts/kgateway \
#     -f kgateway_helm_values_quickstart.yaml \
#     --version v2.1.1

# ============================================================================
# 1. KGATEWAY HELM VALUES (Helm Chart Configuration)
# ============================================================================

# Controller (control plane) configuration
controller:
  replicaCount: 1
  image:
    registry: cr.kgateway.dev
    repository: kgateway-dev/kgateway
    tag: "v2.1.1"
    pullPolicy: IfNotPresent
  
  # Service ports for control plane
  service:
    type: ClusterIP
    ports:
      grpc: 9977        # gRPC API
      health: 9093      # Health checks
      metrics: 9092     # Prometheus metrics
  
  # Resource requests/limits
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  
  # Logging
  logLevel: "info"

# Enable agentgateway integration
agentGateway:
  enabled: true
  enableAlphaAPIs: false  # Set to true for alpha features

# Enable AI Gateway extension
gateway:
  aiExtension:
    enabled: true

# RBAC and namespace
rbac:
  create: true
  
serviceAccount:
  create: true
  name: kgateway

createNamespace: true
namespace: kgateway-system

---
# ============================================================================
# 2. GATEWAYPARAMETERS CRD (Agentgateway Configuration)
# ============================================================================

apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: agentgateway-params
  namespace: kgateway-system
spec:
  kube:
    # Agentgateway configuration
    agentgateway:
      enabled: true
    
    # Service configuration (LoadBalancer for cloud, NodePort for local)
    service:
      type: LoadBalancer

---
# ============================================================================
# 3. GATEWAYPARAMETERS CRD (AI Extension with OpenTelemetry Tracing)
# ============================================================================

apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: ai-gateway-otel-params
  namespace: kgateway-system
  labels:
    app: kgateway-ai-otel
spec:
  kube:
    # AI Extension configuration
    aiExtension:
      enabled: true
      
      # Container port configuration
      ports:
        - name: ai-monitoring
          containerPort: 9092
      
      # Image configuration
      image:
        registry: cr.kgateway.dev
        repository: kgateway-dev/kgateway-ai-extension
        tag: "v2.1.1"
        pullPolicy: IfNotPresent
      
      # Resource configuration
      resources:
        requests:
          memory: "256Mi"
          cpu: "250m"
        limits:
          memory: "1Gi"
          cpu: "1000m"
      
      # OpenTelemetry Tracing Configuration
      tracing:
        enabled: true
        
        # OTLP collector endpoint (gRPC - port 4317)
        endpoint: "http://opentelemetry-collector.telemetry.svc.cluster.local:4317"
        
        # Sampler: alwaysOn, alwaysOff, traceidratio, parentbased_traceidratio, parentbased_alwaysOn
        sampler:
          type: "traceidratio"
          arg: "1.0"  # 1.0 = 100% sampling, 0.1 = 10% sampling
        
        # Timeout in milliseconds
        timeout: 10000
        
        # Protocol: grpc or http
        protocol: "grpc"
        
        # Transport security: tls or plaintext
        transportSecurity: "plaintext"  # Set to "tls" if collector requires TLS
      
      # Environment variables
      env:
        - name: LOG_LEVEL
          value: "info"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"
    
    # Service configuration
    service:
      type: LoadBalancer  # NodePort for local testing
      ports:
        - port: 80
          targetPort: 8080
          protocol: TCP

---
# ============================================================================
# 4. GATEWAY RESOURCE (Kubernetes Gateway API)
# ============================================================================

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway
  namespace: kgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
  - protocol: HTTP
    port: 8080
    name: http
    allowedRoutes:
      namespaces:
        from: All

---
# ============================================================================
# 5. HTTPLISTENERPOLICY (Gateway-Level OpenTelemetry Tracing)
# ============================================================================

apiVersion: gateway.kgateway.dev/v1alpha1
kind: HTTPListenerPolicy
metadata:
  name: otel-listener-policy
  namespace: kgateway-system
spec:
  # Target the agentgateway listener
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway
  
  # Tracing configuration
  tracing:
    enabled: true
    
    # OpenTelemetry provider
    providers:
      - name: opentelemetry
        
        # Sampling configuration
        sampling:
          overall: "100"  # 100% sampling rate
        
        # OTLP collector endpoint
        endpoint:
          type: GRPC
          host: "opentelemetry-collector.telemetry.svc.cluster.local"
          port: 4317
          tls:
            enabled: false  # Set to true if collector uses TLS
        
        # Custom trace attributes
        customTags:
          - name: "service.name"
            literal:
              value: "kgateway-agentgateway"
          - name: "service.version"
            literal:
              value: "v2.1.1"

---
# ============================================================================
# INSTALLATION INSTRUCTIONS
# ============================================================================
#
# 1. Install Gateway API CRDs (prerequisite):
#    kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.4.0/standard-install.yaml
#
# 2. Install kgateway CRDs:
#    helm upgrade -i --create-namespace --namespace kgateway-system \
#      --version v2.1.1 \
#      kgateway-crds oci://cr.kgateway.dev/kgateway-dev/charts/kgateway-crds
#
# 3. Install kgateway with Helm values (extract the first section above):
#    helm upgrade -i -n kgateway-system kgateway \
#      oci://cr.kgateway.dev/kgateway-dev/charts/kgateway \
#      --set agentGateway.enabled=true \
#      --set gateway.aiExtension.enabled=true \
#      --version v2.1.1
#
#    Or using this file:
#    helm upgrade -i -n kgateway-system kgateway \
#      oci://cr.kgateway.dev/kgateway-dev/charts/kgateway \
#      -f kgateway_helm_values_quickstart.yaml \
#      --version v2.1.1
#
# 4. Deploy GatewayParameters and other CRDs (sections 2-5 above):
#    kubectl apply -f kgateway_helm_values_quickstart.yaml
#
# 5. Verify installation:
#    kubectl get gateway -n kgateway-system
#    kubectl get pods -n kgateway-system
#    kubectl get svc -n kgateway-system
#    helm get values kgateway -n kgateway-system -o yaml

