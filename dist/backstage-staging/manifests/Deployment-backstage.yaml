apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backstage
  name: backstage
  namespace: backstage-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      containers:
        - envFrom:
            - secretRef:
                name: backstage-env-vars
          image: ghcr.io/pittampalliorg/backstage:v1.0.0
          name: backstage
          ports:
            - containerPort: 7007
              name: http
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 512Mi
      imagePullSecrets:
        - name: ghcr-dockercfg
