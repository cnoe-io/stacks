apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/name: kagent-openai
    app.kubernetes.io/part-of: kagent
  name: kagent-openai
  namespace: kagent
spec:
  data:
    - remoteRef:
        key: OPENAI-API-KEY
      secretKey: OPENAI_API_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    creationPolicy: Owner
    name: kagent-openai
