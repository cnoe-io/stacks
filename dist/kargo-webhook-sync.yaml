apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "80"
  name: kargo-webhook-sync
  namespace: argocd
spec:
  destination:
    namespace: kargo
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://kargo-webhook-sync/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
