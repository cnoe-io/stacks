apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: kargo-webhook-sync-init
  namespace: kargo
spec:
  template:
    spec:
      containers:
        - command:
            - /bin/sh
            - /scripts/sync-webhooks.sh
          env:
            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: kargo-gitea-credentials
            - name: KARGO_WEBHOOK_SECRET
              value: kargo-gitea-webhook-ryzen-secret-2024
          image: curlimages/curl:8.5.0
          name: webhook-sync
          volumeMounts:
            - mountPath: /scripts
              name: scripts
      restartPolicy: OnFailure
      volumes:
        - configMap:
            defaultMode: 493
            name: kargo-webhook-sync-script
          name: scripts
  ttlSecondsAfterFinished: 3600
