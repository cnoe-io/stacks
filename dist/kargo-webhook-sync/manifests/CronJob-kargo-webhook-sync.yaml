apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/name: kargo-webhook-sync
    app.kubernetes.io/part-of: kargo
  name: kargo-webhook-sync
  namespace: kargo
spec:
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - command:
                - /bin/sh
                - /scripts/sync-webhooks.sh
              env:
                - name: GITEA_TOKEN
                  valueFrom:
                    secretKeyRef:
                      key: token
                      name: kargo-gitea-credentials
                - name: KARGO_WEBHOOK_SECRET
                  value: kargo-gitea-webhook-ryzen-secret-2024
              image: curlimages/curl:8.5.0
              name: webhook-sync
              volumeMounts:
                - mountPath: /scripts
                  name: scripts
          restartPolicy: OnFailure
          volumes:
            - configMap:
                defaultMode: 493
                name: kargo-webhook-sync-script
              name: scripts
  schedule: 0 * * * *
  successfulJobsHistoryLimit: 1
