apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-74"
  name: flagd
  namespace: argocd
spec:
  destination:
    namespace: feature-flags
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://flagd/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
