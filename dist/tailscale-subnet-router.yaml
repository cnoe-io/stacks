apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
  name: tailscale-subnet-router
  namespace: argocd
spec:
  destination:
    namespace: tailscale
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://tailscale-subnet-router/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
