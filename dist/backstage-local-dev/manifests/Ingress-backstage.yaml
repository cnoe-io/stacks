apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backstage
  namespace: backstage-local-dev
spec:
  ingressClassName: nginx
  rules:
    - host: backstage-local-dev.cnoe.localtest.me
      http:
        paths:
          - backend:
              service:
                name: backstage
                port:
                  name: http
            path: /
            pathType: Prefix
