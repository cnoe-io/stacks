apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-github-secret
  namespace: ai-platform-engineering
spec:
  data:
    - remoteRef:
        key: GITHUB-PAT
      secretKey: GITHUB_TOKEN
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    creationPolicy: Owner
    name: agent-github-secret
