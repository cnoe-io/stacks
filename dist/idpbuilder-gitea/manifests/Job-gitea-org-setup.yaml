apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
  name: gitea-org-setup
  namespace: gitea
spec:
  backoffLimit: 5
  template:
    spec:
      containers:
        - command:
            - /bin/sh
            - /scripts/setup-org.sh
          image: alpine/curl:latest
          name: setup
          volumeMounts:
            - mountPath: /scripts
              name: script
              readOnly: true
            - mountPath: /gitea-credentials
              name: gitea-credentials
              readOnly: true
      restartPolicy: OnFailure
      serviceAccountName: default
      volumes:
        - configMap:
            defaultMode: 493
            name: gitea-org-setup-script
          name: script
        - name: gitea-credentials
          secret:
            items:
              - key: username
                path: username
              - key: password
                path: password
            secretName: gitea-credential
  ttlSecondsAfterFinished: 300
