apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: argocd
spec:
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: eso-store
          namespace: argocd
      remoteNamespace: argocd
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: argocd
          type: ConfigMap
