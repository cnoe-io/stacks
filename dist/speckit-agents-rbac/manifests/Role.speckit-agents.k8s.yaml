apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: speckit-agents
  namespace: dapr-agents
rules:
  - apiGroups:
      - ""
    resourceNames:
      - dapr-agents-llm-providers
    resources:
      - secrets
    verbs:
      - get
      - list
  - apiGroups:
      - dapr.io
    resources:
      - components
    verbs:
      - get
      - list
      - watch
