apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "45"
  name: headlamp-keycloak-secrets
  namespace: argocd
spec:
  destination:
    namespace: headlamp
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://headlamp-keycloak-secrets/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
      limit: 10
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
