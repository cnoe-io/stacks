apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: caipe-tailscale-serve
  name: caipe-ryzen-tailscale-serve
  namespace: tailscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caipe-tailscale-serve
  template:
    metadata:
      labels:
        app: caipe-tailscale-serve
    spec:
      containers:
        - env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  key: authKey
                  name: tailscale-auth-key
            - name: TS_HOSTNAME
              value: caipe-ryzen
            - name: TS_SERVE_CONFIG
              value: /config/serve.json
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_EXTRA_ARGS
              value: --reset
          image: tailscale/tailscale:v1.82.0
          name: tailscale
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - mountPath: /var/lib/tailscale
              name: state
            - mountPath: /config
              name: config
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: caipe-ryzen-tailscale-state
        - configMap:
            name: caipe-tailscale-serve-config
          name: config
