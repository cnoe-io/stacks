apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-92"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/component: secrets
    app.kubernetes.io/environment: talos
    app.kubernetes.io/managed-by: cdk8s
    app.kubernetes.io/name: cluster-secret-store
    app.kubernetes.io/part-of: platform
    example: basic
  name: cluster-secret-store
  namespace: argocd
spec:
  destination:
    namespace: external-secrets
    server: https://kubernetes.default.svc
  project: default
  sources:
    - path: cdk8s/dist/cluster-secret-store/manifests
      repoURL: https://github.com/PittampalliOrg/stacks.git
      targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
