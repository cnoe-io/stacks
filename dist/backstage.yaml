apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "100"
    kargo.akuity.io/authorized-stage: kargo-pipelines:backstage
  name: backstage
  namespace: argocd
spec:
  destination:
    namespace: backstage
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - group: apps
      jsonPointers:
        - /spec/replicas
      kind: Deployment
      name: backstage
      namespace: backstage
  project: default
  source:
    path: .
    repoURL: cnoe://backstage/manifests
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
