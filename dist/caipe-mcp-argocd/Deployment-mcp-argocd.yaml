apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mcp-argocd
    tier: mcp
  name: mcp-argocd
  namespace: ai-platform-engineering
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-argocd
  template:
    metadata:
      labels:
        app: mcp-argocd
    spec:
      containers:
        - env:
            - name: MCP_MODE
              value: http
            - name: MCP_HOST
              value: 0.0.0.0
            - name: MCP_PORT
              value: "8000"
            - name: ARGOCD_API_URL
              value: https://argocd-server.argocd.svc.cluster.local
            - name: ARGOCD_TOKEN
              valueFrom:
                secretKeyRef:
                  key: ARGOCD_AUTH_TOKEN
                  name: agent-argocd-secret
          image: ghcr.io/cnoe-io/mcp-argocd:stable
          name: mcp-argocd
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
      imagePullSecrets:
        - name: ghcr-pull-secret
