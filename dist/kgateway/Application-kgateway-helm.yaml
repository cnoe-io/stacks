apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-120"
  name: kgateway-helm
  namespace: argocd
spec:
  destination:
    namespace: kgateway-system
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: kgateway
    helm:
      valuesObject:
        gateway:
          enabled: true
          replicas: 1
    repoURL: cr.kgateway.dev/kgateway-dev/charts
    targetRevision: v2.1.2
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
