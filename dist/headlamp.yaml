apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  name: headlamp
  namespace: argocd
spec:
  destination:
    namespace: headlamp
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://headlamp/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
