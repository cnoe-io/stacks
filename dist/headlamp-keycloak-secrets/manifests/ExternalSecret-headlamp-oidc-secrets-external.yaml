apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc-secrets-external
  namespace: headlamp
spec:
  data:
    - remoteRef:
        key: keycloak-clients
        property: HEADLAMP_CLIENT_ID
      secretKey: clientId
    - remoteRef:
        key: keycloak-clients
        property: HEADLAMP_CLIENT_SECRET
      secretKey: clientSecret
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: keycloak
  target:
    creationPolicy: Owner
    name: headlamp-oidc-secrets
    template:
      data:
        OIDC_CLIENT_ID: '{{ .clientId }}'
        OIDC_CLIENT_SECRET: '{{ .clientSecret }}'
        OIDC_ISSUER_URL: https://keycloak.cnoe.localtest.me:8443/realms/cnoe
        OIDC_REDIRECT_URL: https://headlamp.cnoe.localtest.me:8443/oidc-callback
        OIDC_SCOPES: openid email profile
      engineVersion: v2
      type: Opaque
