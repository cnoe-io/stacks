apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-65"
  labels:
    app: jaeger
    app.kubernetes.io/component: tracing
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: observability
  name: jaeger-collector
  namespace: observability
spec:
  ports:
    - name: zipkin
      port: 9411
      protocol: TCP
      targetPort: 9411
    - name: otlp-http
      port: 14268
      protocol: TCP
      targetPort: 14268
    - name: otlp-grpc
      port: 14250
      protocol: TCP
      targetPort: 14250
  selector:
    app: jaeger
  type: ClusterIP
