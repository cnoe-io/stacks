apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-65"
  labels:
    app: jaeger
    app.kubernetes.io/component: tracing
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: observability
  name: jaeger
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        app.kubernetes.io/component: tracing
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: observability
    spec:
      containers:
        - env:
            - name: SPAN_STORAGE_TYPE
              value: badger
            - name: BADGER_EPHEMERAL
              value: "false"
            - name: BADGER_DIRECTORY_KEY
              value: /badger/key
            - name: BADGER_DIRECTORY_VALUE
              value: /badger/value
            - name: BADGER_SPAN_STORAGE_TTL
              value: 168h
            - name: BADGER_DEPENDENCY_STORAGE_TTL
              value: 168h
            - name: COLLECTOR_ZIPKIN_HOST_PORT
              value: :9411
          image: jaegertracing/all-in-one:1.66.0
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 5
            periodSeconds: 10
          name: jaeger
          ports:
            - containerPort: 16686
              name: query
              protocol: TCP
            - containerPort: 9411
              name: zipkin
              protocol: TCP
            - containerPort: 14268
              name: otlp-http
              protocol: TCP
            - containerPort: 14250
              name: otlp-grpc
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 512Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - mountPath: /badger
              name: badger-data
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
      volumes:
        - name: badger-data
          persistentVolumeClaim:
            claimName: jaeger-badger-pvc
