apiVersion: v1
kind: Service
metadata:
  labels:
    app: jaeger
  name: jaeger-collector
  namespace: observability
spec:
  ports:
    - name: grpc
      port: 14250
      targetPort: grpc
    - name: http
      port: 14268
      targetPort: jaeger-http
    - name: zipkin
      port: 9411
      targetPort: zipkin
  selector:
    app: jaeger
