apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  name: backstage
  namespace: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: backstage
    spec:
      containers:
        - args:
            - node
            - packages/backend
            - --config
            - /app/app-config.yaml
            - --config
            - /app/app-config.production.yaml
            - --config
            - /etc/backstage/app-config.yaml
          env:
            - name: LOG_LEVEL
              value: debug
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            - name: NODE_ENV
              value: production
          envFrom:
            - secretRef:
                name: backstage-env-vars
            - secretRef:
                name: gitea-credentials
            - secretRef:
                name: argocd-credentials
          image: gitea.cnoe.localtest.me:8443/giteaadmin/backstage
          name: backstage
          ports:
            - containerPort: 7007
              name: http
          volumeMounts:
            - mountPath: /etc/backstage/app-config.yaml
              name: app-config
              readOnly: true
              subPath: app-config.yaml
      imagePullSecrets:
        - name: gitea-dockercfg
      securityContext:
        fsGroup: 0
        runAsGroup: 0
        runAsUser: 0
      serviceAccountName: backstage
      volumes:
        - configMap:
            name: backstage-app-config
          name: app-config
