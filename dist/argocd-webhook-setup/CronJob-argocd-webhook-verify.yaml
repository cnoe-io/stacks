apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/name: argocd-webhook-verify
  name: argocd-webhook-verify
  namespace: argocd
spec:
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          containers:
            - command:
                - /bin/sh
                - /scripts/setup-webhooks.sh
              image: dwdraju/alpine-curl-jq:latest
              name: webhook-verify
              resources:
                limits:
                  cpu: 200m
                  memory: 128Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
              volumeMounts:
                - mountPath: /scripts
                  name: script
                  readOnly: true
                - mountPath: /gitea-credentials
                  name: gitea-credentials
                  readOnly: true
          restartPolicy: OnFailure
          volumes:
            - configMap:
                defaultMode: 493
                name: argocd-webhook-setup-script
              name: script
            - name: gitea-credentials
              secret:
                items:
                  - key: token
                    path: token
                secretName: gitea-argocd-webhook-creds
      ttlSecondsAfterFinished: 3600
  schedule: 0 */6 * * *
  successfulJobsHistoryLimit: 1
