apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: querydoc
    app.kubernetes.io/version: 1.1.10
    helm.sh/chart: querydoc-0.7.4
  name: kagent-querydoc
  namespace: kagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: kagent
      app.kubernetes.io/name: querydoc
  template:
    metadata:
      annotations:
        checksum/configmap: 148302e92efabf421447a9286509ec93a8f26e51d392838c1b42ed1e4b91a3ca
      labels:
        app.kubernetes.io/instance: kagent
        app.kubernetes.io/name: querydoc
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: kagent-querydoc
          image: ghcr.io/kagent-dev/doc2vec/mcp:1.1.13
          imagePullPolicy: IfNotPresent
          name: querydoc
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext: {}
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
      serviceAccountName: kagent-querydoc
