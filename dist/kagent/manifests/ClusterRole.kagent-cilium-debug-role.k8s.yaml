apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cilium-debug-agent
    app.kubernetes.io/part-of: kagent
    app.kubernetes.io/version: 0.7.4
    helm.sh/chart: cilium-debug-agent-0.7.4
  name: kagent-cilium-debug-role
rules:
  - apiGroups:
      - cilium.io
    resources:
      - "*"
    verbs:
      - "*"
  - apiGroups:
      - ""
    resources:
      - pods
      - nodes
      - namespaces
      - services
      - endpoints
      - componentstatuses
      - events
    verbs:
      - "*"
  - apiGroups:
      - ""
    resources:
      - pods/log
      - pods/exec
    verbs:
      - "*"
  - apiGroups:
      - networking.k8s.io
    resources:
      - "*"
    verbs:
      - "*"
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - "*"
