apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kagent
    app.kubernetes.io/part-of: kagent
    app.kubernetes.io/version: 0.7.4
    helm.sh/chart: kagent-0.7.4
  name: kagent-getter-role
rules:
  - apiGroups:
      - kagent.dev
    resources:
      - agents
      - modelconfigs
      - toolservers
      - memories
      - remotemcpservers
      - mcpservers
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - kagent.dev
    resources:
      - agents/finalizers
      - modelconfigs/finalizers
      - toolservers/finalizers
      - memories/finalizers
      - remotemcpservers/finalizers
      - mcpservers/finalizers
    verbs:
      - update
  - apiGroups:
      - kagent.dev
    resources:
      - agents/status
      - modelconfigs/status
      - toolservers/status
      - memories/status
      - remotemcpservers/status
      - mcpservers/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - gateway.networking.k8s.io/v1
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
