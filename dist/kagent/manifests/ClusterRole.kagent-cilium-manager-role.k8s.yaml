apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cilium-manager-agent
    app.kubernetes.io/part-of: kagent
    app.kubernetes.io/version: 0.7.4
    helm.sh/chart: cilium-manager-agent-0.7.4
  name: kagent-cilium-manager-role
rules:
  - apiGroups:
      - cilium.io
    resources:
      - "*"
    verbs:
      - "*"
  - apiGroups:
      - ""
    resources:
      - pods
      - nodes
      - namespaces
      - services
      - endpoints
      - componentstatuses
    verbs:
      - "*"
  - apiGroups:
      - ""
    resources:
      - pods/log
      - pods/exec
    verbs:
      - "*"
  - apiGroups:
      - apps
    resources:
      - deployments
      - daemonsets
      - statefulsets
      - replicasets
    verbs:
      - "*"
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
      - ingresses
    verbs:
      - "*"
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - "*"
  - apiGroups:
      - helm.toolkit.fluxcd.io
    resources:
      - helmreleases
    verbs:
      - "*"
