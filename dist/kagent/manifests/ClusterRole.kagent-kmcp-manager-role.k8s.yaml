apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kmcp
    app.kubernetes.io/version: 0.1.8
    control-plane: controller-manager
    helm.sh/chart: kmcp-0.1.8
  name: kagent-kmcp-manager-role
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - services
      - serviceaccounts
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - kagent.dev
    resources:
      - mcpservers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - kagent.dev
    resources:
      - mcpservers/finalizers
    verbs:
      - update
  - apiGroups:
      - kagent.dev
    resources:
      - mcpservers/status
    verbs:
      - get
      - patch
      - update
