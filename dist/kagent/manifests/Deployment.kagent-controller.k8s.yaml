apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kagent
    app.kubernetes.io/part-of: kagent
    app.kubernetes.io/version: 0.7.4
    helm.sh/chart: kagent-0.7.4
  name: kagent-controller
  namespace: kagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: kagent
      app.kubernetes.io/name: kagent
  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/instance: kagent
        app.kubernetes.io/name: kagent
    spec:
      containers:
        - args:
            - -default-model-config-name
            - default-model-config
            - -zap-log-level
            - info
            - -watch-namespaces
            - ""
            - -streaming-max-buf-size
            - 1Mi
            - -streaming-initial-buf-size
            - 4Ki
            - -streaming-timeout
            - 600s
            - -database-type
            - sqlite
            - -sqlite-database-path
            - /sqlite-volume/kagent.db
            - -image-registry
            - cr.kagent.dev
            - -image-repository
            - kagent-dev/kagent/app
            - -image-tag
            - 0.7.4
            - -image-pull-policy
            - IfNotPresent
          env:
            - name: KAGENT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LOG_LEVEL
              value: info
            - name: OTEL_TRACING_ENABLED
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://host.docker.internal:4317
            - name: OTEL_TRACING_EXPORTER_OTLP_ENDPOINT
              value: http://host.docker.internal:4317
            - name: OTEL_EXPORTER_OTLP_TRACES_TIMEOUT
              value: "15"
            - name: OTEL_EXPORTER_OTLP_TRACES_INSECURE
              value: "true"
            - name: OTEL_LOGGING_ENABLED
              value: "false"
            - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
              value: http://host.docker.internal:4317
            - name: OTEL_EXPORTER_OTLP_LOGS_TIMEOUT
              value: "15"
            - name: OTEL_EXPORTER_OTLP_LOGS_INSECURE
              value: "true"
          image: cr.kagent.dev/kagent-dev/kagent/controller:0.7.4
          imagePullPolicy: IfNotPresent
          name: controller
          ports:
            - containerPort: 8083
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - mountPath: /sqlite-volume
              name: sqlite-volume
      securityContext: {}
      serviceAccountName: kagent-controller
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 500Mi
          name: sqlite-volume
