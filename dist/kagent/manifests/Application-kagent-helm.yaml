apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "75"
  name: kagent-helm
  namespace: argocd
spec:
  destination:
    namespace: kagent
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: kagent
    helm:
      valuesObject:
        controller:
          logLevel: info
          replicas: 1
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 128Mi
        ingress:
          className: nginx
          enabled: true
          hosts:
            - host: kagent.cnoe.localtest.me
              paths:
                - path: /
                  pathType: Prefix
        kmcp:
          enabled: true
        namespace: kagent
        ui:
          enabled: true
          replicas: 1
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
    repoURL: ghcr.io/kagent-dev/kagent/helm
    targetRevision: 0.7.4
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
