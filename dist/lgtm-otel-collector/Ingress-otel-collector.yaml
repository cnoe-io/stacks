apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
  name: otel-collector
  namespace: observability
spec:
  ingressClassName: nginx
  rules:
    - host: otel-collector.cnoe.localtest.me
      http:
        paths:
          - backend:
              service:
                name: otel-collector
                port:
                  name: otlp-http
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - otel-collector.cnoe.localtest.me
