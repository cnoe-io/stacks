apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-70"
  labels:
    app: langfuse-minio
    app.kubernetes.io/component: blob-storage
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: langfuse
  name: langfuse-minio
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: langfuse-minio
        app.kubernetes.io/component: blob-storage
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: langfuse
    spec:
      containers:
        - args:
            - server
            - /data
            - --console-address
            - :9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  key: MINIO_ROOT_USER
                  name: langfuse-minio-credentials
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: MINIO_ROOT_PASSWORD
                  name: langfuse-minio-credentials
          image: minio/minio:RELEASE.2024-01-18T22-51-28Z
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          name: minio
          ports:
            - containerPort: 9000
              name: api
              protocol: TCP
            - containerPort: 9001
              name: console
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - mountPath: /data
              name: data
      initContainers:
        - command:
            - sh
            - -c
            - mkdir -p /data/langfuse
          image: minio/minio:RELEASE.2024-01-18T22-51-28Z
          name: create-bucket
          volumeMounts:
            - mountPath: /data
              name: data
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: langfuse-minio-pvc
