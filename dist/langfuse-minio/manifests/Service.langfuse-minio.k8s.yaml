apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-70"
  labels:
    app: langfuse-minio
    app.kubernetes.io/component: blob-storage
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: langfuse
  name: langfuse-minio
