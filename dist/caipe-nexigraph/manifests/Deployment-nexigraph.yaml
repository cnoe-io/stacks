apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nexigraph
    tier: rag
  name: nexigraph
  namespace: ai-platform-engineering
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexigraph
  template:
    metadata:
      labels:
        app: nexigraph
    spec:
      containers:
        - env:
            - name: NEO4J_ADDR
              value: neo4j://neo4j.ai-platform-engineering.svc.cluster.local:7687
            - name: NEO4J_ONTOLOGY_ADDR
              value: neo4j://neo4j.ai-platform-engineering.svc.cluster.local:7687
            - name: NEO4J_USERNAME
              value: neo4j
            - name: REDIS_URL
              value: redis://redis.ai-platform-engineering.svc.cluster.local:6379/0
          envFrom:
            - secretRef:
                name: llm-secret
            - secretRef:
                name: neo4j-secret
          image: ghcr.io/cnoe-io/caipe-rag-agent-ontology:0.2.8
          name: nexigraph
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 512Mi
      imagePullSecrets:
        - name: ghcr-pull-secret
