apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  annotations:
    kargo.akuity.io/color: blue
  labels:
    app.kubernetes.io/component: stage
    app.kubernetes.io/name: backstage-dev-stage
    app.kubernetes.io/part-of: kargo-pipelines
  name: backstage-dev
  namespace: kargo-pipelines
spec:
  promotionTemplate:
    spec:
      steps:
        - as: clone-repo
          config:
            checkout:
              - branch: main
                path: ./src
              - branch: stage/dev
                create: true
                path: ./out
            repoURL: ${{ vars.gitRepoURL }}
          uses: git-clone
        - as: clear-output
          config:
            path: ./out
          uses: git-clear
        - as: update-image
          config:
            images:
              - image: ${{ vars.imageRepoURL }}
                tag: ${{ imageFrom(vars.imageRepoURL).Tag }}
            path: ./src/${{ vars.overlayPath }}
          uses: kustomize-set-image
        - as: render-manifests
          config:
            path: ./src/${{ vars.overlayPath }}
            outPath: ./out/manifests/
          uses: kustomize-build
        - as: commit-changes
          config:
            message: |
              chore(dev): update backstage to ${{ imageFrom(vars.imageRepoURL).Tag }}

              Image: ${{ vars.imageRepoURL }}:${{ imageFrom(vars.imageRepoURL).Tag }}
            path: ./out
          uses: git-commit
        - as: push-changes
          config:
            path: ./out
          uses: git-push
        - as: sync-argocd
          config:
            apps:
              - name: ${{ vars.argoAppName }}
                namespace: argocd
                sources:
                  - desiredRevision: ${{ outputs['push-changes'].commit }}
                    repoURL: ${{ vars.gitRepoURL }}
          uses: argocd-update
      vars:
        - name: gitRepoURL
          value: https://github.com/PittampalliOrg/backstage-config.git
        - name: imageRepoURL
          value: ghcr.io/pittampalliorg/backstage
        - name: overlayPath
          value: overlays/dev
        - name: argoAppName
          value: backstage-dev
  requestedFreight:
    - origin:
        kind: Warehouse
        name: backstage
      sources:
        direct: true
