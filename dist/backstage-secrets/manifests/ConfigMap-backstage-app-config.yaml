apiVersion: v1
data:
  app-config.yaml: |
    # Kubernetes environment configuration for Backstage
    # Loaded after app-config.yaml from the image (provides auth, database, integrations)

    app:
      baseUrl: https://backstage.cnoe.localtest.me:8443

    backend:
      baseUrl: https://backstage.cnoe.localtest.me:8443
      listen: ':7007'
      reading:
        allow:
          - host: 'gitea.cnoe.localtest.me:8443'
          - host: '*.cnoe.localtest.me:8443'
      database:
        client: pg
        connection:
          host: postgresql.backstage.svc.cluster.local
          port: 5432
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}

    auth:
      environment: production
      session:
        secret: ${BACKSTAGE_SESSION_SECRET}
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: true
        keycloak-oidc:
          production:
            metadataUrl: ${KEYCLOAK_NAME_METADATA}
            clientId: backstage
            clientSecret: ${KEYCLOAK_CLIENT_SECRET}
            prompt: auto

    # Proxy endpoints
    proxy:
      endpoints:
        '/agent-forge':
          target: http://supervisor.ai-platform-engineering.svc.cluster.local:8000
          changeOrigin: true
          secure: false
          pathRewrite:
            '^/api/proxy/agent-forge/?': '/'
          credentials: 'dangerously-allow-unauthenticated'
          headers:
            X-Custom-Source: 'backstage'
          allowedMethods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS']
          allowedHeaders: ['Authorization', 'Content-Type']

    # Feature Flags - Using Flipt (OpenFeature-compliant gRPC API)
    # Flagd has been deprecated in favor of Flipt-only architecture
    featureFlags:
      flipt:
        host: flipt.feature-flags.svc.cluster.local
        port: 9000
        tls: false
      frontend:
        baseUrl: /api/feature-flags
        pollInterval: 30000

    # Agent Forge / CAIPE
    agentForge:
      baseUrl: /api/proxy/agent-forge
      botName: 'CAIPE'
      useOpenIDToken: false
      enableStreaming: false
      requestTimeout: 300
      headerTitle: 'CAIPE'
      headerSubtitle: 'AI Platform Engineer Assistant'
      inputPlaceholder: 'Ask CAIPE anything...'

    # Integrations (credentials from environment variables)
    # Host includes port for URL matching in catalog locations
    integrations:
      github:
        - host: github.com
          # GitHub App authentication (higher rate limits, better for orgs)
          apps:
            - appId: ${GITHUB_APP_ID}
              privateKey: ${GITHUB_PRIVATE_KEY}
              webhookSecret: ${GITHUB_WEBHOOK_SECRET}
      gitea:
        - host: gitea.cnoe.localtest.me:8443
          baseUrl: https://gitea.cnoe.localtest.me:8443
          apiBaseUrl: https://gitea.cnoe.localtest.me:8443/api/v1
          username: ${GITEA_USERNAME}
          password: ${GITEA_PASSWORD}

    # Catalog configuration
    # Global rules apply to all dynamically registered locations
    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Template, User, Group]
      # GitHub catalog providers for autodiscovery
      # Discovers catalog-info.yaml files in repositories
      providers:
        github:
          # Personal account - vpittamp
          vpittamp:
            organization: 'vpittamp'
            catalogPath: '/catalog-info.yaml'
            filters:
              branch: 'main'
              repository: '.*'
            schedule:
              frequency: { minutes: 30 }
              timeout: { minutes: 3 }
          # Organization - PittampalliOrg
          pittampalliorg:
            organization: 'PittampalliOrg'
            catalogPath: '/catalog-info.yaml'
            filters:
              branch: 'main'
              repository: '.*'
            schedule:
              frequency: { minutes: 30 }
              timeout: { minutes: 3 }
      locations:
        - type: url
          target: https://gitea.cnoe.localtest.me:8443/giteaAdmin/idpbuilder-ryzen-backstage-templates-entities/raw/branch/main/catalog-info.yaml
          rules:
            - allow: [Component, System, API, Resource, Location, Template, User, Group]
        # Keep local examples for fallback
        - type: file
          target: ./examples/entities.yaml
        - type: file
          target: ./examples/template/template.yaml
          rules:
            - allow: [Template]
        - type: file
          target: ./examples/org.yaml
          rules:
            - allow: [User, Group]

    # ArgoCD integration
    # Instance name must match templates' argoInstance field
    # Uses admin credentials from argocd-credentials secret
    argocd:
      baseUrl: https://argocd.cnoe.localtest.me:8443
      username: admin
      password: ${ARGOCD_ADMIN_PASSWORD}
      appLocatorMethods:
        - type: 'config'
          instances:
            - name: in-cluster
              url: https://argocd.cnoe.localtest.me:8443
              username: admin
              password: ${ARGOCD_ADMIN_PASSWORD}

    # Kargo URL for templates
    kargo:
      baseUrl: https://kargo.cnoe.localtest.me:8443

    # Dapr Configuration plugin settings
    # Connects to Dapr sidecar for configuration management
    # See: https://docs.dapr.io/developing-applications/building-blocks/configuration/
    daprConfiguration:
      host: localhost  # Dapr sidecar runs as localhost in the pod
      port: 3500       # Dapr HTTP port
      storeName: configstore  # Dapr configuration component name

    # Kubernetes plugin configuration
    # Enables viewing K8s resources (pods, deployments, etc.) for catalog components
    # Uses the Backstage service account to connect to the local cluster
    kubernetes:
      serviceLocatorMethod:
        type: 'multiTenant'
      clusterLocatorMethods:
        - type: 'config'
          clusters:
            - name: local-cluster
              url: https://kubernetes.default.svc
              authProvider: 'serviceAccount'
              skipTLSVerify: true
              skipMetricsLookup: true
      customResources:
        # ArgoCD Applications
        - group: 'argoproj.io'
          apiVersion: 'v1alpha1'
          plural: 'applications'
        # Argo Workflows
        - group: 'argoproj.io'
          apiVersion: 'v1alpha1'
          plural: 'workflows'
        # Kargo Stages
        - group: 'kargo.akuity.io'
          apiVersion: 'v1alpha1'
          plural: 'stages'

    # TechDocs configuration
    # Using 'local' builder - mkdocs-techdocs-core installed in container
    # generator.runIn: 'local' uses mkdocs directly (not Docker)
    # For production, configure a publisher (awsS3, googleGcs, azureBlobStorage)
    techdocs:
      builder: 'local'
      generator:
        runIn: 'local'
      publisher:
        type: 'local'

    # Permission framework - disabled for development
    # Enable and configure policies for production
    permission:
      enabled: false
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: config
    app.kubernetes.io/name: backstage
  name: backstage-app-config
  namespace: backstage
