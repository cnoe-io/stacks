apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-secrets
  namespace: backstage
spec:
  data:
    - remoteRef:
        key: keycloak-clients
        property: ARGOCD_SESSION_TOKEN
      secretKey: ARGOCD_SESSION_TOKEN
    - remoteRef:
        key: keycloak-clients
        property: BACKSTAGE_CLIENT_SECRET
      secretKey: BACKSTAGE_CLIENT_SECRET
    - remoteRef:
        key: BACKSTAGE-POSTGRES-PASSWORD
      secretKey: POSTGRES_PASSWORD
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: azure-keyvault-store
    - remoteRef:
        key: BACKSTAGE-SESSION-SECRET
      secretKey: SESSION_SECRET
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: azure-keyvault-store
    - remoteRef:
        key: GITHUB-APP-ID
      secretKey: GITHUB_APP_ID
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: azure-keyvault-store
    - remoteRef:
        key: GITHUB-CLIENT-ID
      secretKey: GITHUB_CLIENT_ID
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: azure-keyvault-store
    - remoteRef:
        key: GITHUB-CLIENT-SECRET
      secretKey: GITHUB_CLIENT_SECRET
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: azure-keyvault-store
    - remoteRef:
        key: GITHUB-PRIVATE-KEY
      secretKey: GITHUB_PRIVATE_KEY
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: azure-keyvault-store
    - remoteRef:
        key: GITHUB-WEBHOOK-SECRET
      secretKey: GITHUB_WEBHOOK_SECRET
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: azure-keyvault-store
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: keycloak
  target:
    name: backstage-env-vars
    template:
      data:
        ARGOCD_AUTH_TOKEN: argocd.token={{.ARGOCD_SESSION_TOKEN}}
        BACKSTAGE_SESSION_SECRET: '{{.SESSION_SECRET}}'
        GITHUB_APP_ID: '{{.GITHUB_APP_ID}}'
        GITHUB_CLIENT_ID: '{{.GITHUB_CLIENT_ID}}'
        GITHUB_CLIENT_SECRET: '{{.GITHUB_CLIENT_SECRET}}'
        GITHUB_PRIVATE_KEY: '{{.GITHUB_PRIVATE_KEY}}'
        GITHUB_WEBHOOK_SECRET: '{{.GITHUB_WEBHOOK_SECRET}}'
        KEYCLOAK_CLIENT_SECRET: '{{.BACKSTAGE_CLIENT_SECRET}}'
        KEYCLOAK_NAME_METADATA: https://keycloak.cnoe.localtest.me:8443/realms/cnoe/.well-known/openid-configuration
        POSTGRES_DB: backstage
        POSTGRES_HOST: postgresql.backstage.svc.cluster.local
        POSTGRES_PASSWORD: '{{.POSTGRES_PASSWORD}}'
        POSTGRES_PORT: "5432"
        POSTGRES_USER: backstage
      engineVersion: v2
