apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: tempo
  name: tempo
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
        - args:
            - -config.file=/etc/tempo/config.yaml
            - -target=all
          image: grafana/tempo:2.6.1
          livenessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 30
            periodSeconds: 30
          name: tempo
          ports:
            - containerPort: 3200
              name: http
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 9095
              name: grpc
          readinessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - mountPath: /etc/tempo
              name: config
            - mountPath: /data/tempo
              name: data
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      volumes:
        - configMap:
            name: tempo-config
          name: config
        - name: data
          persistentVolumeClaim:
            claimName: tempo-data
