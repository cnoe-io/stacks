apiVersion: v1
kind: Service
metadata:
  labels:
    app: tempo
  name: tempo
  namespace: observability
spec:
  ports:
    - name: http
      port: 3200
      targetPort: http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: grpc
      port: 9095
      targetPort: grpc
  selector:
    app: tempo
