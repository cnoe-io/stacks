apiVersion: v1
kind: Secret
metadata:
  name: attic-server-config
  namespace: nix-cache
stringData:
  server.toml: |
    listen = "[::]:8080"
    allowed-hosts = ["*"]
    api-endpoint = "https://attic.cnoe.localtest.me:8443/"

    [database]
    url = "sqlite:///var/lib/attic/server.db?mode=rwc"

    [storage]
    type = "s3"
    region = "us-east-1"
    bucket = "attic-cache"
    endpoint = "http://minio.nix-cache.svc.cluster.local:9000"

    [storage.credentials]
    access_key_id = "admin"
    secret_access_key = "minioadmin"

    # JWT signing configuration (required for authentication)
    # Using HMAC secret for testing - use RSA keys in production
    [jwt.signing]
    token-hs256-secret-base64 = "dGVzdC1zZWNyZXQtZm9yLWF0dGljLWJpbmFyeS1jYWNoZS1zZXJ2ZXI="

    [chunking]
    nar-size-threshold = 65536
    min-size = 16384
    avg-size = 65536
    max-size = 262144

    [compression]
    type = "zstd"
type: Opaque
