apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: supervisor
    tier: agent
  name: supervisor
  namespace: ai-platform-engineering
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supervisor
  template:
    metadata:
      labels:
        app: supervisor
    spec:
      containers:
        - command:
            - python
            - -m
            - ai_platform_engineering.multi_agents
            - platform-engineer
          env:
            - name: RAG_SERVER_URL
              value: http://rag-server.ai-platform-engineering.svc.cluster.local:8000
            - name: ENABLE_RAG_AGENT
              value: "true"
            - name: ENABLE_GITHUB
              value: "true"
            - name: ENABLE_ARGOCD
              value: "true"
            - name: ENABLE_BACKSTAGE
              value: "true"
            - name: GITHUB_AGENT_HOST
              value: agent-github.ai-platform-engineering.svc.cluster.local
            - name: ARGOCD_AGENT_HOST
              value: agent-argocd.ai-platform-engineering.svc.cluster.local
            - name: BACKSTAGE_AGENT_HOST
              value: agent-backstage.ai-platform-engineering.svc.cluster.local
            - name: RAG_AGENT_AGENT_HOST
              value: rag-server.ai-platform-engineering.svc.cluster.local
            - name: SKIP_AGENT_CONNECTIVITY_CHECK
              value: "false"
          envFrom:
            - secretRef:
                name: llm-secret
          image: ghcr.io/cnoe-io/ai-platform-engineering:latest
          name: supervisor
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 512Mi
      imagePullSecrets:
        - name: ghcr-pull-secret
