apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "51"
  name: caipe-argocd-token-push
  namespace: argocd
spec:
  data:
    - match:
        remoteRef:
          remoteKey: CAIPE-ARGOCD-TOKEN-LOCALDEV
        secretKey: token
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: azure-keyvault-store
  selector:
    secret:
      name: caipe-argocd-token
  updatePolicy: Replace
