apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: dapr-dashboard
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/name: dapr-dashboard
    app.kubernetes.io/part-of: dapr
    app.kubernetes.io/version: 0.15.0
  name: dapr-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dapr-dashboard
  template:
    metadata:
      labels:
        app: dapr-dashboard
        app.kubernetes.io/managed-by: helm
        app.kubernetes.io/name: dapr-dashboard
        app.kubernetes.io/part-of: dapr
        app.kubernetes.io/version: 0.15.0
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
      containers:
        - env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          image: docker.io/daprio/dashboard:0.15.0
          imagePullPolicy: IfNotPresent
          name: dapr-dashboard
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
      serviceAccountName: dapr-dashboard
