apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  name: backstage-api-token-sync
  namespace: argocd
spec:
  destination:
    namespace: backstage
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://backstage-api-token-sync/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
