apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-19"
  name: backstage-api-token-push
  namespace: backstage
spec:
  data:
    - match:
        remoteRef:
          remoteKey: CAIPE-BACKSTAGE-API-TOKEN-LOCALDEV
        secretKey: token
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: azure-keyvault-store
  selector:
    secret:
      name: backstage-api-token
  updatePolicy: Replace
