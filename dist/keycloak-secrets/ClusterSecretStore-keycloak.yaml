apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: keycloak
spec:
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: eso-store-keycloak
          namespace: keycloak
      remoteNamespace: keycloak
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: keycloak
          type: ConfigMap
