apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-auth-key
  namespace: tailscale
spec:
  data:
    - remoteRef:
        key: TAILSCALE-AUTH-KEY
      secretKey: authKey
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    creationPolicy: Owner
    name: tailscale-auth-key
