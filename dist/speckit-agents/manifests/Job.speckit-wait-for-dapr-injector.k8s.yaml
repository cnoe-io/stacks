apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app.kubernetes.io/component: presync-hook
    app.kubernetes.io/name: speckit-wait-for-dapr-injector
    app.kubernetes.io/part-of: speckit
  name: speckit-wait-for-dapr-injector
  namespace: dapr-agents
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: speckit-wait-for-dapr-injector
    spec:
      containers:
        - args:
            - "echo \"Waiting for Dapr sidecar injector webhook to be ready...\" &&                    for i in $(seq 1 60); do                      CA=$(kubectl get mutatingwebhookconfiguration dapr-sidecar-injector -o jsonpath='{.webhooks[0].clientConfig.caBundle}' 2>/dev/null);                      if [ -n \"$CA\" ] && echo \"$CA\" | grep -q '^[A-Za-z0-9]'; then                        echo \"Dapr sidecar injector is ready with CA bundle!\";                        sleep 5;                        exit 0;                      fi;                      echo \"Attempt $i: Dapr sidecar injector not ready, waiting...\";                      sleep 2;                    done &&                    echo \"Timeout waiting for Dapr sidecar injector\" && exit 1"
          command:
            - sh
            - -c
          image: bitnami/kubectl:latest
          name: wait-for-dapr
      restartPolicy: OnFailure
      serviceAccountName: speckit-agents
  ttlSecondsAfterFinished: 60
