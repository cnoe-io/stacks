apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: caipe-nexigraph
  namespace: argocd
spec:
  destination:
    namespace: ai-platform-engineering
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./dist/caipe-nexigraph
    repoURL: cnoe://
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
