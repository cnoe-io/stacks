apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
  name: caipe-neo4j
  namespace: argocd
spec:
  destination:
    namespace: ai-platform-engineering
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./dist/caipe-neo4j
    repoURL: cnoe://
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
