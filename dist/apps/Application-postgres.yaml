apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  name: postgres
  namespace: argocd
spec:
  destination:
    namespace: nextjs
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./dist/postgres
    repoURL: cnoe://
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
