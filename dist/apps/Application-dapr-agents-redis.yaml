apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
  name: dapr-agents-redis
  namespace: argocd
spec:
  destination:
    namespace: dapr-agents
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./dist/dapr-agents-redis
    repoURL: cnoe://
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
