apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
  name: headlamp
  namespace: headlamp
spec:
  ingressClassName: nginx
  rules:
    - host: cnoe.localtest.me
      http:
        paths:
          - backend:
              service:
                name: headlamp
                port:
                  name: http
            path: /headlamp(/|$)(.*)
            pathType: ImplementationSpecific
