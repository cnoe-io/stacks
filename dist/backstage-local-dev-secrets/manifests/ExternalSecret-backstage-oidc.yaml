apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-oidc
  namespace: backstage-local-dev
spec:
  data:
    - remoteRef:
        key: keycloak-clients
        property: ARGOCD_SESSION_TOKEN
      secretKey: ARGOCD_SESSION_TOKEN
    - remoteRef:
        key: keycloak-clients
        property: BACKSTAGE_CLIENT_SECRET
      secretKey: BACKSTAGE_CLIENT_SECRET
    - remoteRef:
        key: BACKSTAGE-POSTGRES-PASSWORD
      secretKey: POSTGRES_PASSWORD
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: azure-keyvault-store
    - remoteRef:
        key: BACKSTAGE-SESSION-SECRET
      secretKey: SESSION_SECRET
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: azure-keyvault-store
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: keycloak
  target:
    name: backstage-env-vars
    template:
      data:
        ARGOCD_AUTH_TOKEN: argocd.token={{.ARGOCD_SESSION_TOKEN}}
        ARGO_CD_URL: https://argocd.cnoe.localtest.me:8443
        ARGO_WORKFLOWS_URL: https://cnoe.localtest.me:8443/argo-workflows
        BACKSTAGE_FRONTEND_URL: https://cnoe.localtest.me:8443/backstage
        BACKSTAGE_SESSION_SECRET: '{{.SESSION_SECRET}}'
        GITEA_HOST: gitea.cnoe.localtest.me:8443
        GITEA_URL: https://gitea.cnoe.localtest.me:8443
        KEYCLOAK_CLIENT_SECRET: '{{.BACKSTAGE_CLIENT_SECRET}}'
        KEYCLOAK_NAME_METADATA: https://keycloak.cnoe.localtest.me:8443/realms/cnoe/.well-known/openid-configuration
        POSTGRES_DB: backstage
        POSTGRES_HOST: postgresql.backstage-local-dev.svc.cluster.local
        POSTGRES_PASSWORD: '{{.POSTGRES_PASSWORD}}'
        POSTGRES_PORT: "5432"
        POSTGRES_USER: backstage
      engineVersion: v2
