apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-credentials
  namespace: backstage-local-dev
spec:
  data:
    - remoteRef:
        key: argocd-initial-admin-secret
        property: password
      secretKey: ARGOCD_ADMIN_PASSWORD
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: argocd
  target:
    name: argocd-credentials
