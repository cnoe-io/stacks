gitea:
  admin:
    username: "giteaadmin"
    password: "developer"
    email: "giteaadmin@cnoe.localtest.me"
    passwordMode: initialOnlyNoReset
  config:
    server:
      DOMAIN: gitea.cnoe.localtest.me
      ROOT_URL: https://gitea.cnoe.localtest.me
      SSH_DOMAIN: gitea.cnoe.localtest.me
    webhook:
      ALLOWED_HOST_LIST: "*"
      SKIP_TLS_VERIFY: true
    actions:
      ENABLED: true
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: gitea.cnoe.localtest.me
      paths:
        - path: /
          pathType: Prefix
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  tls:
    - hosts:
      - gitea.cnoe.localtest.me
