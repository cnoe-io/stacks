kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraMounts:
    # Mount Azure Workload Identity service account keys
    - hostPath: /home/vpittamp/repos/PittampalliOrg/stacks/101-improve-tailscale/ref-implementation/azure-workload-identity/keys
      containerPath: /etc/kubernetes/pki/custom-keys
      readOnly: true
    # Mount NixOS images directory for KubeVirt VMs
    - hostPath: /home/vpittamp/repos/PittampalliOrg/stacks/101-improve-tailscale/nixos-images
      containerPath: /home/vpittamp/repos/PittampalliOrg/stacks/101-improve-tailscale/nixos-images
      readOnly: true

  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        # Azure Workload Identity OIDC issuer
        service-account-issuer: "https://oidcissuer65846b7df97b.z13.web.core.windows.net/"
        service-account-key-file: /etc/kubernetes/pki/custom-keys/sa.pub
        service-account-signing-key-file: /etc/kubernetes/pki/custom-keys/sa.key
    controllerManager:
      extraArgs:
        service-account-private-key-file: /etc/kubernetes/pki/custom-keys/sa.key
