kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraMounts:
    # Mount Azure Workload Identity service account keys
    - hostPath: /home/vpittamp/repos/PittampalliOrg/stacks/main/ref-implementation/azure-workload-identity/keys
      containerPath: /etc/kubernetes/pki/custom-keys
      readOnly: true
    # Mount Docker Hub registry config (with auth from 1Password)
    - hostPath: /home/vpittamp/repos/PittampalliOrg/stacks/main/deployment/config/containerd
      containerPath: /etc/containerd/certs.d
      readOnly: true

  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        # Azure Workload Identity OIDC issuer
        service-account-issuer: "https://oidcissuer65846b7df97b.z13.web.core.windows.net/"
        service-account-key-file: /etc/kubernetes/pki/custom-keys/sa.pub
        service-account-signing-key-file: /etc/kubernetes/pki/custom-keys/sa.key
    controllerManager:
      extraArgs:
        service-account-private-key-file: /etc/kubernetes/pki/custom-keys/sa.key

- role: worker
  extraMounts:
    # Mount Docker Hub registry config (with auth from 1Password)
    - hostPath: /home/vpittamp/repos/PittampalliOrg/stacks/main/deployment/config/containerd
      containerPath: /etc/containerd/certs.d
      readOnly: true

- role: worker
  extraMounts:
    # Mount Docker Hub registry config (with auth from 1Password)
    - hostPath: /home/vpittamp/repos/PittampalliOrg/stacks/main/deployment/config/containerd
      containerPath: /etc/containerd/certs.d
      readOnly: true

containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry]
    config_path = "/etc/containerd/certs.d"
