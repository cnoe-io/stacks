apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "45"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/component: secrets
    app.kubernetes.io/environment: dev
    app.kubernetes.io/managed-by: cdk8s
    app.kubernetes.io/name: headlamp-keycloak-secrets
    app.kubernetes.io/part-of: headlamp
    example: basic
  name: headlamp-keycloak-secrets
  namespace: argocd
spec:
  destination:
    namespace: headlamp
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - group: external-secrets.io
      jqPathExpressions:
        - .spec.refreshInterval
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.creationPolicy
        - .spec.target.deletionPolicy
        - .spec.target.template.engineVersion
        - .spec.target.template.mergePolicy
      kind: ExternalSecret
    - group: external-secrets.io
      jsonPointers:
        - /spec
      kind: ClusterSecretStore
  project: default
  source:
    path: "."
    repoURL: cnoe://headlamp-keycloak-secrets/manifests
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
      limit: 10
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
