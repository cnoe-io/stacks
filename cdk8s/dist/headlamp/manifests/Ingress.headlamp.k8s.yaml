apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  name: headlamp
  namespace: headlamp
spec:
  ingressClassName: nginx
  rules:
    - host: headlamp.talos.cnoe.localtest.me
      http:
        paths:
          - backend:
              service:
                name: headlamp
                port:
                  number: 80
            path: /
            pathType: Prefix
