apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-ghcr-chat-credentials-external
  namespace: kargo-pipelines
  labels:
    app.kubernetes.io/name: kargo-ghcr-chat-credentials
    app.kubernetes.io/part-of: kargo-pipelines
    app.kubernetes.io/component: credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  data:
    - remoteRef:
        key: GITHUB-PAT
      secretKey: pat
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: kargo-ghcr-chat-credentials
    template:
      data:
        password: "{{ .pat }}"
        pat: "{{ .pat }}"
        repoURL: ghcr.io/pittampalliorg/chat
        username: pittampalliorg
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          app.kubernetes.io/name: kargo-ghcr-chat-credentials
          app.kubernetes.io/part-of: kargo-pipelines
          kargo.akuity.io/cred-type: image
