apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kagent
    app.kubernetes.io/part-of: kagent
    app.kubernetes.io/version: 0.7.4
    helm.sh/chart: kagent-0.7.4
  name: kagent-ui
  namespace: kagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: ui
      app.kubernetes.io/instance: kagent
      app.kubernetes.io/name: kagent
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ui
        app.kubernetes.io/instance: kagent
        app.kubernetes.io/name: kagent
    spec:
      containers:
        - env:
            - name: NEXT_PUBLIC_BACKEND_URL
              value: http://kagent-controller.kagent.svc.cluster.local:8083/api
          image: cr.kagent.dev/kagent-dev/kagent/ui:0.7.4
          imagePullPolicy: IfNotPresent
          name: ui
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext: {}
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 1
            periodSeconds: 1
      securityContext: {}
      serviceAccountName: kagent-ui
