apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  labels:
    app: agentgateway
  name: agentgateway
  namespace: kgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - allowedRoutes:
        namespaces:
          from: All
      name: http
      port: 8080
      protocol: HTTP
