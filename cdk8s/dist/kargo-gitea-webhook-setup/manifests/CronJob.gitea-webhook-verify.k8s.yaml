apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitea-webhook-verify
  namespace: kargo-pipelines
spec:
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          containers:
            - args:
                - /scripts/setup-webhooks.sh
              command:
                - /bin/sh
              image: curlimages/curl:8.5.0
              name: webhook-verify
              volumeMounts:
                - mountPath: /scripts
                  name: script
                  readOnly: true
                - mountPath: /gitea-credentials
                  name: gitea-credentials
                  readOnly: true
          restartPolicy: OnFailure
          volumes:
            - configMap:
                defaultMode: 493
                name: gitea-webhook-setup-script
              name: script
            - name: gitea-credentials
              secret:
                items:
                  - key: token
                    path: token
                secretName: gitea-credentials
      ttlSecondsAfterFinished: 3600
  schedule: 0 */6 * * *
  successfulJobsHistoryLimit: 1
