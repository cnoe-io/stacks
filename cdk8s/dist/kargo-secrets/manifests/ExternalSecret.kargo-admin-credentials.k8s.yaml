apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-admin-credentials
  namespace: kargo
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
spec:
  data:
    - remoteRef:
        key: KARGO-ADMIN-PASSWORD-HASH
      secretKey: KARGO_ADMIN_PASSWORD_HASH
    - remoteRef:
        key: KARGO-ADMIN-TOKEN-SIGNING-KEY
      secretKey: KARGO_ADMIN_TOKEN_SIGNING_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    creationPolicy: Owner
    name: kargo-admin-credentials
    template:
      data:
        KARGO_ADMIN_PASSWORD_HASH: "{{ .KARGO_ADMIN_PASSWORD_HASH }}"
        KARGO_ADMIN_TOKEN_SIGNING_KEY: "{{ .KARGO_ADMIN_TOKEN_SIGNING_KEY }}"
        passwordHash: "{{ .KARGO_ADMIN_PASSWORD_HASH }}"
        tokenSigningKey: "{{ .KARGO_ADMIN_TOKEN_SIGNING_KEY }}"
      engineVersion: v2
      type: Opaque
