apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "75"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/component: project
    app.kubernetes.io/environment: dev
    app.kubernetes.io/managed-by: cdk8s
    app.kubernetes.io/name: kargo-pipelines-project
    app.kubernetes.io/part-of: kargo-pipelines
    example: basic
  name: kargo-pipelines-project
  namespace: argocd
spec:
  destination:
    namespace: kargo-pipelines
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - group: kargo.akuity.io
      jsonPointers:
        - /status
      kind: Project
    - group: kargo.akuity.io
      jsonPointers:
        - /status
      kind: ProjectConfig
  project: default
  source:
    path: "."
    repoURL: cnoe://kargo-pipelines-project/manifests
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
