apiVersion: v1
kind: Pod
metadata:
  labels:
    app: tailscale-subnet-router
    app.kubernetes.io/component: subnet-router
    app.kubernetes.io/name: tailscale-subnet-router
  name: tailscale-subnet-router
  namespace: tailscale
spec:
  containers:
    - env:
        - name: TS_KUBE_SECRET
          value: tailscale-subnet-state
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              key: authKey
              name: tailscale-auth-key
        - name: TS_ROUTES
          value: 10.244.0.0/16,10.96.0.0/16
        - name: TS_USERSPACE
          value: "true"
        - name: TS_ACCEPT_DNS
          value: "false"
        - name: TS_STATE_DIR
          value: /tmp
      image: ghcr.io/tailscale/tailscale:latest
      name: tailscale
      securityContext:
        runAsGroup: 1000
        runAsUser: 1000
  initContainers:
    - args:
        - |
          
          echo "Waiting for secret tailscale-auth-key to exist..."
          while ! kubectl get secret tailscale-auth-key -n tailscale > /dev/null 2>&1; do
            echo "Secret not found, waiting 5s..."
            sleep 5
          done
          echo "Secret tailscale-auth-key found, proceeding..."
      command:
        - /bin/sh
        - -c
      image: bitnami/kubectl:latest
      name: wait-for-secret
  serviceAccountName: tailscale-subnet-router
