apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    app.kubernetes.io/managed-by: cdk8s
  labels:
    app.kubernetes.io/component: external-webhooks-server
    app.kubernetes.io/instance: kargo
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kargo
    app.kubernetes.io/version: v1.7.1
    helm.sh/chart: kargo-1.7.1
  name: kargo-external-webhooks-server
  namespace: kargo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: external-webhooks-server
      app.kubernetes.io/instance: kargo
      app.kubernetes.io/name: kargo
  strategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        configmap/checksum: 5979dd791f0e59d54d2ec7def26bd9e179321e31ddd8f96e42338536c90f1ee3
      labels:
        app.kubernetes.io/component: external-webhooks-server
        app.kubernetes.io/instance: kargo
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: kargo
        app.kubernetes.io/version: v1.7.1
        helm.sh/chart: kargo-1.7.1
    spec:
      containers:
        - args:
            - external-webhooks-server
          command:
            - /sbin/tini
            - --
            - /usr/local/bin/kargo
          env:
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: webhooks-server
                  divisor: "1"
                  resource: limits.memory
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  containerName: webhooks-server
                  divisor: "1"
                  resource: limits.cpu
          envFrom:
            - configMapRef:
                name: kargo-external-webhooks-server
          image: ghcr.io/akuity/kargo:v1.7.1
          imagePullPolicy: IfNotPresent
          name: webhooks-server
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources: {}
      serviceAccount: kargo-external-webhooks-server
