apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    app.kubernetes.io/managed-by: cdk8s
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: kargo
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kargo
    app.kubernetes.io/version: v1.7.1
    helm.sh/chart: kargo-1.7.1
  name: kargo-controller
  namespace: kargo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: kargo
      app.kubernetes.io/name: kargo
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        configmap/checksum: 4a4137c52602274c67bff80df6ed6651898bfd80d2fd6022725a5d47405d2480
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/instance: kargo
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: kargo
        app.kubernetes.io/version: v1.7.1
        helm.sh/chart: kargo-1.7.1
    spec:
      containers:
        - args:
            - controller
          command:
            - /sbin/tini
            - --
            - /usr/local/bin/kargo
          env:
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: controller
                  divisor: "1"
                  resource: limits.memory
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  containerName: controller
                  divisor: "1"
                  resource: limits.cpu
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/gitea-ca.crt
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs
          envFrom:
            - configMapRef:
                name: kargo-controller
          image: ghcr.io/akuity/kargo:v1.7.1
          imagePullPolicy: IfNotPresent
          name: controller
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - mountPath: /tmp
              name: tmp-data
            - mountPath: /etc/ssl/certs/gitea-ca.crt
              name: ca-certificates
              readOnly: true
              subPath: gitea-ca.crt
      serviceAccount: kargo-controller
      volumes:
        - emptyDir: {}
          name: tmp-data
        - configMap:
            items:
              - key: ca.crt
                path: gitea-ca.crt
            name: gitea-ca-cert
          name: ca-certificates
