apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    app.kubernetes.io/managed-by: cdk8s
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: kargo
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kargo
    app.kubernetes.io/version: v1.7.1
    helm.sh/chart: kargo-1.7.1
  name: kargo-api
  namespace: kargo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      app.kubernetes.io/instance: kargo
      app.kubernetes.io/name: kargo
  strategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        configmap/checksum: 8f948edd8f29e10cf765ad10680f05f2dbfadddb3543dbcc5f1859a4d2d7dce0
        secret/checksum: 1112da1a0d8adfde7dedba0371588cc86a0414061482d0ff39a39375594a9ccc
      labels:
        app.kubernetes.io/component: api
        app.kubernetes.io/instance: kargo
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: kargo
        app.kubernetes.io/version: v1.7.1
        helm.sh/chart: kargo-1.7.1
    spec:
      containers:
        - command:
            - /usr/local/bin/kargo
            - api
          env:
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: api
                  divisor: "1"
                  resource: limits.memory
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  containerName: api
                  divisor: "1"
                  resource: limits.cpu
          envFrom:
            - configMapRef:
                name: kargo-api
            - secretRef:
                name: kargo-api
          image: ghcr.io/akuity/kargo:v1.7.1
          imagePullPolicy: IfNotPresent
          livenessProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 10
          name: api
          ports:
            - containerPort: 8080
              name: h2c
              protocol: TCP
          readinessProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
      serviceAccount: kargo-api
