apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: kargo
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kargo
    app.kubernetes.io/version: v1.7.1
    helm.sh/chart: kargo-1.7.1
  name: kargo-api
  namespace: kargo
data:
  ADMIN_ACCOUNT_ENABLED: "true"
  ADMIN_ACCOUNT_TOKEN_AUDIENCE: kargo.talos.cnoe.localtest.me
  ADMIN_ACCOUNT_TOKEN_ISSUER: http://kargo.talos.cnoe.localtest.me
  ADMIN_ACCOUNT_TOKEN_TTL: 24h
  CLUSTER_SECRETS_NAMESPACE: kargo-cluster-secrets
  KARGO_NAMESPACE: kargo
  LOG_LEVEL: INFO
  PERMISSIVE_CORS_POLICY_ENABLED: "false"
  ROLLOUTS_INTEGRATION_ENABLED: "true"
  SECRET_MANAGEMENT_ENABLED: "true"
