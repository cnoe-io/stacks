apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
  labels:
    app: minio
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/name: minio
  name: minio-storage
  namespace: nix-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
