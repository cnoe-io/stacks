apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
  labels:
    app: minio
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/name: minio
  name: minio
  namespace: nix-cache
spec:
  ports:
    - name: api
      port: 9000
      protocol: TCP
      targetPort: 9000
    - name: console
      port: 9001
      protocol: TCP
      targetPort: 9001
  selector:
    app: minio
  type: ClusterIP
