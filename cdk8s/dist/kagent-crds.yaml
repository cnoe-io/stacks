apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-115"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/component: crds
    app.kubernetes.io/environment: talos
    app.kubernetes.io/managed-by: cdk8s
    app.kubernetes.io/name: kagent-crds
    app.kubernetes.io/part-of: kagent
    example: basic
  name: kagent-crds
  namespace: argocd
spec:
  destination:
    namespace: kagent
    server: https://kubernetes.default.svc
  project: default
  sources:
    - path: cdk8s/dist/kagent-crds/manifests
      repoURL: https://github.com/PittampalliOrg/stacks.git
      targetRevision: 106-consolidate-bootstrap-between
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
