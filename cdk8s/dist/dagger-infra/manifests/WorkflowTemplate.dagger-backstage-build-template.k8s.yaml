apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  labels:
    app.kubernetes.io/component: workflow-template
    app.kubernetes.io/name: dagger-backstage-build-template
    app.kubernetes.io/part-of: dagger
  name: dagger-backstage-build-template
  namespace: argo
spec:
  entrypoint: backstage-build-deploy
  serviceAccountName: argo-workflow
  templates:
    - dag:
        tasks:
          - arguments:
              parameters:
                - name: repo-url
                  value: "{{inputs.parameters.git-url}}"
                - name: branch
                  value: "{{inputs.parameters.branch}}"
            name: clone-repo
            template: git-clone
          - arguments:
              parameters:
                - name: registry
                  value: "{{inputs.parameters.registry}}"
                - name: image-tag
                  value: "{{inputs.parameters.image-tag}}"
            dependencies:
              - clone-repo
            name: build-image
            template: dagger-build-backstage
          - arguments:
              parameters:
                - name: image
                  value: "{{inputs.parameters.registry}}/backstage:{{inputs.parameters.image-tag}}"
            dependencies:
              - build-image
            name: deploy-to-kind
            template: kubectl-apply
      inputs:
        parameters:
          - default: https://gitea.cnoe.localtest.me:8443/giteaadmin/backstage-cnoe.git
            name: git-url
          - default: main
            name: branch
          - default: localhost:5000
            name: registry
          - default: latest
            name: image-tag
      name: backstage-build-deploy
    - container:
        args:
          - git clone {{inputs.parameters.repo-url}} /workspace && cd /workspace && git checkout {{inputs.parameters.branch}}
        command:
          - sh
          - -c
        image: alpine/git:latest
        volumeMounts:
          - mountPath: /workspace
            name: workspace
      inputs:
        parameters:
          - name: repo-url
          - name: branch
      name: git-clone
    - container:
        args:
          - cd /workspace &&                 dagger run build --dockerfile=./Dockerfile                 --push {{inputs.parameters.registry}}/backstage:{{inputs.parameters.image-tag}}
        command:
          - sh
          - -c
        image: registry.dagger.io/dagger:latest
        volumeMounts:
          - mountPath: /workspace
            name: workspace
          - mountPath: /var/run/docker.sock
            name: dagger-engine
      inputs:
        parameters:
          - name: registry
          - name: image-tag
      name: dagger-build-backstage
    - container:
        args:
          - kubectl set image deployment/backstage backstage={{inputs.parameters.image}} -n backstage
        command:
          - sh
          - -c
        image: alpine/kubectl:latest
      inputs:
        parameters:
          - name: image
      name: kubectl-apply
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
  volumes:
    - hostPath:
        path: /var/run/docker.sock
        type: Socket
      name: dagger-engine
