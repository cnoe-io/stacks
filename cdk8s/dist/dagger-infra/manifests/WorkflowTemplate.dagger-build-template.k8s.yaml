apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  labels:
    app.kubernetes.io/component: workflow-template
    app.kubernetes.io/name: dagger-build-template
    app.kubernetes.io/part-of: dagger
  name: dagger-build-template
  namespace: argo
spec:
  entrypoint: dagger-build
  serviceAccountName: argo-workflow
  templates:
    - container:
        args:
          - git clone {{inputs.parameters.repo-url}} /workspace &&                 cd /workspace &&                 git checkout {{inputs.parameters.branch}} &&                 dagger run build --push {{inputs.parameters.registry}}/{{inputs.parameters.image-name}}:{{workflow.name}}
        command:
          - sh
          - -c
        env:
          - name: DAGGER_CLOUD_TOKEN
            valueFrom:
              secretKeyRef:
                key: token
                name: dagger-cloud-token
                optional: true
        image: registry.dagger.io/dagger:latest
        volumeMounts:
          - mountPath: /var/run/docker.sock
            name: dagger-engine
      inputs:
        parameters:
          - description: Git repository URL
            name: repo-url
          - default: main
            description: Git branch to build
            name: branch
          - description: Docker image name to build
            name: image-name
          - default: localhost:5000
            description: Container registry URL
            name: registry
      name: dagger-build
      volumes:
        - hostPath:
            path: /var/run/docker.sock
            type: Socket
          name: dagger-engine
