apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-85"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/component: secrets
    app.kubernetes.io/environment: talos
    app.kubernetes.io/managed-by: cdk8s
    app.kubernetes.io/name: tailscale-secrets
    app.kubernetes.io/part-of: tailscale
    example: basic
  name: tailscale-secrets
  namespace: argocd
spec:
  destination:
    namespace: tailscale
    server: https://kubernetes.default.svc
  project: default
  sources:
    - path: cdk8s/dist/talos/tailscale-secrets/manifests
      repoURL: https://github.com/PittampalliOrg/stacks.git
      targetRevision: 102-bootstrap-talos-argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
