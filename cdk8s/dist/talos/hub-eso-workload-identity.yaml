apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-90"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/component: workload-identity
    app.kubernetes.io/environment: dev
    app.kubernetes.io/managed-by: cdk8s
    app.kubernetes.io/name: hub-eso-workload-identity
    app.kubernetes.io/part-of: hub-cluster
    example: basic
  name: hub-eso-workload-identity
  namespace: argocd
spec:
  destination:
    namespace: external-secrets
    server: https://kubernetes.default.svc
  project: default
  sources:
    - path: cdk8s/dist/hub-eso-workload-identity/manifests
      repoURL: https://github.com/PittampalliOrg/stacks.git
      targetRevision: rendered/talos/108-hub-and-spoke
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
