apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-24"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/component: crds
    app.kubernetes.io/environment: talos
    app.kubernetes.io/managed-by: cdk8s
    app.kubernetes.io/name: kgateway-crds
    app.kubernetes.io/part-of: kgateway
    example: basic
  name: kgateway-crds
  namespace: argocd
spec:
  destination:
    namespace: kgateway-system
    server: https://kubernetes.default.svc
  project: default
  sources:
    - path: cdk8s/dist/talos/kgateway-crds/manifests
      repoURL: https://github.com/PittampalliOrg/stacks.git
      targetRevision: 102-bootstrap-talos-argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
