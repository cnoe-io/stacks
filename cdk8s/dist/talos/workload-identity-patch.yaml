apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-94"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/component: identity
    app.kubernetes.io/environment: talos
    app.kubernetes.io/managed-by: cdk8s
    app.kubernetes.io/name: workload-identity-patch
    app.kubernetes.io/part-of: platform
    example: basic
  name: workload-identity-patch
  namespace: argocd
spec:
  destination:
    namespace: external-secrets
    server: https://kubernetes.default.svc
  project: default
  sources:
    - path: cdk8s/dist/talos/workload-identity-patch/manifests
      repoURL: https://github.com/PittampalliOrg/stacks.git".git
      targetRevision: '"102-bootstrap-talos-argocd"'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
