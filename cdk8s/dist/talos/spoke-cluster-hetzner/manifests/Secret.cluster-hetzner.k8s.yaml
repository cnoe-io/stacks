apiVersion: v1
kind: Secret
metadata:
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-wave: "-75"
    hub-spoke/credentials-secret: spoke-creds-hetzner
    hub-spoke/server-url: https://k8s-api-hetzner.tail286401.ts.net
  labels:
    app.kubernetes.io/component: cluster-registration
    app.kubernetes.io/name: cluster-hetzner
    app.kubernetes.io/part-of: hub-spoke
    argocd.argoproj.io/secret-type: cluster
    cluster-host: hetzner
    cluster-type: production
    managed-by: cdk8s
  name: cluster-hetzner
  namespace: argocd
stringData:
  config: |-
    {
      "tlsClientConfig": {
        "insecure": false,
        "caData": "{{ .caData }}"
      },
      "bearerToken": "{{ .bearerToken }}"
    }
  name: hetzner
  server: https://k8s-api-hetzner.tail286401.ts.net
type: Opaque
