apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-60"
  labels:
    app: langfuse-worker
    app.kubernetes.io/component: llm-observability
    app.kubernetes.io/name: langfuse-worker
    app.kubernetes.io/part-of: observability
  name: langfuse-worker
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-worker
  template:
    metadata:
      labels:
        app: langfuse-worker
        app.kubernetes.io/component: llm-observability
        app.kubernetes.io/name: langfuse-worker
        app.kubernetes.io/part-of: observability
    spec:
      containers:
        - env:
            - name: HOSTNAME
              value: 0.0.0.0
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_USER
                  name: langfuse-postgres-credentials
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: langfuse-postgres-credentials
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@langfuse-postgres:5432/langfuse
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_PASSWORD
              value: clickhouse_langfuse_password
            - name: CLICKHOUSE_URL
              value: http://default:clickhouse_langfuse_password@langfuse-clickhouse:8123
            - name: CLICKHOUSE_MIGRATION_URL
              value: clickhouse://default:clickhouse_langfuse_password@langfuse-clickhouse:9000
            - name: REDIS_HOST
              value: langfuse-redis
            - name: REDIS_PORT
              value: "6379"
            - name: LANGFUSE_S3_BUCKET_NAME
              value: langfuse
            - name: LANGFUSE_S3_ENDPOINT
              value: http://langfuse-minio:9000
            - name: LANGFUSE_S3_ACCESS_KEY_ID
              value: minioadmin
            - name: LANGFUSE_S3_SECRET_ACCESS_KEY
              value: minio_langfuse_password
            - name: AWS_ACCESS_KEY_ID
              value: minioadmin
            - name: AWS_SECRET_ACCESS_KEY
              value: minio_langfuse_password
            - name: LANGFUSE_S3_REGION
              value: us-east-1
            - name: AWS_REGION
              value: us-east-1
            - name: LANGFUSE_S3_FORCE_PATH_STYLE
              value: "true"
            - name: AWS_ENDPOINT_URL_S3
              value: http://langfuse-minio:9000
            - name: AWS_S3_FORCE_PATH_STYLE
              value: "true"
            - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
              value: langfuse
            - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
              value: us-east-1
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              value: minioadmin
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              value: minio_langfuse_password
            - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
              value: http://langfuse-minio:9000
            - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
              value: "true"
            - name: NEXTAUTH_URL
              value: https://langfuse-tailscale-serve.tail286401.ts.net
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  key: NEXTAUTH_SECRET
                  name: langfuse-auth
            - name: SALT
              valueFrom:
                secretKeyRef:
                  key: SALT
                  name: langfuse-auth
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  key: ENCRYPTION_KEY
                  name: langfuse-auth
            - name: CLICKHOUSE_CLUSTER_ENABLED
              value: "false"
            - name: TELEMETRY_ENABLED
              value: "false"
            - name: AUTH_DISABLE_SIGNUP
              value: "false"
          envFrom:
            - secretRef:
                name: langfuse-init
                optional: true
          image: langfuse/langfuse-worker:3
          name: langfuse-worker
          resources:
            limits:
              cpu: 1000m
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
