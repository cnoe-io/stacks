apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/name: langfuse-tailscale-serve
    app.kubernetes.io/part-of: langfuse
  name: langfuse-tailscale-serve
  namespace: tailscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: langfuse-tailscale-serve
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse-tailscale-serve
    spec:
      containers:
        - args:
            - |
              
              set -euo pipefail

              # Start tailscaled in userspace mode (no TUN device needed)
              mkdir -p /var/lib/tailscale
              tailscaled --tun=userspace-networking \
                --socket=/run/tailscale/tailscaled.sock \
                --state=/var/lib/tailscale/tailscaled.state &

              # Install required tools (socat for proxying, curl for health checks)
              apk add --no-cache socat curl >/dev/null

              # Wait for tailscaled to come up
              for i in $(seq 1 40); do
                tailscale --socket=/run/tailscale/tailscaled.sock status >/dev/null 2>&1 && break
                sleep 0.5
              done

              # Bring the node up (no DNS/routes/ssh)
              tailscale --socket=/run/tailscale/tailscaled.sock up \
                --authkey="$TS_AUTHKEY" \
                --accept-dns=false --accept-routes=false --ssh=false

              # Wait for Langfuse to be ready
              echo "Waiting for Langfuse backend at http://langfuse.observability.svc.cluster.local:3000..."
              for i in $(seq 1 60); do
                curl -s http://langfuse.observability.svc.cluster.local:3000/api/public/health >/dev/null && break
                sleep 2
              done
              echo "Langfuse backend is ready"

              # Start socat to forward from localhost:8080 to Langfuse backend
              # Tailscale serve only supports localhost proxies
              echo "Starting socat proxy to langfuse.observability.svc.cluster.local:3000..."
              socat TCP-LISTEN:8080,fork,reuseaddr TCP:langfuse.observability.svc.cluster.local:3000 &

              # Wait for socat to be ready
              sleep 1

              # Expose via Tailscale serve (legacy hostname mode)
              # Using legacy hostname mode (no --service flag) - accessible via pod hostname
              echo "Starting Tailscale serve for langfuse..."
              tailscale --socket=/run/tailscale/tailscaled.sock \
                serve --bg --https=443 http://127.0.0.1:8080

              echo "Langfuse UI available - check Tailscale admin for hostname"
              exec tail -f /dev/null
          command:
            - /bin/sh
            - -c
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  key: authKey
                  name: tailscale-auth-key
          image: tailscale/tailscale:latest
          name: tailscale-serve
          ports:
            - containerPort: 443
              name: https
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            privileged: false
            runAsNonRoot: false
      initContainers:
        - args:
            - |
              
              echo "Waiting for secret tailscale-auth-key to exist..."
              while ! kubectl get secret tailscale-auth-key -n tailscale > /dev/null 2>&1; do
                echo "Secret not found, waiting 5s..."
                sleep 5
              done
              echo "Secret tailscale-auth-key found, proceeding..."
          command:
            - /bin/sh
            - -c
          image: bitnami/kubectl:latest
          name: wait-for-secret
      serviceAccountName: langfuse-tailscale-serve
