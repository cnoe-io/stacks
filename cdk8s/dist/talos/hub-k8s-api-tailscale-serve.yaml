apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-60"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/component: api-proxy
    app.kubernetes.io/environment: dev
    app.kubernetes.io/managed-by: cdk8s
    app.kubernetes.io/name: hub-k8s-api-tailscale-serve
    app.kubernetes.io/part-of: hub-cluster
    example: basic
  name: hub-k8s-api-tailscale-serve
  namespace: argocd
spec:
  destination:
    namespace: tailscale
    server: https://kubernetes.default.svc
  project: default
  sources:
    - path: cdk8s/dist/talos/hub-k8s-api-tailscale-serve/manifests
      repoURL: https://github.com/PittampalliOrg/stacks.git
      targetRevision: 108-hub-and-spoke
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
