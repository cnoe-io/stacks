apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kagent-tools
    app.kubernetes.io/part-of: kagent
    app.kubernetes.io/version: 0.0.12
    helm.sh/chart: kagent-tools-0.0.12
  name: kagent-tools
  namespace: kagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: kagent
      app.kubernetes.io/name: kagent-tools
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: kagent
        app.kubernetes.io/name: kagent-tools
    spec:
      containers:
        - args:
            - --port
            - "8084"
          command:
            - /tool-server
          env:
            - name: KAGENT_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  key: OPENAI_API_KEY
                  name: kagent-tools-openai
                  optional: true
            - name: OTEL_TRACING_ENABLED
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://host.docker.internal:4317
            - name: OTEL_EXPORTER_OTLP_TRACES_TIMEOUT
              value: "15"
            - name: OTEL_EXPORTER_OTLP_TRACES_INSECURE
              value: "true"
          image: ghcr.io/kagent-dev/kagent/tools:0.0.12
          imagePullPolicy: IfNotPresent
          name: tools
          ports:
            - containerPort: 8084
              name: http-tools
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 15
            periodSeconds: 15
            tcpSocket:
              port: http-tools
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext: {}
      securityContext: {}
      serviceAccountName: kagent-tools
