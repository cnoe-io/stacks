apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-80"
  labels:
    app.kubernetes.io/component: cluster-credentials
    app.kubernetes.io/managed-by: cdk8s
    app.kubernetes.io/name: argocd-cluster-hetzner
    app.kubernetes.io/part-of: hub-spoke
    cluster-host: hetzner
  name: argocd-cluster-hetzner
  namespace: argocd
spec:
  data:
    - remoteRef:
        key: ARGOCD-CLUSTER-HETZNER-TOKEN
      secretKey: bearerToken
    - remoteRef:
        key: ARGOCD-CLUSTER-HETZNER-CA
      secretKey: caData
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    creationPolicy: Owner
    name: cluster-hetzner
    template:
      data:
        config: |-
          {
            "tlsClientConfig": {
              "insecure": false,
              "caData": "{{ .caData }}"
            },
            "bearerToken": "{{ .bearerToken }}"
          }
        name: hetzner
        server: https://k8s-api-hetzner.tail286401.ts.net
      metadata:
        annotations:
          external-secrets.io/managed-by: external-secrets
        labels:
          argocd.argoproj.io/secret-type: cluster
          cluster-host: hetzner
          cluster-type: production
          managed-by: external-secrets
      type: Opaque
