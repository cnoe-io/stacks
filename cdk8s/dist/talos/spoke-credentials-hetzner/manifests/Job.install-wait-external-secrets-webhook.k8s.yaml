apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-100"
  labels:
    app.kubernetes.io/component: presync-hook
    app.kubernetes.io/name: install-wait-external-secrets-webhook
    app.kubernetes.io/part-of: external-secrets
  name: install-wait-external-secrets-webhook
  namespace: argocd
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 0
  template:
    spec:
      containers:
        - args:
            - |-
              for i in $(seq 1 60); do
                if curl -ksS --connect-timeout 2 https://external-secrets-webhook.external-secrets.svc:443/ >/dev/null 2>&1; then
                  echo "external-secrets-webhook reachable"
                  exit 0
                fi
                echo "waiting for external-secrets-webhook..."
                sleep 5
              done

              echo "timeout waiting for external-secrets-webhook"
              exit 1
          command:
            - /bin/sh
            - -ec
          image: curlimages/curl:8.5.0
          name: wait
      restartPolicy: Never
  ttlSecondsAfterFinished: 60
