apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: tailscale-serve
    app.kubernetes.io/managed-by: cdk8s
    app.kubernetes.io/name: argocd-hub-tailscale-serve
    app.kubernetes.io/part-of: tailscale
  name: argocd-hub-tailscale-serve
  namespace: tailscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-hub-tailscale-serve
  template:
    metadata:
      labels:
        app.kubernetes.io/component: tailscale-serve
        app.kubernetes.io/name: argocd-hub-tailscale-serve
    spec:
      containers:
        - args:
            - |
              
              set -euo pipefail

              # Start tailscaled in userspace mode (no TUN device needed)
              mkdir -p /var/lib/tailscale
              tailscaled --tun=userspace-networking \
                --socket=/run/tailscale/tailscaled.sock \
                --state=/var/lib/tailscale/tailscaled.state &

              # Install socat for port forwarding (required for userspace networking + Services)
              apk add --no-cache socat >/dev/null 2>&1 || true

              # Wait for tailscaled to come up
              for i in $(seq 1 40); do
                tailscale --socket=/run/tailscale/tailscaled.sock status >/dev/null 2>&1 && break
                sleep 0.5
              done

              # Bring the node up with service registration
              tailscale --socket=/run/tailscale/tailscaled.sock up \
                --authkey="$TS_AUTHKEY" \
                --accept-dns=false --accept-routes=false --ssh=false

              # Wait for backend service to be reachable
              echo "Waiting for backend service argocd-server.argocd.svc.cluster.local:443..."
              for i in $(seq 1 60); do
                if wget -q --spider --timeout=2 http://argocd-server.argocd.svc.cluster.local:443/ 2>/dev/null || \
                   wget -q --spider --timeout=2 http://argocd-server.argocd.svc.cluster.local:443/healthz 2>/dev/null || \
                   nc -z -w2 argocd-server.argocd.svc.cluster.local 443 2>/dev/null; then
                  echo "Backend service is reachable"
                  break
                fi
                echo "Waiting for backend... ($i/60)"
                sleep 2
              done

              # Start socat to forward from internal port (8080) to backend service
              # NOTE: socat does raw TCP forwarding - it doesn't speak TLS
              # The backend service handles TLS termination if needed
              socat TCP-LISTEN:8080,fork,reuseaddr TCP:argocd-server.argocd.svc.cluster.local:443 &

              # Expose via Tailscale serve on HTTPS 443 with service registration
              # Tailscale serve terminates TLS and forwards plain HTTP to socat on port 8080
              # socat then forwards raw TCP to the backend (which may re-establish TLS)
              tailscale --socket=/run/tailscale/tailscaled.sock \
                serve --service=svc:argocd-hub --https=443 http://127.0.0.1:8080

              echo "Service running at https://svc-argocd-hub.<tailnet>.ts.net"
              echo "Backend: argocd-server.argocd.svc.cluster.local:443"

              # Keep container running
              exec tail -f /dev/null
          command:
            - /bin/sh
            - -c
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  key: authKey
                  name: tailscale-auth-key
            - name: BACKEND_HOST
              value: argocd-server.argocd.svc.cluster.local
            - name: BACKEND_PORT
              value: "443"
          image: tailscale/tailscale:latest
          name: tailscale-serve
          ports:
            - containerPort: 443
              name: https
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            privileged: false
            runAsNonRoot: false
          volumeMounts:
            - mountPath: /var/lib/tailscale
              name: tailscale-state
      initContainers:
        - args:
            - |
              
              echo "Waiting for secret tailscale-auth-key to exist..."
              while ! kubectl get secret tailscale-auth-key -n tailscale > /dev/null 2>&1; do
                echo "Secret not found, waiting 5s..."
                sleep 5
              done
              echo "Secret tailscale-auth-key found, proceeding..."
          command:
            - /bin/sh
            - -c
          image: bitnami/kubectl:latest
          name: wait-for-secret
      serviceAccountName: argocd-hub-tailscale-serve-sa
      volumes:
        - name: tailscale-state
          persistentVolumeClaim:
            claimName: argocd-hub-tailscale-serve-state
