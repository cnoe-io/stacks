apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-80"
  labels:
    app.kubernetes.io/component: cluster-credentials
    app.kubernetes.io/managed-by: cdk8s
    app.kubernetes.io/name: argocd-cluster-ryzen
    app.kubernetes.io/part-of: hub-spoke
    cluster-host: ryzen
  name: argocd-cluster-ryzen
  namespace: argocd
spec:
  data:
    - remoteRef:
        key: ARGOCD-CLUSTER-RYZEN-TOKEN
      secretKey: bearerToken
    - remoteRef:
        key: ARGOCD-CLUSTER-RYZEN-CA
      secretKey: caData
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    creationPolicy: Owner
    name: cluster-ryzen
    template:
      data:
        config: |-
          {
            "tlsClientConfig": {
              "insecure": false,
              "caData": "{{ .caData }}"
            },
            "bearerToken": "{{ .bearerToken }}"
          }
        name: ryzen
        server: https://k8s-api-ryzen.tail286401.ts.net
      metadata:
        annotations:
          external-secrets.io/managed-by: external-secrets
        labels:
          argocd.argoproj.io/secret-type: cluster
          cluster-host: ryzen
          cluster-type: staging
          managed-by: external-secrets
      type: Opaque
