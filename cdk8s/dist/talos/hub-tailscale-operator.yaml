apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-75"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/component: operator
    app.kubernetes.io/environment: dev
    app.kubernetes.io/managed-by: cdk8s
    app.kubernetes.io/name: hub-tailscale-operator
    app.kubernetes.io/part-of: hub-cluster
    example: basic
  name: hub-tailscale-operator
  namespace: argocd
spec:
  destination:
    namespace: tailscale
    server: https://kubernetes.default.svc
  project: default
  sources:
    - path: cdk8s/dist/talos/hub-tailscale-operator/manifests
      repoURL: https://github.com/PittampalliOrg/stacks.git
      targetRevision: 108-hub-and-spoke
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
