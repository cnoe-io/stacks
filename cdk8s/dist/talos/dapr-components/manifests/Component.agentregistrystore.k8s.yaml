apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  labels:
    app.kubernetes.io/component: state-store
    app.kubernetes.io/name: agentregistrystore
    app.kubernetes.io/part-of: dapr-agents
  name: agentregistrystore
  namespace: dapr-agents
spec:
  metadata:
    - name: redisHost
      value: redis-service.dapr-agents.svc.cluster.local:6379
    - name: redisPassword
      value: ""
    - name: keyPrefix
      value: none
  type: state.redis
  version: v1
