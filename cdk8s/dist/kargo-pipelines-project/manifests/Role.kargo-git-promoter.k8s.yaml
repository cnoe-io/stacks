apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  name: kargo-git-promoter
  namespace: kargo-pipelines
rules:
  - apiGroups:
      - kargo.akuity.io
    resources:
      - freights
      - stages
      - warehouses
      - promotions
      - projectconfigs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
      - serviceaccounts
    verbs:
      - get
      - list
