apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "85"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/component: webhook-setup
    app.kubernetes.io/environment: dev
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: kargo-gitea-webhook-setup
    app.kubernetes.io/part-of: kargo-pipelines
    example: basic
  name: kargo-gitea-webhook-setup
  namespace: argocd
spec:
  destination:
    namespace: kargo-pipelines
    server: https://kubernetes.default.svc
  project: default
  source:
    path: "."
    repoURL: cnoe://kargo-gitea-webhook-setup/manifests
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
      limit: 10
    syncOptions:
      - CreateNamespace=true
