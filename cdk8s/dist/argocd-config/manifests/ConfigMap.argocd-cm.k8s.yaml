apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Replace=false
    argocd.argoproj.io/sync-wave: "-100"
  name: argocd-cm
  namespace: argocd
data:
  resource.customizations.health.networking.k8s.io_Ingress: |-
    hs = {}
    hs.status = "Healthy"
    hs.message = "Ingress is always considered healthy to prevent sync deadlocks"
    return hs
  resource.customizations.health.v1_PersistentVolumeClaim: |-
    hs = {}
    if obj.status ~= nil then
      if obj.status.phase ~= nil then
        if obj.status.phase == "Pending" then
          hs.status = "Progressing"
          hs.message = "PVC is pending"
        elseif obj.status.phase == "Bound" then
          hs.status = "Healthy"
          hs.message = "PVC is bound"
        else
          hs.status = "Degraded"
          hs.message = "PVC is in " .. obj.status.phase .. " phase"
        end
      end
    end
    return hs
