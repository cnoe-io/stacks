apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-80"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/environment: talos
    app.kubernetes.io/managed-by: cdk8s
    app.kubernetes.io/name: speckit-agents-rbac
    app.kubernetes.io/part-of: speckit
    example: basic
  name: speckit-agents-rbac
  namespace: argocd
spec:
  destination:
    namespace: dapr-agents
    server: https://kubernetes.default.svc
  project: default
  sources:
    - path: cdk8s/dist/speckit-agents-rbac/manifests
      repoURL: https://github.com/PittampalliOrg/stacks.git
      targetRevision: 106-consolidate-bootstrap-between
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
