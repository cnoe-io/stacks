apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: dapr
    app.kubernetes.io/part-of: dapr
    app.kubernetes.io/version: 1.16.6
  name: dapr-sentry
  namespace: dapr-system
rules:
  - apiGroups:
      - ""
    resourceNames:
      - dapr-trust-bundle
    resources:
      - secrets
    verbs:
      - get
      - update
      - delete
  - apiGroups:
      - ""
    resourceNames:
      - dapr-trust-bundle
    resources:
      - configmaps
    verbs:
      - get
      - update
      - watch
      - list
  - apiGroups:
      - dapr.io
    resources:
      - configurations
    verbs:
      - list
      - get
      - watch
