# ArgoCD Helm Values for Talos Linux Cluster
# Feature: 102-bootstrap-talos-argocd
#
# Used by: scripts/01-install-argocd.sh
# Chart: argo/argo-cd version 7.3.0
#
# Configuration optimized for:
# - 5-node Talos cluster (3 CP + 2 workers)
# - Tailscale-only access (no public ingress)
# - High availability with 3 server replicas
# - Azure AD SSO (optional, configure separately)

global:
  # Talos cluster domain
  domain: argocd.local

# Redis (single replica - simpler and more reliable than HA for small clusters)
redis:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Redis HA disabled - using single Redis replica for simplicity
# Enable for production clusters with 3+ worker nodes
redis-ha:
  enabled: false

# ArgoCD Server Configuration
server:
  # HA configuration (2 replicas for 2 worker nodes)
  replicas: 2

  # Autoscaling
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Service configuration (no ingress, Tailscale handles access)
  service:
    type: ClusterIP

  # Disable ingress (using Tailscale for access)
  ingress:
    enabled: false

  # Extra args for server
  extraArgs:
    - --insecure  # TLS termination handled by Tailscale

  # Metrics
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false  # Enable if Prometheus is installed

# Controller Configuration
controller:
  replicas: 1  # Single controller is sufficient

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi  # Increased from 1Gi - OOMKilled with 30+ applications

  # Metrics
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

# Repo Server Configuration
repoServer:
  replicas: 2

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Enable exec plugin for Kustomize/Helm
  env:
    - name: ARGOCD_EXEC_TIMEOUT
      value: "3m"

  # Metrics
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

# ApplicationSet Controller
applicationSet:
  enabled: true
  replicas: 1

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Notifications Controller
notifications:
  enabled: false  # Enable when webhook integration needed

# DEX (SSO) Configuration
dex:
  enabled: false  # Enable for Azure AD SSO

# Config Management Plugins
configs:
  # Repository credentials (for private repos)
  credentialTemplates: {}
  # Example:
  # github-https:
  #   url: https://github.com
  #   username: not-used
  #   password: <github-token>

  # Repository definitions
  repositories: {}
  # Example:
  # stacks-repo:
  #   url: https://github.com/your-org/stacks.git
  #   type: git

  # CM configuration
  cm:
    # Enable status badge
    statusbadge.enabled: true

    # Resource health customizations
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

    # Kustomize build options
    kustomize.buildOptions: "--enable-helm"

    # Application sync timeout
    timeout.reconciliation: 180s

  # RBAC configuration
  rbac:
    # Default policy for non-admin users
    policy.default: role:readonly

    # Policy rules
    policy.csv: |
      # Admin can do everything
      p, role:admin, *, *, *, allow

      # Readonly can view
      p, role:readonly, applications, get, *, allow
      p, role:readonly, certificates, get, *, allow
      p, role:readonly, clusters, get, *, allow
      p, role:readonly, repositories, get, *, allow
      p, role:readonly, projects, get, *, allow
      p, role:readonly, accounts, get, *, allow
      p, role:readonly, gpgkeys, get, *, allow
      p, role:readonly, logs, get, *, allow

      # Groups
      g, admin, role:admin

  # Secret configuration
  secret:
    # Create the argocd-secret
    createSecret: true

# CRDs
crds:
  install: true
  keep: true

# Extra objects (optional)
extraObjects: []
# Example: ConfigMap for custom tools
# - apiVersion: v1
#   kind: ConfigMap
#   metadata:
#     name: argocd-custom-tools
#     namespace: argocd
#   data:
#     my-tool.sh: |
#       #!/bin/bash
#       echo "Custom tool script"
