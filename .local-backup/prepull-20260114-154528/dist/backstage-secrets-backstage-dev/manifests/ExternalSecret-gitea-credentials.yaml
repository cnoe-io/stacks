apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-credentials
  namespace: backstage-dev
spec:
  data:
    - remoteRef:
        key: gitea-credential
        property: username
      secretKey: GITEA_USERNAME
    - remoteRef:
        key: gitea-credential
        property: password
      secretKey: GITEA_PASSWORD
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: gitea
  target:
    name: gitea-credentials
