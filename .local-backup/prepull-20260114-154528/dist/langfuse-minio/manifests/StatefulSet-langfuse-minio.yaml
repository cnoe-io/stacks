apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: langfuse-minio
  name: langfuse-minio
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-minio
  serviceName: langfuse-minio
  template:
    metadata:
      labels:
        app: langfuse-minio
    spec:
      containers:
        - command:
            - minio
            - server
            - /data
            - --console-address
            - :9001
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
          image: minio/minio:RELEASE.2024-01-01T16-36-33Z
          name: minio
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - mountPath: /data
              name: data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
