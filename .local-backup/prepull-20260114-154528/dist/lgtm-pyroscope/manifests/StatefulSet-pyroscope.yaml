apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: pyroscope
  name: pyroscope
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pyroscope
  serviceName: pyroscope
  template:
    metadata:
      labels:
        app: pyroscope
    spec:
      containers:
        - image: grafana/pyroscope:1.4.0
          name: pyroscope
          ports:
            - containerPort: 4040
              name: http
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - mountPath: /data
              name: data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
