apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argo-workflows-ingress
  namespace: argo
spec:
  ingressClassName: nginx
  rules:
    - host: argo-workflows.cnoe.localtest.me
      http:
        paths:
          - backend:
              service:
                name: argo-workflows-server
                port:
                  number: 2746
            path: /
            pathType: Prefix
