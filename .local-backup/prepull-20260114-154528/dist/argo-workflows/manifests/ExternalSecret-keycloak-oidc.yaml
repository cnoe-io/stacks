apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-oidc
  namespace: argo
spec:
  data:
    - remoteRef:
        key: keycloak-clients
        property: ARGO_WORKFLOWS_CLIENT_ID
      secretKey: client-id
    - remoteRef:
        key: keycloak-clients
        property: ARGO_WORKFLOWS_CLIENT_SECRET
      secretKey: secret-key
  secretStoreRef:
    kind: ClusterSecretStore
    name: keycloak
  target:
    name: keycloak-oidc
