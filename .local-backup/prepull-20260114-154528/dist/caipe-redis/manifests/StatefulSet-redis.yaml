apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: caipe-redis
    tier: storage
  name: redis
  namespace: ai-platform-engineering
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caipe-redis
  serviceName: redis
  template:
    metadata:
      labels:
        app: caipe-redis
    spec:
      containers:
        - image: redis:7-alpine
          name: redis
          ports:
            - containerPort: 6379
              name: redis
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - mountPath: /data
              name: data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
