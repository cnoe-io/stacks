apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations: {}
  name: dapr-dashboard
  namespace: dapr-system
spec:
  ingressClassName: nginx
  rules:
    - host: dapr.cnoe.localtest.me
      http:
        paths:
          - backend:
              service:
                name: dapr-dashboard
                port:
                  number: 8080
            path: /
            pathType: Prefix
