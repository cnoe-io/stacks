apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-state
  namespace: tailscale
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - create
      - patch
