apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: embeddings-secret
  namespace: ai-platform-engineering
spec:
  data:
    - remoteRef:
        key: OPENAI-API-KEY
      secretKey: OPENAI_API_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    creationPolicy: Owner
    name: embeddings-secret
