apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-api
  namespace: observability
spec:
  data:
    - remoteRef:
        key: LANGFUSE-API-AUTH
      secretKey: LANGFUSE_AUTH
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    creationPolicy: Owner
    name: langfuse-api
