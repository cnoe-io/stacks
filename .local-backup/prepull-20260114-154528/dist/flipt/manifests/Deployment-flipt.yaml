apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: flipt
    app.kubernetes.io/component: management-ui
    app.kubernetes.io/name: flipt
    app.kubernetes.io/part-of: feature-flags
  name: flipt
  namespace: feature-flags
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flipt
  template:
    metadata:
      labels:
        app: flipt
        app.kubernetes.io/component: management-ui
        app.kubernetes.io/name: flipt
        app.kubernetes.io/part-of: feature-flags
    spec:
      containers:
        - args:
            - server
            - --config
            - /etc/flipt/flipt.yml
          command:
            - /flipt
          env:
            - name: FLIPT_LOG_LEVEL
              value: debug
            - name: GIT_SSL_CAINFO
              value: /etc/ssl/certs/idpbuilder-ca.crt
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/idpbuilder-ca.crt
          envFrom:
            - secretRef:
                name: flipt-oidc
            - secretRef:
                name: flipt-git-credentials
          image: ghcr.io/flipt-io/flipt:v2.4.0
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          name: flipt
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 9000
              name: grpc
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /etc/flipt
              name: config
              readOnly: true
            - mountPath: /var/opt/flipt
              name: data
            - mountPath: /etc/ssl/certs/idpbuilder-ca.crt
              name: idpbuilder-ca
              readOnly: true
              subPath: ca.crt
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      volumes:
        - configMap:
            name: flipt-config
          name: config
        - name: data
          persistentVolumeClaim:
            claimName: flipt-data
        - name: idpbuilder-ca
          secret:
            secretName: idpbuilder-cert
