apiVersion: v1
kind: Service
metadata:
  labels:
    app: flipt
    app.kubernetes.io/component: management-ui
    app.kubernetes.io/name: flipt
    app.kubernetes.io/part-of: feature-flags
  name: flipt
  namespace: feature-flags
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
    - name: grpc
      port: 9000
      protocol: TCP
      targetPort: 9000
  selector:
    app: flipt
  type: ClusterIP
