apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "100"
  name: backstage-templates
  namespace: argocd
spec:
  destination:
    namespace: backstage
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    directory:
      exclude: 'catalog-info.yaml'
    repoURL: cnoe://backstage-templates/entities
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
