apiVersion: v1
data:
  mimir.yaml: |
    multitenancy_enabled: false

    server:
      http_listen_port: 9009
      log_level: warn

    # Single-node ring configuration (required for monolithic mode)
    common:
      storage:
        backend: filesystem
        filesystem:
          dir: /data

    ingester:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
        replication_factor: 1

    store_gateway:
      sharding_ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
        replication_factor: 1

    compactor:
      sharding_ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    distributor:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /data/blocks
      tsdb:
        dir: /data/tsdb

    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/rules

    ruler:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    limits:
      # Disable rate limiting for single-node homelab use
      ingestion_rate: 100000
      ingestion_burst_size: 200000
      max_global_series_per_user: 0
      max_global_series_per_metric: 0
      max_label_names_per_series: 30
      max_label_value_length: 2048
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: observability
