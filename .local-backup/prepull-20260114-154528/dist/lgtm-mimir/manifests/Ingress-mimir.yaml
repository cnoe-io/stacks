apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
  name: mimir
  namespace: observability
spec:
  ingressClassName: nginx
  rules:
    - host: mimir.cnoe.localtest.me
      http:
        paths:
          - backend:
              service:
                name: mimir
                port:
                  name: http
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - mimir.cnoe.localtest.me
