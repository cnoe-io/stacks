apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-staging-secrets
  namespace: backstage-staging
spec:
  data:
    - remoteRef:
        key: BACKSTAGE-POSTGRES-PASSWORD
      secretKey: POSTGRES_PASSWORD
    - remoteRef:
        key: GITHUB-PAT
      secretKey: GITHUB_TOKEN
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    name: backstage-env-vars
    template:
      data:
        BACKSTAGE_FRONTEND_URL: https://cnoe.localtest.me:8443/backstage-staging
        GITHUB_TOKEN: '{{.GITHUB_TOKEN}}'
        POSTGRES_DB: backstage
        POSTGRES_HOST: postgresql.backstage-staging.svc.cluster.local
        POSTGRES_PASSWORD: '{{.POSTGRES_PASSWORD}}'
        POSTGRES_PORT: "5432"
        POSTGRES_USER: backstage
      engineVersion: v2
