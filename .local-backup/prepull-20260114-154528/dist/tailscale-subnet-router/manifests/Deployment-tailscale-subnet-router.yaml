apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: tailscale-subnet-router
  name: tailscale-subnet-router
  namespace: tailscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tailscale-subnet-router
  template:
    metadata:
      labels:
        app: tailscale-subnet-router
    spec:
      containers:
        - env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  key: authKey
                  name: tailscale-auth-key
            - name: TS_HOSTNAME
              value: subnet-router-thinkpad
            - name: TS_ROUTES
              value: 10.244.0.0/16,10.96.0.0/16
            - name: TS_USERSPACE
              value: "true"
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_EXTRA_ARGS
              value: --reset
          image: tailscale/tailscale:v1.82.0
          name: tailscale
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - mountPath: /var/lib/tailscale
              name: state
      serviceAccountName: tailscale-subnet-router
      volumes:
        - emptyDir: {}
          name: state
