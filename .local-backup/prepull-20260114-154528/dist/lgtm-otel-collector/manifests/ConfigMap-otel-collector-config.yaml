apiVersion: v1
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
      batch:
        timeout: 5s
        send_batch_size: 1000
        send_batch_max_size: 1500
      resource:
        attributes:
          - key: service.instance.id
            from_attribute: host.name
            action: insert
          - key: deployment.environment
            value: homelab
            action: insert

    exporters:
      prometheusremotewrite:
        endpoint: http://mimir.observability.svc.cluster.local:9009/api/v1/push
        resource_to_telemetry_conversion:
          enabled: true
        external_labels:
          cluster: homelab
          source: otel-collector
      loki:
        endpoint: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push
        default_labels_enabled:
          exporter: false
          job: true
          instance: true
          level: true
      otlp/tempo:
        endpoint: tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true
      otlphttp/langfuse:
        endpoint: http://langfuse.observability.svc.cluster.local:3000/api/public/otel
        headers:
          Authorization: "${env:LANGFUSE_AUTH}"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      pprof:
        endpoint: 0.0.0.0:1777
      zpages:
        endpoint: 0.0.0.0:55679

    service:
      extensions: [health_check, pprof, zpages]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [prometheusremotewrite]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [loki]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [otlp/tempo, otlphttp/langfuse]
      telemetry:
        logs:
          level: warn
        metrics:
          address: 0.0.0.0:8888
          level: basic
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
