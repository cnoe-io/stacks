apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "70"
  name: nocodb-connections
  namespace: argocd
spec:
  destination:
    namespace: nocodb
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: cnoe://nocodb-connections/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
