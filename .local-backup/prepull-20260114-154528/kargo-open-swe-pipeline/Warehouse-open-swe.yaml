apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: open-swe
  namespace: kargo-pipelines
spec:
  subscriptions:
    # Watch GitHub releases
    - git:
        repoURL: https://github.com/PittampalliOrg/open-swe-config.git
        branch: main
    # Watch GHCR for semantic versioned images
    - image:
        repoURL: ghcr.io/pittampalliorg/open-swe
        semverConstraint: ">=0.0.0"
        discoveryLimit: 20
  interval: 1m
