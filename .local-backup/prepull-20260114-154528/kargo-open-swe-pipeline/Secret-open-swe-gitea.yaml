apiVersion: v1
kind: Secret
metadata:
  name: open-swe-gitea-creds
  namespace: kargo-pipelines
  labels:
    kargo.akuity.io/cred-type: git
type: Opaque
stringData:
  repoURL: https://gitea.cnoe.localtest.me:8443
  repoURLIsRegex: "true"
  username: giteaAdmin
  password: "${GITEA_TOKEN}"
---
apiVersion: v1
kind: Secret
metadata:
  name: open-swe-gitea-image-creds
  namespace: kargo-pipelines
  labels:
    kargo.akuity.io/cred-type: image
type: Opaque
stringData:
  repoURL: gitea.cnoe.localtest.me:8443
  repoURLIsRegex: "true"
  username: giteaAdmin
  password: "${GITEA_TOKEN}"
