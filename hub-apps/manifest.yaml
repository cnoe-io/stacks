  namespace: argocd
spec:
  applicationSelector:
    matchLabels:
      stacks.io/managed: "true"
  promotionStrategyRef:
    name: stacks-environments
---
apiVersion: promoter.argoproj.io/v1alpha1
kind: GitRepository
metadata:
  name: stacks-repo
  namespace: argocd
spec:
  github:
    name: stacks
    owner: PittampalliOrg
  scmProviderRef:
    name: github
---
apiVersion: promoter.argoproj.io/v1alpha1
kind: PromotionStrategy
metadata:
  name: stacks-environments
  namespace: argocd
spec:
  activeCommitStatuses:
    - key: argocd-health
  environments:
    - autoMerge: true
      branch: env/kind-ryzen
    - autoMerge: true
      branch: env/talos
    - autoMerge: false
      branch: env/hub
  gitRepositoryRef:
    name: stacks-repo
---
apiVersion: promoter.argoproj.io/v1alpha1
kind: ScmProvider
metadata:
  name: github
  namespace: argocd
spec:
  github:
    domain: github.com
  secretRef:
    name: github-promoter-credentials
