  project: default
  source:
    chart: loki
    helm:
      releaseName: loki
      valuesObject:
        backend:
          replicas: 0
        deploymentMode: SingleBinary
        gateway:
          enabled: false
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          ingester:
            chunk_encoding: snappy
          limits_config:
            allow_structured_metadata: true
            retention_period: 720h
            volume_enabled: true
          schemaConfig:
            configs:
              - from: "2024-01-01"
                index:
                  period: 24h
                  prefix: index_
                object_store: filesystem
                schema: v13
                store: tsdb
          storage:
            type: filesystem
        monitoring:
          selfMonitoring:
            enabled: false
            grafanaAgent:
              installOperator: false
          serviceMonitor:
            enabled: false
        read:
          replicas: 0
        singleBinary:
          persistence:
            enabled: true
            size: 10Gi
          replicas: 1
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
        test:
          enabled: false
        write:
          replicas: 0
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 6.49.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
