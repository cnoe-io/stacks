apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: grafana
  namespace: argocd
spec:
  destination:
    namespace: observability
    server: https://k8s-api-talos.tail286401.ts.net
  project: default
  source:
    chart: grafana
    helm:
      releaseName: grafana
      valuesObject:
        adminPassword: admin
        adminUser: admin
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - access: proxy
                isDefault: true
                jsonData:
                  httpMethod: POST
                  prometheusType: Mimir
                  timeInterval: 15s
                name: Mimir
                type: prometheus
                uid: mimir
                url: http://mimir.observability.svc.cluster.local:9009/prometheus
              - access: proxy
                isDefault: false
                jsonData:
                  maxLines: 1000
                name: Loki
                type: loki
                uid: loki
                url: http://loki.observability.svc.cluster.local:3100
              - access: proxy
                isDefault: false
                jsonData:
                  httpMethod: GET
                  lokiSearch:
                    datasourceUid: loki
                  nodeGraph:
                    enabled: true
                  search:
                    hide: false
                  serviceMap:
                    datasourceUid: mimir
                  tracesToLogs:
                    datasourceUid: loki
                    filterBySpanID: true
                    filterByTraceID: true
                  tracesToMetrics:
                    datasourceUid: mimir
                    queries:
                      - name: Request rate
                        query: sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))
                      - name: Error rate
                        query: sum(rate(traces_spanmetrics_calls_total{$$__tags,status_code="STATUS_CODE_ERROR"}[5m]))
                      - name: Duration (p95)
                        query: histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])) by (le))
                    spanEndTimeShift: 1h
                    spanStartTimeShift: -1h
                    tags:
                      - key: service.name
                        value: service
                      - key: job
                name: Tempo
                type: tempo
                uid: tempo
                url: http://tempo.observability.svc.cluster.local:3200
