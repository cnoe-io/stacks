    namespace: observability
    server: https://k8s-api-talos.tail286401.ts.net
  project: default
  source:
    chart: tempo
    helm:
      releaseName: tempo
      valuesObject:
        persistence:
          enabled: true
          size: 10Gi
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        serviceMonitor:
          enabled: false
        tempo:
          metricsGenerator:
            enabled: true
            remoteWriteUrl: http://mimir.observability.svc.cluster.local:9009/api/v1/push
          overrides:
            defaults:
              metrics_generator:
                processors:
                  - service-graphs
                  - span-metrics
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          storage:
            trace:
              backend: local
              local:
                path: /var/tempo/traces
              wal:
                path: /var/tempo/wal
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 1.24.1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
