# Headlamp Helm values for deployment with plugin support
replicaCount: 1

image:
  repository: ghcr.io/headlamp-k8s/headlamp
  tag: v0.35.0
  pullPolicy: IfNotPresent

# Enable plugin manager for dynamic plugin loading
pluginsManager:
  enabled: true
  image: ghcr.io/headlamp-k8s/headlamp
  tag: v0.35.0
  configContent: |
    plugins:
    # Core plugins
    - name: prometheus
      source: https://artifacthub.io/packages/headlamp/headlamp/prometheus
      version: 0.8.0
    - name: opencost
      source: https://artifacthub.io/packages/headlamp/headlamp/opencost
      version: 0.3.2
    - name: cert-manager
      source: https://artifacthub.io/packages/headlamp/headlamp/cert-manager
      version: 0.1.2
    - name: flux
      source: https://artifacthub.io/packages/headlamp/headlamp/flux
      version: 0.1.5

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-issuer
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: headlamp.cnoe.localtest.me
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: headlamp-tls
      hosts:
        - headlamp.cnoe.localtest.me

# RBAC configuration to allow viewing External Secrets
clusterRoleBinding:
  create: true
  roleRef:
    kind: ClusterRole
    name: cluster-admin  # Or create a custom role with specific permissions

# Additional environment variables for plugins
env:
  - name: HEADLAMP_CONFIG_ENABLE_PLUGINS
    value: "true"
  - name: HEADLAMP_CONFIG_PLUGIN_DIR
    value: "/plugins"

# Volume for plugins
volumes:
  - name: plugins
    emptyDir: {}

volumeMounts:
  - name: plugins
    mountPath: /plugins

# Resources
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

# Node selector, tolerations, and affinity can be configured as needed
nodeSelector: {}
tolerations: []
affinity: {}