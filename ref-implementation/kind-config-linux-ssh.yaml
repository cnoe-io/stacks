kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry.mirrors."gitea.cnoe.localtest.me:8443"]
    endpoint = ["https://gitea.cnoe.localtest.me"]
  [plugins."io.containerd.grpc.v1.cri".registry.configs."gitea.cnoe.localtest.me".tls]
    insecure_skip_verify = true
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
nodes:
- role: control-plane
  image: "kindest/node:v1.31.4"
  labels:
    ingress-ready: "true"
  extraPortMappings:
  # Standard IDPBuilder ports
  - containerPort: 443
    hostPort: 8443
    protocol: TCP
  - containerPort: 32222
    hostPort: 32222
    protocol: TCP
  
  # DevSpace SSH ports for development containers
  # Backstage SSH ports
  - containerPort: 30022
    hostPort: 30022
    protocol: TCP
    listenAddress: "0.0.0.0"
  - containerPort: 30023
    hostPort: 30023
    protocol: TCP
    listenAddress: "0.0.0.0"
  
  # NextJS SSH ports
  - containerPort: 30024
    hostPort: 30024
    protocol: TCP
    listenAddress: "0.0.0.0"
  - containerPort: 30025
    hostPort: 30025
    protocol: TCP
    listenAddress: "0.0.0.0"
  
  # Additional service SSH ports
  - containerPort: 30026
    hostPort: 30026
    protocol: TCP
    listenAddress: "0.0.0.0"
  - containerPort: 30027
    hostPort: 30027
    protocol: TCP
    listenAddress: "0.0.0.0"
  
  # Direct mount of keys - works on Linux
  extraMounts:
    - hostPath: /home/vpittamp/stacks/ref-implementation/keys
      containerPath: /etc/kubernetes/pki/custom-keys
      readOnly: true
      
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      certSANs:
      - "localhost"
      - "127.0.0.1"
      - "nixos-hetzner"
      - "178.156.202.233"  # Hetzner public IP
      - "kubernetes"
      - "kubernetes.default"
      - "kubernetes.default.svc"
      - "kubernetes.default.svc.cluster.local"
      extraArgs:
        service-account-issuer: "https://oidcissuer65846b7df97b.z13.web.core.windows.net/"
        service-account-key-file: /etc/kubernetes/pki/custom-keys/sa.pub
        service-account-signing-key-file: /etc/kubernetes/pki/custom-keys/sa.key
    controllerManager:
      extraArgs:
        service-account-private-key-file: /etc/kubernetes/pki/custom-keys/sa.key
