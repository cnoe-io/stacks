---
# ClusterRole for viewing External Secrets resources
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-external-secrets-viewer
rules:
# Core Kubernetes resources
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets", "namespaces", "events"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]

# External Secrets Operator CRDs
- apiGroups: ["external-secrets.io"]
  resources: 
  - externalsecrets
  - secretstores
  - clustersecretstores
  - pushsecrets
  - clusterexternalsecrets
  verbs: ["get", "list", "watch"]

# External Secrets status subresources
- apiGroups: ["external-secrets.io"]
  resources:
  - externalsecrets/status
  - secretstores/status
  - clustersecretstores/status
  - pushsecrets/status
  - clusterexternalsecrets/status
  verbs: ["get", "list", "watch"]

# CRD definitions (to show CRD schema in UI)
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]

---
# ServiceAccount for Headlamp
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: headlamp
  
---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-external-secrets-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-external-secrets-viewer
subjects:
- kind: ServiceAccount
  name: headlamp
  namespace: headlamp