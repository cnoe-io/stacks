kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry.mirrors."gitea.cnoe.localtest.me:8443"]
    endpoint = ["https://gitea.cnoe.localtest.me"]
  [plugins."io.containerd.grpc.v1.cri".registry.configs."gitea.cnoe.localtest.me".tls]
    insecure_skip_verify = true
nodes:
- role: control-plane
  image: "kindest/node:v1.31.4"
  labels:
    ingress-ready: "true"
  extraPortMappings:
  - containerPort: 443
    hostPort: 8443
    protocol: TCP
  - containerPort: 32222
    hostPort: 32222
    protocol: TCP
  extraMounts:
    # Mount the entire keys directory instead of individual files
    - hostPath: /home/vpittamp/stacks/ref-implementation/keys
      containerPath: /tmp/sa-keys
      readOnly: true
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        service-account-issuer: "https://oidcissuer65846b7df97b.z13.web.core.windows.net/"
        service-account-key-file: /etc/kubernetes/pki/sa.pub
        service-account-signing-key-file: /etc/kubernetes/pki/sa.key
    controllerManager:
      extraArgs:
        service-account-private-key-file: /etc/kubernetes/pki/sa.key
  preKubeadmCommands:
    # Copy the SA keys from mounted directory to the correct location
    - cp /tmp/sa-keys/sa.key /etc/kubernetes/pki/sa.key
    - cp /tmp/sa-keys/sa.pub /etc/kubernetes/pki/sa.pub
    - chmod 600 /etc/kubernetes/pki/sa.key
    - chmod 644 /etc/kubernetes/pki/sa.pub
    - ls -la /etc/kubernetes/pki/sa.*